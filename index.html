  function runOcr(box) {
    var L = curLayout();
    var btn = U.$('#run', box);
    btn.disabled = true; btn.textContent = '识别中…';

    var prog = U.el('div', { class: 'card' });
    U.setHTML(prog, '<div id="prog" class="hint">准备中…</div>' +
      '<div class="meter mt-s"><i id="progbar" style="width:0%"></i></div>');
    box.appendChild(prog);

    var i = 0, failed = 0, multi = 0;

    function next() {
      var pg = U.$('#prog', prog), pb = U.$('#progbar', prog);
      if (i >= st.pages.length) {
        if (pg) pg.innerHTML = '识别完成：成功 <b>' + (st.pages.length - failed) + '</b> 张' +
          (failed ? '，失败 <b style="color:#b91c1c">' + failed + '</b> 张' : '') +
          (multi ? '。<b style="color:#b45309">' + multi + ' 页出现多涂</b>，复核时要重点看' : '');
        if (pb) pb.style.width = '100%';
        setTimeout(function () { if (App.state.omr === st) App.render(); }, 750);
        return;
      }
      var p = st.pages[i];
      if (pg) pg.textContent = '正在识别第 ' + (i + 1) + ' / ' + st.pages.length + ' 张：' + p.name;
      if (pb) pb.style.width = Math.round(i / st.pages.length * 100) + '%';

      /* 让出主线程，界面才不会假死 */
      U.nextFrame().then(function () {
        var res;
        try {
          res = OMR.detect(p.img, L, { debug: true });
        } catch (e) {
          p.error = e.message || String(e); failed++; i++; return next();
        }
        if (!res.ok) {
          p.error = (res.warnings && res.warnings[0]) || '找不到答题卡的四个定位方块';
          failed++; i++; return next();
        }
        if (res.warnings && res.warnings.some(function (w) { return /多选/.test(w); })) multi++;
        p.result = res;
        p.answers = tokensToAnswers(curQs(), L, res.tokens);
        i++; next();
      });
    }
    next();
  }

  /**
   * 把「每个涂点涂没涂」翻译成「每道题选了什么」。
   * 这是整个流程里唯一带业务语义的一步，单独拆出来便于测试。
   * @returns {Object} qid -> 答案（single: int, multi: int[], judge/fill: bool）
   */
  function tokensToAnswers(qs, L, tokens) {
    var byQid = {};
    L.pages.forEach(function (pg) { pg.groups.forEach(function (g) { byQid[g.qid] = g; }); });
    var out = {};

    qs.forEach(function (q) {
      var g = byQid[q.id];
      if (!g) return;
      var picked = [];
      g.bits.forEach(function (bit) {
        var t = tokens[g.id + '-' + bit.label];
        if (t && t.filled) picked.push(bit.val);
      });
      if (!picked.length) return;                      /* 没涂 = 未作答 */
      if (q.type === 'multi') out[q.id] = picked;
      else out[q.id] = picked[0];                      /* 多涂时先取第一个，由复核界面纠正 */
    });
    return out;
  }

  /* ============================ 步骤 3：人工复核 ============================ */
  function step3(box) {
    var L = curLayout(), qs = curQs();
    var ok = st.pages.filter(okPage);

    if (!ok.length) {
      var bad = U.el('div', { class: 'card' });
      U.setHTML(bad, '<div class="empty"><div class="big">😵</div>' +
        '<div class="t">没有一张识别成功</div>' +
        '<div style="text-align:left;max-width:520px;margin:10px auto 0;font-size:13px">' +
        st.pages.map(function (p) {
          return '· ' + U.esc(p.name) + '：' + U.esc(p.error || '未知原因');
        }).join('<br>') + '</div>' +
        '<div class="hint mt">最常见的原因是四个角没拍全，或者照片太暗、太斜。' +
        '换一张照片再试，或者用「录入成绩」手工把答案填进去——一份卷子手录也就几分钟。</div>' +
        '<div style="margin-top:14px"><button class="btn" id="retry">重新传照片</button>' +
        '<button class="btn ghost" id="toManual" style="margin-left:8px">改用手工录入</button></div></div>');
      box.appendChild(bad);
      U.$('#retry', bad).addEventListener('click', function () { st.pages = []; App.render(); });
      U.$('#toManual', bad).addEventListener('click', function () { App.nav('#/manual'); });
      return;
    }

    var failed = st.pages.filter(function (p) { return !okPage(p); });
    var nLow = 0;
    ok.forEach(function (p) { nLow += lowCount(p); });

    var head = U.el('div', { class: 'card' });
    U.setHTML(head,
      '<div class="spread"><div><h2 class="sec" style="margin-bottom:0"><span class="bar"></span>人工复核</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">机器认错一道题，整份报告的结论就可能反过来。这一步请别跳过。</p></div>' +
      '<div class="row"><button class="btn ghost sm" id="reup">重新传照片</button></div></div>' +
      (nLow ? '<div class="notice warn mt"><span class="ico">🔎</span><div class="bd">' +
        '<div class="nt">有 ' + nLow + ' 个涂点不太确定</div>' +
        '<div class="nc">它们在图上显示为<b>橙色虚线圈</b>并闪烁。对着原照片看一眼，' +
        '点一下圈就能翻转判定。' +
        '典型情况是「涂了一半」或「擦过但没擦干净」——机器有把握，' +
        '但这种痕迹人眼一看就知道学生到底想选什么。</div></div></div>'
        : '<div class="notice ok-notice mt"><span class="ico">👌</span><div class="bd">' +
        '<div class="nt">所有涂点都很清晰</div><div class="nc">机器读得很确定。' +
        '仍然建议扫一眼图上的圈有没有整体错位。</div></div></div>') +
      (failed.length ? '<div class="notice mt"><span class="ico">⚠️</span><div class="bd">' +
        '<div class="nt">有 ' + failed.length + ' 张照片识别失败，已跳过</div><div class="nc">' +
        U.esc(failed.map(function (p) { return p.name; }).join('、')) +
        '。如果这些正是本人答题卡的一部分，请用「录入成绩」手工补上。</div></div></div>' : ''));
    box.appendChild(head);
    U.$('#reup', head).addEventListener('click', function () { st.pages = []; App.render(); });

    ok.forEach(function (p, pi) {
      var card = U.el('div', { class: 'card' });
      card.appendChild(buildReview(p, pi + 1, qs, L));
      box.appendChild(card);
    });

    /* ---- 学生信息 ---- */
    var info = U.el('div', { class: 'card' });
    U.setHTML(info,
      '<h2 class="sec"><span class="bar"></span>这是哪个学生的？</h2>' +
      '<p class="sec-desc">成绩必须和学生对上号——后面的二维码报告就靠这个。</p>' +
      '<div class="grid2">' +
      '<div class="field"><label>学号</label><input type="text" id="f-no" placeholder="例如 2026001"></div>' +
      '<div class="field"><label>姓名</label><input type="text" id="f-name" placeholder="例如 张三"></div>' +
      '<div class="field"><label>班级</label><select id="f-cls"><option value="">（不分班）</option>' +
      Store.classes().map(function (c) {
        return '<option value="' + U.esc(c.id) + '">' + U.esc(c.name) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>备注 <span class="sub">选填</span></label>' +
      '<input type="text" id="f-note" placeholder="比如「第二页没交」"></div></div>' +
      '<div class="hint">输学号后按 Tab，如果这个学生以前做过，姓名会自动带出来。</div>' +
      '<div class="row mt"><button class="btn" id="save">确认无误，保存成绩</button>' +
      '<button class="btn ghost" id="saveNext">保存并接着录下一个</button>' +
      '<span class="hint" id="savehint"></span></div>');
    box.appendChild(info);

    Store.all('students').then(function (students) {
      var no = U.$('#f-no', info);
      if (!no) return;
      no.addEventListener('blur', function () {
        var v = U.normNo(no.value);
        if (!v) return;
        var s = students.filter(function (x) { return U.normNo(x.studentNo) === v; })[0];
        if (s) {
          U.$('#f-name', info).value = s.name || '';
          if (s.classId) U.$('#f-cls', info).value = s.classId;
          U.toast('这位学生以前录过：' + (s.name || ''), 'ok', 2000);
        }
      });
    });

    U.$('#save', info).addEventListener('click', function () { save(info, L, qs, false); });
    U.$('#saveNext', info).addEventListener('click', function () {
      save(info, L, qs, true).then(function (done) {
        if (done) { st.pages = []; App.render(); }
      });
    });
  }

  function okPage(p) { return p.result && p.result.ok; }
  function lowCount(p) {
    var n = 0;
    Object.keys(p.result.tokens).forEach(function (k) {
      if (p.result.tokens[k].confidence < LOW_CONF) n++;
    });
    return n;
  }

  /* ---- 单页复核 ---- */
  function buildReview(p, idx, qs, L) {
    var wrap = U.el('div');
    var nb = lowCount(p);

    U.setHTML(wrap,
      '<div class="spread" style="margin-bottom:10px"><div>' +
      '<b>第 ' + idx + ' 页</b> <span class="hint">' + U.esc(p.name) + '</span> ' +
      '<span class="tag ' + (nb ? 'warn' : 'ok') + '" data-badge>' +
      (nb ? nb + ' 处待确认' : '全部清晰') + '</span>' +
      '<span class="hint" style="margin-left:8px">识别到 ' +
      Object.keys(p.answers || {}).length + ' 个作答</span>' +
      '</div><div class="row">' +
      '<button class="btn ghost sm" data-mode="graph">在图上核对</button>' +
      '<button class="btn ghost sm" data-mode="list">列表核对</button>' +
      '</div></div><div data-pv></div>');

    var holder = U.$('[data-pv]', wrap);
    var mode = 'graph';

    function draw() {
      if (mode === 'graph') drawGraph(holder, p, qs, L, wrap);
      else drawList(holder, p, qs, L, wrap);
    }
    U.$$('[data-mode]', wrap).forEach(function (b) {
      b.addEventListener('click', function () {
        mode = b.getAttribute('data-mode');
        U.$$('[data-mode]', wrap).forEach(function (x) {
          var on = x.getAttribute('data-mode') === mode;
          x.classList.toggle('btn', on);
          x.classList.toggle('ghost', !on);
        });
        draw();
      });
    });
    setTimeout(function () {
      U.$$('[data-mode]', wrap).forEach(function (x) {
        var on = x.getAttribute('data-mode') === mode;
        x.classList.toggle('btn', on);
        x.classList.toggle('ghost', !on);
      });
      draw();
    }, 0);
    return wrap;
  }

  /* ---- 图上核对：画照片 + 按单应矩阵投影气泡中心 ---- */
  function drawGraph(holder, p, qs, L, wrap) {
    var view = U.$('#view');
    var maxW = Math.min(780, Math.max(320, (view ? view.clientWidth : 780) - 96));
    var scale = Math.min(1, maxW / p.img.naturalWidth);

    var stage = U.el('div', { class: 'omr-stage' });
    stage.style.width = Math.round(p.img.naturalWidth * scale) + 'px';
    stage.appendChild(U.el('img', { src: p.dataURL }));
    var layer = U.el('div', { class: 'omr-overlay' });
    stage.appendChild(layer);

    U.setHTML(holder, '');
    holder.appendChild(stage);

    var missed = 0;
    L.pages.forEach(function (pg) {
      pg.bubbles.forEach(function (b) {
        var t = p.result.tokens[b.id];
        if (!t) return;
        var mm = projMm(p.result.H, b.x, b.y);
        if (!mm || mm.x < -5 || mm.y < -5 ||
            mm.x > p.img.naturalWidth + 5 || mm.y > p.img.naturalHeight + 5) { missed++; return; }
        var g = pg.groups.filter(function (x) { return x.id === b.group; })[0];
        var el = U.el('button', {
          class: 'opt-btn', type: 'button',
          title: '第 ' + (g ? g.no : '?') + ' 题 ' + b.label +
            '　置信度 ' + t.confidence.toFixed(2) + (t.filled ? '　判定：已涂' : '　判定：没涂')
        });
        el.style.left = (mm.x * scale) + 'px';
        el.style.top = (mm.y * scale) + 'px';
        if (t.filled) el.classList.add('on');
        if (t.confidence < LOW_CONF) el.classList.add('lowconf');
        el.addEventListener('click', function () {
          /* 老师是对着照片做判断，点一下就是「这一格机器读错了」 */
          t.filled = !t.filled;
          t.confidence = 1;
          el.classList.toggle('on', t.filled);
          el.classList.remove('lowconf');
          p.answers = tokensToAnswers(qs, L, p.result.tokens);
          refreshBadge(wrap, p);
          U.toast('第 ' + (g ? g.no : '?') + ' 题 ' + b.label + ' 改为「' +
            (t.filled ? '已涂' : '没涂') + '」', 'ok', 1500);
        });
        layer.appendChild(el);
      });
    });

    var tip = U.el('div', { class: 'hint mt-s' });
    U.setHTML(tip, '<span style="color:#dc2626">●</span> 实心圈 = 判定已涂　' +
      '<span>○</span> 空圈 = 判定没涂　' +
      '<b style="color:#b45309">◌ 橙色虚线圈 = 不太确定</b>。' +
      '点任意一个圈就能翻转判定。如果所有圈整体偏出格位，说明照片拍得太斜，建议重拍。' +
      (missed ? '<br><b style="color:#b91c1c">注意：有 ' + missed +
        ' 个涂点投影落在照片外</b>，说明卡没拍全，这部分涂不完的会被当成「未作答」。' : ''));
    holder.appendChild(tip);
  }

  /* 页面 mm -> 原图像素 */
  function projMm(H, mx, my) {
    if (!H) return null;
    var w = H[6] * mx + H[7] * my + H[8];
    if (Math.abs(w) < 1e-12) return null;
    return {
      x: (H[0] * mx + H[1] * my + H[2]) / w,
      y: (H[3] * mx + H[4] * my + H[5]) / w
    };
  }

  function refreshBadge(wrap, p) {
    var b = U.$('[data-badge]', wrap);
    if (!b) return;
    var n = lowCount(p);
    b.className = 'tag ' + (n ? 'warn' : 'ok');
    b.textContent = n ? (n + ' 处待确认') : '全部清晰';
  }

  /* ---- 列表核对：老师批量录一个班时更快 ---- */
  function drawList(holder, p, qs, L, wrap) {
    var byQid = {};
    L.pages.forEach(function (pg) { pg.groups.forEach(function (g) { byQid[g.qid] = g; }); });

    var html = '<div class="tbl-wrap" style="max-height:480px;overflow:auto"><table class="tbl"><thead><tr>' +
      '<th style="width:44px">题号</th><th style="width:58px">题型</th><th style="width:96px">识别结果</th>' +
      '<th>改成</th><th style="width:62px">确定度</th></tr></thead><tbody>';

    qs.forEach(function (q, i) {
      var g = byQid[q.id];
      if (!g) return;
      var a = (p.answers || {})[q.id];
      var okd = Analyze.isAnswered(q, a);
      var worst = 1;
      g.bits.forEach(function (bit) {
        var t = p.result.tokens[g.id + '-' + bit.label];
        if (t && t.confidence < worst) worst = t.confidence;
      });
      var low = worst < LOW_CONF;

      html += '<tr><td class="qid">' + (i + 1) + '</td>' +
        '<td style="font-size:11.5px;color:var(--ink2)">' + U.esc(Core.typeName(q.type)) + '</td>' +
        '<td><span class="tag ' + (!okd ? 'gray' : (low ? 'warn' : 'ok')) + '">' +
        U.esc(okd ? Core.answerText(q, a) : '未作答') + '</span>' +
        (okd && Analyze.isCorrect(q, a) ? ' <span class="right-mark">✓</span>' : '') + '</td><td>';

      if (q.type === 'single') {
        (q.options || []).forEach(function (op, oi) {
          html += btn(q.id, 'v', oi, a === oi, String.fromCharCode(65 + oi));
        });
        html += btn(q.id, 'v', -1, !okd, '空');
      } else if (q.type === 'judge' || q.type === 'fill') {
        html += btn(q.id, 'v', 1, a === true, '对') + btn(q.id, 'v', 0, a === false, '错');
        html += btn(q.id, 'v', -1, !okd, '空');
      } else if (q.type === 'multi') {
        (q.options || []).forEach(function (op, oi) {
          html += btn(q.id, 'mv', oi, Array.isArray(a) && a.indexOf(oi) >= 0, String.fromCharCode(65 + oi));
        });
        html += btn(q.id, 'v', -1, !okd, '空');
      }
      html += '</td><td class="num" style="font-size:11.5px;color:' +
        (low ? '#b45309' : 'var(--ink3)') + '">' + worst.toFixed(2) + '</td></tr>';
    });
    html += '</tbody></table></div>';
    U.setHTML(holder, html);

    /* 改完同时同步 token，保证「图上」和「列表」两种视图永远一致 */
    function sync(qid, val) {
      var g = byQid[qid];
      if (!g) return;
      g.bits.forEach(function (bit) {
        var t = p.result.tokens[g.id + '-' + bit.label];
        if (!t) return;
        t.filled = Array.isArray(val) ? (val.indexOf(bit.val) >= 0) : (val === bit.val);
        t.confidence = 1;
      });
    }

    U.$$('[data-q]', holder).forEach(function (b) {
      b.addEventListener('click', function () {
        var qid = b.getAttribute('data-q');
        var q = qs.filter(function (x) { return x.id === qid; })[0];
        if (b.hasAttribute('data-mv')) {
          var oi = +b.getAttribute('data-mv');
          var cur = Array.isArray(p.answers[qid]) ? p.answers[qid].slice() : [];
          var k = cur.indexOf(oi);
          if (k >= 0) cur.splice(k, 1); else cur.push(oi);
          cur.sort(function (x, y) { return x - y; });
          if (!cur.length) delete p.answers[qid]; else p.answers[qid] = cur;
          sync(qid, cur);
        } else {
          var v = +b.getAttribute('data-v');
          var val;
          if (v === -1) val = undefined;
          else if (q.type === 'judge' || q.type === 'fill') val = (v === 1);
          else val = v;
          if (val === undefined) delete p.answers[qid]; else p.answers[qid] = val;
          sync(qid, val);
        }
        /* 整张列表重画 —— 最多 167 行，够快，而且不用维护局部状态 */
        drawList(holder, p, qs, L, wrap);
      });
    });
  }

  function btn(qid, kind, val, on, label) {
    return '<button type="button" class="chip-btn' + (on ? ' on' : '') + '" data-q="' + qid +
      '" data-' + kind + '="' + val + '">' + label + '</button> ';
  }

  /* ============================ 保存 ============================ */
  function save(info, L, qs, andNext) {
    var no = U.normNo(U.$('#f-no', info).value);
    var name = U.normName(U.$('#f-name', info).value);
    if (!no && !name) {
      U.err('请填学号或姓名——成绩必须和学生对上号，否则报告没法发给他');
      U.$('#f-no', info).focus();
      return Promise.resolve(false);
    }

    /* 一份卷子可能印了好几页，学生的答案分散在不同照片里，这里合并 */
    var answers = {};
    st.pages.filter(okPage).forEach(function (p) {
      Object.keys(p.answers || {}).forEach(function (k) { answers[k] = p.answers[k]; });
    });

    if (!Object.keys(answers).length) {
      U.err('一个字都没识别到——很可能选错了卷子，或者卡没拍全');
      return Promise.resolve(false);
    }

    var maxScore = Core.paperStats(qs.map(function (q) { return q.id; })).points;
    var score = 0;
    qs.forEach(function (q) { if (Analyze.isCorrect(q, answers[q.id])) score += Core.scoreOf(q); });

    var rec = {
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      studentNo: no, name: name,
      classId: U.$('#f-cls', info).value,
      note: U.$('#f-note', info).value.trim(),
      paperId: (App.state.sheet && App.state.sheet.paperId) || '',
      paperName: st.paperName || '化学学情诊断',
      questionIds: qs.map(function (q) { return q.id; }),
      answers: answers, unsure: {},
      score: +score.toFixed(1), maxScore: maxScore, rate: maxScore ? score / maxScore : 0,
      source: 'omr', submittedAt: Date.now()
    };

    var jobs = [Store.put('records', rec)];
    /* 顺手把学生补进名册，老师不用再手工建一次 */
    jobs.push(Store.all('students').then(function (list) {
      var ex = list.filter(function (x) {
        return (no && U.normNo(x.studentNo) === no) ||
               (!no && name && U.normName(x.name) === name);
      })[0];
      if (ex) return null;
      return Store.put('students', {
        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        studentNo: no, name: name, classId: rec.classId,
        createdAt: Date.now(), updatedAt: Date.now()
      });
    }));

    var b = U.$('#save', info);
    if (b) { b.disabled = true; b.textContent = '保存中…'; }

    return Promise.all(jobs).then(function () {
      U.ok('已保存：' + (name || no) + '　' + score + ' / ' + maxScore + ' 分');
      if (!andNext) {
        U.toast('可以「保存并接着录下一个」，或去「班级分析」看整体结果', 'ok', 4000);
      }
      return true;
    }).catch(function (e) {
      U.err('保存失败：' + e.message);
      return false;
    });
  }
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-manual -->
<script>
/*!
 * 化学学情诊断平台 · 录入成绩
 * 作者：黎伟成
 *
 * 三个标签页：
 *   手工录入 —— 老师拿着收上来的答题卡，在屏幕上一题一题点。支持键盘。
 *   Excel 导入 —— 这是用户要的主流程：老师打印卷子 → 学生填答题卡 →
 *                 老师批改后把结果录进 Excel（或扫描仪直接出），
 *                 然后上传到这里，自动按「学号」配对。
 *   导出 —— 把班级结果导成 4 个工作表的 Excel。
 *
 * Excel 导入的设计难点：不同老师做的表长得完全不一样。
 * 有的表是「一行一个学生，每题一列」（对/错）；
 * 有的表是「只有学号 + 总分」；
 * 有的表是「学号 + 一列错题号，比如 3,7,12」。
 * 所以这里不强制模板，而是**自动认列表头**，然后让老师在预览里确认和手工纠正。
 * 硬性要求一份固定模板只会让老师在第一步就卡住。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store;
  var Analyze = root.Analyze, XLSX = root.XLSX;

  var st = null;

  App.view('manual', {
    need: 'batch',
    render: function (mount) {
      if (!st) {
        st = { tab: 'entry', paperName: '', questionIds: null, i: 0, answers: {}, unsure: {}, roster: [] };
        App.state.manual = st;
      }
      /* 每次渲染都要跟「答题卡」页的卷子对齐。
         这里曾经只在第一次创建 st 时同步一次，导致一个死循环：
         老师进「手工录入」→ 提示先选卷子 → 跳到「答题卡」选好 →
         回来还是提示先选卷子（因为 st.questionIds 永远停在 null）。
         现在每次都重新同步，并且只在卷子真的变了时才重置录入进度。 */
      syncPaper();
      U.setHTML(mount, '');

      var bar = U.el('div', { class: 'card' });
      var cur = st.questionIds ? '<span class="hint" style="margin-left:10px">当前卷子：' +
        U.esc(st.paperName || '未命名') + ' · ' + st.questionIds.length + ' 题</span>' : '';
      U.setHTML(bar,
        '<div class="spread"><div><h2 class="sec" style="margin-bottom:0"><span class="bar"></span>录入成绩</h2>' +
        cur + '</div><div class="row">' +
        tabBtn('entry', '手工录入') + tabBtn('excel', 'Excel 导入') + tabBtn('export', '导出结果') +
        '<button class="btn ghost sm" id="pick">换卷子</button>' +
        '</div></div>');
      mount.appendChild(bar);

      U.$$('[id^=tab-]', bar).forEach(function (b) {
        b.addEventListener('click', function () { st.tab = b.id.slice(4); App.render(); });
      });
      U.$('#pick', bar).addEventListener('click', function () { App.nav('#/sheet'); });

      var body = U.el('div');
      mount.appendChild(body);
      if (!st.questionIds && st.tab !== 'excel') { noPaper(body); return; }
      if (st.tab === 'entry') tabEntry(body);
      else if (st.tab === 'excel') tabExcel(body);
      else tabExport(body);
    }
  });

  function tabBtn(id, label) {
    var on = st.tab === id;
    return '<button class="btn ' + (on ? '' : 'ghost') + ' sm" id="tab-' + id + '">' + label + '</button>';
  }

  /* 把「答题卡」页当前选中的卷子同步进来。
     关键点：如果老师已经在手工录入到一半，不能因为换个卷子就把已填的答案清掉；
     只有卷子真的变了（题号列表不一样）才重置进度，并明确提示。 */
  function syncPaper() {
    var sh = App.state.sheet;
    var ids = (sh && sh.questionIds && sh.questionIds.length) ? sh.questionIds : null;

    if (!ids) {
      /* 答题卡页还没选卷子（或压根没打开过）。保留已有的，别把状态抹掉。 */
      return;
    }

    var same = st.questionIds && st.questionIds.length === ids.length &&
      st.questionIds.every(function (id, i) { return id === ids[i]; });

    if (same) {
      /* 卷子没变，只同步一下标题（老师可能改了卷名） */
      st.paperName = sh.title || st.paperName || '化学学情诊断';
      return;
    }

    var hadProgress = st.questionIds && Object.keys(st.answers || {}).length;
    st.questionIds = ids.slice();
    st.paperName = sh.title || '化学学情诊断';
    st.answers = {};
    st.unsure = {};
    st.i = 0;

    if (hadProgress) {
      U.toast('卷子已换成「' + st.paperName + '」，之前填的答案已清空', 'bad', 4000);
    }
  }

  function noPaper(body) {
    var e = U.el('div', { class: 'card' });
    U.setHTML(e, '<div class="empty"><div class="big">📝</div><div class="t">先选一份卷子</div>' +
      '<div>手工录入需要知道题目的顺序和选项。请先到「答题卡」页选好卷子。' +
      '<br>（Excel 导入不受影响，那个是根据表头自动认列的。）</div>' +
      '<div style="margin-top:14px"><button class="btn" id="go">去选卷子</button></div></div>');
    body.appendChild(e);
    U.$('#go', e).addEventListener('click', function () { App.nav('#/sheet'); });
  }

  /* ==================== 手工录入 ==================== */
  function tabEntry(body) {
    var qs = st.questionIds.map(function (id) { return Core.qmap()[id]; }).filter(Boolean);
    if (st.i >= qs.length) st.i = 0;

    var card = U.el('div', { class: 'card' });
    U.setHTML(card,
      '<div class="spread"><div><h2 class="sec" style="margin-bottom:0"><span class="bar"></span>手工录入</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">' +
      '键盘更快：<b>A/B/C/D</b> 选项，<b>T</b> 对，<b>F</b> 错，<b>←/→</b> 上/下一题，' +
      '<b>Delete</b> 清空本题，<b>Enter</b> 跳到下一题。' +
      '多选题按数字 <b>1–6</b> 切换选中。</p></div>' +
      '<div class="hint" id="prog"></div></div>' +
      '<div id="qbox"></div>');
    body.appendChild(card);

    var info = U.el('div', { class: 'card' });
    U.setHTML(info,
      '<h2 class="sec"><span class="bar"></span>学生信息</h2>' +
      '<div class="grid2">' +
      '<div class="field"><label>学号</label><input type="text" id="m-no" placeholder="输学号，按 Tab 自动带出姓名"></div>' +
      '<div class="field"><label>姓名</label><input type="text" id="m-name"></div>' +
      '<div class="field"><label>班级</label><select id="m-cls"><option value="">（不分班）</option>' +
      Store.classes().map(function (c) {
        return '<option value="' + U.esc(c.id) + '">' + U.esc(c.name) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>备注 <span class="sub">选填</span></label><input type="text" id="m-note"></div>' +
      '</div>' +
      '<div class="row mt"><button class="btn" id="m-save">保存成绩</button>' +
      '<button class="btn ghost" id="m-next">保存并下一位</button>' +
      '<button class="btn ghost" id="m-clear">清空重填</button>' +
      '<span class="hint" id="m-stat"></span></div>');
    body.appendChild(info);

    var students = [];
    Store.all('students').then(function (list) { students = list; });
    var noI = U.$('#m-no', info);
    noI.addEventListener('blur', function () {
      var v = U.normNo(noI.value);
      if (!v) return;
      var s = students.filter(function (x) { return U.normNo(x.studentNo) === v; })[0];
      if (s) {
        U.$('#m-name', info).value = s.name || '';
        if (s.classId) U.$('#m-cls', info).value = s.classId;
      }
    });

    renderQ(card, qs);

    U.$('#m-save', info).addEventListener('click', function () { saveEntry(info, qs, false); });
    U.$('#m-next', info).addEventListener('click', function () {
      saveEntry(info, qs, true).then(function (ok) {
        if (ok) { st.answers = {}; st.unsure = {}; st.i = 0; App.render(); }
      });
    });
    U.$('#m-clear', info).addEventListener('click', function () {
      st.answers = {}; st.unsure = {}; st.i = 0; App.render();
    });

    /* 键盘 */
    var keyHandler = function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      var q = qs[st.i];
      if (!q) return;
      var k = e.key;

      if (k === 'ArrowRight' || k === 'Enter') { st.i = Math.min(qs.length - 1, st.i + 1); e.preventDefault(); renderQ(card, qs); return; }
      if (k === 'ArrowLeft') { st.i = Math.max(0, st.i - 1); e.preventDefault(); renderQ(card, qs); return; }
      if (k === 'Delete' || k === 'Backspace') {
        delete st.answers[q.id]; delete st.unsure[q.id];
        e.preventDefault(); renderQ(card, qs); return;
      }
      if (k === 'u' || k === 'U') {
        st.unsure[q.id] = !st.unsure[q.id];
        e.preventDefault(); renderQ(card, qs); return;
      }
      var up = k.toUpperCase();
      if ((q.type === 'single' || q.type === 'multi')) {
        var oi = 'ABCDEF'.indexOf(up);
        if (oi >= 0 && oi < (q.options || []).length) {
          if (q.type === 'single') st.answers[q.id] = oi;
          else {
            var cur = Array.isArray(st.answers[q.id]) ? st.answers[q.id].slice() : [];
            var at = cur.indexOf(oi);
            if (at >= 0) cur.splice(at, 1); else cur.push(oi);
            cur.sort(function (a, b) { return a - b; });
            if (!cur.length) delete st.answers[q.id]; else st.answers[q.id] = cur;
          }
          if (q.type === 'single') { st.i = Math.min(qs.length - 1, st.i + 1); }
          e.preventDefault(); renderQ(card, qs); return;
        }
      }
      if (q.type === 'judge' || q.type === 'fill') {
        if (up === 'T') { st.answers[q.id] = true; st.i = Math.min(qs.length - 1, st.i + 1); e.preventDefault(); renderQ(card, qs); return; }
        if (up === 'F') { st.answers[q.id] = false; st.i = Math.min(qs.length - 1, st.i + 1); e.preventDefault(); renderQ(card, qs); return; }
      }
      /* 数字键：跳到第 n 题（多选时切换选区在下面的按钮里处理） */
      var d = parseInt(k, 10);
      if (isFinite(d) && d >= 1 && d <= 9 && q.type === 'multi') {
        var idx = d - 1;
        var c2 = Array.isArray(st.answers[q.id]) ? st.answers[q.id].slice() : [];
        var p2 = c2.indexOf(idx);
        if (p2 >= 0) c2.splice(p2, 1); else c2.push(idx);
        c2.sort(function (a, b) { return a - b; });
        if (!c2.length) delete st.answers[q.id]; else st.answers[q.id] = c2;
        e.preventDefault(); renderQ(card, qs); return;
      }
    };
    document.addEventListener('keydown', keyHandler);
    /* 视图切换时解绑，否则每次进来都会叠加一个监听器 */
    st._unbind = function () { document.removeEventListener('keydown', keyHandler); };
  }

  function renderQ(card, qs) {
    var box = U.$('#qbox', card);
    if (!box) return;
    var q = qs[st.i];
    if (!q) { U.setHTML(box, ''); return; }
    var a = st.answers[q.id];
    var kp = Core.kpmap()[q.kp] || { name: '—' };
    var nAns = Object.keys(st.answers).length;

    var pg = U.$('#prog', card);
    if (pg) {
      pg.innerHTML = '已填 <b>' + nAns + '</b> / ' + qs.length + ' 题　' +
        '<span style="color:' + (nAns === qs.length ? '#059669' : 'var(--ink3)') + '">' +
        (nAns === qs.length ? '全部完成' : '还剩 ' + (qs.length - nAns) + ' 题') + '</span>';
    }

    var html = '<div class="rev" style="margin-top:14px">' +
      '<div class="rh"><span class="chip">第 ' + (st.i + 1) + ' 题 / ' + qs.length + '</span>' +
      '<span class="chip">' + U.esc(kp.name) + '</span>' +
      '<span class="chip d' + (q.diff || 1) + '">' + U.esc(Core.diffName(q.diff)) + '</span>' +
      '<span class="chip gray">' + U.esc(Core.typeName(q.type)) + '</span>' +
      '<span class="hint" style="margin-left:auto">' +
      (a === undefined || a === null || (Array.isArray(a) && !a.length) ? '未填' : '已填：' +
        U.esc(Core.answerText(q, a))) + '</span></div>' +
      '<div class="q">' + U.esc(q.stem) + '</div>';

    if (q.type === 'single' || q.type === 'multi') {
      (q.options || []).forEach(function (op, oi) {
        var on = q.type === 'single' ? (a === oi) : (Array.isArray(a) && a.indexOf(oi) >= 0);
        html += '<div class="pick' + (on ? ' on' : '') + '" data-oi="' + oi + '">' +
          '<span class="kk">' + String.fromCharCode(65 + oi) + '</span>' +
          '<span class="ot">' + U.esc(op) + '</span></div>';
      });
    } else if (q.type === 'judge') {
      html += '<div class="pick' + (a === true ? ' on' : '') + '" data-tf="1"><span class="kk">T</span>' +
        '<span class="ot">对</span></div>' +
        '<div class="pick' + (a === false ? ' on' : '') + '" data-tf="0"><span class="kk">F</span>' +
        '<span class="ot">错</span></div>';
    } else if (q.type === 'fill') {
      html += '<div class="pick' + (a === true ? ' on' : '') + '" data-tf="1"><span class="kk">T</span>' +
        '<span class="ot">答对了（老师批改后判对）</span></div>' +
        '<div class="pick' + (a === false ? ' on' : '') + '" data-tf="0"><span class="kk">F</span>' +
        '<span class="ot">答错了</span></div>' +
        '<div class="hint" style="margin-top:6px">填空题的答案需要老师先批改，' +
        '这里只记录「对/错」。参考答案：' + U.esc(Core.answerText(q, q.answer)) + '</div>';
    }

    html += '<div class="row mt-s">' +
      '<button class="btn ghost sm" id="q-unsure">' + (st.unsure[q.id] ? '✓ 已标记「不确定/蒙的」' : '标记「不确定/蒙的」') + '</button>' +
      '<button class="btn ghost sm" id="q-clear">清空本题 (Delete)</button>' +
      '<span class="hint" id="exp-toggle" style="cursor:pointer;text-decoration:underline">看错因诊断</span></div>' +
      '<div class="exp" id="q-exp" style="display:none"><b>解析：</b>' + U.esc(q.explain || '（无）') + '</div>' +
      '</div>';

    U.setHTML(box, html);

    U.$$('.pick', box).forEach(function (el) {
      el.addEventListener('click', function () {
        if (el.hasAttribute('data-tf')) {
          st.answers[q.id] = el.getAttribute('data-tf') === '1';
          st.i = Math.min(qs.length - 1, st.i + 1);
        } else {
          var oi = +el.getAttribute('data-oi');
          if (q.type === 'single') { st.answers[q.id] = oi; st.i = Math.min(qs.length - 1, st.i + 1); }
          else {
            var c = Array.isArray(st.answers[q.id]) ? st.answers[q.id].slice() : [];
            var at = c.indexOf(oi);
            if (at >= 0) c.splice(at, 1); else c.push(oi);
            c.sort(function (x, y) { return x - y; });
            if (!c.length) delete st.answers[q.id]; else st.answers[q.id] = c;
          }
        }
        renderQ(card, qs);
      });
    });
    U.$('#q-unsure', box).addEventListener('click', function () {
      st.unsure[q.id] = !st.unsure[q.id];
      if (!st.unsure[q.id]) delete st.unsure[q.id];
      renderQ(card, qs);
    });
    U.$('#q-clear', box).addEventListener('click', function () {
      delete st.answers[q.id]; delete st.unsure[q.id]; renderQ(card, qs);
    });
    U.$('#exp-toggle', box).addEventListener('click', function () {
      var e = U.$('#q-exp', box);
      e.style.display = e.style.display === 'none' ? 'block' : 'none';
    });
  }

  function saveEntry(info, qs, andNext) {
    var no = U.normNo(U.$('#m-no', info).value);
    var name = U.normName(U.$('#m-name', info).value);
    if (!no && !name) { U.err('请填学号或姓名'); return Promise.resolve(false); }
    if (!Object.keys(st.answers).length) { U.err('一题都没填'); return Promise.resolve(false); }

    var maxScore = Core.paperStats(qs.map(function (q) { return q.id; })).points;
    var score = 0;
    qs.forEach(function (q) {
      if (Analyze.isCorrect(q, st.answers[q.id])) {
        score += (st.unsure[q.id] ? 0.5 : 1) * Core.scoreOf(q);
      }
    });

    var rec = {
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      studentNo: no, name: name, classId: U.$('#m-cls', info).value,
      note: U.$('#m-note', info).value.trim(),
      paperId: (App.state.sheet && App.state.sheet.paperId) || '',
      paperName: st.paperName || '化学学情诊断',
      questionIds: qs.map(function (q) { return q.id; }),
      answers: JSON.parse(JSON.stringify(st.answers)),
      unsure: JSON.parse(JSON.stringify(st.unsure)),
      score: +score.toFixed(1), maxScore: maxScore, rate: maxScore ? score / maxScore : 0,
      source: 'manual', submittedAt: Date.now()
    };

    var jobs = [Store.put('records', rec)];
    jobs.push(Store.all('students').then(function (list) {
      var ex = list.filter(function (x) {
        return (no && U.normNo(x.studentNo) === no) || (!no && name && U.normName(x.name) === name);
      })[0];
      if (ex) return null;
      return Store.put('students', {
        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        studentNo: no, name: name, classId: rec.classId,
        createdAt: Date.now(), updatedAt: Date.now()
      });
    }));

    return Promise.all(jobs).then(function () {
      U.ok('已保存：' + (name || no) + '　' + score + ' / ' + maxScore + ' 分');
      return true;
    }).catch(function (e) { U.err('保存失败：' + e.message); return false; });
  }

  /* ==================== Excel 导入 ==================== */
  var _imp = null;   /* {sheets, sheetIdx, rows, cols, roles, qs, mapping, resolved} */

  function tabExcel(body) {
    if (!_imp) {
      var card = U.el('div', { class: 'card' });
      U.setHTML(card,
        '<h2 class="sec"><span class="bar"></span>从 Excel 导入成绩</h2>' +
        '<p class="sec-desc">老师批改完（或者答题卡扫描仪导出）的表格直接拖进来。' +
        '不需要按固定模板做——系统会自动认列表头，认不出来的会让你手工指定。</p>' +
        '<div id="imp-dz"></div>' +
        '<div class="notice mt"><span class="ico">💡</span><div class="bd">' +
        '<div class="nt">常见的几种表格样子都能认</div><div class="nc">' +
        '① <b>学号 + 姓名 + 每题一列</b>（列标题是 1、2、3… 或 第1题）——最完整，能直接生成报告<br>' +
        '② <b>学号 + 姓名 + 总分</b>——只能算总分和排名，生成不了逐题报告<br>' +
        '③ <b>学号 + 一列「错题」</b>（内容是 3,7,12 这样的题号）——能反推出逐题对错，很好用<br>' +
        '第一行是表头。如果有多个工作表，导入前会让你选。' +
        '</div></div></div>');
      body.appendChild(card);

      var dzBox = U.$('#imp-dz', card);
      U.setHTML(dzBox, '');
      dzBox.appendChild(U.dropZone({
        accept: '.xlsx,.xls,.csv', icon: '📊', title: '把 Excel 文件拖到这里',
        sub: '支持 .xlsx 和 .csv。老旧的 .xls 请先在 Excel 里另存为 .xlsx。',
        multiple: false,
        onFiles: function (files) { loadExcel(files[0], body); }
      }));
      return;
    }
    renderImport(body);
  }

  function loadExcel(file, body) {
    var isCsv = /\.csv$/i.test(file.name);
    (isCsv ? U.readAsText(file).then(function (txt) { return { csv: txt }; }) : U.readAsArrayBuffer(file))
      .then(function (buf) {
        var sheets;
        if (buf && buf.csv !== undefined) sheets = [{ name: 'CSV', rows: parseCsv(buf.csv), merges: [] }];
        else sheets = XLSX.read(buf);

        /* 丢掉完全空的工作表，免得老师在下拉框里选到一堆空表 */
        sheets = sheets.filter(function (s) {
          return (s.rows || []).some(function (r) {
            return r && r.some(function (c) { return c !== null && c !== undefined && String(c).trim() !== ''; });
          });
        });
        if (!sheets.length) throw new Error('这个文件里没有数据');

        _imp = { file: file.name, sheets: sheets, sheetIdx: 0, qs: [], roles: null, rows: null, fix: {} };
        detectSheet(body);
      })
      .catch(function (e) { U.err('读取失败：' + e.message); });
  }

  function parseCsv(txt) {
    /* 够用的 CSV 解析：支持双引号包裹、引号内换行、\r\n */
    var rows = [], row = [], cell = '', q = false, i = 0;
    txt = String(txt).replace(/^\uFEFF/, '');
    while (i < txt.length) {
      var c = txt[i];
      if (q) {
        if (c === '"') {
          if (txt[i + 1] === '"') { cell += '"'; i += 2; continue; }
          q = false; i++; continue;
        }
        cell += c; i++; continue;
      }
      if (c === '"') { q = true; i++; continue; }
      if (c === ',' || c === '\t') { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r' && txt[i + 1] === '\n') {
        row.push(cell); rows.push(row); row = []; cell = ''; i += 2; continue;
      }
      if (c === '\n' || c === '\r') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
      cell += c; i++;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  /** 认列：根据表头文字判断每一列是什么 */
  function detectCols(rows) {
    var head = (rows[0] || []).map(function (c) { return String(c == null ? '' : c).trim(); });
    var nCol = 0;
    rows.forEach(function (r) { if (r && r.length > nCol) nCol = r.length; });

    var roles = [];
    var perQ = {};
    head.forEach(function (h, ci) {
      var hh = h.replace(/\s/g, '');
      var role = null;
      /* 学号列有很多种叫法。真实表格里常见的还有「学生学号」「考生编号」
         「班级学号」——所以前缀（学生/考生/班级/年级）是可选的。
         注意不能写得太宽，「编号」单独出现时班主任常用来表示座位号，
         那种也应该当学号用，所以保留。 */
      var bare = hh.replace(/^(学生|考生|班级|年级|全校)/, '');
      if (/^(学号|考号|准考证号?|考生号|学籍号|考籍号|编号|id|no\.?|studentno|studentid|学号id)$/i.test(bare)) {
        role = 'no';
      } else if (/^(姓名|名字|名字姓名|name|studentname)$/i.test(bare)) role = 'name';
      else if (/^(班级|所在班级|班|class|班级名称)$/i.test(bare)) role = 'class';
      else if (/^(总分|分数|成绩|得分|score|total)$/i.test(hh)) role = 'score';
      else if (/(满分|max)/.test(hh)) role = 'max';
      else if (/(错题|错误的题|做错的题|错题号|错题列表)/.test(hh)) role = 'wrong';
      else if (/(正确|对的题|作答题数|答对)/.test(hh)) role = 'right';
      else if (/(未作答|空白题|空的题)/.test(hh)) role = 'blank';
      else if (/(不确定|蒙|猜)/.test(hh)) role = 'unsure';
      else {
        /* 表格里的题号列：1 / 第1题 / Q1 / 题1 / T1 */
        var m = /^(?:第|题|q|t)?\s*(\d{1,3})\s*(?:题)?$/i.exec(hh);
        if (m) { role = 'q'; perQ[ci] = parseInt(m[1], 10); }
      }
      roles[ci] = role;
    });

    /* 表头认不出来的空格子：如果这一列大部分内容是 0/1/对/错，也算题目列 */
    for (var ci2 = 0; ci2 < nCol; ci2++) {
      if (roles[ci2]) continue;
      var yes = 0, tot = 0;
      for (var ri = 1; ri < Math.min(rows.length, 30); ri++) {
        var v = rows[ri] ? String(rows[ri][ci2] == null ? '' : rows[ri][ci2]).trim() : '';
        if (!v) continue;
        tot++;
        if (/^(0|1|对|错|√|×|✓|✗|是|否|true|false|正确|错误)$/i.test(v)) yes++;
      }
      if (tot >= 3 && yes / tot >= 0.7) roles[ci2] = 'q';
    }

    return { head: head, roles: roles, nCol: nCol, perQ: perQ };
  }

  function detectSheet(body) {
    var S = _imp.sheets[_imp.sheetIdx];
    var rows = S.rows.filter(function (r) {
      return r && r.some(function (c) { return c !== null && c !== undefined && String(c).trim() !== ''; });
    });
    if (rows.length < 2) { U.err('这个工作表只有表头，没有数据'); return; }

    var d = detectCols(rows);
    _imp.rows = rows;
    _imp.cols = d;

    /* 认列结果里的题目列：按表头里的题号排序，映射到当前卷子 */
    var qCols = [];
    Object.keys(d.perQ).forEach(function (k) { qCols.push({ col: +k, no: d.perQ[k] }); });
    Object.keys(d.roles).forEach(function (k) {
      if (d.roles[k] === 'q' && !d.perQ[k]) qCols.push({ col: +k, no: null });
    });
    /* 没有题号的题目列：按出现顺序当成第 1,2,3… 题 */
    qCols.sort(function (a, b) { return a.col - b.col; });
    var autoNo = 0;
    qCols.forEach(function (x) { if (x.no == null) x.no = ++autoNo; else autoNo = x.no; });

    /* 如果当前没有卷子，但有逐题列 —— 用题列数量猜一个卷子 */
    if (!_imp.qs.length) {
      if (st.questionIds) _imp.qs = st.questionIds.slice();
      else if (qCols.length) {
        var p = Core.presetList().filter(function (x) { return x.id === 'full'; })[0];
        _imp.qs = p.pick();
      }
    }
    _imp.qCols = qCols;
    renderImport(body);
  }

  function renderImport(body) {
    var S = _imp.sheets[_imp.sheetIdx];
    var d = _imp.cols, rows = _imp.rows;
    var nData = rows.length - 1;

    var hasQ = _imp.qCols.length > 0;
    var hasWrong = d.roles.indexOf('wrong') >= 0;
    var hasScore = d.roles.indexOf('score') >= 0;
    var hasNo = d.roles.indexOf('no') >= 0;
    var hasName = d.roles.indexOf('name') >= 0;

    var html = '<div class="card"><div class="spread"><div>' +
      '<h2 class="sec" style="margin-bottom:0"><span class="bar"></span>确认一下表头和配对</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">' +
      U.esc(_imp.file) + ' · ' + U.esc(S.name) + ' · ' + nData + ' 行数据</p></div>' +
      '<button class="btn ghost sm" id="re-pick">换一个文件</button></div>';

    if (_imp.sheets.length > 1) {
      html += '<div class="field mt" style="max-width:320px"><label>工作表</label><select id="imp-sheet">' +
        _imp.sheets.map(function (s, i) {
          return '<option value="' + i + '"' + (i === _imp.sheetIdx ? ' selected' : '') + '>' +
            U.esc(s.name) + '</option>';
        }).join('') + '</select></div>';
    }

    /* 认列结果：每一列一个下拉，老师可以改 */
    html += '<div class="mt"><div class="fg-t">系统认出来的列（不对就改）</div><div class="tbl-wrap">' +
      '<table class="tbl"><thead><tr><th style="width:52px">列</th><th style="width:170px">表头</th>' +
      '<th style="width:160px">当成什么用</th><th>示例数据</th></tr></thead><tbody>';

    for (var ci = 0; ci < d.nCol; ci++) {
      var samples = [];
      for (var ri = 1; ri < Math.min(rows.length, 4); ri++) {
        var v = rows[ri] && rows[ri][ci];
        if (v !== null && v !== undefined && String(v).trim() !== '') samples.push(String(v).trim());
      }
      html += '<tr><td class="qid">' + (ci + 1) + '</td>' +
        '<td style="font-size:12.5px;font-weight:600">' + U.esc(d.head[ci] || '（空）') + '</td>' +
        '<td><select class="imp-role" data-c="' + ci + '">' +
        roleOpts(d.roles[ci]) + '</select></td>' +
        '<td style="font-size:12px;color:var(--ink3)">' + U.esc(samples.join('、').slice(0, 60)) + '</td>' +
        '</tr>';
    }
    html += '</tbody></table></div></div>';

    /* 能不能 import 的结论 */
    if (!hasNo) {
      html += '<div class="notice bad mt"><span class="ico">⛔</span><div class="bd">' +
        '<div class="nt">没有找到「学号」列</div><div class="nc">' +
        '上面把某一列改成「学号」就能继续。学号是配对学生身份的关键——' +
        '用户要求「电脑端上传Excel对应名字对应的学号」，所以这一列不能少。' +
        '如果表里真的只有姓名，可以在上面把姓名列指成「姓名」，然后把学号列留空由系统按姓名匹配。</div></div></div>';
    } else if (!hasQ && !hasWrong && !hasScore) {
      html += '<div class="notice bad mt"><span class="ico">⛔</span><div class="bd">' +
        '<div class="nt">没找到任何成绩信息</div><div class="nc">' +
        '至少要有「每题对错」或「总分」或「错题号」三者之一，否则这个表里没有可用的成绩。</div></div></div>';
    } else {
      html += '<div class="notice ok-notice mt"><span class="ico">✓</span><div class="bd">' +
        '<div class="nt">可以导入</div><div class="nc">' +
        (hasQ ? '逐题对错列 ' + _imp.qCols.length + ' 个 —— 能生成完整报告（含知识点分析、二维码）。'
          : (hasWrong ? '有「错题号」列 —— 可以反推出逐题对错，也能生成完整报告。'
            : '只有总分 —— 只能算总分和排名，没法生成逐题报告和二维码。' +
            '如果只想要总分统计，这样也够用。')) +
        '</div></div></div>';
    }

    /* 卷子选择：只在对得上逐题列时才需要 */
    if (hasQ || hasWrong) {
      html += '<div class="field mt" style="max-width:420px"><label>' +
        '这些题目对应哪份卷子？<span class="sub">用于把列号翻译成知识点</span></label>' +
        '<select id="imp-paper">' + paperOpts() + '</select></div>' +
        '<div class="hint">表里有 ' + (_imp.qCols.length || '若干') +
        ' 个题目列。如果和卷子题数对不上，系统会按顺序对应，对不上的部分忽略。</div>';
    }

    html += '<div class="row mt"><button class="btn" id="imp-go"' +
      ((!hasNo && !hasName) || (!hasQ && !hasWrong && !hasScore) ? ' disabled style="opacity:.5"' : '') +
      '>导入 ' + nData + ' 条</button>' +
      '<button class="btn ghost" id="imp-cancel">取消</button></div></div>';

    U.setHTML(body, html);

    U.$('#re-pick', body).addEventListener('click', function () { _imp = null; App.render(); });
    U.$('#imp-cancel', body).addEventListener('click', function () { _imp = null; App.render(); });
    var ssel = U.$('#imp-sheet', body);
    if (ssel) ssel.addEventListener('change', function () {
      _imp.sheetIdx = +this.value; _imp.qs = []; detectSheet(body);
    });

    /* 改列角色：改完重画，让结论和按钮状态跟着更新 */
    U.$$('.imp-role', body).forEach(function (sel) {
      sel.addEventListener('change', function () {
        var ci = +sel.getAttribute('data-c');
        var v = sel.value;
        _imp.cols.roles[ci] = v === '' ? null : v;
        if (v !== 'q') delete _imp.cols.perQ[ci];
        else if (!_imp.cols.perQ[ci]) {
          /* 用户手动标成题目列：猜一个题号，猜不出来就按顺序 */
          var vr = /^(\d{1,3})$/.exec(String(_imp.cols.head[ci] || '').trim());
          _imp.cols.perQ[ci] = vr ? +vr[1] : null;
        }
        /* 重建题目列 */
        var qc = [];
        Object.keys(_imp.cols.perQ).forEach(function (k) {
          if (_imp.cols.roles[k] === 'q') qc.push({ col: +k, no: _imp.cols.perQ[k] });
        });
        qc.sort(function (a, b) { return a.col - b.col; });
        var auto = 0;
        qc.forEach(function (x) { if (x.no == null) { x.no = auto + 1; } auto = x.no; });
        _imp.qCols = qc;
        renderImport(body);
      });
    });

    var ps = U.$('#imp-paper', body);
    if (ps) {
      ps.addEventListener('change', function () {
        var id = this.value;
        var p = Core.presetList().filter(function (x) { return x.id === id; })[0];
        _imp.qs = (id === 'custom' && st.questionIds)
          ? st.questionIds.slice()
          : p.pick();
        renderImport(body);
      });
      ps.value = st.paperPreset || (ps.options.length ? ps.options[0].value : '');
    }

    var go = U.$('#imp-go', body);
    if (go && !go.disabled) go.addEventListener('click', function () { doImport(body); });
  }

  function roleOpts(cur) {
    var opts = [
      ['', '— 忽略 —'], ['no', '学号'], ['name', '姓名'], ['class', '班级'],
      ['q', '每题对错（第N题）'], ['score', '总分'], ['max', '满分'],
      ['wrong', '错题号（如 3,7,12）'], ['right', '答对的题号'],
      ['blank', '未作答的题号'], ['unsure', '不确定的题号']
    ];
    return opts.map(function (o) {
      return '<option value="' + o[0] + '"' + (cur === o[0] || (cur === null && o[0] === '') ? ' selected' : '') +
        '>' + o[1] + '</option>';
    }).join('');
  }

  function paperOpts() {
    return Core.presetList().map(function (p) {
      if (p.id === 'custom') return '';
      var n = p.pick().length;
      if (!n) return '';
      return '<option value="' + p.id + '">' + U.esc(p.name) + '（' + n + ' 题）</option>';
    }).join('');
  }

  /* ---- 真正导入 ---- */
  function doImport(body) {
    var rows = _imp.rows, d = _imp.cols;
    var qs = _imp.qs.map(function (id) { return Core.qmap()[id]; }).filter(Boolean);
    if (!qs.length) { U.err('请先选一份卷子'); return; }

    var cNo = d.roles.indexOf('no'), cName = d.roles.indexOf('name');
    var cCls = d.roles.indexOf('class'), cScore = d.roles.indexOf('score');
    var cMax = d.roles.indexOf('max'), cWrong = d.roles.indexOf('wrong');
    var cRight = d.roles.indexOf('right'), cBlank = d.roles.indexOf('blank');
    var cUnsure = d.roles.indexOf('unsure');

    var qCols = _imp.qCols;
    var out = [], problems = [];

    for (var ri = 1; ri < rows.length; ri++) {
      var r = rows[ri] || [];
      var no = cNo >= 0 ? U.normNo(r[cNo]) : '';
      var name = cName >= 0 ? U.normName(r[cName]) : '';

      /* 我们导出的「逐题对错」表在最上面有三行说明：知识点 / 难度 / 正确答案。
         学号列是空的，但姓名列写着「知识点」这样的字。
         如果只判断「学号和姓名都为空就跳过」，这三行会被当成三个叫
         「知识点」「难度」「正确答案」的学生录进去，成绩表里就多三行鬼。
         所以按姓名认一下，命中就当成元数据行丢掉。 */
      var META_NAMES = { '知识点': 1, '难度': 1, '正确答案': 1, '题型': 1, '标准答案': 1, '题号': 1 };
      if (!no && META_NAMES[name]) continue;

      if (!no && !name) continue;

      /* 走到这里说明至少有一个 —— 只剩姓名没学号是最常见的真实情况
         （老师懒得填学号）。放行，但在下一步的预览界面里标红提醒。 */
      if (!no) problems.push('第 ' + (ri + 1) + ' 行「' + name + '」没有学号，导入后会按姓名建学生');

      var answers = {}, unsure = {}, score = null, maxScore = null;

      /* (a) 逐题列 */
      if (qCols.length) {
        qCols.forEach(function (qc, qi) {
          if (qi >= qs.length) return;                 /* 列比题多，多余的忽略 */
          var q = qs[qi];
          var v = r[qc.col];
          if (v === null || v === undefined || String(v).trim() === '') return;
          var s = String(v).trim();
          /* 逐题列里可能出现：0/1（错/对）、对/错、√/×、或者是学生实际选的答案 A/B/C/D */
          var isRight = null;
          if (/^(1|对|√|✓|是|正确|true|y|yes)$/i.test(s)) isRight = true;
          else if (/^(0|错|×|✗|否|错误|false|n|no)$/i.test(s)) isRight = false;

          if (isRight === null) {
            /* 不是对错标记 —— 那就当成学生写的答案（比如选了 A） */
            if (q.type === 'single') {
              var oi = 'ABCDEF'.indexOf(s.toUpperCase());
              if (oi >= 0) { answers[q.id] = oi; return; }
            } else if (q.type === 'multi') {
              var arr = s.toUpperCase().split(/[^A-F]+/).filter(Boolean)
                .map(function (ch) { return 'ABCDEF'.indexOf(ch); }).filter(function (x) { return x >= 0; });
              if (arr.length) { answers[q.id] = arr; return; }
            } else if (q.type === 'judge' || q.type === 'fill') {
              if (/^(对|√|✓|T|是)$/i.test(s)) { answers[q.id] = true; return; }
              if (/^(错|×|✗|F|否)$/i.test(s)) { answers[q.id] = false; return; }
            }
            problems.push('第 ' + (ri + 1) + ' 行第 ' + (qi + 1) + ' 题：「' + s + '」看不懂，已跳过');
            return;
          }
          if (isRight) answers[q.id] = q.answer;        /* 判为对 = 按标准答案计分 */
          else delete answers[q.id];                    /* 判为错 = 留空 */
        });
      }

      /* (b) 错题号列：表里给了错题列表，其余题按全对处理 */
      if (cWrong >= 0 && !qCols.length) {
        var wtxt = String(r[cWrong] == null ? '' : r[cWrong]);
        var wrongNos = parseNoList(wtxt);
        if (wrongNos.length || /^\s*(无|没有|none|全对)\s*$/i.test(wtxt)) {
          qs.forEach(function (q, qi) {
            if (wrongNos.indexOf(qi + 1) < 0) answers[q.id] = q.answer;
          });
        }
      }
      /* (c) 答对题号列 */
      if (cRight >= 0 && !qCols.length && cWrong < 0) {
        parseNoList(String(r[cRight] == null ? '' : r[cRight])).forEach(function (n) {
          var q = qs[n - 1];
          if (q) answers[q.id] = q.answer;
        });
      }
      /* (d) 未作答 / 不确定 */
      if (cBlank >= 0) {
        parseNoList(String(r[cBlank] == null ? '' : r[cBlank])).forEach(function (n) {
          var q = qs[n - 1];
          if (q) delete answers[q.id];
        });
      }
      if (cUnsure >= 0) {
        parseNoList(String(r[cUnsure] == null ? '' : r[cUnsure])).forEach(function (n) {
          var q = qs[n - 1];
          if (q) unsure[q.id] = true;
        });
      }

      maxScore = cMax >= 0 ? Number(r[cMax]) : Core.paperStats(qs.map(function (q) { return q.id; })).points;
      if (!isFinite(maxScore) || maxScore <= 0) maxScore = Core.paperStats(qs.map(function (q) { return q.id; })).points;

      if (cScore >= 0 && r[cScore] !== null && r[cScore] !== undefined && String(r[cScore]).trim() !== '') {
        var sc = Number(String(r[cScore]).replace(/[^\d.\-]/g, ''));
        if (isFinite(sc)) score = sc;
      }

      /* 只有总分没有逐题数据：按得分率折算，报告只能给总分结论 */
      if (score === null) {
        score = 0;
        qs.forEach(function (q) {
          if (Analyze.isCorrect(q, answers[q.id])) score += (unsure[q.id] ? 0.5 : 1) * Core.scoreOf(q);
        });
      }

      out.push({
        studentNo: no, name: name,
        classId: cCls >= 0 ? String(r[cCls] == null ? '' : r[cCls]).trim() : '',
        answers: answers, unsure: unsure,
        hasDetail: !!(qCols.length || cWrong >= 0 || cRight >= 0),
        score: +Number(score).toFixed(1), maxScore: maxScore,
        rate: maxScore ? Math.min(1, Number(score) / maxScore) : 0,
        rowNo: ri + 1
      });
    }

    if (!out.length) { U.err('没解析出任何一行有效数据'); return; }
    previewAndSave(body, out, qs, problems);
  }

  function parseNoList(txt) {
    var m = String(txt).match(/\d{1,3}/g);
    return m ? m.map(Number) : [];
  }

  /* ---- 预览 + 修学号 + 保存 ---- */
  function previewAndSave(body, list, qs, problems) {
    var clsByName = (function () {
      var m = {};
      Store.classes().forEach(function (c) { m[U.normName(c.name)] = c.id; });
      return m;
    }());

    var html = '<div class="card"><div class="spread"><div>' +
      '<h2 class="sec" style="margin-bottom:0"><span class="bar"></span>预览：确认学号和姓名对得上</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">' +
      '这是最后一道检查。学号错一位，报告就发给了别人——所以请扫一眼。</p></div>' +
      '<div class="row"><button class="btn ghost sm" id="pv-back">返回上一步</button></div></div>';

    if (problems.length) {
      html += '<div class="notice warn mt"><span class="ico">⚠️</span><div class="bd">' +
        '<div class="nt">有 ' + problems.length + ' 处内容看不懂，已跳过</div>' +
        '<div class="nc">' + U.esc(problems.slice(0, 6).join('；')) +
        (problems.length > 6 ? '…等' : '') + '</div></div></div>';
    }

    var noDetail = list.filter(function (x) { return !x.hasDetail; }).length;
    if (noDetail) {
      html += '<div class="notice mt"><span class="ico">📉</span><div class="bd">' +
        '<div class="nt">有 ' + noDetail + ' 条只有总分，没有逐题数据</div><div class="nc">' +
        '这些记录能进班级平均分和排名，但生成不了逐题报告和二维码。' +
        '想要完整报告的话，需要表格里有「每题一列」或「错题号」列。</div></div></div>';
    }

    html += '<div class="tbl-wrap mt"><table class="tbl" id="pv-tbl"><thead><tr>' +
      '<th style="width:44px">行</th><th style="width:180px">学号</th><th style="width:130px">姓名</th>' +
      '<th style="width:110px">班级</th><th style="width:80px">得分</th>' +
      '<th style="width:78px">得分率</th><th>逐题数据</th></tr></thead><tbody>';

    list.forEach(function (x, i) {
      var bad = !x.studentNo;
      html += '<tr><td class="qid">' + x.rowNo + '</td>' +
        '<td><input type="text" class="pv-no" data-i="' + i + '" value="' + U.esc(x.studentNo) + '"' +
        (bad ? ' style="border-color:#f5a3a0;background:#fff7f7"' : '') + '></td>' +
        '<td><input type="text" class="pv-nm" data-i="' + i + '" value="' + U.esc(x.name) + '"></td>' +
        '<td><input type="text" class="pv-cl" data-i="' + i + '" value="' + U.esc(x.classId) + '"></td>' +
        '<td class="num">' + x.score + '<small style="color:var(--ink3)">/' + x.maxScore + '</small></td>' +
        '<td class="num" style="color:' + rateColor(x.rate) + ';font-weight:650">' +
        Math.round(x.rate * 100) + '%</td>' +
        '<td style="font-size:12px">' + (x.hasDetail
          ? '<span class="tag ok">' + Object.keys(x.answers).length + ' 题</span>'
          : '<span class="tag gray">仅总分</span>') + '</td></tr>';
    });
    html += '</tbody></table></div>' +
      '<div class="row mt"><button class="btn" id="pv-go">确认导入</button>' +
      '<span class="hint" id="pv-hint">共 ' + list.length + ' 条</span></div></div>';

    U.setHTML(body, html);
    U.$('#pv-back', body).addEventListener('click', function () { renderImport(body); });

    U.$$('.pv-no', body).forEach(function (inp) {
      inp.addEventListener('input', function () {
        var i = +inp.getAttribute('data-i');
        list[i].studentNo = U.normNo(inp.value);
        inp.style.borderColor = list[i].studentNo ? '' : '#f5a3a0';
        inp.style.background = list[i].studentNo ? '' : '#fff7f7';
      });
    });
    U.$$('.pv-nm', body).forEach(function (inp) {
      inp.addEventListener('input', function () {
        list[+inp.getAttribute('data-i')].name = U.normName(inp.value);
      });
    });
    U.$$('.pv-cl', body).forEach(function (inp) {
      inp.addEventListener('input', function () {
        var v = inp.value.trim();
        list[+inp.getAttribute('data-i')].classId = clsByName[U.normName(v)] || v;
      });
    });

    U.$('#pv-go', body).addEventListener('click', function () {
      saveBatch(list, qs, body);
    });
  }

  function rateColor(r) { return r >= 0.8 ? '#059669' : r >= 0.5 ? '#d97706' : '#dc2626'; }

  function saveBatch(list, qs, body) {
    var btn = U.$('#pv-go', body);
    if (btn) { btn.disabled = true; btn.textContent = '正在保存…'; }

    var noNo = list.filter(function (x) { return !x.studentNo; });
    if (noNo.length) {
      U.confirm('有 ' + noNo.length + ' 条没有学号，确定还要导入吗？<br>' +
        '<span style="font-size:12.5px;color:var(--ink3)">' +
        '这些学生以后很难和新的成绩对上号，建议现在补上。</span>', function () { reallySave(); },
        { danger: true, html: true, yes: '继续导入' });
      return;
    }
    reallySave();

    function reallySave() {
      var now = Date.now();
      var records = list.map(function (x, i) {
        return {
          id: 'r' + now.toString(36) + i.toString(36) + Math.random().toString(36).slice(2, 5),
          studentNo: x.studentNo, name: x.name, classId: x.classId || '',
          paperId: (App.state.sheet && App.state.sheet.paperId) || '',
          paperName: st.paperName || '化学学情诊断',
          questionIds: qs.map(function (q) { return q.id; }),
          answers: x.answers, unsure: x.unsure,
          score: x.score, maxScore: x.maxScore, rate: x.rate,
          source: 'excel', submittedAt: now
        };
      });

      Store.putAll('records', records).then(function () {
        /* 顺手把缺的学生补进名册 */
        return Store.all('students').then(function (exist) {
          var haveNo = {}, haveName = {};
          exist.forEach(function (s) {
            if (s.studentNo) haveNo[U.normNo(s.studentNo)] = 1;
            if (s.name) haveName[U.normName(s.name)] = 1;
          });
          var add = [];
          list.forEach(function (x, i) {
            if (x.studentNo && haveNo[U.normNo(x.studentNo)]) return;
            if (!x.studentNo && x.name && haveName[U.normName(x.name)]) return;
            add.push({
              id: 's' + now.toString(36) + 'i' + i + Math.random().toString(36).slice(2, 5),
              studentNo: x.studentNo, name: x.name, classId: x.classId || '',
              createdAt: now, updatedAt: now
            });
          });
          return add.length ? Store.putAll('students', add) : null;
        });
      }).then(function () {
        var nDet = list.filter(function (x) { return x.hasDetail; }).length;
        U.ok('导入成功：' + list.length + ' 条' + (nDet ? '（其中 ' + nDet + ' 条含逐题数据）' : ''));
        _imp = null; st.tab = 'export';
        App.render();
        U.toast('去「班级分析」可以看整体情况，去「报告二维码」可以给学生发报告', 'ok', 5000);
      }).catch(function (e) {
        U.err('保存失败：' + e.message);
        if (btn) { btn.disabled = false; btn.textContent = '确认导入'; }
      });
    }
  }

  /* ==================== 导出 ==================== */
  function tabExport(body) {
    var html = '<div class="card"><h2 class="sec"><span class="bar"></span>导出结果</h2>' +
      '<p class="sec-desc">导出的是当前浏览器里保存的全部记录，一共 4 个工作表。</p>' +
      '<div id="exp-holder"><div class="empty"><div class="t">正在统计…</div></div></div></div>';
    U.setHTML(body, html);

    Store.all('records').then(function (records) {
      var h = U.$('#exp-holder', body);
      if (!records.length) {
        U.setHTML(h, '<div class="empty"><div class="big">📄</div><div class="t">还没有成绩记录</div></div>');
        return;
      }
      var withDetail = records.filter(function (r) { return r.questionIds && r.questionIds.length; }).length;
      U.setHTML(h,
        '<div class="stats">' +
        '<div class="stat"><div class="k">记录总数</div><div class="v">' + records.length + '<small>条</small></div></div>' +
        '<div class="stat"><div class="k">含逐题数据</div><div class="v">' + withDetail + '<small>条</small></div></div>' +
        '<div class="stat"><div class="k">工作表</div><div class="v">4<small>个</small></div></div>' +
        '</div>' +
        '<div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>工作表</th><th>内容</th></tr></thead><tbody>' +
        '<tr><td style="font-weight:600">班级成绩</td><td>名次、学号、姓名、得分、得分率、真会/蒙对/答错/未作答</td></tr>' +
        '<tr><td style="font-weight:600">逐题对错</td><td>一行一个学生，一列一题。1=对，0=错，0.5=蒙对，空=没做。老师讲评时最常看这张</td></tr>' +
        '<tr><td style="font-weight:600">错题明细</td><td>一行一条错题，含知识点、学生答案、正确答案，可以直接筛出高频错题</td></tr>' +
        '<tr><td style="font-weight:600">知识点掌握</td><td>一行一个学生，一列一个知识点，数值是掌握百分比</td></tr>' +
        '</tbody></table></div>' +
        '<div class="row mt"><button class="btn" id="do-exp">导出 Excel</button>' +
        '<button class="btn ghost" id="to-class">去班级分析</button></div>');
      U.$('#do-exp', h).addEventListener('click', function () { exportAll(records); });
      U.$('#to-class', h).addEventListener('click', function () { App.nav('#/class'); });
    });
  }

  function exportAll(records) {
    try {
      var built = buildWorkbook(records);
      XLSX.download(U.stamp('化学成绩', 'xlsx'), built.sheets, { author: '黎伟成', title: '化学学情诊断' });
      U.ok('已导出（4 个工作表）');
    } catch (e) { U.err('导出失败：' + e.message); }
  }

  /** 把记录组装成 4 个工作表。抽出来是为了能被测试直接调用。 */
  function buildWorkbook(records) {
    var classes = {};
    Store.classes().forEach(function (c) { classes[c.id] = c.name; });

    /* 以出现最多的那份卷子为准 —— 一次导出针对一份卷子才有意义 */
    var byPaper = {};
    records.forEach(function (r) {
      var k = r.paperId || (r.questionIds || []).join(',') || 'misc';
      (byPaper[k] = byPaper[k] || []).push(r);
    });
    var mainKey = Object.keys(byPaper).sort(function (a, b) {
      return byPaper[b].length - byPaper[a].length;
    })[0];
    var rows0 = byPaper[mainKey] || [];
    var qs = ((rows0[0] || {}).questionIds || []).map(function (id) { return Core.qmap()[id]; }).filter(Boolean);
    var paperName = (rows0[0] || {}).paperName || '化学学情诊断';

    var sheets = [];

    /* 1 班级成绩 */
    var r1 = [['名次', '学号', '姓名', '班级', '得分', '满分', '得分率', '真会', '蒙对', '答错', '未作答', '来源', '提交时间']];
    var sorted = rows0.slice().sort(function (a, b) { return (b.rate || 0) - (a.rate || 0); });
    var sums = 0;
    sorted.forEach(function (r, i) {
      var nR = 0, nL = 0, nW = 0, nB = 0;
      qs.forEach(function (q) {
        var a = (r.answers || {})[q.id];
        if (!Analyze.isAnswered(q, a)) { nB++; return; }
        if (Analyze.isCorrect(q, a)) { (r.unsure || {})[q.id] ? nL++ : nR++; } else nW++;
      });
      sums += r.rate || 0;
      r1.push([i + 1, r.studentNo || '', r.name || '',
        classes[r.classId] || r.classId || '',
        r.score, r.maxScore, +((r.rate || 0) * 100).toFixed(1) + '%',
        nR, nL, nW, nB,
        { omr: '拍照识别', manual: '手工录入', excel: 'Excel导入' }[r.source] || '',
        r.submittedAt ? U.fmtTime(r.submittedAt) : '']);
    });
    if (sorted.length) {
      r1.push([]);
      r1.push(['', '', '班级平均', '', +(sums / sorted.length * (sorted[0].maxScore || 100)).toFixed(1),
        sorted[0].maxScore, +(sums / sorted.length * 100).toFixed(1) + '%']);
    }
    sheets.push({ name: '班级成绩', rows: r1, cols: [{ w: 6 }, { w: 16 }, { w: 10 }, { w: 13 }, { w: 8 }, { w: 7 }, { w: 9 }, { w: 6 }, { w: 6 }, { w: 6 }, { w: 8 }, { w: 10 }, { w: 18 }] });

    /* 2 逐题对错 */
    if (qs.length) {
      var noOf = {};
      qs.forEach(function (q, i) { noOf[q.id] = i + 1; });
      var r2 = [];
      r2.push(['学号', '姓名'].concat(qs.map(function (q) { return '第' + noOf[q.id] + '题'; })));
      r2.push(['', '知识点'].concat(qs.map(function (q) { return (Core.kpmap()[q.kp] || {}).name || ''; })));
      r2.push(['', '难度'].concat(qs.map(function (q) { return Core.diffName(q.diff); })));
      r2.push(['', '正确答案'].concat(qs.map(function (q) { return Core.answerText(q, q.answer); })));
      sorted.forEach(function (r) {
        r2.push([r.studentNo || '', r.name || ''].concat(qs.map(function (q) {
          var a = (r.answers || {})[q.id];
          if (!Analyze.isAnswered(q, a)) return '';
          if (!Analyze.isCorrect(q, a)) return 0;
          return (r.unsure || {})[q.id] ? 0.5 : 1;
        })));
      });
      sheets.push({ name: '逐题对错', rows: r2, cols: [{ w: 16 }, { w: 10 }].concat(qs.map(function () { return { w: 5 }; })) });

      /* 3 错题明细 */
      var r3 = [['学号', '姓名', '题号', '知识点', '题型', '难度', '学生答案', '正确答案', '错因诊断']];
      sorted.forEach(function (r) {
        qs.forEach(function (q) {
          var a = (r.answers || {})[q.id];
          if (Analyze.isCorrect(q, a)) return;
          r3.push([r.studentNo || '', r.name || '', noOf[q.id],
            (Core.kpmap()[q.kp] || {}).name || '', Core.typeName(q.type), Core.diffName(q.diff),
            Analyze.isAnswered(q, a) ? Core.answerText(q, a) : '未作答',
            Core.answerText(q, q.answer), q.explain || '']);
        });
      });
      sheets.push({ name: '错题明细', rows: r3, cols: [{ w: 16 }, { w: 10 }, { w: 6 }, { w: 22 }, { w: 9 }, { w: 7 }, { w: 12 }, { w: 12 }, { w: 46 }] });

      /* 4 知识点掌握 */
      var kpIds = U.uniq(qs.map(function (q) { return q.kp; }));
      var kpName = {};
      kpIds.forEach(function (k) { kpName[k] = (Core.kpmap()[k] || {}).name || k; });
      var r4 = [['学号', '姓名'].concat(kpIds.map(function (k) { return kpName[k]; }))];
      var acc = kpIds.map(function () { return { s: 0, n: 0 }; });
      sorted.forEach(function (r) {
        var line = [r.studentNo || '', r.name || ''];
        kpIds.forEach(function (k, ki) {
          var sub = qs.filter(function (q) { return q.kp === k; });
          if (!sub.length) { line.push(''); return; }
          var got = 0;
          sub.forEach(function (q) { if (Analyze.isCorrect(q, (r.answers || {})[q.id])) got++; });
          var v = Math.round(got / sub.length * 100);
          line.push(v);
          acc[ki].s += v; acc[ki].n++;
        });
        r4.push(line);
      });
      r4.push(['', '全班平均'].concat(kpIds.map(function (k, ki) {
        return acc[ki].n ? Math.round(acc[ki].s / acc[ki].n) : '';
      })));
      sheets.push({ name: '知识点掌握', rows: r4, cols: [{ w: 16 }, { w: 10 }].concat(kpIds.map(function () { return { w: 10 }; })) });
    }

    return { sheets: sheets, paperName: paperName, count: rows0.length, nQ: qs.length };
  }

  /* 视图离开时解绑键盘，避免监听器叠加 */
  App.onLeave.manual = function () { if (st && st._unbind) st._unbind(); };

  /* 暴露给测试：Excel 解析和组装是纯函数，可以在 Node 里跑 */
  root.ManualView = {
    detectCols: function (rows) { return detectCols(rows); },
    parseCsv: parseCsv,
    parseNoList: parseNoList,
    buildWorkbook: buildWorkbook,
    _setState: function (s) { st = s; }
  };
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-class -->
<script>
/*!
 * 化学学情诊断平台 · 班级分析
 * 作者：黎伟成
 *
 * 一位老师带一个班，最想知道的不是「谁最高分」，而是：
 *   1. 哪几道题全班都错 → 这几题上课必须讲
 *   2. 哪个知识点全班都塌 → 这个要重新教一遍
 *   3. 哪几个学生掉队了 → 课下单独找
 *   4. 分数是怎么分布的 → 判断整体难度是否合适
 * 这个页面的排版顺序就是按这四件事来的。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store;
  var Analyze = root.Analyze, Charts = root.Charts, XLSX = root.XLSX;

  var _graph = null;
  function graph() {
    if (!_graph) _graph = Analyze.makeGraph(Core.kp(), Core.stages());
    return _graph;
  }

  function rateColor(r) { return r >= 0.8 ? '#059669' : r >= 0.5 ? '#d97706' : '#dc2626'; }

  App.view('class', {
    need: 'classReport',
    render: function (mount) {
      var st = App.state.cls = App.state.cls || { classId: '', paper: '' };
      U.setHTML(mount, '<div class="empty"><div class="t">正在读取成绩…</div></div>');

      Promise.all([Store.all('records'), Store.classes()]).then(function (r) {
        var records = r[0] || [], classes = r[1] || [];

        if (!records.length) {
          U.setHTML(mount, '<div class="card"><div class="empty"><div class="big">📊</div>' +
            '<div class="t">还没有成绩数据</div>' +
            '<div>先用「拍照识别」或「录入成绩」把学生的成绩输进来。</div>' +
            '<div style="margin-top:14px"><button class="btn" id="go">去录入成绩</button></div></div></div>');
          U.$('#go', mount).addEventListener('click', function () { App.nav('#/manual'); });
          return;
        }

        /* ---- 按「卷子」分组。没有 paperId 的用题号集合做指纹 ---- */
        var papers = {};
        records.forEach(function (r) {
          var key = r.paperId || (r.questionIds && r.questionIds.length
            ? 'ids:' + r.questionIds.length + ':' + r.questionIds[0] + ':' + r.questionIds[r.questionIds.length - 1]
            : 'misc');
          if (!papers[key]) papers[key] = { key: key, name: r.paperName || '', questionIds: r.questionIds || [], records: [] };
          papers[key].records.push(r);
          if (!papers[key].name && r.paperName) papers[key].name = r.paperName;
          if (!papers[key].questionIds.length && r.questionIds) papers[key].questionIds = r.questionIds;
        });
        var paperList = Object.keys(papers).map(function (k) { return papers[k]; })
          .sort(function (a, b) { return b.records.length - a.records.length; });

        if (!st.paper || !papers[st.paper]) st.paper = paperList[0].key;
        var P = papers[st.paper];

        /* ---- 卷子里的题目：优先用 id 列表，否则从记录里反推 ---- */
        var qs;
        if (P.questionIds && P.questionIds.length) {
          qs = P.questionIds.map(function (id) { return Core.qmap()[id]; }).filter(Boolean);
        } else {
          var seen = {};
          P.records.forEach(function (r) { Object.keys(r.answers || {}).forEach(function (k) { seen[k] = 1; }); });
          qs = Object.keys(seen).map(function (id) { return Core.qmap()[id]; }).filter(Boolean)
            .sort(function (a, b) { return a.id < b.id ? -1 : 1; });
        }

        /* ---- 班级筛选 ---- */
        var classIds = {};
        P.records.forEach(function (r) { if (r.classId) classIds[r.classId] = 1; });
        var clsIds = Object.keys(classIds);

        var rows = P.records.filter(function (r) {
          if (!st.classId) return true;
          if (st.classId === '__none__') return !r.classId;
          return r.classId === st.classId;
        });

        if (!rows.length) {
          U.setHTML(mount, '<div class="card"><div class="empty">这个筛选条件下没有记录</div></div>');
          return;
        }

        /* ---- 组装成 classReport 需要的行 ---- */
        var normRows = rows.map(function (r) {
          var score = 0, max = 0;
          qs.forEach(function (q) {
            max += Core.scoreOf(q);
            if (Analyze.isCorrect(q, (r.answers || {})[q.id])) {
              score += (r.unsure && r.unsure[q.id] ? 0.5 : 1) * Core.scoreOf(q);
            }
          });
          return {
            id: r.id, studentNo: r.studentNo || '', name: r.name || '',
            classId: r.classId || '', score: score, maxScore: max || 1,
            rate: max ? score / max : 0,
            answers: r.answers || {}, unsure: r.unsure || {},
            submittedAt: r.submittedAt || 0
          };
        });

        var rep = Analyze.classReport(normRows, qs, graph());
        renderPanel(mount, { P: P, paperList: paperList, classes: classes, clsIds: clsIds, qs: qs, rep: rep, rows: normRows, st: st });
      }).catch(function (e) {
        U.setHTML(mount, '<div class="card"><div class="lic-state bad">读取失败：' + U.esc(e.message) + '</div></div>');
      });
    },
    after: function () { drawCharts(); }
  });

  var _pending = null;
  function drawCharts() {
    if (!_pending) return;
    var rep = _pending.rep;
    var dist = U.$('#cls-dist');
    if (dist) {
      /* drawDist 的第二个参数是**标签字符串数组**，不是桶对象 */
      Charts.drawDist(dist,
        rep.dist.map(function (b) { return b.lo + '–' + b.hi; }),
        rep.dist.map(function (b) { return b.n; }));
    }
    var kp = U.$('#cls-kp');
    if (kp) {
      var list = rep.kpStats.slice(0, 12);
      Charts.drawBars(kp,
        list.map(function (k) { return k.name; }),
        list.map(function (k) { return k.rate; }));
    }
    var q = U.$('#cls-q');
    if (q) {
      var hard = rep.qStats.filter(function (x) { return x.rate < 0.75; })
        .sort(function (a, b) { return a.rate - b.rate; }).slice(0, 12);
      if (hard.length) {
        Charts.drawBars(q,
          hard.map(function (x) { return '第' + (x.no || '') + '题'; }),
          hard.map(function (x) { return x.rate; }));
      } else {
        U.setHTML(q.parentNode, '<div class="empty">没有得分率低于 75% 的题目，这份卷子对全班偏简单。</div>');
      }
    }
    _pending = null;
  }

  function renderPanel(mount, o) {
    var rep = o.rep, qs = o.qs, st = o.st, P = o.P;
    /* 成绩行来自调用方传进来的 o.rows。
       以前这里直接用 normRows —— 那是 render() 的 then 回调里的局部变量，
       在 renderPanel 这个作用域根本不存在，只要班里有任何一条成绩
       整页就报「Can't find variable: normRows」。
       o.rows 一直传得好好的，只是函数体里没用它。 */
    var normRows = o.rows || [];
    _pending = { rep: rep };

    /* 给 qStats 补上题号（第几题） */
    var noOf = {};
    qs.forEach(function (q, i) { noOf[q.id] = i + 1; });
    rep.qStats.forEach(function (x) { x.no = noOf[x.id] || ''; });

    var L = root.Report.levelInfo(rep.avg);

    /* ---- 顶部：筛选 + 概览 ---- */
    var head = U.el('div', { class: 'card' });
    var paperOpts = o.paperList.map(function (p) {
      var nm = p.name || ('未命名卷子（' + p.records.length + ' 人）');
      return '<option value="' + U.esc(p.key) + '"' + (p.key === st.paper ? ' selected' : '') + '>' +
        U.esc(nm) + ' · ' + p.records.length + ' 人</option>';
    }).join('');
    var classOpts = '<option value="">全部班级</option>' +
      o.clsIds.map(function (cid) {
        var c = o.classes.filter(function (x) { return x.id === cid; })[0];
        return '<option value="' + U.esc(cid) + '"' + (st.classId === cid ? ' selected' : '') + '>' +
          U.esc(c ? c.name : cid) + '</option>';
      }).join('') +
      '<option value="__none__"' + (st.classId === '__none__' ? ' selected' : '') + '>未分班</option>';

    U.setHTML(head,
      '<div class="spread"><div>' +
      '<h2 class="sec"><span class="bar"></span>班级分析</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">' + U.esc(P.name || '未命名卷子') + ' · ' +
      qs.length + ' 题 · 满分 ' + Core.paperStats(qs.map(function (q) { return q.id; })).points + ' 分</p>' +
      '</div><div class="row">' +
      '<select id="sel-class" style="width:auto">' + classOpts + '</select>' +
      '<button class="btn ghost" id="btn-export">导出 Excel</button>' +
      '<button class="btn ghost" id="btn-print">打印</button>' +
      '</div></div>' +
      '<div class="mt"><select id="sel-paper" style="width:auto;max-width:100%">' + paperOpts + '</select></div>' +
      '<div class="stats mt">' +
      '<div class="stat"><div class="k">参考人数</div><div class="v">' + rep.n + '<small>人</small></div></div>' +
      '<div class="stat"><div class="k">平均得分率</div><div class="v" style="color:' + rateColor(rep.avg) + '">' +
      Math.round(rep.avg * 100) + '<small>%</small></div></div>' +
      '<div class="stat"><div class="k">中位数</div><div class="v">' + Math.round(rep.median * 100) + '<small>%</small></div></div>' +
      '<div class="stat"><div class="k">最高 / 最低</div><div class="v">' +
      Math.round(rep.max * 100) + '<small>/</small>' + Math.round(rep.min * 100) + '<small>%</small></div></div>' +
      '<div class="stat"><div class="k">整体水平</div><div class="v" style="font-size:15px;color:' + rateColor(rep.avg) + '">' +
      U.esc(L.txt) + '</div></div>' +
      '</div>');
    mount.appendChild(head);

    U.$('#sel-class', head).addEventListener('change', function () {
      st.classId = this.value; App.render();
    });
    U.$('#sel-paper', head).addEventListener('change', function () {
      st.paper = this.value; App.render();
    });
    U.$('#btn-print', head).addEventListener('click', function () { window.print(); });
    U.$('#btn-export', head).addEventListener('click', function () { exportExcel(o); });

    /* ---- 图表 ---- */
    var charts = U.el('div', { class: 'rp-grid2' });
    U.setHTML(charts,
      '<div class="card"><h2 class="sec"><span class="bar"></span>分数分布</h2>' +
      '<p class="sec-desc">看整体难度是否合适——如果一大半人挤在 0–30%，说明卷子偏难或基础缺失严重</p>' +
      '<div class="cv-box"><canvas id="cls-dist"></canvas></div></div>' +
      '<div class="card"><h2 class="sec"><span class="bar"></span>最弱的 12 个知识点</h2>' +
      '<p class="sec-desc">全班平均得分率，从左到右逐渐变强</p>' +
      '<div class="cv-box"><canvas id="cls-kp"></canvas></div></div>');
    mount.appendChild(charts);

    /* ---- 该讲评哪些题 ---- */
    var hard = rep.qStats.filter(function (x) { return x.rate < 0.6; })
      .sort(function (a, b) { return a.rate - b.rate; });

    var teach = U.el('div', { class: 'card pagebreak' });
    var teachHtml = '<h2 class="sec"><span class="bar"></span>这几道题上课必须讲</h2>' +
      '<p class="sec-desc">全班得分率低于 60% 的题目，按错误率排序。' +
      (hard.length ? '共 ' + hard.length + ' 题。' : '') + '</p>';

    if (!hard.length) {
      teachHtml += '<div class="empty"><div class="big">✅</div>' +
        '<div class="t">没有全班性错题</div><div>每题都有一半以上的人做对，正常讲评即可。</div></div>';
    } else {
      teachHtml += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th style="width:52px">题号</th><th>知识点</th><th style="width:64px">题型</th>' +
        '<th style="width:52px">难度</th><th style="width:78px">正确率</th>' +
        '<th style="width:92px">错 / 空</th><th>主要错因</th>' +
        '</tr></thead><tbody>';

      hard.forEach(function (x) {
        var q = Core.qmap()[x.id] || {};
        var kp = Core.kpmap()[q.kp] || { name: '—' };
        var why = (q.explain || '').split(/[。\n]/)[0];
        if (why.length > 46) why = why.slice(0, 46) + '…';
        teachHtml += '<tr>' +
          '<td class="qid">' + x.no + '</td>' +
          '<td>' + U.esc(kp.name) + '</td>' +
          '<td>' + U.esc(Core.typeName(q.type)) + '</td>' +
          '<td><span class="chip d' + (q.diff || 1) + '">' + U.esc(Core.diffName(q.diff)) + '</span></td>' +
          '<td class="num" style="color:' + rateColor(x.rate) + ';font-weight:650">' +
          Math.round(x.rate * 100) + '%</td>' +
          '<td class="num">' + x.wrong + ' / ' + x.blank + '</td>' +
          '<td style="font-size:12.5px;color:var(--ink2)">' + U.esc(why) + '…</td>' +
          '</tr>';
      });
      teachHtml += '</tbody></table></div>';
      teachHtml += '<div class="hint mt-s">点任意一行可以在下方展开这一题的完整解析和全班错选分布。</div>' +
        '<div id="q-detail" class="mt"></div>';
    }
    U.setHTML(teach, teachHtml);
    mount.appendChild(teach);

    /* 点击某题看详情 */
    if (hard.length) {
      U.$$('tbody tr', teach).forEach(function (tr, i) {
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', function () { showQDetail(U.$('#q-detail', teach), hard[i], o); });
      });
    }

    /* ---- 最弱的知识点 ---- */
    var weakKp = rep.kpStats.filter(function (k) { return k.rate < 0.7; });
    var kpCard = U.el('div', { class: 'card' });
    var kpHtml = '<h2 class="sec"><span class="bar"></span>全班性的知识漏洞</h2>' +
      '<p class="sec-desc">全班平均得分率低于 70% 的知识点。这些不是个别学生的问题，是<b>要重新讲一遍</b>的内容。</p>';
    if (!weakKp.length) {
      kpHtml += '<div class="empty"><div class="big">👌</div><div class="t">没有全班性漏洞</div></div>';
    } else {
      weakKp.forEach(function (k) {
        var col = rateColor(k.rate);
        kpHtml += '<div class="kprow">' +
          '<span class="name">' + U.esc(k.name) +
          '<small>' + U.esc(Core.stage(k.stage).name) + ' · ' + k.qids.length + ' 题</small></span>' +
          '<span class="meter"><i style="width:' + Math.round(k.rate * 100) + '%;background:' + col + '"></i></span>' +
          '<span class="pct" style="color:' + col + '">' + Math.round(k.rate * 100) + '%</span></div>';
      });
    }
    U.setHTML(kpCard, kpHtml);
    mount.appendChild(kpCard);

    /* ---- 逐个学生 ---- */
    var sorted = normRows.slice().sort(function (a, b) { return b.rate - a.rate; });
    var weakest = sorted.slice(-8).reverse();

    var stuCard = U.el('div', { class: 'card pagebreak' });
    var stuHtml = '<h2 class="sec"><span class="bar"></span>学生成绩</h2>' +
      '<p class="sec-desc">按得分率排序。点姓名可以给这个学生单独生成报告卡。</p>';

    if (weakest.length && rep.n >= 3) {
      stuHtml += '<div class="notice" style="margin-bottom:14px"><span class="ico">🎯</span>' +
