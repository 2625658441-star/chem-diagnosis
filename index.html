  function checkNew(card) {
    var txt = U.$('#add-q', card).value.trim();
    var box = U.$('#chk-box', card);
    if (!txt) { U.err('还没贴内容'); return; }

    var arr;
    try { arr = JSON.parse(txt); }
    catch (e) {
      U.setHTML(box, '<div class="lic-state bad">JSON 格式不对：' + U.esc(e.message) + '</div>');
      return;
    }
    if (!Array.isArray(arr)) arr = [arr];

    var exist = {}, kpMap = {}, stageMap = {}, seen = {};
    Core.questions().forEach(function (q) { exist[q.id] = 1; });
    Core.kp().forEach(function (k) { kpMap[k.id] = k; });
    Core.stages().forEach(function (s) { stageMap[s.id] = 1; });

    var errs = [], warns = [];
    arr.forEach(function (q, i) {
      var at = '第 ' + (i + 1) + ' 题' + (q && q.id ? '（' + q.id + '）' : '');
      if (!q || typeof q !== 'object') { errs.push(at + '：不是一个对象'); return; }
      if (!q.id) errs.push(at + '：缺 id');
      else if (exist[q.id]) errs.push(at + '：id 和已有题目重复 —— 必须用全新题号');
      else if (seen[q.id]) errs.push(at + '：id 在本批里重复');
      seen[q.id] = 1;
      if (!q.stem) errs.push(at + '：缺题干 stem');
      if (!q.explain || !String(q.explain).trim()) {
        errs.push(at + '：缺 explain（错因诊断）—— 这是这个平台最有价值的部分，不能省');
      }
      if (!q.kp) errs.push(at + '：缺 kp');
      else if (!kpMap[q.kp]) errs.push(at + '：kp「' + q.kp + '」不存在，请从知识点清单里选');
      if (q.stage && !stageMap[q.stage]) errs.push(at + '：stage「' + q.stage + '」不存在');
      if (!q.stage && q.kp && kpMap[q.kp]) {
        warns.push(at + '：没写 stage，按知识点归到「' + kpMap[q.kp].stage + '」');
      }
      if (q.diff == null) warns.push(at + '：没写 diff，按中等处理');
      else if ([1, 2, 3].indexOf(q.diff) < 0) {
        errs.push(at + '：diff 只能是 1（基础）/ 2（中等）/ 3（进阶）');
      }

      if (q.type === 'single') {
        if (!Array.isArray(q.options) || q.options.length < 2) errs.push(at + '：单选题要有 options 数组');
        else if (typeof q.answer !== 'number' || q.answer < 0 || q.answer >= q.options.length) {
          errs.push(at + '：answer 要写正确选项的序号（从 0 开始）');
        }
      } else if (q.type === 'multi') {
        if (!Array.isArray(q.options) || q.options.length < 2) errs.push(at + '：多选题要有 options 数组');
        if (!Array.isArray(q.answer) || !q.answer.length) errs.push(at + '：多选题 answer 要写数组，比如 [0,2]');
      } else if (q.type === 'judge') {
        if (typeof q.answer !== 'boolean') errs.push(at + '：判断题 answer 要写 true 或 false');
      } else if (q.type === 'fill') {
        if (!Array.isArray(q.answer) && typeof q.answer !== 'string') {
          errs.push(at + '：填空题 answer 写数组，多个空按顺序，例如 ["H₂O"]');
        }
      } else {
        errs.push(at + '：type「' + q.type + '」不认识，只能是 single / multi / judge / fill');
      }
    });

    if (errs.length) {
      U.setHTML(box, '<div class="lic-state bad"><b>有 ' + errs.length + ' 个问题，没通过校验：</b><br>' +
        errs.slice(0, 20).map(function (e) { return '· ' + U.esc(e); }).join('<br>') +
        (errs.length > 20 ? '<br>…还有 ' + (errs.length - 20) + ' 个' : '') + '</div>');
      return;
    }

    var normalized = arr.map(function (q) {
      var o = {};
      Object.keys(q).forEach(function (k) { o[k] = q[k]; });
      o.diff = q.diff == null ? 2 : q.diff;
      o.stage = q.stage || (kpMap[q.kp] ? kpMap[q.kp].stage : 'J');
      return o;
    });
    var merged = Core.questions().concat(normalized);

    U.setHTML(box,
      '<div class="lic-state ok">✓ 校验通过：' + arr.length + ' 道新题。' +
      '加上原有 ' + Core.questions().length + ' 题，合并后共 ' + merged.length + ' 题。' +
      (warns.length ? '<br><span style="font-size:12.5px">' + U.esc(warns.join('；')) + '</span>' : '') +
      '</div>' +
      '<div class="row"><button class="btn" id="dl-q">下载合并后的题库文件</button>' +
      '<button class="btn ghost" id="try-q">在本机试用（不发布）</button></div>' +
      '<div class="hint mt-s">下载的文件叫 <code>bank-custom.js</code>。' +
      '把它放到 GitHub 仓库的 <code>dist/</code> 目录，然后在 <code>index.html</code> 里' +
      '加一行 <code>&lt;script src="bank-custom.js"&gt;&lt;/script&gt;</code>' +
      '（放在题库数据那个 script 之后），提交。学生刷新就能看到新题。</div>');

    U.$('#dl-q', box).addEventListener('click', function () {
      try {
        var js = '/* 追加题库 · 由管理员后台生成 · 黎伟成 */\n' +
          'window.BANK_DATA_EXTRA = ' + JSON.stringify(normalized) + ';\n' +
          '(function (w) {\n' +
          '  if (!w.BANK_DATA || !w.BANK_DATA.questions) return;\n' +
          '  var have = {};\n' +
          '  w.BANK_DATA.questions.forEach(function (q) { have[q.id] = 1; });\n' +
          '  var add = w.BANK_DATA_EXTRA.filter(function (q) { return !have[q.id]; });\n' +
          '  w.BANK_DATA.questions = w.BANK_DATA.questions.concat(add);\n' +
          '  if (w.Core && w.Core.setData) w.Core.setData(w.BANK_DATA);\n' +
          '})(window);\n';
        U.download(js, 'bank-custom.js', 'text/javascript;charset=utf-8');
        U.ok('已下载 bank-custom.js');
      } catch (e) { U.err('下载失败：' + e.message); }
    });

    U.$('#try-q', box).addEventListener('click', function () {
      if (!root.BANK_DATA) { U.err('这个页面没有内置题库数据'); return; }
      root.BANK_DATA.questions = Core.questions().concat(normalized);
      Core.setData(root.BANK_DATA);
      U.ok('已加载 ' + arr.length + ' 道新题（仅本次会话，刷新就没了）');
      App.render();
    });
  }

  /* ---- 题库文件导入 ---- */
  function renderSelfBank(body) {
    var card = U.el('div', { class: 'card' });
    U.setHTML(card,
      '<h2 class="sec"><span class="bar"></span>题库文件导入</h2>' +
      '<p class="sec-desc">如果已经攒了一批题（比如从 Word / PDF 试卷里抽出来的），' +
      '做成 JSON 或 bank-custom.js 拖进来，会存到本机，进入「自定义组卷」的可选范围。</p>' +
      '<div id="sb-dz"></div>' +
      '<div id="sb-list" class="mt"></div>');
    body.appendChild(card);

    var dzBox = U.$('#sb-dz', card);
    dzBox.appendChild(U.dropZone({
      accept: '.json,.js,.txt', icon: '📚', title: '把题库文件拖到这里',
      sub: '支持本平台导出的 bank-custom.js，或者 JSON 格式的题目数组。',
      multiple: false,
      onFiles: function (files) {
        U.readAsText(files[0]).then(function (txt) {
          var arr = parseBankFile(txt);
          if (!arr || !arr.length) throw new Error('这个文件里没找到题目');
          return Store.put('banks', {
            id: 'b' + Date.now().toString(36), name: files[0].name,
            count: arr.length, questions: arr, addedAt: Date.now()
          }).then(function () { return arr.length; });
        }).then(function (n) {
          U.ok('已导入 ' + n + ' 道题到本机题库');
          App.render();
        }).catch(function (e) { U.err(e.message); });
      }
    }));

    Store.all('banks').then(function (banks) {
      var h = U.$('#sb-list', card);
      if (!h) return;
      if (!banks.length) {
        U.setHTML(h, '<div class="empty">还没有导入过题库文件</div>');
        return;
      }
      var html = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>文件名</th><th style="width:80px">题数</th>' +
        '<th style="width:110px">导入时间</th><th style="width:90px"></th>' +
        '</tr></thead><tbody>';
      banks.forEach(function (b) {
        html += '<tr><td>' + U.esc(b.name) + '</td>' +
          '<td class="num">' + b.count + '</td>' +
          '<td style="font-size:12px;color:var(--ink3)">' + U.fmtDate(b.addedAt) + '</td>' +
          '<td><button class="btn ghost sm rm-b" data-id="' + b.id + '">删除</button></td></tr>';
      });
      html += '</tbody></table></div>';
      U.setHTML(h, html);
      U.$$('.rm-b', h).forEach(function (btn) {
        btn.addEventListener('click', function () {
          U.confirm('删除这个题库？已经生成过的成绩不受影响。', function () {
            var id = btn.getAttribute('data-id');
            Store.remove('banks', id).then(function () { U.ok('已删除'); App.render(); });
          }, { danger: true, html: true, yes: '删除' });
        });
      });
    });
  }

  function parseBankFile(txt) {
    var t = String(txt).trim();
    try {
      var j = JSON.parse(t);
      if (Array.isArray(j)) return j;
      if (j && Array.isArray(j.questions)) return j.questions;
    } catch (e) { /* 继续试下一种 */ }
    var m = /\[\s*\{[\s\S]*\}\s*\]/.exec(t);
    if (m) {
      try { return JSON.parse(m[0]); } catch (e2) { /* 放弃 */ }
    }
    return null;
  }

  /* ==================== 授权与安全 ==================== */
  function tabAbout(body) {
    var card = U.el('div', { class: 'card' });
    var lic = Lic.current();
    var info = lic ? lic.info || {} : null;

    var licBlock;
    if (!lic) {
      licBlock = '<div class="lic-state warn">本机尚未激活。所有功能都锁着。</div>';
    } else if (info.failed) {
      licBlock = '<div class="lic-state bad">激活码校验不通过：' +
        U.esc(info.reason || '签名不对') + '</div>';
    } else {
      licBlock = '<div class="lic-state ok"><b>' + U.esc(info.planName || '') + '</b>　' +
        (info.perpetual ? '永久有效' : '到期 ' + U.fmtDate(info.expires)) +
        '　剩余 ' + (info.perpetual ? '—' : Lic.remainingDays() + ' 天') + '</div>';
    }

    U.setHTML(card,
      '<h2 class="sec"><span class="bar"></span>授权机制，和它的边界</h2>' +
      '<div class="lic-state info"><b>能防住的：</b>别人伪造不出激活码。' +
      '激活码用 ECDSA P-256 私钥签名，公钥内置在网页里。' +
      '没有私钥，就算把网页源码全看完、算法全抄走，也签不出能通过校验的码。' +
      '这是数学保证，不是靠把代码藏起来。</div>' +
      '<div class="lic-state bad"><b>防不住的：</b>会改 JavaScript 的人可以把校验删掉，免费用。' +
      '因为这个平台没有服务器，所有判断都在浏览器里做，而浏览器里的代码用户自己也能改。' +
      '<br><br>这不是实现得不好，是「纯网页 + 无后端」这种架构的固有上限。' +
      '<b>要真正防住，必须加服务器</b>：把「这份卷子能不能批改」这类关键计算放到服务器上，' +
      '客户端只负责显示。那样才既防破解又防转卖。' +
      '<br><br>如果以后商业化到值得防破解的规模，这是第一件要补的事。</div>' +
      '<div class="lic-state warn"><b>现在这套方案适合什么：</b>' +
      '卖给同事、卖给同校老师、小范围收费。' +
      '这种情况下「不能伪造激活码」已经能挡住 99% 的情况——' +
      '没人会为了省几百块去读你的代码。' +
      '真有人破解，说明用户规模已经到该做服务端的时候了。</div>' +

      '<h2 class="sec mt" style="font-size:15px"><span class="bar"></span>本机授权状态</h2>' +
      licBlock +
      '<div class="row mt-s"><button class="btn ghost sm" id="re-in">重新输入激活码</button>' +
      '<button class="btn ghost sm" id="clr-lic">清除本机授权</button></div>' +
      '<div class="hint mt-s">清除授权只是忘掉这台电脑上的激活码，' +
      '激活码本身不会失效，可以再输一遍。</div>' +

      '<h2 class="sec mt" style="font-size:15px"><span class="bar"></span>管理员密码</h2>' +
      '<div class="row"><button class="btn ghost sm" id="ch-pw">修改密码</button>' +
      '<button class="btn ghost sm" id="clr-pw">清除密码</button></div>' +
      '<div class="hint mt-s">清除密码后，下次进后台会重新让你设一个。' +
      '通告、发码记录这些数据不受影响。</div>');
    body.appendChild(card);

    U.$('#re-in', card).addEventListener('click', function () {
      Store.clearLicense();
      U.ok('已清除，正在回到激活页');
      setTimeout(function () { root.location.reload(); }, 700);
    });
    U.$('#clr-lic', card).addEventListener('click', function () {
      U.confirm('清除本机激活授权？清除后功能会立刻锁上。', function () {
        Store.clearLicense();
        U.ok('已清除');
        setTimeout(function () { root.location.reload(); }, 700);
      }, { danger: true, html: true, yes: '清除' });
    });
    U.$('#ch-pw', card).addEventListener('click', function () {
      var box = U.el('div');
      U.setHTML(box,
        '<div class="field"><label>当前密码</label><input type="password" id="o-pw"></div>' +
        '<div class="field mt-s"><label>新密码</label><input type="password" id="n-pw1"></div>' +
        '<div class="field mt-s"><label>再输一次</label><input type="password" id="n-pw2"></div>');
      U.modal({
        title: '修改管理员密码', body: box,
        buttons: [
          { text: '取消', kind: 'ghost', onClick: function (c) { c(); } },
          {
            text: '修改', onClick: function (c) {
              var oldv = U.$('#o-pw', box).value;
              var a = U.$('#n-pw1', box).value, b = U.$('#n-pw2', box).value;
              if (a.length < 6) { U.err('新密码至少 6 位'); return; }
              if (a !== b) { U.err('两次输入不一样'); return; }
              Admin.check(oldv).then(function (ok) {
                if (!ok) { U.err('当前密码不对'); return; }
                return Admin.setPassword(a)
                  .then(function () { return Admin.login(a); })
                  .then(function () { c(); U.ok('已修改'); });
              }).catch(function (e) { U.err(e.message); });
            }
          }
        ]
      });
    });
    U.$('#clr-pw', card).addEventListener('click', function () {
      U.confirm('清除管理员密码？<br><span style="font-size:12.5px;color:var(--ink3)">' +
        '任何人打开这台电脑的浏览器，都能重设密码并进入后台。</span>', function () {
        Store.setAdmin(null);
        Admin.logout();
        U.ok('已清除');
        App.render();
      }, { danger: true, html: true, yes: '清除' });
    });
  }
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- boot -->
<script>

(function(){
  /* 注入公钥 —— 内嵌在页面里，公开也无所谓（私钥在离线工具里） */
  if (window.CHEM_PUBKEY && window.Lic) window.Lic.setPublicKey(window.CHEM_PUBKEY);
  function go(){
    if (!window.App){ document.body.innerHTML='<div class="wrap"><div class="card">平台脚本加载失败，请刷新页面。</div></div>'; return; }
    if (window.Lic && window.CHEM_PUBKEY) window.Lic.setPublicKey(window.CHEM_PUBKEY);
    window.App.mount();
    window.addEventListener('hashchange', function(){ window.App.render(); });
    window.App.boot();
  }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();

</script>
