        '<div class="bd"><div class="nt">需要重点关注的学生</div><div class="nc">' +
        weakest.map(function (r) {
          return U.esc(r.name || r.studentNo || '未署名') + '（' + Math.round(r.rate * 100) + '%）';
        }).join('　') +
        '</div></div></div>';
    }

    stuHtml += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th style="width:46px">名次</th><th style="width:110px">学号</th><th style="width:96px">姓名</th>' +
      '<th style="width:82px">得分</th><th style="width:78px">得分率</th>' +
      '<th style="width:62px">真会</th><th style="width:62px">蒙对</th>' +
      '<th style="width:62px">答错</th><th style="width:70px">未作答</th>' +
      '<th style="width:66px">报告</th></tr></thead><tbody>';

    sorted.forEach(function (r, i) {
      var nRight = 0, nLucky = 0, nWrong = 0, nBlank = 0;
      qs.forEach(function (q) {
        var a = r.answers[q.id];
        if (!Analyze.isAnswered(q, a)) { nBlank++; return; }
        if (Analyze.isCorrect(q, a)) { r.unsure[q.id] ? nLucky++ : nRight++; }
        else nWrong++;
      });
      stuHtml += '<tr data-rid="' + U.esc(r.id) + '">' +
        '<td class="num">' + (i + 1) + '</td>' +
        '<td>' + U.esc(r.studentNo || '—') + '</td>' +
        '<td><a href="#" class="stu-link" data-rid="' + U.esc(r.id) + '" style="color:var(--brand);font-weight:600">' +
        U.esc(r.name || '—') + '</a></td>' +
        '<td class="num">' + r.score.toFixed(0) + '<small style="color:var(--ink3)">/' + r.maxScore + '</small></td>' +
        '<td class="num" style="color:' + rateColor(r.rate) + ';font-weight:650">' + Math.round(r.rate * 100) + '%</td>' +
        '<td class="num right-mark">' + nRight + '</td>' +
        '<td class="num" style="color:#b45309">' + (nLucky || '') + '</td>' +
        '<td class="num wrong-mark">' + (nWrong || '') + '</td>' +
        '<td class="num" style="color:var(--ink3)">' + (nBlank || '') + '</td>' +
        '<td><button class="btn ghost sm one-rpt" data-rid="' + U.esc(r.id) + '">生成</button></td>' +
        '</tr>';
    });
    stuHtml += '</tbody></table></div>';
    U.setHTML(stuCard, stuHtml);
    mount.appendChild(stuCard);

    /* 单个学生报告卡 */
    U.$$('.one-rpt', stuCard).forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var rid = b.getAttribute('data-rid');
        var row = normRows.filter(function (x) { return x.id === rid; })[0];
        if (!row) return;
        App.state.qr = App.state.qr || {};
        App.state.qr.questionIds = qs.map(function (q) { return q.id; });
        App.state.qr.paperName = P.name || '化学学情诊断';
        App.state.qr.only = rid;
        App.nav('#/qr');
        U.toast('已切到报告卡页面。若要只印这一张，请点「生成报告卡」后单独打印。', 'ok');
      });
    });
  }

  /* ---------------- 单题详情：全班错选分布 ---------------- */
  function showQDetail(box, x, o) {
    var q = Core.qmap()[x.id];
    if (!q || !box) return;
    var kp = Core.kpmap()[q.kp] || { name: '—' };

    var counts = {}, blank = 0, n = 0;
    o.rows.forEach(function (r) {
      n++;
      var a = r.answers[q.id];
      if (!Analyze.isAnswered(q, a)) { blank++; return; }
      var key = Array.isArray(a) ? a.join(',') : String(a);
      counts[key] = (counts[key] || 0) + 1;
    });

    var html = '<div class="rev">' +
      '<div class="rh"><span class="chip">' + U.esc(kp.name) + '</span>' +
      '<span class="chip d' + (q.diff || 1) + '">' + U.esc(Core.diffName(q.diff)) + '</span>' +
      '<span class="chip gray">' + U.esc(Core.typeName(q.type)) + '</span>' +
      '<span class="chip" style="margin-left:auto;background:' +
      (x.rate >= 0.6 ? 'var(--ok-soft);color:#065f46' : 'var(--bad-soft);color:#991b1b') + '">正确率 ' +
      Math.round(x.rate * 100) + '%</span></div>' +
      '<div class="q">' + U.esc(q.stem) + '</div>';

    if (q.type === 'single' || q.type === 'multi') {
      (q.options || []).forEach(function (op, i) {
        var isA = (q.type === 'single') ? (q.answer === i) : ((q.answer || []).indexOf(i) >= 0);
        var c = counts[String(i)] || 0;
        var pct = n ? Math.round(c / n * 100) : 0;
        html += '<div class="optline' + (isA ? ' right' : '') + '">' +
          '<b>' + String.fromCharCode(65 + i) + '.</b> ' + U.esc(op) +
          (isA ? ' <span style="color:#065f46">← 正确答案（' + c + ' 人，' + pct + '%）</span>'
            : (c ? ' <span style="color:' + (pct >= 40 ? '#b91c1c' : 'var(--ink3)') + '">选择 ' + c + ' 人（' + pct + '%）</span>' : '')) +
          '</div>';
      });
    } else if (q.type === 'judge') {
      [[true, '对'], [false, '错']].forEach(function (p) {
        var c = counts[String(p[0])] || 0;
        html += '<div class="optline' + (q.answer === p[0] ? ' right' : '') + '">' +
          p[1] + '　选择 ' + c + ' 人' + (q.answer === p[0] ? '　← 正确答案' : '') + '</div>';
      });
    } else {
      html += '<div class="optline right">参考答案：' + U.esc((q.answer || []).join(' 或 ')) + '</div>' +
        '<div class="optline">判对 ' + (counts['true'] || 0) + ' 人，判错 ' + (counts['false'] || 0) + ' 人</div>';
    }
    html += '<div class="optline" style="background:#f8fafc;color:var(--ink3)">未作答 ' + blank + ' 人</div>';

    /* 错误选项分析：如果某个干扰项被大量选择，说明存在共同的迷思概念 */
    var wrongMost = null, wrongMostN = 0;
    Object.keys(counts).forEach(function (k) {
      if (q.type === 'single' && Number(k) === q.answer) return;
      if (q.type === 'multi' && String(q.answer) === k) return;
      if (counts[k] > wrongMostN) { wrongMostN = counts[k]; wrongMost = k; }
    });
    if (wrongMost !== null && n && wrongMostN / n >= 0.25 && wrongMostN > 1) {
      var label = q.type === 'single' ? String.fromCharCode(65 + Number(wrongMost)) : wrongMost;
      html += '<div class="lic-state warn" style="margin-top:10px;margin-bottom:0">' +
        '<b>集体迷思：</b>有 ' + wrongMostN + ' 人（' + Math.round(wrongMostN / n * 100) + '%）都选了 <b>' +
        U.esc(label) + '</b>。这不是粗心，是<b>同一个概念理解偏了</b>——' +
        '讲这道题时要专门指出这个错误选项为什么错，而不是只报正确答案。</div>';
    }

    html += '<div class="exp"><b>解析 / 错因诊断：</b>' + U.esc(q.explain || '（无）') + '</div></div>';

    U.setHTML(box, html);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ---------------- 导出 Excel ---------------- */
  function exportExcel(o) {
    var rep = o.rep, qs = o.qs, P = o.P;
    var sheets = [];

    /* Sheet 1 班级成绩 */
    var r1 = [['名次', '学号', '姓名', '得分', '满分', '得分率', '真会', '蒙对', '答错', '未作答', '提交时间']];
    var sorted = o.rows.slice().sort(function (a, b) { return b.rate - a.rate; });
    sorted.forEach(function (r, i) {
      var nR = 0, nL = 0, nW = 0, nB = 0;
      qs.forEach(function (q) {
        var a = r.answers[q.id];
        if (!Analyze.isAnswered(q, a)) { nB++; return; }
        if (Analyze.isCorrect(q, a)) { r.unsure[q.id] ? nL++ : nR++; } else nW++;
      });
      r1.push([i + 1, r.studentNo, r.name, +r.score.toFixed(1), r.maxScore,
        +(r.rate * 100).toFixed(1) + '%', nR, nL, nW, nB,
        r.submittedAt ? U.fmtTime(r.submittedAt) : '']);
    });
    sheets.push({ name: '班级成绩', rows: r1, cols: [{ w: 6 }, { w: 15 }, { w: 10 }, { w: 8 }, { w: 7 }, { w: 9 }, { w: 6 }, { w: 6 }, { w: 6 }, { w: 8 }, { w: 18 }] });

    /* Sheet 2 逐题对错 —— 老师讲评时最常看的一张 */
    var noOf = {};
    qs.forEach(function (q, i) { noOf[q.id] = i + 1; });
    var r2 = [];
    r2.push(['学号', '姓名'].concat(qs.map(function (q) { return '第' + noOf[q.id] + '题'; })));
    r2.push(['', ''].concat(qs.map(function (q) { return (Core.kpmap()[q.kp] || {}).name || ''; })));
    r2.push(['', ''].concat(qs.map(function (q) { return Core.diffName(q.diff); })));
    r2.push(['', ''].concat(qs.map(function (q) { return Core.answerText(q, q.answer); })));
    sorted.forEach(function (r) {
      r2.push([r.studentNo, r.name].concat(qs.map(function (q) {
        var a = r.answers[q.id];
        if (!Analyze.isAnswered(q, a)) return '';
        if (!Analyze.isCorrect(q, a)) return 0;
        return (r.unsure[q.id] ? 0.5 : 1);   /* 0.5 = 蒙对，老师和学生都要能看出来 */
      })));
    });
    sheets.push({
      name: '逐题对错',
      rows: r2,
      cols: [{ w: 15 }, { w: 10 }].concat(qs.map(function () { return { w: 5 }; }))
    });

    /* Sheet 3 错题明细 */
    var r3 = [['学号', '姓名', '题号', '知识点', '题型', '难度', '学生答案', '正确答案']];
    sorted.forEach(function (r) {
      qs.forEach(function (q) {
        var a = r.answers[q.id];
        if (Analyze.isCorrect(q, a)) return;
        r3.push([
          r.studentNo, r.name, noOf[q.id],
          (Core.kpmap()[q.kp] || {}).name || '', Core.typeName(q.type), Core.diffName(q.diff),
          Analyze.isAnswered(q, a) ? Core.answerText(q, a) : '未作答',
          Core.answerText(q, q.answer)
        ]);
      });
    });
    sheets.push({ name: '错题明细', rows: r3, cols: [{ w: 15 }, { w: 10 }, { w: 6 }, { w: 22 }, { w: 9 }, { w: 7 }, { w: 12 }, { w: 12 }] });

    /* Sheet 4 知识点掌握 */
    var kpList = rep.kpStats.map(function (k) { return k.id; });
    var kpName = {};
    rep.kpStats.forEach(function (k) { kpName[k.id] = k.name; });
    var r4 = [['学号', '姓名'].concat(kpList.map(function (id) { return kpName[id]; }))];
    var sums = new Array(kpList.length).fill(0), cnts = new Array(kpList.length).fill(0);
    sorted.forEach(function (r) {
      var line = [r.studentNo, r.name];
      kpList.forEach(function (k, i) {
        var sub = qs.filter(function (q) { return q.kp === k; });
        if (!sub.length) { line.push(''); return; }
        var got = 0;
        sub.forEach(function (q) { if (Analyze.isCorrect(q, r.answers[q.id])) got++; });
        var v = Math.round(got / sub.length * 100);
        line.push(v);
        sums[i] += v; cnts[i]++;
      });
      r4.push(line);
    });
    r4.push(['', '全班平均'].concat(kpList.map(function (k, i) {
      return cnts[i] ? Math.round(sums[i] / cnts[i]) : '';
    })));
    sheets.push({ name: '知识点掌握', rows: r4, cols: [{ w: 15 }, { w: 10 }].concat(kpList.map(function () { return { w: 11 }; })) });

    var fname = U.stamp('化学班级成绩' + (P.name ? '_' + P.name.replace(/[\\/:*?"<>|]/g, '') : ''), 'xlsx');
    try {
      XLSX.download(fname, sheets, { author: '黎伟成', title: P.name || '化学学情诊断' });
      U.ok('已导出 ' + fname + '（4 个工作表）');
    } catch (e) {
      U.err('导出失败：' + (e.message || e));
    }
  }
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-qr -->
<script>
/*!
 * 化学学情诊断平台 · 学生报告二维码
 * 作者：黎伟成
 *
 * 这是整条链路的收口：
 *   老师批改完 → 这里给每个学生生成一张「报告卡」→ 打印/截图发下去
 *   → 学生手机扫码 → student.html 打开详细报告
 *
 * 为什么没有服务器也能做到？
 *   二维码里直接装着「这份卷子考了哪些题 + 这个学生每题选了什么」，
 *   学生端页面自带题库，解码后本地算报告。好处：
 *   · 零成本、零运维，不用买服务器
 *   · 学生数据不上传，隐私天然更好
 *   · 老师断网也能生成
 *   代价是二维码容量有限：整卷 167 题实测 148 字符、QR 版本 8（49×49），
 *   手机很好扫；但题量再翻倍就会超出上限。所以这里必须**提前估算**并明确警告，
 *   而不是默默生成一个扫不出来的码让老师到教室才发现。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store;
  var Codec = root.Codec, QR = root.QR;

  /* 安全上限。QR 版本 40 / 纠错 M 理论上能装约 2331 字节，
     但那么密的码在手机屏幕上、尤其印在纸上以后基本扫不出来。
     1200 字符是留足余量的经验值；超过 700 就提示老师把码印大一点。 */
  var MAX_PAYLOAD = 1200;
  var COMFORT = 700;

  function sameIds(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  /* 跟「答题卡」页的卷子对齐。
     换卷子后必须重算，否则二维码里装的还是旧卷子的题号，
     学生扫开看到的是别人的题目和分数。 */
  function syncPaper(st) {
    var sh = App.state.sheet;
    if (!sh || !sh.questionIds || !sh.questionIds.length) return;
    if (sameIds(st.questionIds, sh.questionIds)) {
      st.paperName = sh.title || st.paperName || '化学学情诊断';
      return;
    }
    st.questionIds = sh.questionIds.slice();
    st.paperName = sh.title || '化学学情诊断';
  }

  /* 简版报告卡：一个学生一张，打印时【一人一页】。
     卡片只放「拿在手里一眼看懂」的东西 —— 谁、多少分、什么水平、最该补哪一个。
     完整的逐题错因分析 + 技能地图在二维码里，学生扫码看。
     二维码做成右上角的小卡片，缩小后不抢视线，剪开分发也方便。 */
  function reportCardHtml(d) {
    var m = d.meta, A = d.analysis;
    var L = root.Report.levelInfo(d.rate);

    /* 最该补的知识点：按得分率从低到高，取前 3 */
    var weak = [];
    Object.keys(A.kp).forEach(function (k) {
      var K = A.kp[k];
      if (!K.untested && K.rate < 0.75) weak.push({ id: k, K: K });
    });
    weak.sort(function (a, b) { return a.K.rate - b.K.rate; });

    function kpName(id) { return (Core.kpmap()[id] || { name: id }).name; }

    var top = weak.slice(0, 3).map(function (x) {
      var pct = Math.round(x.K.rate * 100);
      var col = pct < 40 ? '#dc2626' : pct < 70 ? '#d97706' : '#059669';
      return '<div class="rc-kp">' +
        '<span class="rc-kp-n">' + U.esc(kpName(x.id)) + '</span>' +
        '<span class="rc-kp-m"><i style="width:' + pct + '%;background:' + col + '"></i></span>' +
        '<span class="rc-kp-p" style="color:' + col + '">' + pct + '%</span>' +
        '</div>';
    }).join('');

    if (!top) {
      top = '<div class="rc-kp-none">✓ 这套卷子考到的知识点都掌握得不错</div>';
    } else if (weak.length > 3) {
      top += '<div class="rc-kp-more">另外还有 ' + (weak.length - 3) + ' 个知识点没掌握 —— 扫码看完整清单</div>';
    }

    return '<div class="rpt-card">' +
      /* 右上角小卡片：二维码 */
      '<div class="rc-qrwrap">' +
      '<div class="rc-qr" data-qr="' + U.esc(m.payload || '') + '">' +
      '<div class="rc-qr-load">二维码<br>生成中…</div></div>' +
      '<div class="rc-qr-t">扫码看完整报告</div>' +
      '</div>' +

      '<div class="rc-head">' +
      '<div class="rc-brand">黎伟成 制作</div>' +
      '<div class="rc-t">化学学情诊断 · 个人报告</div>' +
      '</div>' +

      '<div class="rc-main">' +
      '<div class="rc-who">' +
      '<span class="rc-name">' + U.esc(m.name || '（未署名）') + '</span>' +
      '<span class="rc-no">学号 ' + U.esc(m.studentNo || '—') + '</span>' +
      '</div>' +

      '<div class="rc-scorebar">' +
      '<div class="rc-score"><b>' + d.score.toFixed(0) + '</b><small> / ' + d.maxScore + ' 分</small></div>' +
      '<div class="rc-ratebox">' +
      '<div class="rc-rate">得分率 <b>' + Math.round(d.rate * 100) + '%</b></div>' +
      '<div class="rc-level">' + U.esc(L.txt) + '</div>' +
      '</div>' +
      '</div>' +

      '<div class="rc-counts">' +
      '<div class="rc-cnt"><b>' + A.nRight + '</b><span>真会</span></div>' +
      '<div class="rc-cnt lucky"><b>' + (A.nLucky || 0) + '</b><span>蒙对</span></div>' +
      '<div class="rc-cnt wrong"><b>' + A.nWrong + '</b><span>答错</span></div>' +
      '<div class="rc-cnt blank"><b>' + (A.nBlank || 0) + '</b><span>未作答</span></div>' +
      '</div>' +

      '<div class="rc-sec">' +
      '<div class="rc-sec-h">最需要补的知识点</div>' +
      '<div class="rc-kps">' + top + '</div>' +
      '</div>' +

      '<div class="rc-scan">' +
      '<span class="rc-scan-i">📱</span>' +
      '<div>扫码查看<b>全部错题的错因分析</b>、<b>技能地图</b>，以及按依赖关系排好的复习顺序。</div>' +
      '</div>' +

      '<div class="rc-foot">' +
      '<span>' + U.esc(m.paperName || '化学学情诊断') + '　·　' +
      U.esc(U.fmtDate(m.submittedAt || Date.now())) + '</span>' +
      '<span class="rc-foot-b">黎伟成 制作</span>' +
      '</div>' +
      '</div>' +
      '</div>';
  }

  App.view('qr', {
    need: 'qrReport',
    render: function (mount) {
      var st = App.state.qr = App.state.qr || {};
      /* 每次渲染都跟「答题卡」页对齐。原来只在「还没有卷子」时才同步，
         老师换了卷子再回来，显示的还是旧卷子 —— 二维码发下去就是错卷子的报告。 */
      syncPaper(st);

      U.setHTML(mount, '');

      if (!st.questionIds || !st.questionIds.length) {
        var e = U.el('div', { class: 'card' });
        U.setHTML(e, '<div class="empty"><div class="big">📇</div>' +
          '<div class="t">先选一份卷子</div>' +
          '<div>报告卡需要知道「考了哪些题」。请先到「答题卡」页选好卷子。</div>' +
          '<div style="margin-top:14px"><button class="btn" id="go-sheet">去选卷子</button></div></div>');
        mount.appendChild(e);
        U.$('#go-sheet', e).addEventListener('click', function () { App.nav('#/sheet'); });
        return;
      }

      var qs = st.questionIds.map(function (id) { return Core.qmap()[id]; }).filter(Boolean);
      var ids = qs.map(function (q) { return q.id; });

      /* 提前估算二维码大小，决定要不要警告——不要等生成完才发现扫不出来 */
      var est = Codec.encode({
        questions: qs, answers: {}, bank: Core.questions(),
        studentNo: '202601010101', name: '三四字姓名'
      }).length;

      var head = U.el('div', { class: 'card' });
      var warnHtml = '';
      if (est > MAX_PAYLOAD) {
        warnHtml = '<div class="notice bad" style="margin-top:12px"><span class="ico">⛔</span>' +
          '<div class="bd"><div class="nt">这份卷子太大了，二维码会扫不出来</div>' +
          '<div class="nc">预计需要 ' + est + ' 个字符，安全上限约 ' + MAX_PAYLOAD + ' 个。' +
          '建议改用「快速摸底」(32 题) 或「地基诊断」(91 题)，把一次诊断拆成几次。' +
          '题目越多码越密，打印后手机越难扫——拆卷实际上效果更好，学生也不会一次做太多。</div></div></div>';
      } else if (est > COMFORT) {
        warnHtml = '<div class="notice" style="margin-top:12px"><span class="ico">📐</span>' +
          '<div class="bd"><div class="nt">二维码偏大，注意印清楚</div>' +
          '<div class="nc">预计 ' + est + ' 个字符。打印时请保证二维码边长不小于 25 mm，' +
          '不要缩印、不要覆膜反光。</div></div></div>';
      }

      U.setHTML(head,
        '<h2 class="sec"><span class="bar"></span>生成学生报告卡</h2>' +
        '<p class="sec-desc">每个学生一张。上面有他自己的二维码，扫开就是他的详细报告——' +
        '报告数据全部装在二维码里，不经过任何服务器。</p>' +
        '<div class="stats">' +
        '<div class="stat"><div class="k">题目</div><div class="v">' + qs.length + '<small>题</small></div></div>' +
        '<div class="stat"><div class="k">满分</div><div class="v">' + Core.paperStats(ids).points + '<small>分</small></div></div>' +
        '<div class="stat"><div class="k">二维码载荷</div><div class="v">' + est + '<small>字符</small></div></div>' +
        '<div class="stat"><div class="k">可生成</div><div class="v" id="cnt">—<small>张</small></div></div>' +
        '</div>' + warnHtml +
        '<div class="row mt"><button class="btn" id="btn-build">生成报告卡</button>' +
        '<button class="btn ghost" id="btn-print">打印</button>' +
        '<span class="hint" id="build-hint">' +
        (est > MAX_PAYLOAD ? '请先换一份更小的卷子' : '') + '</span></div>');
      mount.appendChild(head);

      var body = U.el('div', { id: 'qr-body' });
      mount.appendChild(body);

      var buildBtn = U.$('#btn-build', head);
      if (est > MAX_PAYLOAD) { buildBtn.disabled = true; buildBtn.style.opacity = '.5'; }
      else buildBtn.addEventListener('click', build);
      U.$('#btn-print', head).addEventListener('click', function () { window.print(); });

      function build() {
        U.setHTML(body, '<div class="empty"><div class="t">正在读取成绩…</div></div>');
        Store.all('records').then(function (records) {
          /* 只保留确实属于这份卷子的：题目集合一致的优先；
             没有记录题目集合的（比如手工只录了总分）就一并带上，由老师自己判断。 */
          var list = records.filter(function (r) {
            if (r.questionIds && r.questionIds.length && !sameIds(r.questionIds, ids)) return false;
            if (st.paperId && r.paperId && r.paperId !== st.paperId) return false;
            return true;
          });

          if (!list.length) {
            U.setHTML(body, '<div class="card"><div class="empty"><div class="big">📭</div>' +
              '<div class="t">还没有成绩记录</div>' +
              '<div>先到「拍照识别」或「录入成绩」把成绩输进来，再回来生成报告卡。</div>' +
              '<div style="margin-top:14px"><button class="btn" id="go">去录入成绩</button></div></div></div>');
            U.$('#go', body).addEventListener('click', function () { App.nav('#/manual'); });
            return;
          }

          list.sort(function (a, b) {
            return String(a.studentNo || '').localeCompare(String(b.studentNo || ''), 'zh');
          });
          U.$('#cnt', head).innerHTML = list.length + '<small>张</small>';

          /* file:// 打开时 origin 是 'null'，给不出可用的学生链接。
             这种情况二维码内容是对的，只是前缀不对——上传到网上再生成一次即可。 */
          var isFile = root.location.protocol === 'file:';
          var base = isFile ? 'student.html?d='
            : (root.location.origin + root.location.pathname.replace(/[^/]*$/, '') + 'student.html?d=');

          var cards = '', overCount = 0, payloads = [];
          list.forEach(function (r) {
            var payload = Codec.encode({
              questions: qs, answers: r.answers || {},
              studentNo: r.studentNo || '', name: r.name || '',
              bank: Core.questions()
            });
            if (payload.length > MAX_PAYLOAD) overCount++;
            payloads.push(payload);

            /* 用真实成绩重算报告，保证卡片上的数字和扫码后看到的完全一致 */
            var d = root.Report.compute({
              questions: qs, answers: r.answers || {}, unsure: r.unsure || {},
              meta: {
                name: r.name || '', studentNo: r.studentNo || '',
                paperName: st.paperName || '化学学情诊断',
                submittedAt: r.submittedAt || Date.now(), payload: payload
              }
            });
            cards += reportCardHtml(d);
          });

          var note = '';
          if (isFile) {
            note = '<div class="notice bad" style="margin-bottom:14px"><span class="ico">⚠️</span>' +
              '<div class="bd"><div class="nt">现在是用本地文件打开的，学生扫码打不开</div>' +
              '<div class="nc">二维码里的链接必须是一个真正的网址。请先把 <b>dist 文件夹</b>' +
              '上传到 GitHub Pages 或 Netlify，再用那个网址打开本页面重新生成。<br>' +
              '二维码里的数据本身是对的，只是链接前缀不对。</div></div></div>';
          }
          if (overCount) {
            note += '<div class="notice bad" style="margin-bottom:14px"><span class="ico">⛔</span>' +
              '<div class="bd"><div class="nt">有 ' + overCount + ' 张卡的二维码超长了</div>' +
              '<div class="nc">这些卡可能扫不出来，请换更小的卷子重新生成。</div></div></div>';
          }

          U.setHTML(body, note + '<div class="qr-grid">' + cards + '</div>');

          /* 二维码延迟注入：几十张卡的 SVG 直接拼进 innerHTML 会很慢，
             分开按需渲染，且单张失败不会毁掉整页。 */
          var slots = U.$$('[data-qr]', body);
          slots.forEach(function (slot, i) {
            var payload = payloads[i];
            try {
              U.setHTML(slot, QR.svg(base + payload, 'M', 4));
            } catch (err) {
              U.setHTML(slot, '<div class="lic-state bad" style="font-size:11.5px;line-height:1.5">' +
                '二维码生成失败：' + U.esc(err.message || err) + '</div>');
            }
          });

          U.ok('已生成 ' + list.length + ' 张报告卡');
          U.$('#build-hint', head).textContent =
            '共 ' + list.length + ' 张 · 用手机相机直接扫卡片上的码即可';
        }).catch(function (e) {
          U.setHTML(body, '<div class="card"><div class="lic-state bad">读取成绩失败：' +
            U.esc(e.message) + '</div></div>');
        });
      }
    }
  });
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-students -->
<script>
/*!
 * 化学学情诊断平台 · 学生与记录
 * 作者：黎伟成
 *
 * 这里做三件事：
 *   1. 学生名册（学号 ↔ 姓名 的对应关系，Excel 导入时靠它配对）
 *   2. 历史记录（谁在什么时候做过哪份卷子、多少分）
 *   3. 数据备份（导出/导入 JSON）—— 数据只在浏览器里，必须能搬走
 *
 * 第 3 点特别重要：平台没有服务器，数据全在本机浏览器。
 * 老师换电脑、清缓存、换浏览器，数据就没了。所以这里要显眼。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store;
  var Analyze = root.Analyze, XLSX = root.XLSX;

  App.view('students', {
    render: function (mount) {
      var st = App.state.stu = App.state.stu || { tab: 'roster', classId: '' };
      U.setHTML(mount, '<div class="empty"><div class="t">正在读取…</div></div>');

      Promise.all([
        Store.all('students'), Store.all('records'),
        Store.classes(), Store.all('papers')
      ]).then(function (r) {
        var students = r[0] || [], records = r[1] || [];
        var classes = r[2] || [], papers = r[3] || [];
        renderAll(mount, { students: students, records: records, classes: classes, papers: papers, st: st });
      }).catch(function (e) {
        U.setHTML(mount, '<div class="card"><div class="lic-state bad">读取失败：' + U.esc(e.message) + '</div></div>');
      });
    }
  });

  function renderAll(mount, o) {
    var st = o.st, students = o.students, records = o.records, classes = o.classes;

    /* ---- 班级管理 ---- */
    var clsMap = {};
    classes.forEach(function (c) { clsMap[c.id] = c.name; });

    var head = U.el('div', { class: 'card' });
    U.setHTML(head,
      '<div class="spread"><div>' +
      '<h2 class="sec"><span class="bar"></span>学生与记录</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">名册和成绩都保存在你自己的浏览器里，不会上传到任何地方。</p>' +
      '</div><div class="row">' +
      '<button class="btn ghost sm" id="tab-roster">学生名册 <b>' + students.length + '</b></button>' +
      '<button class="btn ghost sm" id="tab-records">历史记录 <b>' + records.length + '</b></button>' +
      '<button class="btn ghost sm" id="tab-classes">班级 <b>' + classes.length + '</b></button>' +
      '<button class="btn ghost sm" id="tab-data">数据备份</button>' +
      '</div></div>');
    mount.appendChild(head);

    var body = U.el('div', { id: 'stu-body' });
    mount.appendChild(body);

    function setTab(t) {
      st.tab = t;
      U.$$('[id^=tab-]', head).forEach(function (b) {
        b.classList.toggle('btn', b.id === 'tab-' + t);
        b.classList.toggle('ghost', b.id !== 'tab-' + t);
      });
      if (t === 'roster') tabRoster(body, o);
      else if (t === 'records') tabRecords(body, o);
      else if (t === 'classes') tabClasses(body, o);
      else tabData(body, o);
    }

    U.$('#tab-roster', head).addEventListener('click', function () { setTab('roster'); });
    U.$('#tab-records', head).addEventListener('click', function () { setTab('records'); });
    U.$('#tab-classes', head).addEventListener('click', function () { setTab('classes'); });
    U.$('#tab-data', head).addEventListener('click', function () { setTab('data'); });
    setTab(st.tab);
  }

  /* ---------------- 名册 ---------------- */
  function tabRoster(body, o) {
    var students = o.students, classes = o.classes, records = o.records;
    var clsMap = {};
    classes.forEach(function (c) { clsMap[c.id] = c.name; });

    /* 每个学生做过几次、最近一次多少分 */
    var stat = {};
    records.forEach(function (r) {
      var key = studentKey(r);
      if (!stat[key]) stat[key] = { n: 0, last: 0, lastAt: 0 };
      stat[key].n++;
      if ((r.submittedAt || 0) >= stat[key].lastAt) {
        stat[key].lastAt = r.submittedAt || 0;
        stat[key].last = r.rate != null ? r.rate : 0;
      }
    });

    var html = '<div class="card" id="roster-card">' +
      '<div class="spread"><h2 class="sec" style="margin-bottom:0"><span class="bar"></span>学生名册</h2>' +
      '<div class="row">' +
      '<button class="btn sm" id="add-stu">+ 添加学生</button>' +
      '<button class="btn ghost sm" id="imp-stu">批量粘贴导入</button>' +
      '<button class="btn ghost sm" id="exp-stu">导出名册</button>' +
      '</div></div>' +
      '<p class="sec-desc">Excel 导入成绩时，靠<b>学号</b>自动配对——所以名册越全，导入越省事。' +
      '只有姓名没有学号的学生，导入时会被标出来让你手工填。</p>';

    if (!students.length) {
      html += '<div class="empty"><div class="big">👥</div><div class="t">还没有学生</div>' +
        '<div>加几个学生，或者等 Excel 导入时自动建立名册。</div></div>';
    } else {
      /* 按班级分组 */
      var groups = {};
      students.forEach(function (s) {
        var k = s.classId || '__none__';
        (groups[k] = groups[k] || []).push(s);
      });
      Object.keys(groups).forEach(function (k) { groups[k].sort(byNo); });

      var keys = Object.keys(groups).sort(function (a, b) {
        if (a === '__none__') return 1;
        if (b === '__none__') return -1;
        return String(clsMap[a] || a).localeCompare(String(clsMap[b] || b), 'zh');
      });

      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th style="width:130px">学号</th><th style="width:120px">姓名</th>' +
        '<th style="width:120px">班级</th><th style="width:76px">测评次数</th>' +
        '<th style="width:88px">最近得分率</th><th style="width:110px">最近测评</th>' +
        '<th></th></tr></thead><tbody>';

      keys.forEach(function (k) {
        var list = groups[k];
        html += '<tr class="grp"><td colspan="7" style="background:var(--gray-soft);font-weight:650;font-size:12.5px;color:var(--ink2)">' +
          U.esc(k === '__none__' ? '未分班' : (clsMap[k] || k)) + '　' + list.length + ' 人</td></tr>';
        list.forEach(function (s) {
          var key = studentKey(s);
          var stt = stat[key] || { n: 0, last: 0, lastAt: 0 };
          html += '<tr data-sid="' + U.esc(s.id) + '">' +
            '<td class="qid">' + U.esc(s.studentNo || '—') + '</td>' +
            '<td style="font-weight:600">' + U.esc(s.name || '—') + '</td>' +
            '<td style="font-size:12.5px;color:var(--ink2)">' +
            U.esc(k === '__none__' ? '—' : (clsMap[k] || k)) + '</td>' +
            '<td class="num">' + (stt.n || '') + '</td>' +
            '<td class="num" style="color:' + (stt.n ? rateColor(stt.last) : 'var(--ink3)') + ';font-weight:650">' +
            (stt.n ? Math.round(stt.last * 100) + '%' : '—') + '</td>' +
            '<td style="font-size:12px;color:var(--ink3)">' + (stt.lastAt ? U.fmtDate(stt.lastAt) : '—') + '</td>' +
            '<td style="text-align:right;white-space:nowrap">' +
            '<button class="btn ghost sm ed-stu" data-sid="' + U.esc(s.id) + '">改</button> ' +
            '<button class="btn ghost sm rm-stu" data-sid="' + U.esc(s.id) + '">删</button>' +
            '</td></tr>';
        });
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    U.setHTML(body, html);

    U.$('#add-stu', body).addEventListener('click', function () { editStudent(null, o); });
    U.$('#imp-stu', body).addEventListener('click', function () { pasteImport(o); });
    U.$('#exp-stu', body).addEventListener('click', function () { exportRoster(o); });
    U.$$('.ed-stu', body).forEach(function (b) {
      b.addEventListener('click', function () {
        var s = students.filter(function (x) { return x.id === b.getAttribute('data-sid'); })[0];
        editStudent(s, o);
      });
    });
    U.$$('.rm-stu', body).forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = b.getAttribute('data-sid');
        var s = students.filter(function (x) { return x.id === sid; })[0];
        U.confirm('删除学生「' + (s.name || s.studentNo) + '」？<br>' +
          '<span style="font-size:12.5px;color:var(--ink3)">已有的测评记录不会删除，但会和名册脱钩。</span>',
          function () {
            Store.remove('students', sid).then(function () { U.ok('已删除'); App.render(); });
          }, { danger: true, html: true, yes: '删除' });
      });
    });
  }

  function byNo(a, b) {
    return String(a.studentNo || '').localeCompare(String(b.studentNo || ''), 'zh');
  }

  function studentKey(r) {
    if (r.studentNo) return 'no:' + U.normNo(r.studentNo);
    if (r.name) return 'nm:' + U.normName(r.name);
    return 'id:' + (r.id || '');
  }

  function rateColor(r) { return r >= 0.8 ? '#059669' : r >= 0.5 ? '#d97706' : '#dc2626'; }

  /* ---------------- 学生编辑弹窗 ---------------- */
  function editStudent(s, o) {

    var classOpts = '<option value="">（不分班）</option>' + o.classes.map(function (c) {

      '<div class="field"><label>班级</label><select id="f-cls">' + classOpts + '</select></div>' +
      '<div class="field"><label>备注 <span class="sub">可选</span></label>' +

    var m = U.modal({
      title: isNew ? '添加学生' : '编辑学生',
      body: box,
      buttons: [
        { text: '取消', kind: 'ghost', onClick: function (close) { close(); } },
        {

            var rec = {

              studentNo: no, name: name,

  /* ---------------- 批量粘贴导入名册 ---------------- */
  function pasteImport(o) {
    var box = U.el('div');
    U.setHTML(box,
      '<div class="field"><label>把 Excel 里的「学号」「姓名」两列直接复制粘贴进来</label>' +
      '<textarea id="f-paste" rows="10" placeholder="2026001\t张三&#10;2026002\t李四&#10;或者只粘姓名，一行一个"></textarea></div>' +
      '<div class="field"><label>归入班级</label><select id="f-cls"><option value="">（不分班）</option>' +
      o.classes.map(function (c) { return '<option value="' + U.esc(c.id) + '">' + U.esc(c.name) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="hint">支持从 Excel 直接粘贴（制表符分隔），也支持逗号分隔。' +
      '已有的学生会按学号更新姓名，不会重复添加。</div>');

    U.modal({
      title: '批量导入名册',
      desc: '最快的建名册方式：从 Excel 里框选两列，复制，粘贴到这里。',
      body: box,
      buttons: [
        { text: '取消', kind: 'ghost', onClick: function (close) { close(); } },
        {
          text: '导入', onClick: function (close) {
            var txt = U.$('#f-paste', box).value || '';
            var classId = U.$('#f-cls', box).value;
            var lines = txt.split(/\r?\n/).filter(function (l) { return l.trim(); });
            if (!lines.length) { U.err('没有内容'); return; }

            var students = o.students.slice();
            var byNo = {}, byName = {};
            students.forEach(function (s) {
              if (s.studentNo) byNo[U.normNo(s.studentNo)] = s;
              if (s.name) byName[U.normName(s.name)] = s;
            });

            var added = 0, updated = 0, ops = [];
            lines.forEach(function (line) {
              var parts = line.split(/\t|,|，|;|；|\s{2,}/).map(function (x) { return x.trim(); })
                .filter(function (x) { return x !== ''; });
              if (!parts.length) return;

              var no = '', name = '';
              /* 判断哪一列是学号：像学号的是纯数字或字母数字混合且长度≥4，且不是纯汉字 */
              var looksNo = function (x) { return /^[0-9A-Za-z\-_]{4,}$/.test(x) && !/[\u4e00-\u9fa5]/.test(x); };
              if (parts.length === 1) {
                if (looksNo(parts[0])) no = parts[0]; else name = parts[0];
              } else {
                if (looksNo(parts[0])) { no = parts[0]; name = parts[1]; }
                else if (looksNo(parts[1])) { name = parts[0]; no = parts[1]; }
                else { name = parts[0]; no = parts[1] || ''; }
              }
              if (!no && !name) return;

              var exist = (no && byNo[U.normNo(no)]) || (name && byName[U.normName(name)]);
              if (exist) {
                /* 只补空缺，不覆盖已有信息 —— 老师手工填过的更可靠 */
                if (no && !exist.studentNo) exist.studentNo = U.normNo(no);
                if (name && !exist.name) exist.name = U.normName(name);
                if (classId && !exist.classId) exist.classId = classId;
                exist.updatedAt = Date.now();
                ops.push(exist); updated++;
                if (exist.studentNo) byNo[U.normNo(exist.studentNo)] = exist;
                if (exist.name) byName[U.normName(exist.name)] = exist;
              } else {
                var rec = {
                  id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + added,
                  studentNo: U.normNo(no), name: U.normName(name), classId: classId,
                  createdAt: Date.now(), updatedAt: Date.now()
                };
                ops.push(rec); added++;
                if (rec.studentNo) byNo[rec.studentNo] = rec;
                if (rec.name) byName[rec.name] = rec;
              }
            });

            Store.putAll('students', ops).then(function () {
              close();
              U.ok('新增 ' + added + ' 人，更新 ' + updated + ' 人');
              App.render();
            }).catch(function (e) { U.err('导入失败：' + e.message); });
          }
        }
      ]
    });
  }

  function exportRoster(o) {
    var rows = [['学号', '姓名', '班级', '备注']];
    o.students.forEach(function (s) {
      var c = o.classes.filter(function (x) { return x.id === s.classId; })[0];
      rows.push([s.studentNo || '', s.name || '', c ? c.name : '', s.note || '']);
    });
    if (rows.length === 1) { U.err('还没有学生'); return; }
    try {
      XLSX.download(U.stamp('学生名册', 'xlsx'), [{ name: '学生名册', rows: rows, cols: [{ w: 16 }, { w: 11 }, { w: 13 }, { w: 18 }] }],
        { author: '黎伟成' });
      U.ok('已导出');
    } catch (e) { U.err('导出失败：' + e.message); }
  }

  /* ---------------- 历史记录 ---------------- */
  function tabRecords(body, o) {

        '</tr></thead><tbody>';

      records.slice(0, 400).forEach(function (r) {

        var pname = r.paperName || (p ? p.name : '') ||
          (r.questionIds ? r.questionIds.length + ' 题的卷子' : '未命名');
        var src = { omr: '拍照', manual: '手工', excel: 'Excel' }[r.source] || (r.source || '—');
        var rate = r.rate != null ? r.rate : (r.maxScore ? r.score / r.maxScore : 0);
        html += '<tr data-rid="' + U.esc(r.id) + '">' +
          '<td class="qid">' + U.esc(r.studentNo || '—') + '</td>' +

          '<td style="font-size:12.5px;color:var(--ink2)">' +

          '<td style="font-size:12.5px">' + U.esc(pname) + '</td>' +
          '<td class="num" style="color:' + rateColor(rate) + ';font-weight:650">' +
          Math.round(rate * 100) + '%</td>' +
          '<td><span class="tag ' + (src === '拍照' ? 'info' : 'gray') + '">' + U.esc(src) + '</span></td>' +
          '<td style="font-size:12px;color:var(--ink3)">' +
          (r.submittedAt ? U.fmtDate(r.submittedAt) : '—') + '</td>' +
          '<td><button class="btn ghost sm view-rec" data-rid="' + U.esc(r.id) + '">看报告</button></td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
      if (records.length > 400) {
        html += '<div class="hint mt-s">只显示最近 400 条，共 ' + records.length + ' 条。导出可以看到全部。</div>';
      }
    }
    html += '</div>';
    U.setHTML(body, html);

    U.$('#exp-rec', body).addEventListener('click', function () {
      var rows = [['学号', '姓名', '班级', '试卷', '得分', '满分', '得分率', '来源', '提交时间']];
      records.forEach(function (r) {
        var rate = r.rate != null ? r.rate : (r.maxScore ? r.score / r.maxScore : 0);
        rows.push([r.studentNo || '', r.name || '',
          r.classId ? (clsMap[r.classId] || r.classId) : '',
          r.paperName || '', r.score, r.maxScore,
          +(rate * 100).toFixed(1) + '%',
          { omr: '拍照识别', manual: '手工录入', excel: 'Excel导入' }[r.source] || '',
          r.submittedAt ? U.fmtTime(r.submittedAt) : '']);
      });
      try {
        XLSX.download(U.stamp('测评记录', 'xlsx'),
          [{ name: '测评记录', rows: rows, cols: [{ w: 16 }, { w: 11 }, { w: 13 }, { w: 26 }, { w: 8 }, { w: 8 }, { w: 9 }, { w: 10 }, { w: 18 }] }],

          '班里的学生不会被删除，只会变成「未分班」。</span>', function () {
          Store.removeClass(cid).then(function () { U.ok('已删除'); App.render(); });
        }, { danger: true, html: true, yes: '删除' });
      });
    });
  }

  function editClass(c, o) {
    var isNew = !c;
    var box = U.el('div');
    U.setHTML(box,
      '<div class="field"><label>班级名称</label>' +
      '<input type="text" id="c-name" placeholder="例如 高三(7)班" value="' + U.esc(c ? c.name : '') + '"></div>' +
      '<div class="field"><label>年级 <span class="sub">可选</span></label>' +
      '<input type="text" id="c-grade" placeholder="例如 高三" value="' + U.esc(c ? (c.grade || '') : '') + '"></div>');
    U.modal({
      title: isNew ? '新建班级' : '编辑班级',
      body: box,
      buttons: [
        { text: '取消', kind: 'ghost', onClick: function (close) { close(); } },
        {
          text: '保存', onClick: function (close) {
            var name = U.$('#c-name', box).value.trim();
            if (!name) { U.err('请填班级名称'); return; }
            Store.saveClass({
              id: c ? c.id : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
              name: name, grade: U.$('#c-grade', box).value.trim(),
              createdAt: c ? (c.createdAt || Date.now()) : Date.now()
            }).then(function () { close(); U.ok('已保存'); App.render(); });
          }
        }
      ]
    });
  }

  /* ---------------- 数据备份 ---------------- */
  function tabData(body, o) {
    var html = '<div class="card">' +
      '<h2 class="sec"><span class="bar"></span>数据备份</h2>' +
      '<div class="notice bad"><span class="ico">⚠️</span><div class="bd">' +
      '<div class="nt">数据只存在这台电脑的这个浏览器里</div>' +
      '<div class="nc">没有服务器，所以：换电脑、换浏览器、清理浏览器数据、' +
      '或者用无痕模式打开，数据都会丢失。' +
      '<b>每次录入完一批成绩，请顺手导出一份备份。</b></div></div></div>' +
      '<div class="row mt"><button class="btn" id="btn-backup">导出完整备份</button>' +
      '<button class="btn ghost" id="btn-restore">从备份恢复</button></div>' +
      '<div id="restore-box" class="mt"></div>' +
      '<div class="stats mt">' +
      '<div class="stat"><div class="k">学生</div><div class="v">' + o.students.length + '</div></div>' +
      '<div class="stat"><div class="k">记录</div><div class="v">' + o.records.length + '</div></div>' +
      '<div class="stat"><div class="k">班级</div><div class="v">' + o.classes.length + '</div></div>' +
      '<div class="stat"><div class="k">自建卷</div><div class="v">' + o.papers.length + '</div></div>' +
      '</div>' +
      '<h2 class="sec mt" style="font-size:15px"><span class="bar"></span>危险操作</h2>' +
      '<div class="row"><button class="btn bad sm" id="btn-wipe">清空全部数据</button>' +
      '<span class="hint">会删除所有学生、班级、成绩记录，无法恢复。</span></div>' +
      '</div>';
    U.setHTML(body, html);

    U.$('#btn-backup', body).addEventListener('click', function () {
      var b = this;
      b.disabled = true; b.textContent = '正在打包…';
      Store.all('students').then(function (students) {
        return Store.all('records').then(function (records) {
          return Store.all('papers').then(function (papers) {
            var cfg = Store.exportConfig();
            Store.all('sessions').then(function (sessions) {
              var backup = {
                format: 'chemdx-backup',
                version: 1,
                exportedAt: new Date().toISOString(),
                author: '黎伟成',
                bankVersion: Core.bankVersion(),
                counts: { students: students.length, records: records.length, papers: papers.length, classes: (cfg.classes || []).length },
                data: { students: students, records: records, papers: papers, sessions: sessions, config: cfg }
              };
              try {
                U.download(JSON.stringify(backup, null, 1),
                  U.stamp('化学平台备份', 'json'), 'application/json;charset=utf-8');
                U.ok('备份已下载');
              } catch (e) { U.err('导出失败：' + e.message); }
              b.disabled = false; b.textContent = '导出完整备份';
            });
          });
        });
      }).catch(function (e) {
        U.err('备份失败：' + e.message);
        b.disabled = false; b.textContent = '导出完整备份';
      });
    });

    U.$('#btn-restore', body).addEventListener('click', function () {
      var box = U.$('#restore-box', body);
      var input = U.el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
      var dz = U.dropZone({
        accept: '.json', icon: '📥', title: '把备份文件拖到这里',
        sub: '或点击选择文件。恢复会合并到现有数据，不会覆盖。',
        onFiles: function (files) { doRestore(files[0], box); }
      });
      U.setHTML(box, '');
      box.appendChild(dz);
      box.appendChild(input);
    });

    U.$('#btn-wipe', body).addEventListener('click', function () {
      U.confirm('确定清空全部数据？<br><span style="font-size:12.5px;color:var(--ink3)">' +
        '学生会全部删除，成绩记录也全部删除，无法恢复。建议先导出一份备份。</span>', function () {
        Store.clear('students').then(function () {
          return Store.clear('records');
        }).then(function () {
          return Store.clear('papers');
        }).then(function () {
          Store.set('classes', []);
          return Store.clear('sessions');
        }).then(function () {
          U.ok('已清空');
          App.render();
        }).catch(function (e) { U.err('清空失败：' + e.message); });
      }, { danger: true, html: true, yes: '我确定，清空' });
    });
  }

  function doRestore(file, box) {
    if (!file) return;
    U.readAsText(file).then(function (txt) {
      var bk;
      try { bk = JSON.parse(txt); } catch (e) { throw new Error('文件不是有效的备份（JSON 解析失败）'); }
      if (!bk || bk.format !== 'chemdx-backup' || !bk.data) {
        throw new Error('这个文件不是本平台导出的备份');
      }
      var d = bk.data;
      var nS = (d.students || []).length, nR = (d.records || []).length;

      /* 先按 id 去重再写入：重复恢复同一份备份不应该产生重复数据 */
      return Promise.all([
        Store.all('students'), Store.all('records'), Store.all('papers')
      ]).then(function (cur) {
        var haveS = {}, haveR = {}, haveP = {};
        cur[0].forEach(function (x) { haveS[x.id] = 1; });
        cur[1].forEach(function (x) { haveR[x.id] = 1; });
        cur[2].forEach(function (x) { haveP[x.id] = 1; });

        var addS = (d.students || []).filter(function (x) { return !haveS[x.id]; });
        var addR = (d.records || []).filter(function (x) { return !haveR[x.id]; });
        var addP = (d.papers || []).filter(function (x) { return !haveP[x.id]; });

        return Store.putAll('students', addS)
          .then(function () { return Store.putAll('records', addR); })
          .then(function () { return Store.putAll('papers', addP); })
          .then(function () {
            if (d.config) Store.importConfig(d.config, { merge: true });
            return { addS: addS.length, addR: addR.length, addP: addP.length, skipped: (nS - addS.length) + (nR - addR.length) };
          });
      });
    }).then(function (r) {
      U.setHTML(box, '<div class="lic-state ok">✓ 恢复完成：' +
        '新增学生 ' + r.addS + ' 人，新增记录 ' + r.addR + ' 条，新增自建卷 ' + r.addP + ' 份' +
        (r.skipped ? '，跳过重复 ' + r.skipped + ' 条' : '') + '</div>');
      U.ok('恢复完成');
      setTimeout(function () { App.render(); }, 1400);
    }).catch(function (e) {
      U.setHTML(box, '<div class="lic-state bad">恢复失败：' + U.esc(e.message) + '</div>');
      U.err('恢复失败');
    });
  }
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-self -->
<script>
/*!
 * 化学学情诊断平台 · 学生自测模式（校园版 · 把电脑直接给学生）
 * 作者：黎伟成
 *
 * 这个页面解决的是「只有一台电脑，但要让一个学生安安静静做一套卷子」的场景。
 *
 * 和平台模式（老师端）的区别，只有一句话：
 *   平台模式：老师操作，从出卡到出报告，中间有很多管理功能；
 *   自测模式：把电脑交给学生，学生只看到题目，做完交卷，立刻看到自己的报告。
 * 所以自测模式【必须】把老师的东西全部藏起来 —— 导航、学生名单、
 * 班级分析、管理后台、以及其它学生的记录。学生能在屏幕上看别人的分数，
 * 是这类工具最不能犯的错。
 *
 * 三道锁：
 *   1. 进入前要老师点头（避免学生自己点进来）；
 *   2. 进入后顶栏换成学生视角，导航只留「交卷」；
 *   3. 交卷后立刻退出到「已交卷」页，不给学生翻回去改答案的机会。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store;
  var Analyze = root.Analyze, Report = root.Report;

  /* 一次自测的完整状态。放在 App.state 里，因为它要跨「设置 → 答题 → 报告」三屏。 */
  var st = null;
  var timer = null;

  function blank() {
    return {
      phase: 'setup',        /* setup | quiz | done */
      name: '', studentNo: '', classId: '',
      preset: 'quick',
      questionIds: null, paperName: '',
      answers: {}, unsure: {},
      i: 0,
      startedAt: 0, seconds: 0,
      d: null                 /* 交卷后的报告数据 */
    };
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  /* ============================ 设置屏 ============================ */
  function setupHtml() {
    return '<div class="card">' +
      '<h2 class="sec"><span class="bar"></span>学生自测 · 把电脑交给学生</h2>' +
      '<p class="sec-desc">填上姓名、选一套卷子，然后点「开始答题」——' +
      '接下来屏幕就交给学生了。他会看到题目、作答、交卷后立刻看到自己的报告；' +
      '期间<b>看不到别的同学的任何成绩</b>。</p>' +
      '<div class="grid2" style="margin-top:14px">' +
      '<div class="field" style="margin:0"><label>学生姓名</label>' +
      '<input type="text" id="st-name" placeholder="例如：张三" autocomplete="off"></div>' +
      '<div class="field" style="margin:0"><label>学号（可留空）</label>' +
      '<input type="text" id="st-no" placeholder="例如：2026001" autocomplete="off"></div>' +
      '</div>' +
      '<div class="field" style="margin-top:14px"><label>班级（可留空）</label>' +
      '<input type="text" id="st-cls" placeholder="例如：高三(1)班" autocomplete="off"></div>' +
      '</div>' +
      '<div class="card">' +
      '<h2 class="sec"><span class="bar"></span>选一套卷子</h2>' +
      '<p class="sec-desc">不确定选哪个就先「快速摸底」——32 题，大约 25 分钟。</p>' +
      '<div class="mode-grid" id="st-presets" style="margin-top:12px"></div>' +
      '</div>' +
      '<div class="card">' +
      '<div class="steps-hint">' +
      '<div><b>开始之前请确认：</b></div>' +
      '<div>· 学生已经坐好，不需要再查资料；</div>' +
      '<div>· 你（老师）不在旁边提示；</div>' +
      '<div>· 屏幕上没有别的学生成绩（自测模式会自动隐藏）。</div>' +
      '<div style="margin-top:8px">答题过程中可以随时「上一题 / 下一题」，' +
      '不确定的题让学生自己勾「不确定」，报告会更准。</div>' +
      '</div>' +
      '<button class="btn lg block" id="st-start" style="margin-top:16px">开始答题 · 把屏幕交给学生</button>' +
      phoneRowHtml() +
      '</div>';
  }

  /* 老师手机号是本机退出去的唯一凭据，得让老师看得见、改得了 ——
     不然换了号码就自己被锁在外面了。 */
  function phoneRowHtml() {
    var T = root.Teacher;
    if (!T) return '';
    var has = T.has();
    var mask = T.hint();
    return '<div class="self-phone-row">' +
      '<span>退出凭据：' +
      (has && mask
        ? '老师手机号 <b>' + U.esc(mask) + '</b>'
        : '<b class="warn-t">还没登记</b>（第一次退出时会让你填）') +
      '</span>' +
      '<button class="btn ghost sm" id="st-phone">' +
      (has ? '改号码' : '现在就登记') + '</button>' +
      '</div>';
  }

  /* ============================ 答题屏 ============================ */
  function quizHtml() {
    var qs = questions();
    return '<div class="quizbar"><div class="quizbar-in">' +
      '<span class="qcount" id="st-count">1 / ' + qs.length + '</span>' +
      '<div class="pbar"><i id="st-bar" style="width:0%"></i></div>' +
      '<span class="timer">用时 <b id="st-timer">00:00</b></span>' +
      '<button class="btn ghost sm" id="st-quit">退出自测</button>' +
      '</div></div>' +
      '<div class="qcard" id="st-card">' +
      '<div class="wm-corner">黎伟成</div>' +
      '<div id="st-body"></div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px">' +
      '<div class="navrow">' +
      '<button class="btn ghost sm" id="st-prev">← 上一题</button>' +
      '<button class="btn sm" id="st-next">下一题 →</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn primary sm" id="st-submit">交卷看报告</button>' +
      '</div>' +
      '<details class="navbox" style="margin-top:10px"><summary>展开题目导航</summary>' +
      '<div class="navgrid" id="st-navgrid"></div></details>' +
      '</div>';
  }

  /* ============================ 交卷屏 ============================ */
  function doneHtml() {
    var d = st.d;
    var L = Report.levelInfo(d.rate);
    return '<div class="card">' +
      '<div class="done-hero">' +
      '<div class="dh-t">✓ 交卷完成</div>' +
      '<div class="dh-s">' + U.esc(st.name || st.studentNo || '这位同学') +
      '，' + d.score.toFixed(0) + ' / ' + d.maxScore + ' 分（得分率 ' +
      Math.round(d.rate * 100) + '%）</div>' +
      '<div class="dh-l">' + U.esc(L.txt) + '</div>' +
      '</div>' +
      '<div class="lic-state warn" style="margin-top:14px">' +
      '成绩已经存在这台电脑上，老师那边能看到。<b>现在请把电脑还给老师</b>，' +
      '下面这份报告你可以先看，也可以用手机扫老师的报告卡再看一遍。' +
      '</div>' +
      '<div class="row" style="margin-top:16px">' +
      '<button class="btn" id="st-report">看我的详细报告</button>' +
      '<button class="btn primary" id="st-again">回到设置（换下一个学生）</button>' +
      '<button class="btn ghost" id="st-back">退出自测模式</button>' +
      '</div>' +
      '</div>';
  }

  function questions() {
    if (!st.questionIds) return [];
    var m = Core.qmap();
    return st.questionIds.map(function (id) { return m[id]; }).filter(Boolean);
  }

  /* ============================ 渲染：设置屏 ============================ */
  function renderSetup(mount) {
    U.setHTML(mount, setupHtml());

    /* 卷子选择卡片 */
    var grid = U.$('#st-presets', mount);
    Core.presetList().forEach(function (p) {
      var ids = p.pick();
      if (!ids.length && p.id !== 'custom') return;
      var card = U.el('div', { class: 'mode-card' + (st.preset === p.id ? ' on' : '') });
      U.setHTML(card,
        '<div class="mc-h"><span class="mc-ico">' + U.esc(p.icon || '📄') + '</span>' +
        '<span class="mc-nm">' + U.esc(p.name) + '</span>' +
        '<span class="mc-cnt">' + ids.length + ' 题</span></div>' +
        '<div class="mc-d">' + U.esc(p.desc || '') + '</div>' +
        (p.minutes ? '<div class="mc-meta">约 ' + p.minutes + ' 分钟</div>' : ''));
      card.addEventListener('click', function () {
        st.preset = p.id;
        U.$$('.mode-card', grid).forEach(function (c) { c.classList.remove('on'); });
        card.classList.add('on');
      });
      grid.appendChild(card);
    });

    U.$('#st-start', mount).addEventListener('click', function () {
      var name = U.normName(U.$('#st-name', mount).value);
      var no = U.normNo(U.$('#st-no', mount).value);
      if (!name && !no) { U.err('请填学生姓名（或者学号）'); return; }
      var p = Core.presetList().filter(function (x) { return x.id === st.preset; })[0];
      var ids = p ? p.pick() : [];
      if (!ids.length) { U.err('这套卷子没有题目，换一套试试'); return; }

      st.name = name;
      st.studentNo = no;
      st.classId = U.$('#st-cls', mount).value.trim();
      st.questionIds = ids;
      st.paperName = p.name;
      st.answers = {};
      st.unsure = {};
      st.i = 0;
      st.phase = 'quiz';
      st.startedAt = Date.now();
      st.seconds = 0;
      startTimer();
      render(mount);
      U.ok('开始答题。屏幕已经交给学生了。');
    });

    setTimeout(function () { try { U.$('#st-name', mount).focus(); } catch (e) {} }, 100);

    /* 登记／修改老师手机号 */
    var pbtn = U.$('#st-phone', mount);
    if (pbtn) pbtn.addEventListener('click', function () { askPhone(mount); });
  }

  /** 让老师登记或修改手机号。改完刷新那一行提示。 */
  function askPhone(mount) {
    var T = root.Teacher;
    if (!T) return;
    var cur = T.hint();
    var box = U.el('div');
    U.setHTML(box,
      '<div class="lic-state info">' +
      '学生做完题要退出时，输这个<b>手机号</b>才能回到老师这边。' +
      '学生不知道你的号码，就退不出去。<br>' +
      '号码只存在这台电脑上，不会上传到任何地方。' +
      '</div>' +
      '<div class="field" style="margin-top:12px"><label>老师的手机号' +
      (cur ? ' <span class="sub">当前 ' + U.esc(cur) + '</span>' : '') + '</label>' +
      '<input type="tel" id="tb-phone" inputmode="numeric" maxlength="13" ' +
      'autocomplete="tel" placeholder="例如 13800138000"></div>' +
      '<div class="lic-state bad" id="tb-pw-err" style="display:none"></div>');

    U.modal({
      title: cur ? '修改手机号' : '登记老师的手机号',
      body: box,
      buttons: [
        { text: '取消', kind: 'ghost', onClick: function (close) { close(); } },
        {
          text: '保存', onClick: function (close) {
            var err = U.$('#tb-pw-err', box);
            T.set(U.$('#tb-phone', box).value).then(function () {
              close();
              render(mount);
              U.ok('手机号已登记，退出自测时用它');
            }).catch(function (e) {
              if (err) { err.style.display = ''; err.textContent = e.message || '号码不对'; }
            });
            return false;   /* 异步，别让弹窗提前关掉 */
          }
        }
      ]
    });
    setTimeout(function () { try { U.$('#tb-phone', box).focus(); } catch (e) {} }, 120);
  }

  function startTimer() {
    stopTimer();
    timer = setInterval(function () {
      if (st.phase !== 'quiz') { stopTimer(); return; }
      st.seconds = Math.floor((Date.now() - st.startedAt) / 1000);
      var el = U.$('#st-timer');
      if (el) {
        var m = Math.floor(st.seconds / 60), s = st.seconds % 60;
        el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }
    }, 1000);
  }

  /* ============================ 渲染：答题屏 ============================ */
  function renderQuiz(mount) {
    U.setHTML(mount, quizHtml());
    renderQ(mount);
    renderNav(mount);

    U.$('#st-prev', mount).addEventListener('click', function () {
      if (st.i > 0) { st.i--; renderQ(mount); renderNav(mount); }
    });
    U.$('#st-next', mount).addEventListener('click', function () {
      var qs = questions();
      if (st.i < qs.length - 1) { st.i++; renderQ(mount); renderNav(mount); }
    });
    U.$('#st-submit', mount).addEventListener('click', function () { confirmSubmit(mount); });
    U.$('#st-quit', mount).addEventListener('click', function () {
      U.confirm(
        '退出后屏幕会切回老师视角，已经填的答案会丢掉，这套卷子也不会记成绩。<br>' +
        '<b>请确认学生已经离开电脑。</b>',
        function () {
          stopTimer();
          st = blank();
          App.setSelfMode(false);   /* 先关模式，再跳转，否则会被拦回自测页 */
          App.nav('#/');
        },
        { title: '退出自测？', yesLabel: '退出自测', html: true, danger: true }
      );
    });

    /* 键盘加速：交给学生做 32 题，能按键盘会快很多。
       注册前先解绑一次 —— 这个视图可能被重新渲染（比如刷新后回到 #/self），
       叠两个监听器的结果是按一下方向键跳两题。 */
    root.removeEventListener('keydown', onKey);
    App.onLeave.selfKeys = function () {
      root.removeEventListener('keydown', onKey);
    };
    root.addEventListener('keydown', onKey);
  }

  function onKey(e) {
    if (st.phase !== 'quiz') return;
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    var qs = questions();
    var mount = U.$('#view');
    if (!mount) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (st.i > 0) { st.i--; renderQ(mount); renderNav(mount); }
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'Enter') {
      if (st.i < qs.length - 1) { st.i++; renderQ(mount); renderNav(mount); }
    } else if (/^[1-9]$/.test(e.key)) {
      var oi = +e.key - 1;
      var q = qs[st.i];
      if (q && (q.type === 'single' || q.type === 'multi') &&
          oi < (q.options || []).length) {
        pick(st, q, oi);
        renderQ(mount); renderNav(mount);
      }
    }
  }

  function pick(state, q, oi) {
    if (q.type === 'single') {
      state.answers[q.id] = oi;
      state.i = Math.min(questions().length - 1, state.i + 1);
    } else {
      var cur = Array.isArray(state.answers[q.id]) ? state.answers[q.id].slice() : [];
      var at = cur.indexOf(oi);
      if (at >= 0) cur.splice(at, 1); else cur.push(oi);
      cur.sort(function (x, y) { return x - y; });
      if (!cur.length) delete state.answers[q.id]; else state.answers[q.id] = cur;
    }
  }

  function renderQ(mount) {
    var qs = questions();
    var box = U.$('#st-body', mount);
    if (!box) return;
    var q = qs[st.i];
    if (!q) { U.setHTML(box, ''); return; }

    var a = st.answers[q.id];
    var kp = Core.kpmap()[q.kp] || { name: '—' };
    var n = Object.keys(st.answers).length;

    var cnt = U.$('#st-count', mount);
    if (cnt) cnt.textContent = (st.i + 1) + ' / ' + qs.length;
    var bar = U.$('#st-bar', mount);
    if (bar) bar.style.width = Math.round((st.i + 1) / qs.length * 100) + '%';

    var html = '<div class="qmeta">' +
      '<span class="chip">第 ' + (st.i + 1) + ' 题 / ' + qs.length + '</span>' +
      '<span class="chip">' + U.esc(kp.name) + '</span>' +
      '<span class="chip gray">' + U.esc(Core.typeName(q.type)) + '</span>' +
      '<span class="hint" style="margin-left:auto">已填 ' + n + ' / ' + qs.length + '</span>' +
      '</div>' +
      '<div class="qstem">' + U.esc(q.stem) + '</div>';

    if (q.type === 'single' || q.type === 'multi') {
      (q.options || []).forEach(function (op, oi) {
        var on = q.type === 'single' ? (a === oi) : (Array.isArray(a) && a.indexOf(oi) >= 0);
        html += '<div class="pick' + (on ? ' on' : '') + '" data-oi="' + oi + '">' +
          '<span class="kk">' + String.fromCharCode(65 + oi) + '</span>' +
          '<span class="ot">' + U.esc(op) + '</span></div>';
      });
      if (q.type === 'multi') {
        html += '<div class="hint" style="margin-top:8px">这题是多选，选好后点「下一题」。</div>';
      }
    } else if (q.type === 'judge') {
      html += '<div class="pick' + (a === true ? ' on' : '') + '" data-tf="1">' +
        '<span class="kk">T</span><span class="ot">对</span></div>' +
        '<div class="pick' + (a === false ? ' on' : '') + '" data-tf="0">' +
        '<span class="kk">F</span><span class="ot">错</span></div>';
    } else if (q.type === 'fill') {
      html += '<div class="pick' + (a === true ? ' on' : '') + '" data-tf="1">' +
        '<span class="kk">T</span><span class="ot">我会做，写对了</span></div>' +
        '<div class="pick' + (a === false ? ' on' : '') + '" data-tf="0">' +
        '<span class="kk">F</span><span class="ot">我不会，或者写错了</span></div>';
    }

    html += '<label class="unsure" style="margin-top:14px;display:flex">' +
      '<input type="checkbox" id="st-unsure"' + (st.unsure[q.id] ? ' checked' : '') + '>' +
      '<span>这题我不确定 / 是猜的（诚实一点，报告会更准）</span></label>' +
      '<div class="row mt-s">' +
      '<button class="btn ghost sm" id="st-clear">清空本题</button>' +
      '</div>';

    U.setHTML(box, html);

    U.$$('.pick', box).forEach(function (el) {
      el.addEventListener('click', function () {
        if (el.hasAttribute('data-tf')) {
          st.answers[q.id] = el.getAttribute('data-tf') === '1';
          if (st.i < qs.length - 1) st.i++;
          renderQ(mount); renderNav(mount);
        } else {
          var before = st.i;
          pick(st, q, +el.getAttribute('data-oi'));
          if (before !== st.i) { renderQ(mount); renderNav(mount); }
          else { renderQ(mount); renderNav(mount); }
        }
      });
    });

    var un = U.$('#st-unsure', box);
    if (un) un.addEventListener('change', function () {
      if (un.checked) st.unsure[q.id] = 1; else delete st.unsure[q.id];
    });

    var cl = U.$('#st-clear', box);
    if (cl) cl.addEventListener('click', function () {
      delete st.answers[q.id];
      delete st.unsure[q.id];
      renderQ(mount); renderNav(mount);
    });
  }

  function renderNav(mount) {
    var box = U.$('#st-navgrid', mount);
    if (!box) return;
    var qs = questions();
    U.setHTML(box, qs.map(function (q, i) {
      var cls = 'navcell';
      if (st.answers[q.id] !== undefined) cls += ' done';
      if (i === st.i) cls += ' cur';
      return '<button class="' + cls + '" data-goto="' + i + '">' + (i + 1) + '</button>';
    }).join(''));
    U.$$('[data-goto]', box).forEach(function (b) {
      b.addEventListener('click', function () {
        st.i = +b.getAttribute('data-goto');
        renderQ(mount); renderNav(mount);
      });
    });
  }

  /* ============================ 交卷 ============================ */
  function confirmSubmit(mount) {
    var qs = questions();
    var n = Object.keys(st.answers).length;
    var left = qs.length - n;
    U.confirm(
      '已填 <b>' + n + '</b> / ' + qs.length + ' 题。' +
      (left ? '空着的题会算作「没作答」。' : '全部完成，交卷吧。') +
      '<br>交卷后就不能再改了。',
      function () { submit(); },
      {
        title: left ? '还有 ' + left + ' 题没填，确定交卷？' : '全部填完了，交卷？',
        yesLabel: '交卷',
        html: true
      }
    );
  }

  function submit() {
    stopTimer();
    var qs = questions();
    var maxScore = Core.paperStats(qs.map(function (q) { return q.id; })).points;
    var score = 0;
    qs.forEach(function (q) {
      if (Analyze.isCorrect(q, st.answers[q.id])) {
        score += (st.unsure[q.id] ? 0.5 : 1) * Core.scoreOf(q);
      }
    });

    var secs = Math.max(1, Math.round((Date.now() - st.startedAt) / 1000));
    var d = Report.compute({
      questions: qs, answers: st.answers, unsure: st.unsure,
      meta: {
        name: st.name, studentNo: st.studentNo, classId: st.classId,
        paperName: st.paperName, seconds: secs, submittedAt: Date.now()
      }
    });
    st.d = d;
    st.phase = 'done';

    var rec = {
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      studentNo: st.studentNo, name: st.name, classId: st.classId,
      note: '学生自测模式下完成',
      paperId: '', paperName: st.paperName,
      questionIds: qs.map(function (q) { return q.id; }),
      answers: JSON.parse(JSON.stringify(st.answers)),
      unsure: JSON.parse(JSON.stringify(st.unsure)),
      score: +score.toFixed(1), maxScore: maxScore,
      rate: maxScore ? score / maxScore : 0,
      seconds: secs,
      source: 'selftest', submittedAt: Date.now()
    };

    Store.put('records', rec);
    Store.all('students').then(function (list) {
      var ex = list.filter(function (x) {
        return (st.studentNo && U.normNo(x.studentNo) === U.normNo(st.studentNo)) ||
          (!st.studentNo && st.name && U.normName(x.name) === U.normName(st.name));
      })[0];
      if (ex) return null;
      return Store.put('students', {
        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        studentNo: st.studentNo, name: st.name, classId: st.classId,
        createdAt: Date.now(), updatedAt: Date.now()
      });
    });

    var mount = U.$('#view');
    if (mount) renderDone(mount);
    U.ok('交卷完成，成绩已保存');
  }

  /* ============================ 渲染：交卷屏 ============================ */
  function renderDone(mount) {
    U.setHTML(mount, doneHtml());
    U.$('#st-report', mount).addEventListener('click', function () {
      var box = U.el('div', { class: 'card', id: 'st-rp' });
      mount.appendChild(box);
      Report.renderTo(box, st.d, { role: 'student' });
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    U.$('#st-again', mount).addEventListener('click', function () {
      var had = st.name;
      st = blank();
      render(mount);
      if (had) U.toast('上一个学生（' + had + '）的成绩已经保存好了', 'ok', 3000);
    });
    U.$('#st-back', mount).addEventListener('click', function () {
      st = blank();
      App.setSelfMode(false);   /* 先关模式再跳，否则会被拦回自测页 */
      App.nav('#/');
    });
  }

  /* ============================ 渲染入口 ============================ */
  function render(mount) {
    if (!st) st = blank();
    if (st.phase === 'quiz') renderQuiz(mount);
    else if (st.phase === 'done') renderDone(mount);
    else renderSetup(mount);
  }

  App.view('self', {
    render: function (mount) {
      /* 自测模式是校园版功能 */
      render(mount);
    }
  });

  /* 离开这个页面要停掉计时器、解绑键盘，不然会漏 */
  App.onLeave.selfMode = function () {
    stopTimer();
    root.removeEventListener('keydown', onKey);
  };

  root.SelfTest = {
    reset: function () { stopTimer(); st = blank(); },
    state: function () { return st; }
  };
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-admin -->
<script>
/*!
 * 化学学情诊断平台 · 管理员后台
 * 作者：黎伟成
 *
 * 这里是「平台运营方」的入口，不是给老师用的。四件事：
 *   1 发通告（所有打开平台的人都会看到）
 *   2 发激活码（要卖钱的那个东西）
 *   3 更新题库、上传自建题库
 *   4 查看授权状态
 *
 * 安全模型必须说清楚（界面上也写明了）：
 *   激活码用 ECDSA P-256 私钥签名，公钥内置在网页里。
 *   没有私钥就造不出能通过校验的码 —— 这是密码学保证，不是靠藏代码。
 *   但是：这个平台没有服务器，所有校验都在浏览器里跑。
 *   一个会改 JS 的人可以把校验删掉，然后白用。
 *   所以定位是「防君子 + 防小白转卖」，不是「防黑客」。
 *   要真正防住，必须加服务端。这一点不能让运营方误解。
 *
 * 私钥绝不能进这个页面 —— 这个页面会被部署到公网。
 * 发码要用离线的「管理员工具/发码.html」，那里才读私钥。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store;
  var Lic = root.Lic, Admin = root.Admin;

  var st = { tab: 'notice' };

  function planNameOf(p) {
    return { 1: '试用版', 2: '标准版', 3: '专业版', 4: '校园版' }[p] || ('计划' + p);
  }

  App.view('admin', {
    render: function (mount) {
      U.setHTML(mount, '');
      if (!Admin.hasPassword()) { setupPassword(mount); return; }
      if (!Admin.isLoggedIn()) { login(mount); return; }
      dashboard(mount);
    }
  });

  /* ---------------- 首次设置密码 ---------------- */
  function setupPassword(mount) {
    var card = U.el('div', { class: 'card', style: 'max-width:470px;margin:40px auto' });
    U.setHTML(card,
      '<h2 class="sec"><span class="bar"></span>设置管理员密码</h2>' +
      '<p class="sec-desc">这是你第一次进管理后台，先设一个密码。' +
      '密码用 PBKDF2 加盐哈希后存在本机，不上传，也<b>没法找回</b>——' +
      '请记牢，忘了只能清空浏览器数据重设。</p>' +
      '<div class="field"><label>密码 <span class="sub">至少 6 位</span></label>' +
      '<input type="password" id="p1" autocomplete="new-password"></div>' +
      '<div class="field mt-s"><label>再输一次</label>' +
      '<input type="password" id="p2" autocomplete="new-password"></div>' +
      '<div class="row mt"><button class="btn" id="go">设置</button>' +
      '<a class="btn ghost" href="#/">返回首页</a></div>' +
      '<div class="lic-state warn mt">⚠️ 这个密码保护的是「发激活码」和「发通告」的权限。' +
      '它管不了题库和成绩数据——那些本来就在浏览器里，谁打开这台电脑都能看到。</div>');
    mount.appendChild(card);

    U.$('#go', card).addEventListener('click', function () {
      var a = U.$('#p1', card).value, b = U.$('#p2', card).value;
      if (a.length < 6) { U.err('密码至少 6 位'); return; }
      if (a !== b) { U.err('两次输入不一样'); return; }
      U.$('#go', card).disabled = true;
      Admin.setPassword(a)
        .then(function () { return Admin.login(a); })
        .then(function () { U.ok('密码已设置'); App.render(); })
        .catch(function (e) { U.$('#go', card).disabled = false; U.err(e.message); });
    });
    U.$('#p2', card).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') U.$('#go', card).click();
    });
  }

  /* ---------------- 登录 ---------------- */
  function login(mount) {
    var card = U.el('div', { class: 'card', style: 'max-width:420px;margin:40px auto' });
    U.setHTML(card,
      '<h2 class="sec"><span class="bar"></span>管理员登录</h2>' +
      '<div class="field"><label>密码</label>' +
      '<input type="password" id="pw" autocomplete="current-password"></div>' +
      '<div class="row mt"><button class="btn" id="go">登录</button>' +
      '<a class="btn ghost" href="#/">返回首页</a></div>' +
      '<div class="hint">登录状态保持 8 小时。连续错 5 次会强制等一会儿再试，' +
      '挡住拿脚本硬猜的人。</div>' +
      '<div class="lic-state bad mt" id="msg" style="display:none"></div>');
    mount.appendChild(card);

    var tries = 0, locked = false;
    function attempt() {
      if (locked) return;
      var pw = U.$('#pw', card).value;
      if (!pw) { U.err('请输入密码'); return; }
      var btn = U.$('#go', card);
      btn.disabled = true;
      Admin.login(pw).then(function (ok) {
        btn.disabled = false;
        if (ok) { U.ok('登录成功'); App.render(); return; }
        tries++;
        var msg = U.$('#msg', card);
        msg.style.display = 'block';
        msg.textContent = '密码不对（第 ' + tries + ' 次）';
        if (tries >= 5) {
          locked = true;
          var wait = Math.min(60, 5 * (tries - 4));
          msg.textContent = '密码连续错 ' + tries + ' 次，请等 ' + wait + ' 秒';
          var t = setInterval(function () {
            wait--;
            btn.disabled = true;
            if (wait <= 0) {
              clearInterval(t);
              locked = false;
              btn.disabled = false;
              msg.textContent = '可以再试了';
            } else msg.textContent = '请等 ' + wait + ' 秒再试';
          }, 1000);
        }
      }).catch(function (e) { btn.disabled = false; U.err(e.message); });
    }
    U.$('#go', card).addEventListener('click', attempt);
    U.$('#pw', card).addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(); });
    setTimeout(function () { var i = U.$('#pw', card); if (i) i.focus(); }, 60);
  }

  /* ---------------- 后台主界面 ---------------- */
  function dashboard(mount) {
    var bar = U.el('div', { class: 'card' });
    U.setHTML(bar,
      '<div class="spread"><div><h2 class="sec" style="margin-bottom:0"><span class="bar"></span>管理员后台</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">发通告、发激活码、更新题库。</p></div>' +
      '<div class="row">' +
      tabBtn('notice', '公告') + tabBtn('code', '激活码') + tabBtn('bank', '题库') +
      tabBtn('about', '授权与安全') +
      '<button class="btn ghost sm" id="logout">退出</button></div></div>');
    mount.appendChild(bar);

    U.$$('[id^=tab-]', bar).forEach(function (b) {
      b.addEventListener('click', function () { st.tab = b.id.slice(4); App.render(); });
    });
    U.$('#logout', bar).addEventListener('click', function () {
      Admin.logout();
      U.ok('已退出');
      App.render();
    });

    var body = U.el('div');
    mount.appendChild(body);
    if (st.tab === 'code') tabCode(body);
    else if (st.tab === 'bank') tabBank(body);
    else if (st.tab === 'about') tabAbout(body);
    else tabNotice(body);
  }

  function tabBtn(id, label) {
    return '<button class="btn ' + (st.tab === id ? '' : 'ghost') + ' sm" id="tab-' + id + '">' +
      label + '</button>';
  }

  /* ==================== 公告 ==================== */
  function tabNotice(body) {
    var list = Store.notices();
    var card = U.el('div', { class: 'card' });
    var html = '<div class="spread"><div>' +
      '<h2 class="sec" style="margin-bottom:0"><span class="bar"></span>通告</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">发出的通告会显示在所有打开这个平台的人的页面顶部。</p>' +
      '</div><button class="btn sm" id="add-n">+ 新建通告</button></div>';

    if (!list.length) {
      html += '<div class="empty"><div class="big">📢</div><div class="t">还没有通告</div>' +
        '<div>可以用它通知「题库已更新到 200 题」或「本周日系统维护」。</div></div>';
    } else {
      list.forEach(function (n) {
        var expired = n.until && Date.now() > n.until;
        html += '<div class="rev" style="margin-top:12px' + (n.hidden ? ';opacity:.5' : '') + '">' +
          '<div class="rh"><span class="tag ' +
          (n.level === 'bad' ? 'bad' : n.level === 'warn' ? 'warn' : 'info') + '">' +
          U.esc({ info: '通知', warn: '提醒', bad: '重要' }[n.level] || '通知') + '</span>' +
          '<b style="font-size:14px">' + U.esc(n.title || '（无标题）') + '</b>' +
          (n.hidden ? '<span class="tag gray">已隐藏</span>' : '') +
          (expired ? '<span class="tag gray">已过期</span>' : '') +
          (n.until && !expired ? '<span class="tag">到期 ' + U.fmtDate(n.until) + '</span>' : '') +
          '<span class="hint" style="margin-left:auto">' + U.fmtTime(n.createdAt) + '</span></div>' +
          '<div style="font-size:13.5px;line-height:1.75;white-space:pre-wrap;margin-top:6px">' +
          U.esc(n.body || '') + '</div>' +
          '<div class="row mt-s"><button class="btn ghost sm ed-n" data-id="' + n.id + '">编辑</button>' +
          '<button class="btn ghost sm tg-n" data-id="' + n.id + '">' +
          (n.hidden ? '显示' : '隐藏') + '</button>' +
          '<button class="btn ghost sm rm-n" data-id="' + n.id + '">删除</button></div></div>';
      });
    }
    U.setHTML(card, html);
    body.appendChild(card);

    U.$('#add-n', card).addEventListener('click', function () { editNotice(null); });
    U.$$('.ed-n', card).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-id');
        editNotice(list.filter(function (x) { return x.id === id; })[0]);
      });
    });
    U.$$('.tg-n', card).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-id');
        var n = list.filter(function (x) { return x.id === id; })[0];
        Store.updateNotice(id, { hidden: !n.hidden });
        App.render();
      });
    });
    U.$$('.rm-n', card).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-id');
        U.confirm('删除这条通告？', function () {
          Store.removeNotice(id);
          U.ok('已删除');
          App.render();
        }, { danger: true, html: true, yes: '删除' });
      });
    });
  }

  function editNotice(n) {
    var box = U.el('div');
    U.setHTML(box,
      '<div class="field"><label>标题</label>' +
      '<input type="text" id="n-t" placeholder="例如：题库已更新到 200 题" value="' +
      U.esc(n ? n.title : '') + '"></div>' +
      '<div class="field mt-s"><label>内容</label>' +
      '<textarea id="n-b" rows="5" style="width:100%;font-family:inherit;font-size:14px;' +
      'padding:8px 10px;border:1px solid var(--line);border-radius:8px;resize:vertical">' +
      U.esc(n ? n.body : '') + '</textarea></div>' +
      '<div class="grid2 mt-s">' +
