<script>
/*!
 * 化学学情诊断平台 · 报告渲染
 * 作者：黎伟成
 *
 * 一份报告同时服务两种读者：
 *   role='teacher'  老师 / 家长：全量信息，含逐题解析、错因诊断
 *   role='student'  学生手机扫码：同样完整，但语气更友好，突出「接下来做什么」
 * 两者用的是同一套分析引擎（Analyze.analyze），所以数据口径完全一致。
 */
(function (root) {
  'use strict';

  var R = {};
  var U = root.U;
  var Core = root.Core;
  var Analyze = root.Analyze;

  var _graph = null;
  function graph() {
    if (_graph) return _graph;
    _graph = Analyze.makeGraph(Core.kp(), Core.stages());
    return _graph;
  }

  function esc(s) { return U.esc(s); }
  function keyOf(i) { return String.fromCharCode(65 + i); }

  /* ---------------- 等级 ---------------- */
  R.levelInfo = function (rate) {
    if (rate >= 0.85) return { txt: '基础扎实', col: 'var(--ok)', tone: 'ok' };
    if (rate >= 0.7) return { txt: '基本达标', col: 'var(--ok)', tone: 'ok' };
    if (rate >= 0.5) return { txt: '基础不牢', col: 'var(--warn)', tone: 'warn' };
    if (rate >= 0.3) return { txt: '基础很薄弱', col: 'var(--bad)', tone: 'bad' };
    return { txt: '地基严重缺失', col: 'var(--bad)', tone: 'bad' };
  };

  /* ---------------- 计算 ---------------- */
  /**
   * @param {Object} data {questions, answers, unsure, meta}
   * @returns {Object} {questions, answers, unsure, meta, analysis, rate, stats}
   */
  R.compute = function (data) {
    var questions = data.questions || [];
    var answers = data.answers || {};
    var unsure = data.unsure || {};
    var A = Analyze.analyze({
      questions: questions, answers: answers, unsure: unsure,
      graph: graph(), STAGES: Core.stages(), DIMS: Core.dims()
    });
    var totalPts = 0, maxPts = 0;
    questions.forEach(function (q) {
      maxPts += Core.scoreOf(q);
      var a = answers[q.id];
      if (Analyze.isCorrect(q, a)) totalPts += (unsure[q.id] ? 0.5 : 1) * Core.scoreOf(q);
    });
    return {
      questions: questions, answers: answers, unsure: unsure,
      meta: data.meta || {},
      analysis: A,
      rate: maxPts ? totalPts / maxPts : 0,
      score: totalPts, maxScore: maxPts,
      stats: Core.paperStats(questions.map(function (q) { return q.id; }))
    };
  };

  /* ---------------- 结论 ---------------- */
  function verdict(d, role) {
    var A = d.analysis, rate = d.rate;
    var STAGES = Core.stages(), DIMS = Core.dims();
    var weakestStage = null, wv = 2, strongestStage = null, sv = -1;
    STAGES.forEach(function (s) {
      var g = A.stage[s.id];
      if (g && g.n >= 3) {
        var v = g.pts / g.n;
        if (v < wv) { wv = v; weakestStage = s; }
        if (v > sv) { sv = v; strongestStage = s; }
      }
    });
    var weakestDim = null, dv = 2, strongestDim = null, sdv = -1;
    DIMS.forEach(function (x) {
      var g = A.dim[x.id];
      if (g && g.n >= 3) {
        var v = g.pts / g.n;
        if (v < dv) { dv = v; weakestDim = x; }
        if (v > sdv) { sdv = v; strongestDim = x; }
      }
    });

    var t = '';
    var n = 0;
    function step(title, body) {
      n++;
      t += '<div class="step"><div class="num">' + ['①', '②', '③', '④', '⑤', '⑥', '⑦'][n - 1] + '</div><div class="body">' +
        '<div class="t">' + title + '</div><div class="d">' + body + '</div></div></div>';
    }

    if (role === 'student') {
      if (rate < 0.5) {
        step('先说结论：现在最该做的不是刷题',
          '你的得分率是 <b>' + Math.round(rate * 100) + '%</b>，属于<b>' + R.levelInfo(rate).txt + '</b>。' +
          '这个分数段说明问题不在"某几个知识点没记住"，而是<b>底层概念还没有连成网</b>。' +
          '这个阶段硬刷高三的卷子，只会一直受挫——先把地基打好，分数会涨得比你想的快。');
      } else {
        step('先说结论：地基还在，是连接不牢',
          '得分率 <b>' + Math.round(rate * 100) + '%</b>，属于<b>' + R.levelInfo(rate).txt + '</b>。' +
          '框架是有的，丢分主要来自知识点之间的连接松动，以及一部分概念的细节理解有偏差。这种问题补起来见效最快。');
      }
    } else {
      step('总体判断',
        '得分率 <b>' + Math.round(rate * 100) + '%</b>，属于<b>' + R.levelInfo(rate).txt + '</b>。' +
        (rate < 0.5
          ? '这个分数段说明问题不在"某几个知识点没背"，而是<b>底层概念框架还没有建立起来</b>。继续刷高三的题只会不断累积挫败感，必须先回到基础重建。'
          : '基础框架基本还在，问题主要是知识点之间的连接不牢、以及部分概念理解有偏差。'));
    }

    if (weakestStage || weakestDim) {
      step(role === 'student' ? '最需要补的地方' : '最薄弱的板块',
        (weakestStage ? ('阶段上最弱的是<b>' + esc(weakestStage.name) + '</b>（正确率 ' + Math.round(wv * 100) + '%）。') : '') +
        (weakestDim ? ('能力维度上最弱的是<b>' + esc(weakestDim.name) + '</b>（正确率 ' + Math.round(dv * 100) + '%）。') : ''));
    }

    if (A.nLucky > 0) {
      step('有 ' + A.nLucky + ' 道题是「不确定但蒙对了」',
        (role === 'student'
          ? '你自己标记了「不确定」。<b>这 ' + A.nLucky + ' 道题要当成错题来对待</b>——考试时题目稍变就会翻车。'
          : '学生自己标记了"不确定"。<b>这 ' + A.nLucky + ' 道题在补课时要当成错题处理</b>，' +
            '因为这说明相关知识点是"模糊的、靠语感的"，考试时只要题目稍变就会翻车。'));
    }
    if (A.nBlank > 0) {
      step('有 ' + A.nBlank + ' 道题完全没作答',
        '空白通常意味着"连蒙都不会"，比选错更能说明这个知识点是完全陌生的。');
    }
    if (strongestDim && sdv >= 0.4) {
      step(role === 'student' ? '你的相对优势' : '相对优势',
        '<b>' + esc(strongestDim.name) + '</b>相对最好（' + Math.round(sdv * 100) + '%），' +
        (role === 'student' ? '这是你的抓手，可以从这里重建信心。' : '可以把它作为重建信心的切入点。'));
    }
    return t;
  }

  /* ---------------- 逐题回顾 ---------------- */
  function renderRev(q, kind, ans, role) {
    var kp = Core.kpmap()[q.kp] || { name: '—' };
    var st = Core.stage(kp.stage);
    var h = '<div class="rev ' + (kind === 'lucky' ? 'lucky' : 'wrong') + '">' +
      '<div class="rh"><span class="mark">' + (kind === 'lucky' ? '蒙对' : '答错') + '</span>' +
      '<span class="chip">' + esc(st.name) + '</span>' +
      '<span class="chip">' + esc(kp.name) + '</span>' +
      '<span class="chip d' + (q.diff || 1) + '" style="margin-left:auto">' + esc(Core.typeName(q.type)) + '</span>' +
      '</div>' +
      '<div class="q">' + esc(q.stem) + '</div>';

    if (q.type === 'single' || q.type === 'multi') {
      (q.options || []).forEach(function (o, i) {
        var isA = (q.type === 'single') ? (q.answer === i) : ((q.answer || []).indexOf(i) >= 0);
        var picked = (q.type === 'single') ? (ans === i) : (Array.isArray(ans) && ans.indexOf(i) >= 0);
        var cls = isA ? ' right' : (picked ? ' wrongpicked' : '');
        var mark = isA ? ' ✓' : (picked ? ' ✗' : '');
        h += '<div class="optline' + cls + '">' + keyOf(i) + '. ' + esc(o) + mark + '</div>';
      });
      if (!Analyze.isAnswered(q, ans)) {
        h += '<div class="optline" style="background:#f8fafc;color:#94a3b8">（未作答）</div>';
      }
    } else if (q.type === 'judge') {
      h += '<div class="optline' + (ans === true ? ' wrongpicked' : '') + '">你的答案：' +
        (Analyze.isAnswered(q, ans) ? (ans === true ? '对' : '错') : '（未作答）') + '</div>' +
        '<div class="optline right">正确答案：' + (q.answer ? '对' : '错') + ' ✓</div>';
    } else {
      h += '<div class="optline' + (Analyze.isCorrect(q, ans) ? ' right' : ' wrongpicked') + '">你的答案：' +
        esc(Core.answerText(q, ans)) + '</div>' +
        '<div class="optline right">参考答案：' + esc((q.answer || []).join(' 或 ')) + ' ✓</div>';
    }
    h += '<div class="exp"><b>' + (role === 'student' ? '错因诊断：' : '解析：') + '</b>' +
      esc(q.explain || '（无）') + '</div></div>';
    return h;
  }

  /* ---------------- 主渲染 ---------------- */
  /**
   * @param {Object} d  R.compute() 的结果
   * @param {Object} o  {role:'teacher'|'student', showQuestions:bool, compact:bool}
   * @returns {String} HTML
   */
  R.html = function (d, o) {
    o = o || {};
    var role = o.role || 'teacher';
    var A = d.analysis, meta = d.meta;
    var L = R.levelInfo(d.rate);
    var qs = d.questions;
    var secs = Math.round(meta.seconds || 0);
    var mm = Math.floor(secs / 60), ss = secs % 60;
    var h = '';

    /* ---- 概览 ---- */
    h += '<div class="rp-hero">' +
      '<div class="rp-hero-top">' +
      '<div>' +
      '<h2>' + (role === 'student' ? '我的化学诊断报告' : '化学学情诊断报告') + '</h2>' +
      '<div class="who">' +
      (meta.name ? esc(meta.name) : '未署名') +
      (meta.studentNo ? ' · 学号 ' + esc(meta.studentNo) : '') +
      (meta.paperName ? ' · ' + esc(meta.paperName) : '') +
      '</div>' +
      '<div class="when">' + esc(U.fmtTime(meta.submittedAt || Date.now())) +
      (secs ? ' · 用时 ' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss : '') +
      '</div>' +
      '</div>' +
      '<div class="rp-score"><div class="val">' + d.score.toFixed(0) +
      '<small>/' + d.maxScore + ' 分</small></div>' +
      '<div class="pct">得分率 ' + Math.round(d.rate * 100) + '%</div>' +
      '<div class="lvl ' + L.tone + '">' + L.txt + '</div></div>' +
      '</div>' +
      '<div class="rp-stats">' +
      '<div class="hs"><div class="v">' + A.totalN + '</div><div class="k">总题数</div></div>' +
      '<div class="hs"><div class="v">' + A.nRight + '</div><div class="k">真会</div></div>' +
      '<div class="hs"><div class="v">' + A.nLucky + '</div><div class="k">蒙对</div></div>' +
      '<div class="hs"><div class="v">' + A.nWrong + '</div><div class="k">答错</div></div>' +
      '<div class="hs"><div class="v">' + A.failedCount + '</div><div class="k">漏洞知识点</div></div>' +
      '</div></div>';

    /* ---- 结论 ---- */
    h += '<div class="card"><h2 class="sec"><span class="bar"></span>' +
      (role === 'student' ? '给你的结论' : '诊断结论') + '</h2>' +
      '<p class="sec-desc">' +
      (role === 'student' ? '顺着看完，你会知道下一步该干什么' : '这一栏是给补习老师 / 家长看的') +
      '</p>' + verdict(d, role) + '</div>';

    /* ---- 技能地图：十个能力维度 + 教材阶段 ---- */
    h += '<div class="card pagebreak" id="rp-map">' +
      '<h2 class="sec"><span class="bar"></span>技能地图</h2>' +
      '<p class="sec-desc">把你的化学能力拆成十个维度，看哪一块是短板。' +
      '补的时候<b>优先补最低的那块</b>——它往往不只影响这几个知识点。</p>' +
      '<div class="rp-map-wrap">' +
      '<div class="cv-box"><canvas id="rp-radar"></canvas></div>' +
      '<div class="rp-map-side">' +
      '<div class="rp-map-list">' +
      Core.dims().map(function (d) {
        var x = A.dim && A.dim[d.id];
        var tested = !!(x && x.n);
        var r = tested ? (x.pts / x.n) : 0;
        var col = r >= 0.8 ? '#059669' : r >= 0.5 ? '#d97706' : '#dc2626';
        return '<div class="rp-map-item">' +
          '<span class="rp-map-n">' + esc(d.name) + '</span>' +
          '<span class="rp-map-m"><i style="width:' + Math.round(r * 100) +
          '%;background:' + (tested ? col : '#cbd5e1') + '"></i></span>' +
          '<span class="rp-map-p" style="color:' + (tested ? col : 'var(--ink3)') + '">' +
          (tested ? Math.round(r * 100) + '%' : '未考') + '</span>' +
          '</div>';
      }).join('') +
      '</div></div></div>' +
      '<div class="rp-legend">' +
      '<span><i style="background:#059669"></i>≥80% 掌握</span>' +
      '<span><i style="background:#d97706"></i>50–80% 不稳固</span>' +
      '<span><i style="background:#dc2626"></i>&lt;50% 未掌握</span>' +
      '<span><i style="background:#cbd5e1"></i>本次未考到</span>' +
      '</div></div>';

    h += '<div class="card"><h2 class="sec"><span class="bar"></span>各阶段掌握度</h2>' +
      '<p class="sec-desc">按人教版教材顺序排列</p>' +
      '<div class="cv-box"><canvas id="rp-bars"></canvas></div></div>';

    /* ---- 根源诊断 ---- */
    h += '<div class="card"><h2 class="sec"><span class="bar"></span>根源诊断 · 最该先补的地方</h2>' +
      '<p class="sec-desc">这些知识点本身没掌握，同时还是其他错题的<b>前置基础</b>——补它们收益最大</p>';
    if (!A.roots.length) {
      h += '<div class="empty"><div class="big">🌱</div><div class="t">没有发现明显的连锁性漏洞</div>' +
        '<div>基础之间没有互相拖累，按正常顺序推进即可。</div></div>';
    } else {
      A.roots.slice(0, 6).forEach(function (rt) {
        var kp = Core.kpmap()[rt.id] || { name: rt.id };
        var st = Core.stage(kp.stage);
        var rr = A.kp[rt.id] ? A.kp[rt.id].rate : 0;
        h += '<div class="rootcard"><div class="rh">' +
          '<span class="rn">' + esc(kp.name) + '</span>' +
          '<span class="chip">' + esc(st.name) + '</span>' +
          '<span class="chip d3">正确率 ' + Math.round(rr * 100) + '%</span>' +
          '<span class="chip gray">卡住下游 ' + rt.n + ' 个知识点</span>' +
          '</div>' +
          '<div class="rd">这个知识点没打通，直接导致后面这些内容也听不懂：' +
          rt.down.slice(0, 7).map(function (x) {
            return '<b>' + esc((Core.kpmap()[x] || { name: x }).name) + '</b>';
          }).join('、') +
          (rt.down.length > 7 ? (' 等 ' + rt.down.length + ' 个') : '') +
          '。建议从这里开始补。</div></div>';
      });
    }
    h += '</div>';

    /* ---- 漏洞清单 ---- */
    var bad = [];
    Object.keys(A.kp).forEach(function (k) {
      var K = A.kp[k];
      if (K.untested) return;
      if (K.rate < 0.8) bad.push({ id: k, K: K, kp: Core.kpmap()[k] });
    });
    bad.sort(function (a, b) {
      if (a.K.rate !== b.K.rate) return a.K.rate - b.K.rate;
      var sa = Core.stage((a.kp || {}).stage).i, sb = Core.stage((b.kp || {}).stage).i;
      return (sa === undefined ? 99 : sa) - (sb === undefined ? 99 : sb);
    });

    h += '<div class="card"><h2 class="sec"><span class="bar"></span>知识漏洞清单</h2>' +
      '<p class="sec-desc">正确率低于 80% 的知识点，按严重程度排序</p>';
    if (!bad.length) {
      h += '<div class="empty"><div class="big">🎉</div><div class="t">本次测评涉及的知识点全部达标</div></div>';
    } else {
      bad.forEach(function (x) {
        var pct = Math.round(x.K.rate * 100);
        var col = x.K.rate >= 0.5 ? 'var(--warn)' : 'var(--bad)';
        h += '<div class="kprow">' +
          '<span class="name">' + esc(x.kp ? x.kp.name : x.id) +
          '<small>' + esc(Core.stage((x.kp || {}).stage).name) + ' · ' +
          esc(Core.dim((x.kp || {}).dim).name) + '</small></span>' +
          '<span class="meter"><i style="width:' + pct + '%;background:' + col + '"></i></span>' +
          '<span class="pct" style="color:' + col + '">' + pct + '%</span></div>';
      });
    }
    h += '</div>';

    /* ---- 补习路线图 ---- */
    h += '<div class="card pagebreak"><h2 class="sec"><span class="bar"></span>' +
      (role === 'student' ? '你的复习路线图' : '补习路线图') + '</h2>' +
      '<p class="sec-desc">已按知识点依赖关系排好序，从最底层往上补。<b>按这个顺序走，不要跳</b>。</p>';
    var batches = [], curStage = null;
    A.roadmap.forEach(function (item) {
      if (item.stage !== curStage) { curStage = item.stage; batches.push({ stage: curStage, items: [] }); }
      batches[batches.length - 1].items.push(item);
    });
    if (!batches.length) {
      h += '<div class="empty"><div class="big">✅</div><div class="t">没有需要补的知识点</div></div>';
    } else {
      var stepNo = 0;
      batches.forEach(function (b) {
        h += '<div class="stage-h">▍' + esc(Core.stage(b.stage).name) + '</div>';
        b.items.forEach(function (it) {
          stepNo++;
          var rootInfo = A.roots.filter(function (x) { return x.id === it.id; })[0];
          var why = it.untested ? '本次未考到，但它是错题的前置基础'
            : (it.isRoot ? '<b style="color:#b91c1c">根源性漏洞</b>，卡住 ' + (rootInfo ? rootInfo.n : 0) + ' 个下游知识点'
              : '正确率 ' + Math.round(it.rate * 100) + '%');
          h += '<div class="step"><div class="num">' + stepNo + '</div><div class="body">' +
            '<div class="t">' + esc(it.name) + '</div>' +
            '<div class="d">' + why + '</div>' +
            '<div class="tags">' +
            (it.isRoot ? '<span class="tag" style="border-color:#f5b5b1;color:#b91c1c">根源</span>' : '') +
            '<span class="tag">' + esc(Core.dim(it.dim).name) + '</span>' +
            '</div></div></div>';
        });
      });
    }
    h += '</div>';

    /* ---- 逐题回顾 ---- */
    if (o.showQuestions !== false) {
      var wrongList = qs.filter(function (q) { return !Analyze.isCorrect(q, d.answers[q.id]); });
      var luckyList = qs.filter(function (q) { return Analyze.isCorrect(q, d.answers[q.id]) && d.unsure[q.id]; });
      h += '<div class="card pagebreak"><h2 class="sec"><span class="bar"></span>逐题回顾</h2>' +
        '<p class="sec-desc">共 ' + wrongList.length + ' 道错题' +
        (luckyList.length ? ('、' + luckyList.length + ' 道蒙对题') : '') +
        '。蒙对题单独列出，因为它们暴露的是同一种问题。</p>';
      luckyList.forEach(function (q) { h += renderRev(q, 'lucky', d.answers[q.id], role); });
      wrongList.forEach(function (q) { h += renderRev(q, 'wrong', d.answers[q.id], role); });
      if (!wrongList.length && !luckyList.length) {
        h += '<div class="empty"><div class="big">💯</div><div class="t">全部答对</div></div>';
      }
      h += '</div>';
    }

    /* ---- 落款 ---- */
    h += '<div class="signoff">' +
      '<div class="so-line"></div>' +
      '<div class="so-main">化学学情诊断报告 · 由「化学学情诊断平台」自动生成</div>' +
      '<div class="so-sub">测评学生：' + esc(meta.name || '未署名') +
      (meta.studentNo ? '（学号 ' + esc(meta.studentNo) + '）' : '') +
      '　|　测评时间：' + esc(U.fmtTime(meta.submittedAt || Date.now())) +
      '　|　试卷：' + esc(meta.paperName || '') +
      '　|　共 ' + A.totalN + ' 题　得分率 ' + Math.round(d.rate * 100) + '%</div>' +
      '<div class="so-brand">黎伟成制作</div>' +
      '<div class="so-note">本平台与题库由黎伟成独立开发 · 仅供教学使用</div>' +
      '</div>';

    return h;
  };

  /** 渲染进容器并绘图 */
  R.renderTo = function (container, d, o) {
    U.setHTML(container, R.html(d, o));
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        setTimeout(function () {
          var A = d.analysis;
          var cvr = container.querySelector('#rp-radar');
          if (cvr && root.Charts) {
            root.Charts.drawRadar(cvr,
              Core.dims().map(function (x) { return x.name; }),
              Core.dims().map(function (x) { var g = A.dim[x.id]; return g && g.n ? g.pts / g.n : 0; }));
          }
          var cvb = container.querySelector('#rp-bars');
          if (cvb && root.Charts) {
            var sl = [], sv = [];
            Core.stages().forEach(function (s) {
              var g = A.stage[s.id];
              if (g && g.n) { sl.push(s.name); sv.push(g.pts / g.n); }
            });
            root.Charts.drawBars(cvb, sl, sv);
          }
          resolve();
        }, 20);
      });
    });
  };

  /** 一行摘要，用于列表 */
  R.summaryLine = function (d) {
    var L = R.levelInfo(d.rate);
    return '<span class="tag ' + (L.tone === 'ok' ? 'ok' : L.tone === 'warn' ? 'warn' : 'bad') + '">' +
      L.txt + '</span>';
  };

  root.Report = R;
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/app -->
<script>
/*!
 * 化学学情诊断平台 · 应用外壳与路由
 * 作者：黎伟成
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, Store = root.Store, Lic = root.Lic, Admin = root.Admin;

  var App = {};
  App.views = {};
  App.state = {};

  /** 注册一个视图 */
  App.view = function (name, def) { App.views[name] = def; };

  var ROUTES = [
    { hash: '#/', name: 'home', title: '首页' },
    { hash: '#/sheet', name: 'sheet', title: '答题卡' },
    { hash: '#/omr', name: 'omr', title: '拍照识别' },
    { hash: '#/manual', name: 'manual', title: '录入成绩' },
    { hash: '#/class', name: 'class', title: '班级分析' },
    { hash: '#/qr', name: 'qr', title: '报告二维码' },
    { hash: '#/students', name: 'students', title: '学生与记录' },
    { hash: '#/self', name: 'self', title: '学生自测' },
    { hash: '#/admin', name: 'admin', title: '管理' }
  ];

  App.routes = ROUTES;

  /* 学生自测模式：进入后顶栏只留最少的字，导航全部藏起来。
     学生在电脑前能看到别的同学分数，是这类工具最不能犯的错。
     所以这不是「样式好看不好看」的问题，是必须藏干净。 */
  var SELF_MODE = false;
  App.isSelfMode = function () { return SELF_MODE; };
  App.setSelfMode = function (on) {
    SELF_MODE = !!on;
    try {
      if (document.body) {
        if (SELF_MODE) document.body.classList.add('mode-self');
        else document.body.classList.remove('mode-self');
      }
    } catch (e) {}
    /* 会话级记录：刷新页面后仍然回学生视角，关掉浏览器自动失效 */
    try {
      if (root.sessionStorage) {
        if (SELF_MODE) root.sessionStorage.setItem('chem_self_mode', '1');
        else root.sessionStorage.removeItem('chem_self_mode');
      }
    } catch (e) {}
  };

  function currentRoute() {
    var h = (root.location.hash || '#/').replace(/\?.*$/, '');
    if (h === '#' || h === '') h = '#/';
    return h;
  }

  App.nav = function (hash) {
    App.leave();
    if (currentRoute() === hash) { App.render(); return; }
    root.location.hash = hash;
  };

  /* 执行当前视图注册的清理函数，然后清空 —— 只能跑一次 */
  App.leave = function () {
    try {
      Object.keys(App.onLeave).forEach(function (k) {
        var fn = App.onLeave[k];
        if (typeof fn === 'function') fn();
        delete App.onLeave[k];
      });
    } catch (e) { /* 清理失败不能影响跳转 */ }
  };

  /* ---------------- 顶栏 ---------------- */
  function renderTopbar(active) {
    var lic = Lic.info();

    /* 学生自测模式：顶栏换成最简单的样子。
       不给导航链接 —— 学生一点就能翻到「学生与记录」「班级分析」，
       那里全是别人的分数。
       但必须留一个出口：老师进得去也要出得来。
       出口做成「老师退出」，有管理员密码时要求输密码，
       这样学生随手点一下也退不出去。 */
    if (SELF_MODE) {
      return '<header class="topbar"><div class="topbar-in">' +
        '<div class="brand">' +
        '<span class="logo-mark">化</span>' +
        '<div><h1>化学学情诊断 · 学生自测</h1>' +
        '<p>把屏幕交给你，做完交卷就能看到自己的报告</p></div></div>' +
        '<span class="built-by">黎伟成 制作</span>' +
        '<button class="tb-teacher-exit" id="tb-self-off" title="老师用，退出学生自测模式">老师退出</button>' +
        '</div></header>';
    }

    var brand = '<div class="brand">' +
      '<span class="logo-mark">化</span>' +
      '<div><h1>化学学情诊断平台</h1>' +
      '<p>高中化学 · 学情测评 · 班级分析' +
      (lic ? ' · <b>' + U.esc(lic.planName) + '</b>' + (lic.perpetual ? '（永久）' : '') : '') +
      '</p></div></div>';

    var links = ROUTES.filter(function (r) {
      if (r.name === 'admin') return true;
      return true;
    }).map(function (r) {
      return '<a href="' + r.hash + '" class="' + (active === r.name ? 'on' : '') + '">' +
        U.esc(r.title) + '</a>';
    }).join('');

    /* 自测模式进得去也要出得来。放在顶栏最右边，和「黎伟成 制作」并排，
       老师一眼能看到；学生不认识这个按钮，也不会随手点。 */
    var selfBtn = SELF_MODE
      ? '<button class="btn ghost sm" id="tb-self-off" style="flex:none">退出学生自测</button>'
      : '<a href="#/self" class="tb-self-on" title="把电脑直接给学生做卷子">学生自测</a>';

    return '<header class="topbar"><div class="topbar-in">' + brand +
      '<nav class="navlinks">' + links + '</nav>' +
      '<span class="built-by">黎伟成 制作</span>' + selfBtn +
      '</div></header>';
  }

  /* ---------------- 公告栏 ---------------- */
  function renderNotices() {
    var list = Store.activeNotices();
    if (!list.length) return '';
    var dismissed = Store.getFlag('dismissedNotices', []);
    var html = '';
    list.forEach(function (n) {
      if (n.dismissable !== false && dismissed.indexOf(n.id) >= 0) return;
      /* 字段名认两种写法：kind/level、content/body。
         管理员后台写的是 level/body，这里早期读的是 kind/content ——
         结果通告发出来只显示标题，正文是空的。
         通告是存在老师本机 localStorage 里的，已经发出去的改不回来，
         所以这里做兼容，而不是去改数据。 */
      var kind = n.kind || n.level || 'warn';
      var body = n.content || n.body || '';
      var icon = kind === 'info' ? 'ℹ️' : kind === 'bad' ? '⚠️' : '📢';
      html += '<div class="notice ' + (kind === 'warn' ? '' : kind) + '" data-nid="' + U.esc(n.id) + '">' +
        '<span class="ico">' + icon + '</span>' +
        '<div class="bd"><div class="nt">' + U.esc(n.title || '公告') + '</div>' +
        (body ? '<div class="nc">' + U.esc(body) + '</div>' : '') +
        (n.link ? '<div style="margin-top:8px"><a href="' + U.esc(n.link) + '" style="color:inherit;font-weight:600">查看详情 →</a></div>' : '') +
        '</div>' +
        (n.dismissable === false ? '' :
          '<button class="btn ghost sm no-print" data-dismiss="' + U.esc(n.id) + '" style="flex:none">知道了</button>') +
        '</div>';
    });
    return html;
  }

  function bindNotices(box) {
    U.$$('[data-dismiss]', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-dismiss');
        var d = Store.getFlag('dismissedNotices', []).slice();
        if (d.indexOf(id) < 0) d.push(id);
        Store.flag('dismissedNotices', d);
        var n = b.closest('.notice');
        if (n) n.parentNode.removeChild(n);
      });
    });
  }

  /* ---------------- 激活门 ---------------- */
  /* ==================== 进门三关 ====================
   * 以前的顺序是「先激活，再进平台」—— 只有一关。
   * 现在拆成两关，顺序对调：
   *   1. 老师登录（手机号 + 密码）—— 回答「现在坐在这儿的是谁」
   *   2. 激活码（这台电脑买了哪个版本）—— 回答「这台电脑能用什么」
   * 分开是有道理的：一个学校一台电脑，换老师、换班要分得清谁的数据是谁的；
   * 而激活码是买给机器的，不该跟着人走。
   *
   * 管理员入口单独放在登录页上，不走老师账号 ——
   * 管理员（我）和老师是两种身份，老师账号密码不该能开后台。
   */

  function adminIn() {
    try { return !!(root.Admin && root.Admin.isLoggedIn && root.Admin.isLoggedIn()); }
    catch (e) { return false; }
  }

  function teacherIn() {
    try { return !!(root.Account && root.Account.isLoggedIn && root.Account.isLoggedIn()); }
    catch (e) { return false; }
  }

  /* 两关都过：老师登录过，或者管理员登录过（管理员免老师账号） */
  function someoneIn() { return teacherIn() || adminIn(); }

  /* ---------------- 第一关：登录 ---------------- */
  function renderLogin(mount) {
    U.setHTML(mount, '');
    var hasAcc = root.Account && root.Account.has();
    var box = U.el('div', { class: 'gate-box' });

    if (hasAcc) {
      U.setHTML(box,
        '<h1>老师登录</h1>' +
        '<p class="sub">这台电脑已经注册过账号。输入手机号和密码进入平台。</p>' +
        '<div id="lg-state"></div>' +
        '<div class="field"><label>手机号</label>' +
        '<input type="tel" id="lg-phone" inputmode="numeric" maxlength="13" autocomplete="tel" ' +
        'placeholder="13800138000" value="' + U.esc(root.Account.mask(root.Account.get().phone)) + '"></div>' +
        '<div class="field"><label>密码</label>' +
        '<input type="password" id="lg-pw" autocomplete="current-password"></div>' +
        '<button class="btn lg block" id="lg-btn">登录</button>' +
        '<div style="margin-top:10px;text-align:center">' +
        '<a href="javascript:void 0" id="lg-forgot" style="font-size:12.5px;color:var(--ink3)">忘记密码？</a>' +
        '</div>');
    } else {
      U.setHTML(box,
        '<h1>创建老师账号</h1>' +
        '<p class="sub">第一次在这台电脑上用，先设一个账号。<br>' +
        '账号只存在本机，用于区分「谁在用这台电脑」。</p>' +
        '<div id="lg-state"></div>' +
        '<div class="field"><label>手机号</label>' +
        '<input type="tel" id="lg-phone" inputmode="numeric" maxlength="13" autocomplete="tel" ' +
        'placeholder="13800138000"></div>' +
        '<div class="field"><label>密码 <span class="sub">至少 8 位，别用纯数字</span></label>' +
        '<input type="password" id="lg-pw" autocomplete="new-password" placeholder="例如 hx2026ban"></div>' +
        '<div class="field"><label>再输一遍</label>' +
        '<input type="password" id="lg-pw2" autocomplete="new-password"></div>' +
        '<div class="grid2">' +
        '<div class="field"><label>姓名 <span class="sub">选填</span></label>' +
        '<input type="text" id="lg-name" maxlength="20" placeholder="王老师"></div>' +
        '<div class="field"><label>学校 <span class="sub">选填</span></label>' +
        '<input type="text" id="lg-school" maxlength="30" placeholder="某某中学"></div>' +
        '</div>' +
        '<button class="btn lg block" id="lg-btn">注册并继续</button>');
    }

    /* 管理员入口：和老师登录用一条线隔开，视觉上就不是同一个东西 */
    var foot = U.el('div', { class: 'gate-sep' });
    U.setHTML(foot,
      '<div class="gate-sep-line"><span>管理员</span></div>' +
      '<button class="btn ghost block" id="lg-admin">管理员入口</button>' +
      '<div class="hint" style="margin-top:9px;line-height:1.75">' +
      '管理员是平台维护方（黎伟成），和老师账号是两回事：发码、重置题库、发通告。' +
      '<br>学生不需要登录 —— 扫答题卡上的二维码就能看自己的报告。</div>');
    box.appendChild(foot);

    var wrap = U.el('div', { class: 'gate' }, [box]);
    mount.appendChild(wrap);

    var state = U.$('#lg-state', box), btn = U.$('#lg-btn', box);
    function setState(html, cls) {
      state.innerHTML = '';
      if (html) state.appendChild(U.el('div', { class: 'lic-state ' + (cls || ''), html: html }));
    }

    function busy(on, label) {
      btn.disabled = on;
      btn.textContent = on ? (label || '请稍候…') : (hasAcc ? '登录' : '注册并继续');
    }

    function go() {
      var phone = U.$('#lg-phone', box).value;
      var pw = U.$('#lg-pw', box).value;

      if (!hasAcc) {
        var pw2 = U.$('#lg-pw2', box).value;
        if (!phone) { setState('请输入手机号', 'bad'); return; }
        if (!root.Account.valid(root.Account.norm(phone))) {
          setState('手机号要 11 位，1 开头。例如 13800138000', 'bad'); return;
        }
        var bad = root.Account.passProblem(pw);
        if (bad) { setState(U.esc(bad), 'bad'); return; }
        if (pw !== pw2) { setState('两次输入的密码不一样', 'bad'); return; }
        busy(true, '正在创建…');
        root.Account.register({
          phone: phone, password: pw,
          name: U.$('#lg-name', box).value, school: U.$('#lg-school', box).value
        }).then(function (r) {
          if (!r.ok) { busy(false); setState(U.esc(r.error), 'bad'); return; }
          root.Account.login(phone, pw).then(function () {
            U.ok('账号已创建');
            setTimeout(function () { afterLogin(); }, 400);
          });
        }).catch(function (e) { busy(false); setState('注册出错：' + U.esc(e.message || e), 'bad'); });
        return;
      }

      if (!phone) { setState('请输入手机号', 'bad'); return; }
      if (!pw) { setState('请输入密码', 'bad'); return; }

      var w = root.Account.waitSeconds();
      if (w > 0) { setState('密码连续错太多次，请等 ' + w + ' 秒再试', 'bad'); return; }

      busy(true, '校验中…');
      root.Account.login(phone, pw).then(function (ok) {
        if (ok) { setState('✓ 登录成功', 'ok'); setTimeout(afterLogin, 350); return; }
        busy(false);
        var f = root.Account.recordFail();
        if (f.until && f.until > Date.now()) {
          setState('密码不对。连续错 ' + f.n + ' 次，请等 ' +
            Math.ceil((f.until - Date.now()) / 1000) + ' 秒', 'bad');
        } else {
          setState('手机号或密码不对（第 ' + f.n + ' 次，错满 ' + root.Account.MAX_TRIES + ' 次要等一会儿）', 'bad');
        }
      }).catch(function (e) { busy(false); setState('登录出错：' + U.esc(e.message || e), 'bad'); });
    }

    btn.addEventListener('click', go);
    box.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    U.$('#lg-forgot', box) && U.$('#lg-forgot', box).addEventListener('click', function () {
      U.modal({
        title: '忘记密码怎么办',
        desc: '本机账号的密码是单向哈希，找不回来。',
        body: '<div class="hint" style="line-height:1.85">' +
          '密码只存在这台电脑上，也做了单向加密，<b>没有任何办法算出原来的密码</b>，' +
          '包括我在内。<br><br>两条路：<br>' +
          '<b>1.</b> 用下面的「管理员入口」进去，在管理后台里重置老师账号；<br>' +
          '<b>2.</b> 联系黎伟成。<br><br>' +
          '学生的成绩记录和激活码都不受影响，重置账号不会弄丢数据。' +
          '</div>',
        buttons: [{ text: '知道了', kind: 'ghost', onClick: function (close) { close(); } }]
      });
    });
    U.$('#lg-admin', box).addEventListener('click', function () { renderAdminEntry(mount); });

    setTimeout(function () {
      var f = U.$('#lg-phone', box);
      if (f && hasAcc) { try { U.$('#lg-pw', box).focus(); } catch (e) {} }
      else if (f) { try { f.focus(); } catch (e) {} }
    }, 120);
  }

  /* ---------------- 登录页上的管理员入口 ---------------- */
  function renderAdminEntry(mount) {
    /* 必须先把上一屏擦掉。少了这一句，管理员表单会叠在老师登录表单下面，
       老师看到两个输入框会不知道该填哪个。 */
    U.setHTML(mount, '');
    var box = U.el('div', { class: 'gate-box' });
    U.setHTML(box,
      '<h1>管理员入口</h1>' +
      '<p class="sub">平台维护方使用。老师请返回上一页，用手机号登录。</p>' +
      '<div id="ad-state"></div>' +
      '<div class="field"><label>管理员密码</label>' +
      '<input type="password" id="ad-pw" autocomplete="current-password"></div>' +
      '<button class="btn lg block" id="ad-btn">进入后台</button>' +
      '<div style="margin-top:12px;text-align:center">' +
      '<a href="javascript:void 0" id="ad-back" style="font-size:12.5px;color:var(--ink3)">← 返回老师登录</a></div>');

    /* 没设过密码：第一次进来就是设密码。这也是唯一一次「凭密码拿管理员身份」的机会。 */
    var hasPw = !!(root.Admin && root.Admin.hasPassword && root.Admin.hasPassword());
    if (!hasPw) {
      U.setHTML(box,
        '<h1>设置管理员密码</h1>' +
        '<p class="sub">这台电脑还没有管理员密码。设一个，用来管发码、题库和通告。</p>' +
        '<div id="ad-state"></div>' +
        '<div class="field"><label>管理员密码 <span class="sub">至少 6 位</span></label>' +
        '<input type="password" id="ad-pw" autocomplete="new-password"></div>' +
        '<div class="field"><label>再输一遍</label>' +
        '<input type="password" id="ad-pw2" autocomplete="new-password"></div>' +
        '<button class="btn lg block" id="ad-btn">设置并进入后台</button>' +
        '<div style="margin-top:12px;text-align:center">' +
        '<a href="javascript:void 0" id="ad-back" style="font-size:12.5px;color:var(--ink3)">← 返回老师登录</a></div>');
    }

    var wrap = U.el('div', { class: 'gate' }, [box]);
    mount.appendChild(wrap);

    var state = U.$('#ad-state', box), btn = U.$('#ad-btn', box);
    function setState(html, cls) {
      state.innerHTML = '';
      if (html) state.appendChild(U.el('div', { class: 'lic-state ' + (cls || ''), html: html }));
    }
    function busy(on, label) {
      btn.disabled = on;
      btn.textContent = on ? (label || '请稍候…') : (hasPw ? '进入后台' : '设置并进入后台');
    }

    function go() {
      var pw = U.$('#ad-pw', box).value;
      if (!hasPw) {
        var pw2 = U.$('#ad-pw2', box).value;
        if (String(pw).length < 6) { setState('管理员密码至少要 6 位', 'bad'); return; }
        if (pw !== pw2) { setState('两次输入的密码不一样', 'bad'); return; }
        busy(true, '正在加密…');
        root.Admin.setPassword(pw).then(function () {
          return root.Admin.login(pw);
        }).then(function () {
          U.ok('管理员密码已设置');
          setTimeout(afterLogin, 350);
        }).catch(function (e) { busy(false); setState('设置失败：' + U.esc(e.message || e), 'bad'); });
        return;
      }
      if (!pw) { setState('请输入管理员密码', 'bad'); return; }
      busy(true, '校验中…');
      root.Admin.login(pw).then(function (ok) {
        if (ok) { setState('✓ 已进入管理员后台', 'ok'); setTimeout(afterLogin, 350); return; }
        busy(false);
        setState('管理员密码不对', 'bad');
      }).catch(function (e) { busy(false); setState('登录出错：' + U.esc(e.message || e), 'bad'); });
    }

    btn.addEventListener('click', go);
    box.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    U.$('#ad-back', box).addEventListener('click', function () { renderLogin(mount); });
    setTimeout(function () { try { U.$('#ad-pw', box).focus(); } catch (e) {} }, 120);
  }

  /* 登录成功后：有激活码就进平台，没有就走第二关 */
  function afterLogin() {
    var mount = U.$('#app') || App.mount();

    /* 管理员不走激活关 —— 激活码就是管理员自己发的，
       再要求他先有码才能进后台管题库，等于把钥匙锁在屋里：
       换一台新电脑、后台还没激活时，他连题库都传不了。
       规矩定成一句话：管平台不用激活码，用平台的功能要。
       （「用功能」这一层仍由 Lic.can() 逐页把着，这里没放水。） */
    if (adminIn() && !teacherIn() && root.Admin.isLoggedIn()) {
      if (root.location.hash !== '#/admin') root.location.hash = '#/admin';
      App.render();
      return;
    }

    Lic.ensure().then(function (r) {
      if (r && r.ok) {
        /* 管理员直接进后台；老师进首页。
           注意：改 hash 不会自己把界面画出来 —— 这里必须先 App.render()
           铺好外壳，否则管理员登录成功后仍停在登录页，什么都看不到。 */
        var toAdmin = adminIn() && !teacherIn();
        if (toAdmin && root.location.hash !== '#/admin') {
          root.location.hash = '#/admin';
        }
        App.render();
      } else {
        renderGate(mount);
      }
    }).catch(function () { renderGate(mount); });
  }

  /* ---------------- 第二关：激活码 ---------------- */
  function renderGate(mount) {
    U.setHTML(mount, '');
    var box = U.el('div', { class: 'gate-box' });
    var who = adminIn() ? '管理员' : (root.Account && root.Account.get() ? root.Account.get().mask || root.Account.get().phone : '');
    U.setHTML(box,
      '<h1>激活平台</h1>' +
      '<p class="sub">登录完成' + (who ? '（' + U.esc(who) + '）' : '') +
      '。最后一步：把激活码填进去。<br>激活码是买给这台电脑的，由「黎伟成」统一发放。</p>' +
      '<div id="gate-state"></div>' +
      '<div class="field">' +
      '<label>激活码</label>' +
      '<input type="text" class="lic-input" id="gate-code" placeholder="HX1-XXXXXXXXXXXXXXXX" autocomplete="off" spellcheck="false">' +
      '<div class="hint" style="margin-top:7px">直接整段粘贴就行：空格、换行、全角字符、被微信吃掉的下划线，都会自动处理。</div>' +
      '</div>' +
      '<button class="btn lg block" id="gate-btn">激活并进入平台</button>' +
      '<div class="gate-sep">' +
      '<div class="gate-sep-line"><span>其它</span></div>' +
      '<a href="javascript:void 0" id="gate-logout" style="font-size:12.5px;color:var(--ink3)">退出登录，换一个账号</a>' +
      '</div>' +
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);line-height:1.8">' +
      '<div><b style="color:var(--ink2)">还没有激活码？</b>联系黎伟成获取。</div>' +
      '<div style="margin-top:6px">学生无需激活码——拿到答题卡上的二维码，直接打开链接就能看自己的报告。</div>' +
      '</div>'
    );
    var wrap = U.el('div', { class: 'gate' }, [box]);
    mount.appendChild(wrap);

    var input = U.$('#gate-code', box), btn = U.$('#gate-btn', box), state = U.$('#gate-state', box);

    function setState(html, cls) {
      state.innerHTML = '';
      if (!html) return;
      state.appendChild(U.el('div', { class: 'lic-state ' + (cls || ''), html: html }));
    }

    /* 粘贴时当场清洗，并且把「改了什么」说出来。
       老师看不到零宽字符，只看到「激活失败」，会以为码是假的。
       说清楚「我帮你清掉了什么」，他才敢相信这个码是好的。 */
    input.addEventListener('paste', function (e) {
      var dt = e.clipboardData;
      if (!dt) return;
      var raw = dt.getData('text');
      if (!raw) return;
      e.preventDefault();
      var cleaned = Lic.clean ? Lic.clean(raw) : String(raw).replace(/\s+/g, '');
      input.value = cleaned;
      var notes = [];
      if (/\s/.test(raw)) notes.push('空格/换行');
      if (/[\uFF01-\uFF5E]/.test(raw)) notes.push('全角字符');
      if (/[\u200B-\u200D\uFEFF\u00AD]/.test(raw)) notes.push('看不见的零宽字符');
      if (/["'`<>\u201C\u201D\u300C\u300D]/.test(raw)) notes.push('引号/书名号');
      var p = Lic.peek(cleaned);
      if (p) {
        setState('已自动清理：' + (notes.length ? notes.join('、') : '无') +
          '<br>识别为：<b>' + U.esc(p.planName) + '</b> · ' + p.seats + ' 个班级席位 · ' +
          (p.perpetual ? '永久有效' : '到期 ' + U.fmtDate(p.expires)), 'ok');
      } else {
        setState('粘贴进来的内容里没有找到完整的激活码（' + cleaned.length + ' 个字符）。' +
          '<br>请确认复制的是完整一段，没有漏掉结尾。', 'bad');
      }
      input.dispatchEvent(new Event('input'));
    });

    /* 输入时预览：让用户确认「我输入的是专业版」，但不作为放行依据 */
    input.addEventListener('input', function () {
      var v = input.value.trim();
      if (v.length < 20) { setState(''); return; }
      var p = Lic.peek(v);
      if (p) {
        setState('识别为：<b>' + U.esc(p.planName) + '</b> · ' + p.seats + ' 个班级席位 · ' +
          (p.perpetual ? '永久有效' : '到期 ' + U.fmtDate(p.expires)) +
          '<br><span style="font-size:12px">（正在校验签名，点「激活」确认）</span>', 'warn');
      } else {
        setState(''); /* 格式不对就不提示，避免误报 */
      }
    });

    function doActivate() {
      var v = input.value.trim();
      if (!v) { setState('请输入激活码', 'bad'); return; }
      btn.disabled = true;
      btn.textContent = '正在校验…';
      setState('正在用离线签名校验…', 'warn');
      Lic.activate(v).then(function (r) {
        btn.disabled = false;
        btn.textContent = '激活并进入平台';
        if (!r.ok) {
          setState(U.esc(r.reason || '激活失败') +
            '<br><span style="font-size:12px">如果是从微信 / QQ 复制过来的，删掉重来、' +
            '一次性整段粘贴试试：码里有一段连续的下划线，有些软件转发时会把它吃掉。</span>', 'bad');
          return;
        }
        /* 自动修好了就说出来。
           沉默地「帮用户改对了」不好 —— 老师下次会把同样的坏码发给别人，
           而且他会以为自己复制得没问题。 */
        var fixNote = r.repaired
          ? '<br><span style="font-size:12px">（检测到复制时丢了字符，已自动' +
            U.esc(r.repaired) + '。下次建议整段复制，别手抄。）</span>'
          : '';
        setState('✓ 激活成功：<b>' + U.esc(r.info.planName) + '</b> · ' +
          r.info.seats + ' 个班级席位 · ' +
          (r.info.perpetual ? '永久有效' : '到期 ' + U.fmtDate(r.info.expires)) + fixNote, 'ok');
        U.ok('激活成功，正在进入平台…');
        setTimeout(function () { App.boot(); }, 700);
      }).catch(function (e) {
        btn.disabled = false;
        btn.textContent = '激活并进入平台';
        setState('激活出错：' + U.esc(e.message || e), 'bad');
      });
    }

    btn.addEventListener('click', doActivate);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doActivate(); });
    U.$('#gate-logout', box).addEventListener('click', function () {
      if (root.Account) root.Account.logout();
      if (root.Admin) root.Admin.logout();
      App.boot();
    });
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 120);
  }

  /* ---------------- 渲染 ---------------- */
  App.render = function () {
    var route = currentRoute();
    var def = ROUTES.filter(function (r) { return r.hash === route; })[0];
    var name = def ? def.name : 'home';
    var mount = U.$('#app');
    if (!mount) return;

    /* 没登录就改地址栏（#/class 之类）也进不来 —— 光把门画上没用，
       得在每个入口都拦。这和「学生自测模式」的拦截是一个道理。 */
    if (!someoneIn()) { renderLogin(mount); return; }

    /* 学生自测模式下，除了自测页哪儿都去不了。
       学生只要在地址栏按两下退格，就能翻到「学生与记录」看到全班分数 ——
       所以要在这里拦，而不是只把导航链接藏起来。
       老师要退出，走「退出自测」按钮，那个按钮会先关掉模式再跳转。 */
    if (SELF_MODE && name !== 'self') {
      root.location.hash = '#/self';
      return;
    }

    /* 反过来，只要落到自测页，就先把模式打开。
       否则学生手打一个 #/self 进来，看到的是带完整导航的「设置」页 ——
       点一下「学生与记录」全班分数就露出来了。
       设成老师主动点按钮才算，等于把锁装在了门上却把门开着。 */
    if (!SELF_MODE && name === 'self') App.setSelfMode(true);

    var v = App.views[name];
    if (!v) {
      U.setHTML(mount, renderTopbar(name) +
        '<div class="wrap"><div class="card"><div class="empty">' +
        '<div class="big">🚧</div><div class="t">这个页面还在建设中</div>' +
        '<div>先看看别的吧。</div></div></div></div>');
      return;
    }

    /* 权限门禁 */
    if (v.need && !Lic.can(v.need)) {
      U.setHTML(mount, renderTopbar(name) + '<div class="wrap">' + renderNotices() +
        '<div class="card"><div class="empty"><div class="big">🔒</div>' +
        '<div class="t">此功能需要更高版本的授权</div>' +
        '<div style="margin-top:8px">当前版本：<b>' +
        U.esc((Lic.info() || { planName: '未激活' }).planName) + '</b>　' +
        '所需版本：<b>' + planNameOf(Lic.FEATURES.minPlan[v.need]) + ' 及以上</b></div>' +
        '<div style="margin-top:14px"><a class="btn" href="#/">返回首页</a> ' +
        '<button class="btn ghost" id="btn-upgrade">查看已有授权</button></div>' +
        '</div></div></div>');
      var up = U.$('#btn-upgrade');
      if (up) up.addEventListener('click', function () {
        U.modal({
          title: '当前授权', desc: '激活码由黎伟成统一发放。',
          body: infoTable()
        });
      });
      return;
    }

    var html = renderTopbar(name) + '<div class="wrap' + (v.narrow ? ' narrow' : '') + '">' +
      renderNotices() + '<div id="view"></div></div>';
    U.setHTML(mount, html);
    bindNotices(mount);
    mount.appendChild(U.el('div', { class: 'toast-wrap' }));

    /* 顶栏的「老师退出」*/
    var offBtn = U.$('#tb-self-off', mount);
    if (offBtn) offBtn.addEventListener('click', function () {
      /* 退出要确认「你是老师」，凭据是老师登记过的手机号。
         用管理员密码是错的：管理员密码是平台后台的钥匙，大部分老师
         根本不会设它，结果老师自己退不出去。
         手机号是老师注册时一定填过的东西，学生不知道 —— 够用了。 */
      var needPhone = root.Teacher && root.Teacher.has && root.Teacher.has();

      function doExit() {
        if (root.SelfTest) root.SelfTest.reset();
        App.setSelfMode(false);
        App.nav('#/');
        U.ok('已退出学生自测模式');
      }

      if (needPhone) { phoneAsk(); }
      else { firstTimeAsk(); }

      /* ---------- 第一次用：登记老师的手机号 ---------- */
      function firstTimeAsk() {
        var box = U.el('div');
        U.setHTML(box,
          '<div class="lic-state info">' +
          '第一次用学生自测模式，先留一个<b>老师的手机号</b>。' +
          '以后学生做完题要退出，输这个号码才能回到老师这边；' +
          '学生不知道你的号，就退不出去。' +
          '</div>' +
          '<div class="field" style="margin-top:12px"><label>老师的手机号</label>' +
          '<input type="tel" id="tb-phone" inputmode="numeric" maxlength="13" ' +
          'autocomplete="tel" placeholder="例如 13800138000"></div>' +
          '<div class="lic-state bad" id="tb-pw-err" style="display:none"></div>');

        U.modal({
          title: '先登记老师的手机号',
          desc: '这个号码只存在这台电脑上，不会上传。',
          body: box,
          buttons: [
            { text: '取消', kind: 'ghost', onClick: function (close) { close(); } },
            {
              text: '登记并退出', onClick: function (close) {
                var err = U.$('#tb-pw-err', box);
                root.Teacher.set(U.$('#tb-phone', box).value).then(function () {
                  close();
                  doExit();
                }).catch(function (e) {
                  if (err) { err.style.display = ''; err.textContent = e.message || '号码不对'; }
                });
                return false;   /* 异步，别让弹窗提前关掉 */
              }
            }
          ]
        });
        setTimeout(function () { try { U.$('#tb-phone', box).focus(); } catch (e) {} }, 120);
      }

      /* ---------- 以后每次：输手机号才能走 ---------- */
      function phoneAsk() {
        var hint = root.Teacher.hint();
        var wait = root.Teacher.waitSeconds();
        var goBtn = null;   /* 由 U.modal 同步创建，下面赋值 */

        /* 连错几次就锁一会儿。手机号只有 11 位数字，不加冷却的话
           「一个个试出老师的号」是可行的。 */
        if (wait > 0) {
          var locked = U.el('div');
          U.setHTML(locked,
            '<div class="lic-state bad">' +
            '号码输错太多次，请等 <b>' + Math.ceil(wait / 60) + ' 分钟</b>再试。' +
            '</div>' +
            '<div class="lic-state info" style="margin-top:10px;font-size:13px">' +
            '老师如果记不清自己的号码：先点「继续答题」把学生做完的卷子交掉，' +
            '别直接关页面 —— 没交卷的答案会丢。' +
            '</div>');
          U.modal({
            title: '暂时不能退出',
            body: locked,
            buttons: [{ text: '知道了', kind: 'ghost' }]
          });
          return;
        }

        var box = U.el('div');
        U.setHTML(box,
          '<div class="lic-state warn">请先确认<b>学生已经离开电脑</b>，' +
          '再输入老师的手机号退出。' +
          (hint ? '<br>本机登记的号码：<b>' + U.esc(hint) + '</b>' : '') +
          '</div>' +
          '<div class="field" style="margin-top:12px"><label>老师的手机号</label>' +
          '<input type="tel" id="tb-phone" inputmode="numeric" maxlength="13" ' +
          'autocomplete="tel" placeholder="11 位手机号"></div>' +
          '<div class="lic-state bad" id="tb-pw-err" style="display:none"></div>');

        var mm = U.modal({
          title: '退出学生自测模式',
          desc: '只有老师能退出去。',
          body: box,
          buttons: [
            { text: '继续答题', kind: 'ghost', onClick: function (close) { close(); } },
            {
              text: '退出', onClick: function (close) {
                var err = U.$('#tb-pw-err', box);
                function showErr(msg) {
                  if (err) { err.style.display = ''; err.textContent = msg; }
                }
                /* PBKDF2 要跑 12 万轮，大约一秒。按钮不给反应的话，
                   老师会以为卡住了、然后一直点 —— 所以先改成「校验中…」。
                   按钮是 goBtn（弹窗 footer 里的那个），不是 box 里的元素。 */
                if (goBtn) { goBtn.disabled = true; goBtn.textContent = '校验中…'; }
                function restore() {
                  if (goBtn) { goBtn.disabled = false; goBtn.textContent = '退出'; }
                }
                root.Teacher.check(U.$('#tb-phone', box).value).then(function (okv) {
                  restore();
                  if (!okv) {
                    var f = root.Teacher.recordFail();
                    if (f.until) {
                      close();
                      phoneAsk();   /* 重新弹一次，这时会显示「等 N 分钟」 */
                      return;
                    }
                    showErr('号码不对，再试一次。（还能试 ' + f.left + ' 次）');
                    return;
                  }
                  root.Teacher.clearFails();
                  close();
                  doExit();
                }).catch(function () {
                  restore();
                  showErr('校验出错，再试一次。');
                });
                return false;   /* 异步，别让弹窗提前关掉 */
              }
            }
          ]
        });
        /* U.modal 是同步建按钮的，所以这里能直接拿到 footer 最后一个按钮。
           不要用 setTimeout 延迟去挂 id —— 老师和学生的点击可能比它更快，
           那时按钮还没有 id，就会表现成「点了没反应」。 */
        try {
          var bs = mm.box.querySelectorAll('.row button');
          if (bs.length) goBtn = bs[bs.length - 1];
        } catch (e) {}
        setTimeout(function () {
          try { U.$('#tb-phone', box).focus(); } catch (e) {}
        }, 120);
      }
    });

    var viewMount = U.$('#view', mount);
    try {
      v.render(viewMount);
    } catch (e) {
      U.setHTML(viewMount, '<div class="card"><h2 class="sec"><span class="bar"></span>页面出错</h2>' +
        '<div class="lic-state bad" style="word-break:break-all">' + U.esc(e.message || String(e)) + '</div>' +
        '<pre class="keybox" style="margin-top:10px">' + U.esc((e.stack || '').split('\n').slice(0, 8).join('\n')) + '</pre></div>');
    }
    if (v.after) setTimeout(v.after, 30);
  };

  /* 视图离开时的清理钩子。
     有些视图会在 document 上挂键盘监听（手工录入靠键盘提速），
     不在离开时解绑的话，每进一次页面就多叠一个监听器，
     最后按一次键会触发好几遍。 */
  App.onLeave = {};

  function planNameOf(p) {
    return { 1: '试用版', 2: '标准版', 3: '专业版', 4: '校园版' }[p] || ('计划' + p);
  }

  function infoTable() {
    var lic = Store.getLicense();
    if (!lic) return '<div class="lic-state bad">尚未激活</div>';
    var i = lic.info || {};
    return '<div class="lic-state ok">' +
      '<div><b>' + U.esc(i.planName || '') + '</b>　' + (i.perpetual ? '永久有效' : '到期 ' + U.fmtDate(i.expires)) + '</div>' +
      '<div style="margin-top:4px;font-size:12.5px">班级席位：' + (i.seats || 0) + '　' +
      '激活时间：' + U.fmtTime(lic.activatedAt || lic.verifiedAt) + '</div>' +
      '</div>' +
      '<div class="hint" style="margin-top:8px;word-break:break-all">激活码：' + U.esc(lic.code || '') + '</div>';
  }

  App.infoTable = infoTable;

  /* ---------------- 启动 ---------------- */
  /* 挂载点。
     页面骨架里已经有 <div id="app">，所以这里必须先找再用 ——
     早期版本无条件 append，结果 DOM 里出现两个 #app，
     渲染进第一个，第二个变成幽灵空节点（没报错，但很难查）。 */
  App.mount = function () {
    var exist = U.$('#app');
    if (exist) return exist;
    var m = U.el('div', { id: 'app' });
    document.body.appendChild(m);
    return m;
  };

  App.boot = function () {
    var mount = U.$('#app') || App.mount();

    /* 上次是学生自测模式的话，刷新后仍然回到学生视角。
       不然学生在答题时按一下 F5，就掉进老师端、看到全班分数了。
       这个标记存在会话级存储里：关掉浏览器就清空，不会第二天还锁着。 */
    try {
      if (root.sessionStorage && root.sessionStorage.getItem('chem_self_mode') === '1') {
        App.setSelfMode(true);
        if (root.location.hash !== '#/self') root.location.hash = '#/self';
      }
    } catch (e) {}

    /* 第一关：老师登录（或管理员） */
    if (!someoneIn()) { renderLogin(mount); return; }

    /* 第二关：激活码 */
    Lic.ensure().then(function (r) {
      if (!r.ok) { renderGate(mount); return; }
      App.render();
    }).catch(function () {
      renderGate(mount);
    });
  };

  root.App = App;
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-home -->
<script>
/*!
 * 化学学情诊断平台 · 首页
 * 作者：黎伟成
 *
 * 首页要回答的唯一问题：「我现在该点哪里？」
 *
 * 这个平台有两条使用路径，很多人第一次打开会懵：
 *   路径一（推荐，正式上课用）：印答题卡 → 学生填 → 拍照识别 → 出报告
 *   路径二（没条件拍照时）：印答题卡 → 学生填 → 老师在电脑上点 → 出报告
 * 用户要求的「大班使用」是路径一：老师打印题目，学生在答题卡上作答，
 * 扫描后用 Excel 导入，带学号+分数+错题，扫码看详细报告。
 * 所以首页把这条链画成 4 步，每步一个按钮，一步接一步。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store, Lic = root.Lic;

  App.view('home', {
    render: function (mount) {
      var qs = Core.questions();
      U.setHTML(mount, '');

      /* ---------- 顶部：状态 ---------- */
      var top = U.el('div', { class: 'card' });
      var lic = Lic.current();
      var info = lic ? lic.info || {} : null;
      var activated = !!(info && !info.failed);

      var html = '<div class="spread"><div>' +
        '<h1 style="font-size:23px;margin:0 0 6px;letter-spacing:-.4px">化学学情诊断平台</h1>' +
        '<p style="margin:0;color:var(--ink3);font-size:14px">' +
        '给老师用的化学成绩诊断工具。从出卡到出报告，一台电脑搞定。</p>' +
        '</div><div style="text-align:right">' +
        (activated
          ? '<span class="tag ok">' + U.esc(info.planName) + '</span>'
          : '<span class="tag warn">未激活</span>') +
        '<div class="hint" style="margin-top:4px">' + U.fmtDate(Date.now()) + '</div>' +
        '</div></div>' +
        '<div class="stats mt">' +
        '<div class="stat"><div class="k">题库</div><div class="v">' + qs.length + '<small>题</small></div></div>' +
        '<div class="stat"><div class="k">知识点</div><div class="v">' + Core.kp().length + '<small>个</small></div></div>' +
        '<div class="stat"><div class="k">试卷分值</div><div class="v">' +
        Core.paperStats(qs.map(function (q) { return q.id; })).points + '<small>分</small></div></div>' +
        '<div class="stat"><div class="k">已录成绩</div><div class="v" id="h-rec">—<small>条</small></div></div>' +
        '</div>';
      U.setHTML(top, html);
      mount.appendChild(top);

      Store.all('records').then(function (rs) {
        var el = U.$('#h-rec');
        if (el) U.setHTML(el, rs.length + '<small>条</small>');
      });

      /* ---------- 四步流程 ---------- */
      var flow = U.el('div', { class: 'card' });
      U.setHTML(flow,
        '<h2 class="sec"><span class="bar"></span>上课怎么用</h2>' +
        '<p class="sec-desc">四步。点每一步的按钮就能进去。' +
        '已经走过的步骤会打勾，中途关掉浏览器也不会丢。</p>' +
        '<div class="steps mt" id="h-steps"></div>' +
        '<div class="mode-grid mt" id="h-actions"></div>');

      var steps = [
        {
          n: '1', t: '出答题卡并打印', d: '选卷子 → 打印 A4 答题卡',
          href: '#/sheet', icon: '🖨️',
          desc: '选好考哪些知识点，自动排成答题卡（选项位置就是识别用的定位点）。' +
            '题目单独打印，或者直接投屏让学生抄。'
        },
        {
          n: '2', t: '学生填涂', d: '每个学生一张卡，写学号',
          href: '#/omr', icon: '✏️',
          desc: '学生把答案涂在选项框里，左上角写学号。' +
            '学号写清楚是后面能自动配对的前提。'
        },
        {
          n: '3', t: '收回来识别成绩', d: '拍照识别 / Excel 导入 / 手工点',
          href: '#/omr', icon: '📷',
          desc: '三种方式任选。手机一张张拍也行，扫描仪出 Excel 直接导也行。' +
            '识别结果一定有一步人工复核，不会悄悄判错。'
        },
        {
          n: '4', t: '出报告发给学生', d: '班级分析 + 学生扫二维码',
          href: '#/class', icon: '📊',
          desc: '老师看班级整体漏洞，学生扫自己那张卡的二维码，' +
            '在手机上看到自己的详细报告。'
        }
      ];
      var stepBox = U.$('#h-steps', flow);
      U.setHTML(stepBox, steps.map(function (s, i) {
        var done = false;
        var sheetState = App.state.sheet;
        if (i === 0) done = !!(sheetState && sheetState.questionIds && sheetState.questionIds.length);
        if (i === 1) done = false;
        if (i === 2) done = false;
        if (i === 3) done = false;
        return '<div class="step-chip' + (done ? ' done' : '') + '">' +
          '<span class="sn">' + s.n + '</span>' + U.esc(s.t) + '</div>';
      }).join(''));

      var actBox = U.$('#h-actions', flow);
      U.setHTML(actBox, steps.map(function (s) {
        return '<div class="mode-card" data-href="' + s.href + '" data-i="' + s.n + '">' +
          '<div class="mc-h"><span class="mc-ico">' + s.icon + '</span>' +
          '<span class="mc-nm">' + U.esc(s.t) + '</span></div>' +
          '<div class="mc-d">' + U.esc(s.d) + '</div>' +
          '<div class="mc-cnt" style="font-weight:400;line-height:1.65;color:var(--ink3)">' +
          U.esc(s.desc) + '</div></div>';
      }).join(''));
      mount.appendChild(flow);

      U.$$('.mode-card', actBox).forEach(function (c) {
        c.addEventListener('click', function () { App.nav(c.getAttribute('data-href')); });
      });

      /* ---------- 大班批量流程（用户明确要的那个） ---------- */
      var batch = U.el('div', { class: 'card' });
      U.setHTML(batch,
        '<h2 class="sec"><span class="bar"></span>大班批量录成绩</h2>' +
        '<p class="sec-desc">一个班五十几个人，不可能一张张在电脑上点。' +
        '批量走这条路：</p>' +
        '<div class="steps mt">' +
        '<div class="step-chip done"><span class="sn">A</span>打印答题卡，一人一张</div>' +
        '<div class="step-chip done"><span class="sn">B</span>学生填涂并写好学号</div>' +
        '<div class="step-chip done"><span class="sn">C</span>老师统一对着答案批改</div>' +
        '<div class="step-chip done"><span class="sn">D</span>录进 Excel（学号 + 每题对错，或一列错题号）</div>' +
        '<div class="step-chip done"><span class="sn">E</span>上传 Excel，自动按学号配对</div>' +
        '</div>' +
        '<div class="row mt"><button class="btn" id="h-imp">上传 Excel 导入成绩</button>' +
        '<button class="btn ghost" id="h-ml">手工录入（少量学生）</button>' +
        '<button class="btn ghost" id="h-omr">手机拍照识别</button></div>' +
        '<div class="notice mt"><span class="ico">💡</span><div class="bd">' +
        '<div class="nt">Excel 不用按固定模板做</div><div class="nc">' +
        '系统会自己认列。最常见的三种表都认：<br>' +
        '· <b>学号 + 姓名 + 每题一列</b>（内容 0/1 或 对/错）——最完整<br>' +
        '· <b>学号 + 一列错题号</b>（内容 3,7,12）——很好用<br>' +
        '· <b>学号 + 总分</b>——只能算排名，出不了逐题报告<br>' +
        '认错了的列可以在导入前手工改，导入前还有一步预览让你核对姓名和学号。' +
        '</div></div></div>');
      mount.appendChild(batch);
      U.$('#h-imp', batch).addEventListener('click', function () { App.nav('#/manual'); });
      U.$('#h-ml', batch).addEventListener('click', function () { App.nav('#/manual'); });
      U.$('#h-omr', batch).addEventListener('click', function () { App.nav('#/omr'); });

      /* ---------- 五种卷子 ---------- */
      var presets = U.el('div', { class: 'card' });
      var list = Core.presetList();
      U.setHTML(presets,
        '<h2 class="sec"><span class="bar"></span>先选一份卷子</h2>' +
        '<p class="sec-desc">第一次用，建议从「快速摸底」开始。' +
        '32 道题，20 分钟能测完，能立刻看出初中地基和高中主干哪里断了。</p>' +
        '<div class="mode-grid">' +
        list.filter(function (p) { return p.id !== 'custom'; }).map(function (p) {
          var n = p.pick().length;
          var pts = n ? Core.paperStats(p.pick()).points : 0;
          var m = /(\d+)\s*题/.exec(p.desc || '');
          void m;
          return '<div class="mode-card" data-preset="' + p.id + '">' +
            '<div class="mc-h"><span class="mc-nm">' + U.esc(p.name) + '</span>' +
            '<span class="mc-cnt">' + n + ' 题 · ' + pts + ' 分</span></div>' +
            '<div class="mc-d">' + U.esc(p.desc || '') + '</div></div>';
        }).join('') +
        '</div>');
      mount.appendChild(presets);

      U.$$('[data-preset]', presets).forEach(function (c) {
        c.addEventListener('click', function () {
          var id = c.getAttribute('data-preset');
          var p = list.filter(function (x) { return x.id === id; })[0];
          if (!p) return;
          var ids = p.pick();
          App.state.sheet = {
            preset: id, questionIds: ids, title: p.name,
            note: '姓名＿＿＿＿＿　班级＿＿＿＿＿　学号＿＿＿＿＿＿＿＿', twoSide: false
          };
          U.ok('已选好：' + p.name);
          App.nav('#/sheet');
        });
      });

      /* ---------- 两条路径的取舍说明 ---------- */
      var tips = U.el('div', { class: 'card' });
      U.setHTML(tips,
        '<h2 class="sec"><span class="bar"></span>三种录成绩的方式，怎么选</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th style="width:120px">方式</th><th style="width:110px">适合</th><th>说明</th>' +
        '</tr></thead><tbody>' +
        '<tr><td style="font-weight:650">手机拍照识别</td><td>1–2 个班</td>' +
        '<td>一张卡拍一张，系统自动找四个角上的定位点、算出每个选项涂没涂。' +
        '识别完会<b>标出它没把握的题</b>，你点一下就能改。' +
        '不需要扫描仪。</td></tr>' +
        '<tr><td style="font-weight:650">Excel 导入</td><td>大班、有扫描仪</td>' +
        '<td>扫描仪或者老师批量批改之后出表，上传到这里。' +
        '学号错一位报告就发错人，所以导入前会让你核对一遍。</td></tr>' +
        '<tr><td style="font-weight:650">手工录入</td><td>几个人、补录</td>' +
        '<td>纯键盘操作：A/B/C/D 选项，T/F 判断，方向键换题。' +
        '手快的话一题一秒。</td></tr>' +
        '</tbody></table></div>' +
        '<div class="lic-state info mt">' +
        '<b>关于报告的准确性：</b>这份题库测的是「基础过不过关」，' +
        '不是竞赛拔高。全卷 167 题里只有 11 题是进阶题，' +
        '所以分数在 20–60 分之间时诊断最准；' +
        '如果学生本来就在 70 分以上，这份卷子只能告诉你「基础没问题」，' +
        '再细的短板看不出来。' +
        '</div>');
      mount.appendChild(tips);

      /* ---------- 底部：数据在哪 ---------- */
      var danger = U.el('div', { class: 'card' });
      U.setHTML(danger,
        '<h2 class="sec"><span class="bar"></span>数据存在哪</h2>' +
        '<div class="lic-state warn">' +
        '所有学生成绩都存在<b>这台电脑的浏览器里</b>，没有上传到任何服务器。' +
        '好处是别人看不到；坏处是<b>换电脑、清缓存、用无痕模式都会没了</b>。' +
        '<br><br>所以：<b>录完一个班就导出一次备份</b>。' +
        '在「学生与记录 → 数据备份」里一键导出，是个 JSON 文件，' +
        '下次换电脑拖进去就能全部恢复。' +
        '</div>' +
        '<div class="row mt-s"><button class="btn ghost" id="h-bk">去备份数据</button>' +
        '<button class="btn ghost" id="h-adm">管理员后台</button></div>');
      mount.appendChild(danger);
      U.$('#h-bk', danger).addEventListener('click', function () { App.nav('#/students'); });
      U.$('#h-adm', danger).addEventListener('click', function () { App.nav('#/admin'); });

      /* ---------- 学生自测模式（校园版） ---------- */

<script>
/*!
 * 化学学情诊断平台 · 答题卡生成与打印
 * 作者：黎伟成
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Sheet = root.Sheet, Lic = root.Lic;

  App.view('sheet', {
    need: null,
    render: function (mount) {
      var presets = Core.presetList();
      var saved = U.$('#sheet-qids');
      var state = App.state.sheet = App.state.sheet || {
        preset: 'quick',
        questionIds: null,
        title: '化学学情诊断',
        note: '',
        twoSide: true
      };
      if (!state.questionIds) {
        state.questionIds = Core.PRESETS[state.preset].pick();
      }

      U.setHTML(mount, '');

      /* ---- 选卷 ---- */
      var cardSel = U.el('div', { class: 'card' });
      U.setHTML(cardSel,
        '<h2 class="sec"><span class="bar"></span>第一步：选一份卷子</h2>' +
        '<p class="sec-desc">答题卡会按这份卷子的题量和题型自动分页排版。</p>' +
        '<div class="mode-grid" id="preset-grid"></div>' +
        '<div id="custom-box" class="hidden mt"></div>');
      mount.appendChild(cardSel);

      var grid = U.$('#preset-grid', cardSel);
      presets.forEach(function (p) {
        var node = U.el('div', {
          class: 'mode-card' + (state.preset === p.key ? ' on' : ''),
          'data-key': p.key
        });
        U.setHTML(node,
          '<div class="mc-h"><span class="mc-ico">' + p.icon + '</span>' +
          '<span class="mc-nm">' + U.esc(p.name) + '</span>' +
          '<span class="mc-cnt">' + p.count + ' 题</span></div>' +
          '<div class="mc-d">' + U.esc(p.desc) + '</div>' +
          '<div class="mc-tags">' + p.tags.map(function (t) {
            return '<span class="tag ' + (t.indexOf('建议') >= 0 ? 'ok' : 'gray') + '">' + U.esc(t) + '</span>';
          }).join('') + '</div>');
        node.addEventListener('click', function () {
          U.$$('.mode-card', grid).forEach(function (x) { x.classList.remove('on'); });
          node.classList.add('on');
          state.preset = p.key;
          if (p.key === 'custom') {
            showCustom(true);
            state.questionIds = Core.filterQuestions({}).map(function (q) { return q.id; });
          } else {
            showCustom(false);
            state.questionIds = p.pick();
          }
          refreshStats();
        });
        grid.appendChild(node);
      });

      /* ---- 自定义筛选 ---- */
      var customBox = U.$('#custom-box', cardSel);
      function showCustom(on) {
        customBox.classList.toggle('hidden', !on);
        if (on && !customBox.dataset.built) { buildCustom(); customBox.dataset.built = '1'; }
      }

      function buildCustom() {
        U.setHTML(customBox,
          '<div class="filter-grid" id="fg"></div>' +
          '<div class="row mt"><button class="btn sm" id="btn-all">全选</button>' +
          '<button class="btn ghost sm" id="btn-none">清空</button>' +
          '<span class="hint" id="custom-hint"></span></div>');

        var fg = U.$('#fg', customBox);

        function chipGroup(title, items, key) {
          var box = U.el('div', { class: 'fg-box' });
          U.setHTML(box, '<div class="fg-t">' + U.esc(title) + '</div>');
          var row = U.el('div', { class: 'fg-row' });
          items.forEach(function (it) {
            var b = U.el('button', { class: 'chip-btn', 'data-v': it.id, text: it.name });
            b.addEventListener('click', function () {
              b.classList.toggle('on');
              applyFilter();
            });
            row.appendChild(b);
          });
          box.appendChild(row);
          fg.appendChild(box);
          return row;
        }

        chipGroup('按册 / 模块', Core.stages(), 'stages');
        chipGroup('按能力维度', Core.dims(), 'dims');

        var trow = U.el('div', { class: 'fg-box' });
        U.setHTML(trow, '<div class="fg-t">按题型</div>');
        var tr = U.el('div', { class: 'fg-row' });
        [['single', '单选'], ['multi', '多选'], ['judge', '判断'], ['fill', '填空']].forEach(function (t) {
          var b = U.el('button', { class: 'chip-btn', 'data-v': t[0], text: t[1] });
          b.addEventListener('click', function () { b.classList.toggle('on'); applyFilter(); });
          tr.appendChild(b);
        });
        trow.appendChild(tr);
        fg.appendChild(trow);

        var drow = U.el('div', { class: 'fg-box' });
        U.setHTML(drow, '<div class="fg-t">按难度</div>');
        var dr = U.el('div', { class: 'fg-row' });
        [[1, '基础'], [2, '中等'], [3, '进阶']].forEach(function (t) {
          var b = U.el('button', { class: 'chip-btn', 'data-v': t[0], text: t[1] });
          b.addEventListener('click', function () { b.classList.toggle('on'); applyFilter(); });
          dr.appendChild(b);
        });
        drow.appendChild(dr);
        fg.appendChild(drow);

        function picked(key) {
          return U.$$('.chip-btn.on', fg)
            .filter(function (b) {
              return b.closest('.fg-box').querySelector('.fg-t').textContent === key;
            })
            .map(function (b) { return b.getAttribute('data-v'); });
        }

        function applyFilter() {
          var opt = {};
          var st = U.$$('.chip-btn.on', fg).filter(function (b) {
            return b.closest('.fg-box').querySelector('.fg-t').textContent === '按册 / 模块';
          }).map(function (b) { return b.getAttribute('data-v'); });
          var dm = U.$$('.chip-btn.on', fg).filter(function (b) {
            return b.closest('.fg-box').querySelector('.fg-t').textContent === '按能力维度';
          }).map(function (b) { return b.getAttribute('data-v'); });
          var tp = U.$$('.chip-btn.on', fg).filter(function (b) {
            return b.closest('.fg-box').querySelector('.fg-t').textContent === '按题型';
          }).map(function (b) { return b.getAttribute('data-v'); });
          var df = U.$$('.chip-btn.on', fg).filter(function (b) {
            return b.closest('.fg-box').querySelector('.fg-t').textContent === '按难度';
          }).map(function (b) { return Number(b.getAttribute('data-v')); });

          if (st.length) opt.stages = st;
          if (dm.length) opt.dims = dm;
          if (tp.length) opt.types = tp;
          if (df.length) opt.diffs = df;

          var list = Core.filterQuestions(opt);
          state.questionIds = list.map(function (q) { return q.id; });
          refreshStats();
        }

        U.$('#btn-all', customBox).addEventListener('click', function () {
          U.$$('.chip-btn', fg).forEach(function (b) { b.classList.add('on'); });
          applyFilter();
        });
        U.$('#btn-none', customBox).addEventListener('click', function () {
          U.$$('.chip-btn', fg).forEach(function (b) { b.classList.remove('on'); });
          applyFilter();
        });
        /* 默认全选 */
        U.$$('.chip-btn', fg).forEach(function (b) { b.classList.add('on'); });
        applyFilter();
      }

      /* ---- 卷头设置 ---- */
      var cardHead = U.el('div', { class: 'card' });
      U.setHTML(cardHead,
        '<h2 class="sec"><span class="bar"></span>第二步：卷头与说明</h2>' +
        '<p class="sec-desc">这些字会印在答题卡上。</p>' +
        '<div class="row" style="align-items:flex-end">' +
        '<div class="field" style="flex:1;min-width:220px;margin-bottom:0">' +
        '<label>试卷名称</label>' +
        '<input type="text" id="in-title"></div>' +
        '<div class="field" style="flex:2;min-width:260px;margin-bottom:0">' +
        '<label>卡上说明 <span class="sub">可留空用默认</span></label>' +
        '<input type="text" id="in-note"></div>' +
        '</div>' +
        '<div class="mt" id="stat-box"></div>');
      mount.appendChild(cardHead);

      var inTitle = U.$('#in-title', cardHead), inNote = U.$('#in-note', cardHead);
      inTitle.value = state.title;
      inNote.value = state.note;
      inTitle.addEventListener('input', function () { state.title = inTitle.value; refreshPreviewLater(); });
      inNote.addEventListener('input', function () { state.note = inNote.value; refreshPreviewLater(); });

      function refreshStats() {
        var ids = state.questionIds || [];
        var s = Core.paperStats(ids);
        var box = U.$('#stat-box', cardHead);
        if (!box) return;
        var typeStr = Object.keys(s.types).map(function (t) {
          return Core.typeName(t) + ' ' + s.types[t];
        }).join(' · ');
        var diffStr = Object.keys(s.diffs).map(function (d) {
          return Core.diffName(Number(d)) + ' ' + s.diffs[d];
        }).join(' · ');
        var L = Sheet.layout(ids.map(function (id) { return Core.qmap()[id]; }).filter(Boolean), {});
        U.setHTML(box,
          '<div class="stats">' +
          '<div class="stat"><div class="k">题量</div><div class="v">' + s.total + '<small>题</small></div></div>' +
          '<div class="stat"><div class="k">总分</div><div class="v">' + s.points + '<small>分</small></div></div>' +
          '<div class="stat"><div class="k">答题卡页数</div><div class="v">' + L.pageCount + '<small>页</small></div></div>' +
          '<div class="stat"><div class="k">需要涂的格</div><div class="v">' + L.totalBits + '<small>格</small></div></div>' +
          '</div>' +
          '<div class="hint mt-s">' + U.esc(typeStr) + '<br>' + U.esc(diffStr) + '</div>');
        if (L.overflow) U.warn('题目太多，有 ' + L.overflow + ' 个格没能排下，请减少题量。');
        refreshPreviewLater();
      }

      /* ---- 预览 ---- */
      var cardPrev = U.el('div', { class: 'card' });
      U.setHTML(cardPrev,
        '<div class="spread no-print"><div>' +
        '<h2 class="sec"><span class="bar"></span>第三步：预览与打印</h2>' +
        '<p class="sec-desc" style="margin-bottom:0">下面就是打印出来的样子。四角黑方块是定位标记，识别程序靠它们对齐。</p>' +
        '</div><div class="row">' +
        '<button class="btn ghost" id="btn-print">打印答题卡</button>' +
        '<button class="btn" id="btn-cards">生成学生报告卡 →</button>' +
        '</div></div>' +
        '<div id="sheet-pages" class="mt"></div>');
      mount.appendChild(cardPrev);

      var pagesBox = U.$('#sheet-pages', cardPrev);
      var previewTimer = null;

      function refreshPreviewLater() {
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(refreshPreview, 180);
      }

      function refreshPreview() {
        var ids = state.questionIds || [];
        var qs = ids.map(function (id) { return Core.qmap()[id]; }).filter(Boolean);
        if (!qs.length) {
          U.setHTML(pagesBox, '<div class="empty"><div class="big">📄</div><div class="t">还没有选题</div></div>');
          return;
        }
        var out = Sheet.svgAll(qs, {
          title: state.title || '化学学情诊断',
          note: state.note || undefined
        });
        var html = '';
        out.svgs.forEach(function (svg, i) {
          html += '<div class="sheet-page" data-page="' + i + '">' + svg + '</div>';
        });
        U.setHTML(pagesBox, html);
        App.state.sheet.last = { layout: out.layout, questions: qs };

        /* 加上图例说明 */
        var legend = Sheet.legend(qs);
        if (legend.length) {
          var lb = U.el('div', { class: 'hint mt' });
          U.setHTML(lb, '📌 ' + legend.map(U.esc).join('　·　'));
          pagesBox.appendChild(lb);
        }
      }

      U.$('#btn-print', cardPrev).addEventListener('click', function () { window.print(); });

      U.$('#btn-cards', cardPrev).addEventListener('click', function () {
        if (!state.questionIds || !state.questionIds.length) { U.err('先选好题目'); return; }
        App.state.qr = App.state.qr || {};
        App.state.qr.questionIds = state.questionIds.slice();
        App.state.qr.paperName = state.title || '化学学情诊断';
        App.nav('#/qr');
      });

      refreshStats();
    }
  });
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/view-omr -->
<script>
/*!
 * 化学学情诊断平台 · 拍照识别答题卡
 * 作者：黎伟成
 *
 * 全流程四步：选卷子 → 传照片 → 人工复核 → 保存
 *
 * 关于「人工复核」为什么不能省：
 *   OMR 引擎在光线、阴影、透视等各种退化条件下实测准确率是 100%，
 *   但那是在测试集上。真实场景还会遇到：涂得太轻、涂了两个、橡皮没擦干净、
 *   水渍、折痕、手指挡住角、拍歪太多。这些情况下任何识别算法都可能出错。
 *   而一个学生被误判一道题，整份报告的结论可能就反过来了。
 *   所以设计上：
 *     · 低置信度的涂点在图上画成橙色虚线圈 + 脉冲提示
 *     · 复核界面允许老师直接点圈改判定，或切到列表用键盘核对
 *     · 保存前若一道题都没识别到，直接拦住
 *   宁可让老师多点几下，也不能悄悄写一条错数据进数据库。
 */
(function (root) {
  'use strict';

  var U = root.U, Core = root.Core, App = root.App, Store = root.Store;
  var OMR = root.OMR, Sheet = root.Sheet, Analyze = root.Analyze;

  /* 低于这个置信度就标出来请老师看一眼。
     0.714 是「半涂」的实测值，0.55 以下通常是光线问题或纸面脏污。
     阈值取 0.72 是为了让半涂这种「机器有把握但可能是擦痕」的情况也能被看到。 */
  var LOW_CONF = 0.72;

  var st = null;

  App.view('omr', {
    need: 'omr',
    render: function (mount) {
      if (!st) {
        st = { preset: 'quick', paperName: '', questionIds: null, pages: [] };
        App.state.omr = st;
      }
      /* 每次渲染都跟「答题卡」页对齐。
         这里原来只在第一次创建 st 时同步一次，老师如果在答题卡页改了卷子，
         回来还停在旧卷子上 —— 会把答案张冠李戴地判到错误的题目位置。
         识别结果和照片是绑死的，所以卷子一变就必须清掉已传的照片。 */
      syncPaper();
      U.setHTML(mount, '');

      var step = !st.questionIds ? 1 : (!st.pages.length ? 2 : 3);
      var bar = U.el('div', { class: 'card' });
      U.setHTML(bar,
        '<h2 class="sec"><span class="bar"></span>拍照识别答题卡</h2>' +
        '<div class="steps">' +
        chip(1, '选卷子', step > 1) + chip(2, '传照片', step > 2) +
        chip(3, '人工复核', false) + chip(4, '保存', false) +
        '</div>');
      mount.appendChild(bar);

      var box = U.el('div');
      mount.appendChild(box);
      if (step === 1) step1(box);
      else if (step === 2) step2(box);
      else step3(box);
    }
  });

  function chip(n, t, done) {
    return '<div class="step-chip' + (done ? ' done' : '') + '">' +
      '<b>' + (done ? '✓' : n) + '</b>' + t + '</div>';
  }

  /* 跟「答题卡」页的卷子对齐。卷子变了就清空已传照片 ——
     照片是按某份卷子的版式拍的，换卷子后旧照片的位置对不上，
     留着会认出错位的答案。 */
  function syncPaper() {
    var sh = App.state.sheet;
    var ids = (sh && sh.questionIds && sh.questionIds.length) ? sh.questionIds : null;
    if (!ids) return;

    var same = st.questionIds && st.questionIds.length === ids.length &&
      st.questionIds.every(function (id, i) { return id === ids[i]; });
    if (same) {
      st.paperName = sh.title || st.paperName || '';
      return;
    }

    var hadPages = st.pages && st.pages.length;
    st.preset = sh.preset || st.preset || 'quick';
    st.questionIds = ids.slice();
    st.paperName = sh.title || '';
    st.pages = [];

    if (hadPages) {
      U.toast('卷子已换成「' + (st.paperName || '新卷子') + '」，之前传的照片已清空', 'bad', 4000);
    }
  }

  function curQs() {
    return (st.questionIds || []).map(function (id) { return Core.qmap()[id]; }).filter(Boolean);
  }
  function curLayout() { return Sheet.layout(curQs(), { page: 1 }); }

  /* ============================ 步骤 1：选卷子 ============================ */
  function step1(box) {
    var presets = Core.presetList();
    var html = '<div class="card"><h2 class="sec"><span class="bar"></span>先确认：你印出去的是哪份卷子？</h2>' +
      '<p class="sec-desc">识别靠的是「题目 ↔ 答题卡上的位置」这个对应关系。' +
      '印的是「快速摸底」，这里就必须选「快速摸底」——选错了，答案会张冠李戴，' +
      '而且看起来还挺正常，很难自己发现。</p><div class="mode-grid">';
    presets.forEach(function (p) {
      if (p.id === 'custom') return;
      var n = p.pick().length;
      if (!n) return;
      html += '<div class="mode-card" data-p="' + p.id + '">' +
        '<div class="mc-h"><span class="mc-nm">' + U.esc(p.name) + '</span>' +
        '<span class="mc-cnt">' + n + ' 题</span></div>' +
        '<div class="mc-d">' + U.esc(p.desc || '') + '</div></div>';
    });
    html += '</div><div class="row mt"><button class="btn ghost" id="back">返回答题卡页</button></div></div>';
    U.setHTML(box, html);

    U.$$('.mode-card', box).forEach(function (c) {
      c.addEventListener('click', function () {
        var id = c.getAttribute('data-p');
        var p = presets.filter(function (x) { return x.id === id; })[0];
        st.preset = id;
        st.questionIds = p.pick();
        st.paperName = p.name;
        App.render();
      });
    });
    U.$('#back', box).addEventListener('click', function () { App.nav('#/sheet'); });
  }

  /* ============================ 步骤 2：传照片 ============================ */
  function step2(box) {
    var qs = curQs(), L = Sheet.layout(qs, { page: 1 });

    U.setHTML(box, '<div class="card">' +
      '<div class="spread"><div><h2 class="sec" style="margin-bottom:0"><span class="bar"></span>' +
      U.esc(st.paperName || '未命名') + '</h2>' +
      '<p class="sec-desc" style="margin-bottom:0">' + qs.length + ' 题 · ' +
      L.pageCount + ' 页 · ' + L.totalBits + ' 个涂点</p></div>' +
      '<button class="btn ghost sm" id="back1">换一份</button></div>' +
      '<div id="dz" class="mt"></div><div id="files" class="mt"></div>' +
      '<div class="row mt"><button class="btn" id="run" disabled>开始识别</button>' +
      '<span class="hint" id="runhint">先加照片</span></div>' +
      '<div class="notice mt"><span class="ico">📷</span><div class="bd">' +
      '<div class="nt">拍好照片的几个要点</div><div class="nc">' +
      '① 答题卡四个角的黑方块要完整入镜，别被手指挡住<br>' +
      '② 手机尽量正对着卡拍，稍微斜一点没关系，斜太多会识别失败<br>' +
      '③ 光线均匀，避免一半亮一半暗、避免自己的影子盖在卡上<br>' +
      '④ 一页一张照片。这份卷子有 ' + L.pageCount + ' 页，就拍 ' + L.pageCount + ' 张<br>' +
      '⑤ 分辨率越高越好，但手机默认设置就够了' +
      '</div></div></div></div>');

    U.$('#back1', box).addEventListener('click', function () {
      st.questionIds = null; st.pages = []; App.render();
    });

    var dzBox = U.$('#dz', box);
    U.setHTML(dzBox, '');
    dzBox.appendChild(U.dropZone({
      accept: 'image/*', icon: '📄', title: '点击选择照片，或把照片拖到这里',
      sub: '可以一次选多张。HEIC 请先在手机上手选转换成 JPG。',
      onFiles: function (files) { addFiles(files, box); }
    }));
    renderFiles(box);
  }

  function addFiles(files, box) {
    var arr = files.filter(function (f) {
      return /^image\//.test(f.type) || /\.(jpe?g|png|webp|bmp)$/i.test(f.name);
    });
    if (!arr.length) { U.err('这些文件不是图片'); return; }

    var chain = Promise.resolve();
    arr.forEach(function (f) {
      chain = chain.then(function () {
        return U.readAsDataURL(f).then(function (url) {
          return new Promise(function (res, rej) {
            var img = new Image();
            img.onload = function () {
              st.pages.push({ name: f.name, dataURL: url, img: img, result: null, answers: null, error: null });
              res();
            };
            img.onerror = function () { rej(new Error(f.name + ' 无法解码（可能是 HEIC 格式，请先转成 JPG）')); };
            img.src = url;
          });
        });
      });
    });
    chain.then(function () {
      U.ok('已添加 ' + arr.length + ' 张');
      renderFiles(box);
    }).catch(function (e) { U.err(e.message); renderFiles(box); });
  }

  function renderFiles(box) {
    var holder = U.$('#files', box);
    if (!holder) return;
    if (!st.pages.length) {
      U.setHTML(holder, '<div class="card"><div class="empty"><div class="t">还没有照片</div></div></div>');
    } else {
      var html = '<div class="card"><h2 class="sec" style="font-size:15px"><span class="bar"></span>' +
        '照片（' + st.pages.length + ' 张）</h2>';
      st.pages.forEach(function (p, i) {
        html += '<div class="photo-row">' +
          '<span style="color:var(--ink3);width:22px">' + (i + 1) + '</span>' +
          '<span class="pn">' + U.esc(p.name) + '</span>' +
          '<span class="hint">' + p.img.naturalWidth + '×' + p.img.naturalHeight + '</span>' +
          '<button class="btn ghost sm rm" data-i="' + i + '">移除</button></div>';
      });
      html += '</div>';
      U.setHTML(holder, html);
      U.$$('.rm', holder).forEach(function (b) {
        b.addEventListener('click', function () {
          st.pages.splice(+b.getAttribute('data-i'), 1);
          renderFiles(box);
        });
      });
    }

    var btn = U.$('#run', box), hint = U.$('#runhint', box);
    if (!btn) return;
    btn.disabled = !st.pages.length;
    btn.textContent = '开始识别';
    if (hint) hint.textContent = st.pages.length
      ? '将依次识别 ' + st.pages.length + ' 张' : '先加照片';
    btn.onclick = function () { runOcr(box); };
  }

  /* ============================ 识别 ============================ */
