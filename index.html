      if (c.area < minA || c.area > maxA) continue;
      if (c.bw < 3 || c.bh < 3) continue;
      if (c.bw > gw * 0.3 || c.bh > gh * 0.3) continue;
      var ar = c.bw / c.bh;
      if (ar < 0.42 || ar > 2.4) continue;
      if (c.fill < 0.55) continue;
      res.push(c);
    }
    return res;
  }

  /** 把 4 点整理为 TL,TR,BR,BL 的**索引顺序**（x+y 最小/最大定对角，其余按 y-x）。 */
  function orderQuadIdx(pts) {
    var tl = 0, br = 0, i;
    var sMin = pts[0][0] + pts[0][1], sMax = sMin;
    for (i = 1; i < 4; i++) {
      var s = pts[i][0] + pts[i][1];
      if (s < sMin) { sMin = s; tl = i; }
      if (s > sMax) { sMax = s; br = i; }
    }
    var rest = [];
    for (i = 0; i < 4; i++) if (i !== tl && i !== br) rest.push(i);
    var d0 = pts[rest[0]][1] - pts[rest[0]][0];
    var d1 = pts[rest[1]][1] - pts[rest[1]][0];
    var tr = d0 < d1 ? rest[0] : rest[1];
    var bl = d0 < d1 ? rest[1] : rest[0];
    return [tl, tr, br, bl];
  }

  /** 把 4 点按 TL,TR,BR,BL 重排（返回点数组）。 */
  function orderQuad(pts) {
    var o = orderQuadIdx(pts);
    return [pts[o[0]], pts[o[1]], pts[o[2]], pts[o[3]]];
  }

  function polyArea(q) {
    var s = 0;
    for (var i = 0; i < 4; i++) {
      var j = (i + 1) & 3;
      s += q[i][0] * q[j][1] - q[j][0] * q[i][1];
    }
    return Math.abs(s) / 2;
  }

  function isConvex(q) {
    var sign = 0;
    for (var i = 0; i < 4; i++) {
      var a = q[i], b = q[(i + 1) & 3], c = q[(i + 2) & 3];
      var cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (Math.abs(cr) < 1e-9) continue;
      var s = cr > 0 ? 1 : -1;
      if (sign === 0) sign = s; else if (s !== sign) return false;
    }
    return true;
  }

  function dist(a, b) { return Math.sqrt((a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1])); }

  /**
   * 从候选中挑出最像“页面四角”的 4 个：枚举组合，
   * 评分 = 四边形面积 × 长宽比符合度 × 凸性/对边平行度 × 候选面积一致性。
   */
  function pickQuad(cands, gw, gh, expectAspect, warn) {
    if (!cands || cands.length < 4) {
      if (warn) warn.push('候选标记不足 4 个（实际 ' + (cands ? cands.length : 0) + '）');
      return null;
    }
    var pool = cands, i, j, k, l;
    var MAXP = 40;
    if (pool.length > MAXP) {
      var cx0 = gw / 2, cy0 = gh / 2;
      var scored = pool.map(function (c) {
        var dx = (c.cx - cx0) / (gw / 2), dy = (c.cy - cy0) / (gh / 2);
        return { c: c, s: Math.log(c.area + 1) + 0.9 * Math.sqrt(dx * dx + dy * dy) };
      });
      scored.sort(function (a, b) { return b.s - a.s; });
      pool = scored.slice(0, MAXP).map(function (o) { return o.c; });
    }
    var best = null, bestScore = -1, bestIds = null, bestPerm = null;
    var n = pool.length;
    var q4 = [[0, 0], [0, 0], [0, 0], [0, 0]];
    var pts4 = [[0, 0], [0, 0], [0, 0], [0, 0]];
    for (i = 0; i < n - 3; i++) {
      for (j = i + 1; j < n - 2; j++) {
        for (k = j + 1; k < n - 1; k++) {
          for (l = k + 1; l < n; l++) {
            var c0 = pool[i], c1 = pool[j], c2 = pool[k], c3 = pool[l];
            pts4[0][0] = q4[0][0] = c0.cx; pts4[0][1] = q4[0][1] = c0.cy;
            pts4[1][0] = q4[1][0] = c1.cx; pts4[1][1] = q4[1][1] = c1.cy;
            pts4[2][0] = q4[2][0] = c2.cx; pts4[2][1] = q4[2][1] = c2.cy;
            pts4[3][0] = q4[3][0] = c3.cx; pts4[3][1] = q4[3][1] = c3.cy;
            var oi = orderQuadIdx([[q4[0][0], q4[0][1]], [q4[1][0], q4[1][1]],
                                   [q4[2][0], q4[2][1]], [q4[3][0], q4[3][1]]]);
            var q = [pts4[oi[0]], pts4[oi[1]], pts4[oi[2]], pts4[oi[3]]];
            if (!isConvex(q)) continue;
            var area = polyArea(q);
            if (area < gw * gh * 0.01) continue;
            var wTop = dist(q[0], q[1]), wBot = dist(q[3], q[2]);
            var hL = dist(q[0], q[3]), hR = dist(q[1], q[2]);
            var w = (wTop + wBot) / 2, h = (hL + hR) / 2;
            if (w < 1 || h < 1) continue;
            var lr = Math.log((w / h) / expectAspect);
            if (Math.abs(lr) > Math.log(1.5)) continue;
            var sidePen = 1 - 0.55 * (Math.abs(wTop - wBot) / (w + 1e-6) +
                                      Math.abs(hL - hR) / (h + 1e-6));
            // 4 个候选块的面积应彼此接近（同一 markerSize）
            var la = [Math.log(c0.area + 1), Math.log(c1.area + 1), Math.log(c2.area + 1), Math.log(c3.area + 1)];
            var lm = (la[0] + la[1] + la[2] + la[3]) / 4;
            var dv = (Math.abs(la[0] - lm) + Math.abs(la[1] - lm) + Math.abs(la[2] - lm) + Math.abs(la[3] - lm)) / 4;
            var areaSim = Math.exp(-3.2 * dv);
            var fillAvg = (c0.fill + c1.fill + c2.fill + c3.fill) / 4;
            var score = area * Math.exp(-4 * lr * lr) * clamp(sidePen, 0.1, 1) * areaSim
                      * (0.7 + 0.3 * Math.min(1, fillAvg));
            if (score > bestScore) {
              bestScore = score;
              best = { quad: [[q[0][0], q[0][1]], [q[1][0], q[1][1]],
                              [q[2][0], q[2][1]], [q[3][0], q[3][1]]],
                       area: area, aspect: w / h };
              bestIds = [pool[i], pool[j], pool[k], pool[l]];
              bestPerm = oi;
            }
          }
        }
      }
    }
    if (!best) {
      if (warn) warn.push('未找到符合“页面四角”几何关系的 4 个标记组合');
      return null;
    }
    // 候选按 TL,TR,BR,BL 顺序输出（与 best.quad 一致）
    best.ids = [bestIds[bestPerm[0]], bestIds[bestPerm[1]], bestIds[bestPerm[2]], bestIds[bestPerm[3]]];
    best.score = bestScore;
    return best;
  }

  /** 在掩膜上对候选中心做局部质心细化（亚像素）。 */
  function refineCenter(mask, gw, gh, c, radius) {
    var x0 = Math.max(0, Math.round(c.cx - radius)), x1 = Math.min(gw - 1, Math.round(c.cx + radius));
    var y0 = Math.max(0, Math.round(c.cy - radius)), y1 = Math.min(gh - 1, Math.round(c.cy + radius));
    var sx = 0, sy = 0, s = 0, r2 = radius * radius;
    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        if (mask[y * gw + x] === 0) continue;
        var dx = x - c.cx, dy = y - c.cy;
        if (dx * dx + dy * dy > r2) continue;
        sx += x; sy += y; s++;
      }
    }
    if (s < 6) return { cx: c.cx, cy: c.cy };
    return { cx: sx / s, cy: sy / s };
  }

  /* ========================== 气泡采样 ========================== */

  /** 单位圆内均匀网格点（u,v ∈ [-1,1]，含 dist2）。 */
  function buildSampleGrid(N) {
    var pts = [];
    var step = 2 / (N - 1);
    for (var iy = 0; iy < N; iy++) {
      var v = -1 + iy * step;
      for (var ix = 0; ix < N; ix++) {
        var u = -1 + ix * step;
        var d2 = u * u + v * v;
        if (d2 > 1.0001) continue;
        pts.push([u, v, d2]);
      }
    }
    return pts;
  }

  /* ============================ 主流程 ============================ */

  function detect(src, layout, opts) {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    opts = opts || {};
    var debug = !!opts.debug;
    var warnings = [];
    var out = {
      ok: false, markers: null, rectified: null, tokens: {},
      warnings: warnings, debug: null, threshold: null, timeMs: 0
    };
    function done() {
      out.timeMs = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - t0;
      return out;
    }

    try {
      if (!layout || !layout.markers || layout.markers.length !== 4) {
        warnings.push('layout.markers 必须提供 4 个点（TL,TR,BR,BL）');
        return done();
      }

      /* ---- 1. 读图 + 灰度降采样 ---- */
      var px = readPixels(src);
      var iw = px.width, ih = px.height;
      var maxDim = opts.maxDim || 1400;
      var longSide = Math.max(iw, ih);
      var ds = Math.min(1, maxDim / longSide);
      var gw = Math.max(16, Math.round(iw * ds)), gh = Math.max(16, Math.round(ih * ds));
      var g = grayDownsample(px, iw, ih, gw, gh);
      var sx = gw / iw, sy = gh / ih;                    // 原图像素 -> 降采样像素

      /* ---- 2. 自适应二值化（多尺度） ---- */
      var mind = Math.min(gw, gh);
      var mkArr = layout.markers;
      var mwMm = Math.abs(((mkArr[1].x + mkArr[2].x) / 2) - ((mkArr[0].x + mkArr[3].x) / 2));
      var mhMm = Math.abs(((mkArr[3].y + mkArr[2].y) / 2) - ((mkArr[0].y + mkArr[1].y) / 2));
      // 估计定位标记在降采样图中的边长（假设页面大致占满画面，这是上界估计）
      var markerPx = Math.max(3, (layout.markerSize || 8) * Math.min(gw / Math.max(1, mwMm),
                                                                     gh / Math.max(1, mhMm)));
      var radii = [
        Math.max(5, Math.round(Math.min(0.010 * mind, 0.5 * markerPx))),
        Math.max(8, Math.round(0.022 * mind)),
        Math.max(12, Math.round(0.045 * mind)),
        Math.max(16, Math.round(Math.min(0.085 * mind, 1.35 * markerPx)))
      ];
      radii.sort(function (a, b) { return a - b; });
      var uniq = [radii[0]];
      for (var rr = 1; rr < radii.length; rr++) if (radii[rr] > uniq[uniq.length - 1] * 1.25) uniq.push(radii[rr]);
      var winR = uniq[uniq.length - 1];
      var k = opts.k || 0.25, floorNoise = opts.floor || 10, capOff = opts.cap || 70;
      var am = adaptiveMask(g, gw, gh, uniq, k, floorNoise, capOff);
      var mask = am.mask, ii = am.ii;

      /* ---- 3. 连通域 + 候选筛选 ---- */
      var allCC = connectedComponents(mask, gw, gh);
      var cands = candidateFilter(allCC, gw, gh);

      /* ---- 4. 四角四边形挑选 ---- */
      var mk = layout.markers;
      var mw = Math.abs(((mk[1].x + mk[2].x) / 2) - ((mk[0].x + mk[3].x) / 2));
      var mh = Math.abs(((mk[3].y + mk[2].y) / 2) - ((mk[0].y + mk[1].y) / 2));
      var expectAspect = (mw > 0 && mh > 0) ? (mw / mh) : (layout.pageW / layout.pageH);
      var quad = pickQuad(cands, gw, gh, expectAspect, warnings);
      if (!quad) {
        warnings.push('标记检测失败：暗色候选块 ' + cands.length + ' 个，无法构成合理四边形');
        return done();
      }

      /* ---- 5. 亚像素细化 + 换算回原图连续像素坐标 ---- */
      var mr = Math.max(3, Math.round(Math.sqrt(quad.area) * 0.02 + 3));
      var mIds = quad.ids, refined = [];
      for (var q = 0; q < 4; q++) {
        var rc = refineCenter(mask, gw, gh, mIds[q], mr);
        refined.push([(rc.cx + 0.5) / sx, (rc.cy + 0.5) / sy]);
      }
      out.markers = refined;
      out.markerBox = quad.quad;

      /* ---- 6. 单应：原图像素  <->  页面 mm ---- */
      var H = solveH(refined, [[mk[0].x, mk[0].y], [mk[1].x, mk[1].y],
                               [mk[2].x, mk[2].y], [mk[3].x, mk[3].y]]);
      if (!H) { warnings.push('单应矩阵求解失败（4 点退化）'); return done(); }
      var Hinv = invertH(H);
      if (!Hinv) { warnings.push('单应矩阵不可逆'); return done(); }
      out.H = H; out.Hinv = Hinv;

      /* 页面 mm -> 降采样图连续坐标 */
      function mmToDs(mx, my) {
        var w3 = Hinv[6] * mx + Hinv[7] * my + Hinv[8];
        if (Math.abs(w3) < 1e-12) w3 = 1e-12;
        return { x: ((Hinv[0] * mx + Hinv[1] * my + Hinv[2]) / w3) * sx,
                 y: ((Hinv[3] * mx + Hinv[4] * my + Hinv[5]) / w3) * sy };
      }

      /* ---- 7. 气泡采样 ---- */
      var sampleScale = opts.sampleScale || 0.66;   // 采样椭圆 = 气泡尺寸的 66%
      var N = opts.grid || 9;
      var grid = buildSampleGrid(N);
      var bubbles = layout.bubbles || [];
      var byId = {}, allRatios = [], outOfBounds = 0;

      for (var bi = 0; bi < bubbles.length; bi++) {
        var b = bubbles[bi];
        var rx = 0.5 * (b.w || 5) * sampleScale, ry = 0.5 * (b.h || b.w || 5) * sampleScale;
        var c0 = mmToDs(b.x, b.y);
        // 局部尺度（降采样像素 / mm），用于背景环半径
        var ex = mmToDs(b.x + 1, b.y), ey = mmToDs(b.x, b.y + 1);
        var pxmm = Math.max(0.2, Math.sqrt((ex.x - c0.x) * (ex.x - c0.x) + (ex.y - c0.y) * (ex.y - c0.y)));
        var pymm = Math.max(0.2, Math.sqrt((ey.x - c0.x) * (ey.x - c0.x) + (ey.y - c0.y) * (ey.y - c0.y)));

        var dark1 = 0, dark2 = 0, tot = 0, sumGray = 0;
        // 沿 45° 对角方向（气泡排布为水平/垂直阵列，对角背景最干净）取背景环样本
        var bgSamples = [];
        var BG_R = opts.bgRadius || 1.75;
        var bfr = rx * BG_R / Math.SQRT2, bfy = ry * BG_R / Math.SQRT2;
        var diag = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
        for (var dq = 0; dq < 4; dq++) {
          for (var mul = 0.60; mul <= 1.01; mul += 0.13) {
            var P2 = mmToDs(b.x + diag[dq][0] * bfr * mul, b.y + diag[dq][1] * bfy * mul);
            var xj = Math.floor(P2.x), yj = Math.floor(P2.y);
            if (xj >= 0 && yj >= 0 && xj < gw && yj < gh) bgSamples.push(g[yj * gw + xj]);
          }
        }
        for (var gi = 0; gi < grid.length; gi++) {
          var ux = b.x + grid[gi][0] * rx, uy = b.y + grid[gi][1] * ry;
          var P = mmToDs(ux, uy);
          var xi = Math.floor(P.x), yi = Math.floor(P.y);
          if (xi < 0 || yi < 0 || xi >= gw || yi >= gh) continue;
          var gv = g[yi * gw + xi];
          tot++; sumGray += gv;
          if (mask[yi * gw + xi] !== 0) dark1++;
        }
        var bg;
        if (bgSamples.length >= 4) bg = medianOf(bgSamples);          // 中位数抗离群（笔迹/邻泡）
        else bg = (tot > 0) ? boxMean(ii, gw, gh, Math.round(c0.x), Math.round(c0.y),
                                       Math.max(2, Math.round(2.5 * (pxmm + pymm) / 2))) : 255;
        // 第二信号：局部（相对背景）阈值 —— 抗光照梯度的“变暗占比”
        var thr2 = bg - Math.max(opts.relFloor || 16, (opts.relK || 0.32) * bg);
        if (tot > 0) {
          for (var gj = 0; gj < grid.length; gj++) {
            var ux2 = b.x + grid[gj][0] * rx, uy2 = b.y + grid[gj][1] * ry;
            var P3 = mmToDs(ux2, uy2);
            var xk = Math.floor(P3.x), yk = Math.floor(P3.y);
            if (xk < 0 || yk < 0 || xk >= gw || yk >= gh) continue;
            if (g[yk * gw + xk] < thr2) dark2++;
          }
        }
        var r1 = tot > 0 ? dark1 / tot : 0;
        var r2 = tot > 0 ? dark2 / tot : 0;
        var ratio = tot > 0 ? 0.5 * (r1 + r2) : 0;
        var grayMean = tot > 0 ? sumGray / tot : 255;
        if (tot < 8) { outOfBounds++; }

        byId[b.id] = {
          id: b.id, ratio: ratio, r1: r1, r2: r2,
          gray: grayMean, bg: bg, points: tot,
          filled: false, confidence: 0.5, cls: 'empty',
          group: b.group || null, idx: bi
        };
        if (tot >= 8) allRatios.push(ratio);
      }
      if (outOfBounds) warnings.push(outOfBounds + ' 个气泡采样点不足（卡片可能被裁切或标记误检）');
      if (allRatios.length < 4) warnings.push('有效气泡样本过少（' + allRatios.length + '）');

      /* ---- 8. 自适应判定阈值 ---- */
      var med = medianOf(allRatios);
      var madv = madOf(allRatios, med);
      var thr = med + Math.max(0.16, Math.min(0.34, 3.0 * madv));
      // 最大间隙法（当涂/未涂两簇分离明显时优先）
      var sorted = allRatios.slice().sort(function (a, b) { return a - b; });
      var gapThr = null, gapBest = 0;
      for (var si = 0; si + 1 < sorted.length; si++) {
        var gp = sorted[si + 1] - sorted[si];
        if (gp > gapBest) { gapBest = gp; gapThr = (sorted[si] + sorted[si + 1]) / 2; }
      }
      if (gapThr !== null && gapBest >= 0.22 && gapThr > 0.18 && gapThr < 0.85 && gapThr > med + 0.06) {
        thr = gapThr;
      }
      thr = clamp(thr, 0.14, 0.72);
      if (opts.threshold !== undefined && opts.threshold !== null) thr = opts.threshold;

      var loArr = [], hiArr = [];
      for (var qi = 0; qi < sorted.length; qi++) (sorted[qi] < thr ? loArr : hiArr).push(sorted[qi]);
      var loC = loArr.length ? meanOf(loArr) : Math.max(0, thr - 0.32);
      var hiC = hiArr.length ? meanOf(hiArr) : Math.min(1, thr + 0.32);
      var halfBand = Math.max(0.10, Math.min(0.42, (hiC - loC) / 2));
      if (!(hiC > loC)) { loC = thr - 0.30; hiC = thr + 0.30; }

      /* ---- 9. tokens ---- */
      var tokens = {}, ids = Object.keys(byId);
      for (var ti = 0; ti < ids.length; ti++) {
        var id = ids[ti], t = byId[id];
        t.filled = t.ratio >= thr;
        var dAbs = Math.abs(t.ratio - thr);
        var conf = clamp(0.5 + 0.5 * Math.min(1, dAbs / halfBand), 0, 1);
        if (t.points < 8) conf = Math.min(conf, 0.15);
        t.confidence = clamp(conf, 0, 1);
        t.cls = t.filled ? (t.confidence < 0.66 ? 'uncertain' : 'filled')
                         : (t.confidence < 0.66 ? 'uncertain' : 'empty');
        tokens[id] = { filled: t.filled, confidence: t.confidence, ratio: t.ratio };
      }

      /* ---- 10. 同组单选校验 ---- */
      var groups = {};
      for (var g2 = 0; g2 < bubbles.length; g2++) {
        var bb = bubbles[g2];
        if (!bb.group) continue;
        (groups[bb.group] || (groups[bb.group] = [])).push(bb.id);
      }
      var multi = 0, emptyGroups = 0;
      for (var gk in groups) {
        if (!groups.hasOwnProperty(gk)) continue;
        var list = groups[gk], cntF = 0, idF = [];
        for (var li = 0; li < list.length; li++) {
          if (tokens[list[li]] && tokens[list[li]].filled) { cntF++; idF.push(list[li]); }
        }
        if (cntF > 1) {
          multi++;
          for (var mi = 0; mi < idF.length; mi++) {
            tokens[idF[mi]].confidence = clamp(tokens[idF[mi]].confidence * 0.5, 0, 1);
            byId[idF[mi]].cls = 'uncertain';
          }
        } else if (cntF === 0) emptyGroups++;
      }
      if (multi) warnings.push(multi + ' 个题组出现多选（置信度已下调，需人工复核）');
      if (emptyGroups) warnings.push(emptyGroups + ' 个题组未检测到涂填');

      out.tokens = tokens;
      out.threshold = thr;

      /* ---- 11. debug 信息 / 校正图 ---- */
      if (debug) {
        out.debug = {
          iw: iw, ih: ih, gw: gw, gh: gh, winR: winR, radii: uniq, markerPx: markerPx,
          maxDim: maxDim, sampleScale: sampleScale, grid: N,
          threshold: thr, median: med, mad: madv,
          gapBest: gapBest, gapThr: gapThr,
          loCenter: loC, hiCenter: hiC, halfBand: halfBand,
          candidateCount: cands.length, componentCount: allCC.length,
          candidates: cands.slice(0, 60).map(function (c) {
            return { x: fmt(c.cx, 1), y: fmt(c.cy, 1), area: c.area,
                     fill: fmt(c.fill, 2), bw: c.bw, bh: c.bh };
          }),
          tokensDetail: byId
        };
        out.rectified = buildRectified(g, gw, gh, Hinv, sx, sy, layout, opts);
      }
      out.ok = true;
      return done();
    } catch (e) {
      warnings.push('OMR 内部错误: ' + (e && e.message ? e.message : String(e)));
      return done();
    }

            '" fillId="' +
            x.fill +

        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        '</Types>';

      var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
      rootRels += '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
      rootRels +=
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>';

      var wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
      wb +=
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
        ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
      wb += '<workbookPr/><bookViews><workbookView/></bookViews><sheets>';
      for (si = 0; si < sheetCount; si++) {
        wb +=
          '<sheet name="' +
          esc(sheetNames[si]) +
          '" sheetId="' +
          (si + 1) +
          '" r:id="rId' +
          (si + 1) +
          '"/>';
      }
      wb += '</sheets></workbook>';

      var wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
      wbRels += '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
      for (si = 0; si < sheetCount; si++) {
        wbRels +=
          '<Relationship Id="rId' +
          (si + 1) +
          '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' +
          (si + 1) +
          '.xml"/>';
      }
      wbRels +=
        '<Relationship Id="rId' +
        (sheetCount + 1) +
        '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>';

      var zipFiles = [
        { name: '[Content_Types].xml', data: enc(contentTypes) },
        { name: '_rels/.rels', data: enc(rootRels) },
        { name: 'xl/workbook.xml', data: enc(wb) },
        { name: 'xl/_rels/workbook.xml.rels', data: enc(wbRels) },
      ];
      for (var pi = 0; pi < files.length; pi++) zipFiles.push(files[pi]);
      zipFiles.push({ name: 'xl/styles.xml', data: enc(styles.xml()) });

      return buildZip(zipFiles);
    }

    function write(sheets, opts) {
      var u8 = writeBytes(sheets, opts);
      // 保证返回的 ArrayBuffer 恰好等长
      return u8.buffer.byteLength === u8.length && u8.byteOffset === 0
        ? u8.buffer
        : u8.slice().buffer;
    }

    /* =====================================================================
     * 12. 下载（浏览器）
     * ===================================================================== */
    function download(filename, sheets, opts) {
      var buf = write(sheets, opts);
      if (typeof document !== 'undefined' && typeof Blob !== 'undefined') {
        var blob = new Blob([buf], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename || 'export.xlsx';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 0);
        return buf;
      }
      throw new Error('download: 当前环境没有 document（请在浏览器中使用，或直接用 write 取字节）');
    }

    /* =====================================================================
     * 13. 读 XLSX
     * ===================================================================== */
    function parseSharedStrings(xmlText) {
      var out = [];
      if (!xmlText) return out;
      var root = parseXml(xmlText);
      var sst = root.name === 'sst' ? root : firstChild(root, 'sst') || root;
      var sis = childList(sst, 'si');
      for (var i = 0; i < sis.length; i++) out.push(inlineText(sis[i]));
      return out;
    }

    function parseSheetRows(xmlText, shared) {
      var root = parseXml(xmlText);
      var sd = firstChild(root, 'sheetData');
      var rows = [];
      var merges = [];
      if (!sd) return { rows: rows, merges: merges };

      var rowEls = childList(sd, 'row');
      for (var ri = 0; ri < rowEls.length; ri++) {
        var rowEl = rowEls[ri];
        var rowIdx = ri;
        if (rowEl.attrs.r !== undefined) {
          var rn = parseInt(rowEl.attrs.r, 10);
          if (isFinite(rn) && rn > 0) rowIdx = rn - 1;
        }
        while (rows.length < rowIdx) rows.push([]);
        var arr = [];
        var cellEls = childList(rowEl, 'c');
        for (var ci = 0; ci < cellEls.length; ci++) {
          var cEl = cellEls[ci];
          var col = ci;
          if (cEl.attrs.r) {
            var letters = String(cEl.attrs.r).replace(/[^A-Za-z]/g, '');
            if (letters) col = colIndex(letters);
          }
          var tv = cEl.attrs.t || '';
          var vEl = firstChild(cEl, 'v');
          var val = null;

          if (tv === 's') {
            var idx = vEl ? parseInt(vEl.text, 10) : NaN;
            val = isFinite(idx) && shared && shared[idx] !== undefined ? shared[idx] : null;
          } else if (tv === 'inlineStr') {
            var isEl = firstChild(cEl, 'is');
            val = isEl ? inlineText(isEl) : '';
          } else if (tv === 'b') {
            val = vEl ? vEl.text.trim() === '1' || vEl.text.trim().toLowerCase() === 'true' : false;
          } else if (tv === 'str') {
            val = vEl ? vEl.text : '';
          } else if (tv === 'e') {
            val = vEl ? vEl.text : '#ERR';
          } else if (tv === 'd') {
            val = vEl ? vEl.text : null; // ISO 日期字符串，原样返回
          } else {
            // 数字（或 t="n"）
            if (vEl && vEl.text !== '') {
              var num = Number(vEl.text.trim());
              val = isFinite(num) ? num : vEl.text;
            } else if (!vEl) {
              // 无 v：可能是公式字符串结果或空
              val = null;
            } else {
              val = null;
            }
          }
          if (val === '') val = ''; // 空内联字符串保持 ''
          while (arr.length < col) arr.push(null);
          arr[col] = val;
        }
        rows[rowIdx] = arr;
      }

      var mc = firstChild(root, 'mergeCells');
      if (mc) {
        var mcs = childList(mc, 'mergeCell');
        for (var mi = 0; mi < mcs.length; mi++) {
          var ref = mcs[mi].attrs.ref;
          if (!ref) continue;
          var mm = /^([A-Za-z]+)(\d+):([A-Za-z]+)(\d+)$/.exec(ref);
          if (mm)
            merges.push([
              parseInt(mm[2], 10) - 1,
              colIndex(mm[1]),
              parseInt(mm[4], 10) - 1,
              colIndex(mm[3]),
            ]);
        }
      }
      return { rows: rows, merges: merges };
    }

    function read(buf) {
      var u8 = toU8(buf);
      var zip = readZipEntries(u8);
      var entries = zip.entries;
      var names = zip.order;

      function find(name) {
        if (entries[name]) return entries[name];
        var lower = name.toLowerCase();
        for (var i = 0; i < names.length; i++)
          if (names[i].toLowerCase() === lower) return entries[names[i]];
        return null;
      }

      var wbBytes = find('xl/workbook.xml');
      if (!wbBytes) throw new Error('read: 不是有效的 XLSX（缺少 xl/workbook.xml）');
      var wbRoot = parseXml(utf8Decode(wbBytes, 0, wbBytes.length));
      var sheetsEl = firstChild(wbRoot, 'sheets');
      if (!sheetsEl) throw new Error('read: workbook.xml 里没有 <sheets>');

      // rId -> target
      var rels = Object.create(null);
      var relBytes = find('xl/_rels/workbook.xml.rels');
      if (relBytes) {
        var relRoot = parseXml(utf8Decode(relBytes, 0, relBytes.length));
        var relEls = childList(relRoot, 'Relationship');
        for (var i = 0; i < relEls.length; i++) {
          var target = relEls[i].attrs.Target || relEls[i].attrs.target || '';
          rels[relEls[i].attrs.Id || relEls[i].attrs.id || ''] = target;
        }
      }

      var ssBytes = find('xl/sharedStrings.xml');
      var shared = ssBytes ? parseSharedStrings(utf8Decode(ssBytes, 0, ssBytes.length)) : [];

      var out = [];
      var sheetEls = childList(sheetsEl, 'sheet');
      for (var si = 0; si < sheetEls.length; si++) {
        var el = sheetEls[si];
        var name = el.attrs.name || 'Sheet' + (si + 1);
        var rid = el.attrs.id || el.attrs['r:id'] || '';
        var path = rels[rid] ? String(rels[rid]) : 'worksheets/sheet' + (si + 1) + '.xml';
        path = path.replace(/^\/+/, '').replace(/\\/g, '/');
        if (path.indexOf('xl/') !== 0) path = 'xl/' + path;
        var data = find(path);
        if (!data) data = find('xl/worksheets/sheet' + (si + 1) + '.xml');
        if (!data) {
          out.push({ name: name, rows: [], merges: [] });
          continue;
        }
        var parsed = parseSheetRows(utf8Decode(data, 0, data.length), shared);
        out.push({ name: name, rows: parsed.rows, merges: parsed.merges });
      }
      return out;
    }

    return {
      version: '1.0.0',
      write: write,
      writeBytes: writeBytes,
      download: download,
      read: read,
      // 供测试使用的内部函数
      _crc32: crc32,
      _inflateRaw: inflateRaw,
      _colName: colName,
      _buildZip: buildZip,
      _parseXml: parseXml,
      _readZipEntries: readZipEntries,
      _utf8Decode: utf8Decode,
      _utf8Encode: utf8Encode,
    };
  }
);

</script>

<script>
/*!
 * 化学学情诊断平台 · 存储层
 * 作者：黎伟成
 *
 * 设计说明（重要）：
 * 本平台是「纯静态网页」，没有服务器。所有数据都存在**用户自己的浏览器**里：
 *   - 小数据（激活状态、公告、班级名单、设置）→ localStorage，同步读写
 *   - 大数据（答题记录、题库）→ IndexedDB，容量大且是异步的
 * 因此：
 *   1. 换电脑 / 换浏览器 / 清缓存 → 数据会丢。平台提供「导出全部数据 / 导入备份」来对抗这一点。
 *   2. 老师端的成绩数据**不上传到任何服务器**，学生扫码看到的是**数据写在二维码里**，
 *      而不是去服务器取——这正是没有后端也能让学生看报告的原因。
 */
(function (root) {
  'use strict';

  var LS_KEY = 'chemdx.v1';
  var DB_NAME = 'chemdx';
  var DB_VER = 1;

  var STORES = ['students', 'papers', 'sessions', 'records', 'banks', 'files'];

  /* ============================ localStorage 小数据 ============================ */
  var mem = null;

  function loadLS() {
    if (mem) return mem;
    var raw = null;
    try { raw = root.localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
    if (raw) {
      try { mem = JSON.parse(raw); } catch (e) { mem = null; }
    }
    if (!mem || typeof mem !== 'object') {
      mem = { license: null, notices: [], classes: [], settings: {}, meta: {} };
    }
    if (!mem.notices) mem.notices = [];
    if (!mem.classes) mem.classes = [];
    if (!mem.settings) mem.settings = {};
    if (!mem.meta) mem.meta = {};
    return mem;
  }

  function saveLS() {
    try {
      root.localStorage.setItem(LS_KEY, JSON.stringify(loadLS()));
      return true;
    } catch (e) {
      /* 配额满或隐私模式 */
      return false;
    }
  }

  var S = {
    /** 读取整个配置对象（只读用） */
    config: function () { return loadLS(); },

    get: function (key, dflt) {
      var m = loadLS();
      return m[key] === undefined ? dflt : m[key];
    },
    set: function (key, val) {
      var m = loadLS();
      m[key] = val;
      return saveLS();
    },
    getSetting: function (k, dflt) {
      var m = loadLS();
      return m.settings[k] === undefined ? dflt : m.settings[k];
    },
    setSetting: function (k, v) {
      var m = loadLS();
      m.settings[k] = v;
      return saveLS();
    },

    /** 激活码：{code, info, activatedAt} */
    getLicense: function () { return loadLS().license; },
    setLicense: function (lic) {
      var m = loadLS();
      m.license = lic;
      return saveLS();
    },
    clearLicense: function () {
      var m = loadLS();
      m.license = null;
      return saveLS();
    },

    /** 管理员密码：只存 PBKDF2 派生结果，不存明文 */
    getAdmin: function () { return loadLS().meta.admin || null; },
    setAdmin: function (rec) {
      var m = loadLS();
      m.meta.admin = rec;
      return saveLS();
    },

    /** 不希望云端/共享的本地标记 */
    flag: function (k, v) {
      var m = loadLS();
      m.meta[k] = v;
      return saveLS();
    },
    getFlag: function (k, dflt) {
      var m = loadLS();
      return m.meta[k] === undefined ? dflt : m.meta[k];
    },

    /* ---------------- 公告 ---------------- */
    notices: function () { return loadLS().notices.slice(); },
    addNotice: function (n) {
      var m = loadLS();
      n.id = n.id || ('n' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36));
      n.createdAt = n.createdAt || Date.now();
      m.notices.unshift(n);
      saveLS();
      return n;
    },
    updateNotice: function (id, patch) {
      var m = loadLS();
      for (var i = 0; i < m.notices.length; i++) {
        if (m.notices[i].id === id) {
          Object.keys(patch).forEach(function (k) { m.notices[i][k] = patch[k]; });
          saveLS();
          return m.notices[i];
        }
      }
      return null;
    },
    removeNotice: function (id) {
      var m = loadLS();
      m.notices = m.notices.filter(function (n) { return n.id !== id; });
      saveLS();
    },
    /** 当前对学生可见的公告（未过期） */
    activeNotices: function () {
      var now = Date.now();
      return loadLS().notices.filter(function (n) {
        if (n.hidden) return false;
        if (n.until && now > n.until) return false;
        return true;
      });
    },

    /* ---------------- 班级 ---------------- */
    classes: function () { return loadLS().classes.slice(); },
    getClass: function (id) {
      return loadLS().classes.filter(function (c) { return c.id === id; })[0] || null;
    },
    saveClass: function (cls) {
      var m = loadLS();
      if (!cls.id) cls.id = 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
      var found = false;
      for (var i = 0; i < m.classes.length; i++) {
        if (m.classes[i].id === cls.id) { m.classes[i] = cls; found = true; break; }
      }
      if (!found) m.classes.push(cls);
      saveLS();
      return cls;
    },
    removeClass: function (id) {
      var m = loadLS();
      m.classes = m.classes.filter(function (c) { return c.id !== id; });
      saveLS();
    },

    /* ---------------- 全局导出/导入（备份） ---------------- */
    exportConfig: function () { return JSON.parse(JSON.stringify(loadLS())); },
    importConfig: function (obj, opts) {
      opts = opts || {};
      if (!obj || typeof obj !== 'object') throw new Error('备份内容不是有效的对象');
      var m = loadLS();
      if (opts.merge) {
        if (obj.notices) obj.notices.forEach(function (n) {
          if (!m.notices.some(function (x) { return x.id === n.id; })) m.notices.push(n);
        });
        if (obj.classes) obj.classes.forEach(function (c) {
          if (!m.classes.some(function (x) { return x.id === c.id; })) m.classes.push(c);
        });
      } else {
        mem = obj;
      }
      return saveLS();
    },

    /* ============================ IndexedDB 大数据 ============================ */
    _db: null,
    _dbReady: null,

    db: function () {
      if (S._dbReady) return S._dbReady;
      S._dbReady = new Promise(function (resolve, reject) {
        if (!root.indexedDB) { reject(new Error('此浏览器不支持本地数据库（IndexedDB）')); return; }
        var req = root.indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = function (e) {
          var db = e.target.result;
          STORES.forEach(function (name) {
            if (db.objectStoreNames.contains(name)) return;
            var os = db.createObjectStore(name, { keyPath: 'id' });
            if (name === 'records' || name === 'sessions') {
              try { os.createIndex('paperId', 'paperId', { unique: false }); } catch (x) {}
              try { os.createIndex('classId', 'classId', { unique: false }); } catch (x) {}
            }
            if (name === 'students') {
              try { os.createIndex('classId', 'classId', { unique: false }); } catch (x) {}
            }
          });
        };
        req.onsuccess = function () {
          S._db = req.result;
          S._db.onversionchange = function () { try { S._db.close(); } catch (e) {} };
          resolve(S._db);
        };
        req.onerror = function () { reject(new Error('打开本地数据库失败：' + (req.error && req.error.message))); };
      });
      return S._dbReady;
    },

    _tx: function (store, mode, fn) {
      return S.db().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(store, mode);
          var os = tx.objectStore(store);
          var out;
          try { out = fn(os); } catch (e) { reject(e); return; }
          tx.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
          tx.onerror = function () { reject(tx.error || new Error('数据库操作失败')); };
          tx.onabort = function () { reject(tx.error || new Error('数据库操作被中止')); };
        });
      });
    },

    /** 通用：放一条 */
    put: function (store, obj) {
      return S._tx(store, 'readwrite', function (os) { return os.put(obj); });
    },
    /** 通用：批量放（一个事务里） */
    putAll: function (store, arr) {
      if (!arr || !arr.length) return Promise.resolve(0);
      return S._tx(store, 'readwrite', function (os) {
        arr.forEach(function (o) { os.put(o); });
        return arr.length;
      });
    },
    get: function (store, id) {
      return S._tx(store, 'readonly', function (os) { return os.get(id); });
    },
    all: function (store) {
      return S._tx(store, 'readonly', function (os) { return os.getAll(); });
    },
    remove: function (store, id) {
      return S._tx(store, 'readwrite', function (os) { return os.delete(id); });
    },
    clear: function (store) {
      return S._tx(store, 'readwrite', function (os) { return os.clear(); });
    },
    count: function (store) {
      return S._tx(store, 'readonly', function (os) { return os.count(); });
    },

    /** 按索引取（如 students by classId） */
    byIndex: function (store, index, value) {
      return S._tx(store, 'readonly', function (os) {
        return os.index(index).getAll(value);
      });
    },

    /** 危险操作：清空全部本地数据 */
    wipe: function () {
      var p = S._dbReady ? S.db().then(function () {
        return Promise.all(STORES.map(function (s) { return S.clear(s); }));
      }) : Promise.resolve();
      return p.then(function () {
        try { root.localStorage.removeItem(LS_KEY); } catch (e) {}
        mem = null;
      });
    },

    STORES: STORES,
    LS_KEY: LS_KEY
  };

  root.Store = S;
  root.DB = S; /* 别名，方便调用 */
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<script>
/*!
 * 化学学情诊断平台 · 授权与门禁
 * 作者：黎伟成
 *
 * 【安全边界，必须如实告知用户】
 * 本平台是纯静态网页（GitHub Pages），没有服务器，因此：
 *   ✓ 能做到：激活码用 ECDSA P-256 私钥签名，别人**伪造不出**一个有效的码。
 *     没有私钥，改一个字符、自己编一串、把试用改成永久，全都会被签名校验挡掉。
 *   ✗ 做不到：把校验逻辑藏在浏览器里，懂技术的人打开开发者工具、改掉那段 JS
 *     就能绕过。这是所有「纯前端授权」的固有上限，不是本项目的实现缺陷。
 * 如果需要真正无法绕过的授权，必须配一台服务器做在线校验。
 *
 * 管理员密码同理：PBKDF2 + AES-GCM 加密存储，能挡住「翻 localStorage 看到明文」，
 * 但挡不住「改 JS 直接进管理页」。
 */
(function (root) {
  'use strict';

  var Lic = {};
  var PUBKEY = null; /* 由构建脚本注入 */

  Lic.setPublicKey = function (jwk) { PUBKEY = jwk; };
  Lic.getPublicKey = function () { return PUBKEY; };

  /* ---------------- 工具 ---------------- */
  function b64(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }
  function unb64(str) {
    var s = atob(String(str).replace(/-/g, '+').replace(/_/g, '/'));
    var b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  function u8(str) { return new TextEncoder().encode(str); }

  /* ---------------- 激活码校验 ---------------- */
  /**
   * 校验激活码，成功返回 {ok:true, info:{...}}
   * 依赖 License 模块的 verify（ECDSA P-256）
   */
  Lic.verify = function (code) {
    code = String(code || '').trim().replace(/\s+/g, '');
    if (!code) return Promise.resolve({ ok: false, reason: '请输入激活码' });
    if (!PUBKEY) return Promise.resolve({ ok: false, reason: '平台配置异常：缺少公钥' });
    if (!root.License || !root.License.verify) {
      return Promise.resolve({ ok: false, reason: '平台组件未加载完整，请刷新页面' });
    }
    return root.License.verify(code, PUBKEY).then(function (r) {
      if (!r.ok) return r;
      /* 附加：座位数/有效期判断 */
      var info = r.info;
      if (!info.perpetual && info.expires) {
        var ex = info.expires instanceof Date ? info.expires : new Date(info.expires);
        if (ex.getTime() < Date.now()) {
          return { ok: false, reason: '此激活码已于 ' + ex.toLocaleDateString('zh-CN') + ' 到期', info: info };
        }
      }
      return r;
    }).catch(function (e) {
      return { ok: false, reason: '校验出错：' + (e && e.message ? e.message : e) };
    });
  };

  /** 不验签的快速预览（只用来给用户看「你输入的是专业版」，不作为放行依据） */
  Lic.peek = function (code) {
    try {
      if (root.License && root.License.peek) return root.License.peek(code);
    } catch (e) {}
    return null;
  };

  /** 当前激活状态（读本地存储） */
  Lic.current = function () {
    var lic = root.Store.getLicense();
    if (!lic || !lic.code) return null;
    /* 每次读取都重新验签，防止有人直接改 localStorage 里的 info */
    var cached = lic.verifiedAt && (Date.now() - lic.verifiedAt < 6 * 3600 * 1000);
    if (cached && lic.info) {
      if (!lic.info.perpetual && lic.info.expires) {
        var ex = new Date(lic.info.expires);
        if (ex.getTime() < Date.now()) return null;
      }
      return lic;
    }
    return lic; /* 异步复验由 ensure() 完成 */
  };

  /**
   * 启动时调用：重新验签一次本地保存的激活码。
   * 返回 Promise<{ok, reason?, info?}>
   */
  Lic.ensure = function () {
    var lic = root.Store.getLicense();
    if (!lic || !lic.code) return Promise.resolve({ ok: false, reason: '未激活' });
    return Lic.verify(lic.code).then(function (r) {
      if (r.ok) {
        root.Store.setLicense({ code: lic.code, info: r.info, verifiedAt: Date.now() });
      } else {
        /* 验签失败：清掉，避免"改一下本地存储就变专业版" */
        root.Store.clearLicense();
      }
      return r;
    });
  };

  /** 激活：验签通过才写入 */
  Lic.activate = function (code) {
    return Lic.verify(code).then(function (r) {
      if (!r.ok) return r;
      root.Store.setLicense({
        code: String(code).trim().replace(/\s+/g, ''),
        info: r.info,
        verifiedAt: Date.now(),
        activatedAt: Date.now()
      });
      return r;
    });
  };

  /** 功能门禁：不同版本能做什么 */
  var FEATURES = {
    /* plan 1=试用 2=标准 3=专业 4=校园 */
    minPlan: {
      omr: 2,          /* 拍照识别答题卡 */
      batch: 2,        /* 批量导入 Excel */
      exportExcel: 2,  /* Excel 导出 */
      qrReport: 2,     /* 学生扫码报告 */
      classReport: 2,  /* 班级分析 */
      selfBank: 3,     /* 自己更新题库 */
      notices: 3,      /* 发布公告 */
      multiClass: 3    /* 多个班级 */
    }
  };

  Lic.info = function () {
    var lic = Lic.current();
    return lic ? lic.info : null;
  };

  Lic.plan = function () {
    var i = Lic.info();
    return i ? i.plan : 0;
  };

  /** 是否具备某功能。未激活一律 false */
  Lic.can = function (feature) {
    var need = FEATURES.minPlan[feature];
    if (need === undefined) need = 1;
    var p = Lic.plan();
    if (!p) return false;
    if (p === 4) return true; /* 校园版全开 */
    return p >= need;
  };

  Lic.seats = function () {
    var i = Lic.info();
    if (!i) return 0;
    return i.seats || 0;
  };

  Lic.remainingDays = function () {
    var i = Lic.info();
    if (!i) return 0;
    if (i.perpetual) return Infinity;
    if (!i.expires) return Infinity;
    var d = Math.ceil((new Date(i.expires).getTime() - Date.now()) / 86400000);
    return d > 0 ? d : 0;
  };

  Lic.FEATURES = FEATURES;

  /* ============================ 管理员密码 ============================ */
  var Admin = {};

  var PBKDF2_ITER = 120000;

  function derive(password, salt) {
    return crypto.subtle.importKey('raw', u8(password), 'PBKDF2', false, ['deriveKey', 'deriveBits'])
      .then(function (baseKey) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: salt, iterations: PBKDF2_ITER, hash: 'SHA-256' },
          baseKey, 256
        );
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }

  Admin.hasPassword = function () { return !!root.Store.getAdmin(); };

  Admin.setPassword = function (password) {
    if (!password || password.length < 6) {
      return Promise.reject(new Error('管理员密码至少 6 位'));
    }
    var salt = crypto.getRandomValues(new Uint8Array(16));
    return derive(password, salt).then(function (dk) {
      root.Store.setAdmin({
        salt: b64(salt),
        hash: b64(dk),
        iter: PBKDF2_ITER,
        createdAt: Date.now()
      });
      return true;
    });
  };

  Admin.check = function (password) {
    var rec = root.Store.getAdmin();
    if (!rec) return Promise.resolve(false);
    var salt = unb64(rec.salt);
    return derive(password, salt).then(function (dk) {
      var mine = b64(dk);
      /* 定长比较，避免时序泄漏（虽然这里意义不大，但没坏处） */
      if (mine.length !== rec.hash.length) return false;
      var diff = 0;
      for (var i = 0; i < mine.length; i++) diff |= mine.charCodeAt(i) ^ rec.hash.charCodeAt(i);
      return diff === 0;
    });
  };

  /** 管理员本次会话是否已登录（sessionStorage，关浏览器就失效） */
  var SESS_KEY = 'chemdx.admin.session';
  var SESS_TTL = 8 * 3600 * 1000; /* 8 小时 */

  Admin.isLoggedIn = function () {
    try {
      var raw = sessionStorage.getItem(SESS_KEY);
      if (!raw) return false;
      var o = JSON.parse(raw);
      if (!o || !o.at) return false;
      if (Date.now() - o.at > SESS_TTL) { sessionStorage.removeItem(SESS_KEY); return false; }
      return true;
    } catch (e) { return false; }
  };

  Admin.login = function (password) {
    return Admin.check(password).then(function (ok) {
      if (!ok) return false;
      try {
        sessionStorage.setItem(SESS_KEY, JSON.stringify({ at: Date.now() }));
      } catch (e) {}
      return true;
    });
  };

  Admin.logout = function () {
    try { sessionStorage.removeItem(SESS_KEY); } catch (e) {}
  };

  /* ============================ 老师的手机号 ============================
   * 学生自测模式退出时要确认「你是老师」，用哪个密码？
   *
   * 用管理员密码是错的：管理员密码是「平台后台」的钥匙，
   * 大部分老师根本不会去设它（他们只用答题卡、录成绩、出报告），
   * 结果就是老师自己退不出去，而学生从来不需要那个密码。
   *
   * 用手机号是对的：老师注册平台时就填了手机号，是手上一定有的东西，
   * 而且学生不知道老师手机号 —— 这就够了。这里要的不是「密码学安全」，
   * 而是「坐在电脑前的这个学生答不出来」。
   *
   * 【安全边界，如实说明】
   * 手机号只有 11 位数字，真要枚举是能破的。但攻击者得先能在这台电脑上
   * 写脚本、跑几千次校验 —— 有这能力的人本来就能改 JS 绕过整个前端。
   * 所以这把锁的定位是「挡住顺手乱点的学生」，不是「挡住黑客」。
   * 真要挡后者，得等后端上线用短信验证码。
   */
  var Teacher = {};

  Teacher.PHONE_KEY = 'teacherPhone';   /* meta 里的字段名，存哈希不存明文 */
  Teacher.SALT_KEY = 'teacherPhoneSalt';

  /** 只留数字，去掉空格、横线、+86 前缀 —— 老师抄号码时经常带这些 */
  Teacher.norm = function (s) {
    var d = String(s == null ? '' : s).replace(/\D/g, '');
    if (d.length === 13 && d.slice(0, 2) === '86') d = d.slice(2);
    if (d.length === 14 && d.slice(0, 3) === '086') d = d.slice(3);
    return d;
  };

  /** 中国大陆手机号：1 开头，第二位 3–9，共 11 位 */
  Teacher.valid = function (s) {
    return /^1[3-9]\d{9}$/.test(Teacher.norm(s));
  };

  /** 138****8888 —— 给老师回忆用，不泄露完整号码 */
  Teacher.mask = function (s) {
    var d = Teacher.norm(s);
    if (d.length !== 11) return '已登记的号码';
    return d.slice(0, 3) + '****' + d.slice(7);
  };

  Teacher.has = function () {
    var m = root.Store.config().meta || {};
    return !!(m[Teacher.PHONE_KEY] && m[Teacher.SALT_KEY]);
  };

  /** 登记/修改老师手机号。返回 Promise，失败时 reject 一个可读的中文原因。 */
  Teacher.set = function (phone) {
    var d = Teacher.norm(phone);
    if (!Teacher.valid(d)) {
      return Promise.reject(new Error('请填 11 位手机号，例如 13800138000'));
    }
    var salt = crypto.getRandomValues(new Uint8Array(16));
    return derive(d, salt).then(function (dk) {
      root.Store.flag(Teacher.SALT_KEY, b64(salt));
      root.Store.flag(Teacher.PHONE_KEY, b64(dk));
      root.Store.flag('teacherPhoneMask', Teacher.mask(d));
      /* 明文另存一份：一是老师忘了自己填哪个号时能直接显示，
         二是后端做真登录时要拿它去对账。纯前端版本不影响任何逻辑。 */
      root.Store.flag('teacherPhonePlain', d);
      return true;
    });
  };

  /**
   * 核对手机号。返回 Promise<boolean>。
   * 号码本身很短，这里不做时序防护 —— 有意义的是别把明文摆在
   * localStorage 里让人一眼翻到。
   */
  Teacher.check = function (phone) {
    var m = root.Store.config().meta || {};
    var hash = m[Teacher.PHONE_KEY], saltB64 = m[Teacher.SALT_KEY];
    var d = Teacher.norm(phone);
    if (!d) return Promise.resolve(false);

    /* 老师注册账号时留的手机号，本身就是「他是老师」的凭据 ——
       没必要为了退出学生自测再让他登记一个单独的号。
       两条路都试：先试登录账号的号，再试自测模式里单登记的号。 */
    var tries = [];
    try {
      var a = root.Account && root.Account.get && root.Account.get();
      if (a && a.phone) tries.push({ salt: a.salt, hash: a.hash });
    } catch (e) {}
    if (hash && saltB64) tries.push({ salt: saltB64, hash: hash });
    if (!tries.length) return Promise.resolve(false);

    var matched = false;
    var chain = Promise.resolve();
    tries.forEach(function (t) {
      chain = chain.then(function () {
        if (matched) return;
        return derive(d, unb64(t.salt)).then(function (dk) {
          var mine = b64(dk);
          if (mine.length !== String(t.hash).length) return;
          var diff = 0;
          for (var i = 0; i < mine.length; i++) diff |= mine.charCodeAt(i) ^ String(t.hash).charCodeAt(i);
          if (diff === 0) matched = true;
        });
      });
    });
    return chain.then(function () { return matched; }).catch(function () { return false; });
  };

  /** 老师忘了自己填的号码时，给个提示 */
  Teacher.hint = function () {
    var own = root.Store.getFlag('teacherPhoneMask', '') || '';
    if (own) return own;
    /* 没单登记过就用账号的号 —— 老师只填过一次手机号，别让他填第二次 */
    try {
      var a = root.Account && root.Account.get && root.Account.get();
      if (a && a.phone) return a.mask || Teacher.mask(a.phone);
    } catch (e) {}
    return '';
  };

   * 手机号只有 11 位数字，理论上可以一个个试。加个冷却，让「一个个试」
   * 从几秒钟变成几天，这条路就不值得走了。
   * 存 localStorage（不是内存变量）：学生刷新页面绕不过去。
   * 这仍然只是减速带 —— 能改 JS 的人可以清掉这个标记；如实说明，
   * 真正的防护要等后端上线。
   */

  var FIRST_LOCK = 60 * 1000;         /* 第 5 次错：等 1 分钟 */
  var SECOND_LOCK = 10 * 60 * 1000;   /* 再来：等 10 分钟 */

  Teacher.fails = function () {
    var m = root.Store.config().meta || {};
    var f = m.teacherFails;
    return (f && typeof f.n === 'number') ? f : { n: 0, until: 0 };
  };

  /** 还要等多少秒才能再试；0 表示可以试了 */
  Teacher.waitSeconds = function () {
    var f = Teacher.fails();
    var left = (f.until || 0) - Date.now();
    return left > 0 ? Math.ceil(left / 1000) : 0;
  };

  Teacher.recordFail = function () {
    var f = Teacher.fails();
    var n = (f.n || 0) + 1;
    var until = 0;
    if (n >= MAX_TRIES) {
      var lock = n >= MAX_TRIES * 2 ? SECOND_LOCK : FIRST_LOCK;
      until = Date.now() + lock;
    }
    root.Store.flag('teacherFails', { n: n, until: until });
    return { n: n, until: until, left: n >= MAX_TRIES ? Math.max(0, MAX_TRIES * 2 - n) : MAX_TRIES - n };
  };

  Teacher.clearFails = function () {
    root.Store.flag('teacherFails', { n: 0, until: 0 });
  };

  Teacher.MAX_TRIES = MAX_TRIES;

  /* ============================ 老师账号 ============================
   * 手机号 + 密码 注册 / 登录。
   *
   * 为什么要有这一层：
   *   以前进平台只要一个激活码，谁拿到码都能进来，谁也说不清
   *   「这台电脑上是哪个老师的数据」。而且「激活」和「登录」是两件事：
   *   激活是「这台电脑买了哪个版本」，登录是「现在坐在这儿的是谁」。
   *   一个学校一台电脑，换老师、换班都要能分清。
   *
   * 现在的实现是纯前端的（这台电脑上记账），所以要说清楚它做不到什么：
   *   密码是 PBKDF2 哈希后存在浏览器里，同一台电脑上的另一个老师
   *   打不开对方的数据；但**换个浏览器、换台电脑就登录不了**，
   *   因为账号没有存在服务器上。真账号要等后端上线。
   *   这里先把「界面和流程」跑通，后端一接上，数据就能搬过去。
   */
  var Account = {};

  var ACC_KEY = 'teacherAccount';       /* {phone, hash, salt, name, school, createdAt} */
  var ACC_SESS = 'chemdx.teacher.session';
  var ACC_SESS_TTL = 12 * 3600 * 1000;  /* 12 小时，够上一天课 */

  Account.KEY = ACC_KEY;

  Account.norm = Teacher.norm;
  Account.valid = Teacher.valid;
  Account.mask = Teacher.mask;

  Account.get = function () {
    try {
      var a = root.Store.getFlag(ACC_KEY, null);
      return a && a.phone ? a : null;
    } catch (e) { return null; }
  };

  Account.has = function () { return !!Account.get(); };

  /**
   * 密码强度检查。
   * 和 server/auth.js 的规则保持一致 —— 前端挡一道只是为了少一次往返，
   * 真正的把关必须放在服务端（前端规则谁都能改）。
   */
  Account.passProblem = function (pw) {
    pw = String(pw == null ? '' : pw);
    if (pw.length < 8) return '密码至少要 8 位';
    if (pw.length > 128) return '密码太长了';
    if (/^[0-9]+$/.test(pw)) return '密码不能是纯数字（太容易被猜到）';
    if (/^[a-zA-Z]+$/.test(pw)) return '密码不能是纯字母';
    if (!/[0-9]/.test(pw) && !/[a-zA-Z]/.test(pw)) return '密码要有数字或字母';
    if (/^(123456|password|qwerty|abc123|111111)/i.test(pw)) return '这个密码太常见了，换一个';
    return '';
  };

  /** 注册：手机号 + 密码（同一台电脑上一个手机号只能注册一次） */
  Account.register = function (o) {
    o = o || {};
    var phone = Account.norm(o.phone);
    if (!Account.valid(phone)) {
      return Promise.resolve({ ok: false, error: '手机号要 11 位，1 开头。例如 13800138000' });
    }
    var prev = Account.get();
    if (prev) {
      if (prev.phone === phone) {
        return Promise.resolve({ ok: false, error: '这个号码已经注册过了，直接登录就行' });
      }
      /* 不覆盖：覆盖会让前一个老师的激活码和数据「变成」新老师的 */
      return Promise.resolve({
        ok: false,
        error: '这台电脑上已经用 ' + Account.mask(prev.phone) + ' 注册过账号了。一台电脑一个老师账号，换人请先退出登录。'
      });
    }
    var bad = Account.passProblem(o.password);
    if (bad) return Promise.resolve({ ok: false, error: bad });
    /* password2 只在传了的时候才比对。
       调用方（注册界面）自己会先做一次「两次输入是否一致」的即时校验，
       好立刻提示用户，不必等一次异步往返；传下来的就只有 password。
       这里保留 password2 的判断，是为了别的调用方也能用它兜底。 */
    if (o.password2 !== undefined && o.password !== o.password2) {
      return Promise.resolve({ ok: false, error: '两次输入的密码不一样' });
    }
    var salt = crypto.getRandomValues(new Uint8Array(16));
    return derive(o.password, salt).then(function (dk) {
      var rec = {
        phone: phone,
        mask: Account.mask(phone),
        hash: b64(dk),
        salt: b64(salt),
        iter: PBKDF2_ITER,
        name: String(o.name || '').slice(0, 20),
        school: String(o.school || '').slice(0, 30),
        createdAt: Date.now(),
        synced: false      /* 后端上线后，这个标记用来决定要不要补传 */
      };
      root.Store.flag(ACC_KEY, rec);
      /* 注册完直接登录，别让人再输一遍 */
      return { ok: true, account: rec };
    }).catch(function (e) {
      return { ok: false, error: '注册出错：' + (e && e.message ? e.message : e) };
    });
  };

  /** 登录校验 */
  Account.check = function (phone, password) {
    var rec = Account.get();
    if (!rec) return Promise.resolve(false);
    var p = Account.norm(phone);
    /* 号码不对就直接返回，但也要跑一次 derive，避免「号码对不对」
       从响应快慢上被看出来（本地算不上关键，但没坏处） */
    var salt = unb64(rec.salt);
    return derive(String(password == null ? '' : password), salt).then(function (dk) {
      var mine = b64(dk);
      if (p !== rec.phone) return false;
      if (mine.length !== rec.hash.length) return false;
      var diff = 0;
      for (var i = 0; i < mine.length; i++) diff |= mine.charCodeAt(i) ^ rec.hash.charCodeAt(i);
      return diff === 0;
    });
  };

  Account.login = function (phone, password) {
    return Account.check(phone, password).then(function (ok) {
      if (!ok) return false;
      try {
        root.sessionStorage.setItem(ACC_SESS, JSON.stringify({ phone: Account.norm(phone), at: Date.now() }));
      } catch (e) {}
      Account.clearFails();
      return true;
    });
  };

  Account.isLoggedIn = function () {
    try {
      var raw = root.sessionStorage.getItem(ACC_SESS);
      if (!raw) return false;
      var o = JSON.parse(raw);
      if (!o || !o.at) return false;
      if (Date.now() - o.at > ACC_SESS_TTL) {
        root.sessionStorage.removeItem(ACC_SESS);
        return false;
      }
      return true;
    } catch (e) { return false; }
  };

  Account.currentPhone = function () {
    try {
      var o = JSON.parse(root.sessionStorage.getItem(ACC_SESS) || 'null');
      return o && o.phone ? o.phone : (Account.get() ? Account.get().phone : null);
    } catch (e) { return null; }
  };

  Account.logout = function () {
    try { root.sessionStorage.removeItem(ACC_SESS); } catch (e) {}
  };

  /* ---------------- 登录限流（和手机号退出共用一套计数思路） ---------------- */
  var ACC_FAILS = 'accountFails';

  Account.fails = function () {
    try {
      var f = root.Store.getFlag(ACC_FAILS, null) || {};
      var n = +f.n || 0, until = +f.until || 0;
      if (until && until < Date.now()) { n = 0; until = 0; }
      return { n: n, until: until };
    } catch (e) { return { n: 0, until: 0 }; }
  };

  Account.waitSeconds = function () {
    var f = Account.fails();
    return f.until ? Math.ceil((f.until - Date.now()) / 1000) : 0;
  };

  Account.recordFail = function () {
    var f = Account.fails();
    var n = f.n + 1;
    var until = 0;
    if (n >= MAX_TRIES) until = Date.now() + (n >= MAX_TRIES * 2 ? SECOND_LOCK : FIRST_LOCK);
    root.Store.flag(ACC_FAILS, { n: n, until: until });
    return { n: n, until: until, left: n >= MAX_TRIES ? Math.max(0, MAX_TRIES * 2 - n) : MAX_TRIES - n };
  };

  Account.clearFails = function () { root.Store.flag(ACC_FAILS, { n: 0, until: 0 }); };

  Account.MAX_TRIES = MAX_TRIES;

  root.Lic = Lic;
  root.Admin = Admin;
  root.Teacher = Teacher;
  root.Account = Account;
}(typeof window !== 'undefined' ? window : globalThis));

</script>

      return Number.isInteger(i) && i >= 0 && i < (q.options || []).length ? String.fromCharCode(65 + i) : String(ans);
    }
    if (q.type === 'multi') {
      return ans.slice().sort(function (a, b) { return a - b; }).map(function (i) {
        return String.fromCharCode(65 + Number(i));
      }).join('');
    }
    if (q.type === 'judge') return ans === true ? '对' : '错';
    if (q.type === 'fill') {
      if (typeof ans === 'boolean') return ans ? '对（老师判定）' : '错（老师判定）';
      return Array.isArray(ans) ? ans.join('；') : String(ans);
    }
    return String(ans);
  };

  root.Core = C;
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<script>
/*!
 * 化学学情诊断平台 · 图表绘制
 * 作者：黎伟成
 * Canvas 绘制雷达图 / 条形图。每张图都带「黎伟成制作」水印（截图外流可溯源）。
 */
(function (root) {
  'use strict';

  var Ch = {};

  function setupCanvas(cv, h) {
    var dpr = root.devicePixelRatio || 1;
    var w = (cv.parentNode && cv.parentNode.clientWidth) || 560;
    w = Math.min(w, 620);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx: ctx, w: w, h: h };
  }

  function markCanvas(o) {
    var ctx = o.ctx;
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#1d4ed8';
    ctx.font = '600 13px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('黎伟成制作', o.w - 10, o.h - 7);
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (w < r * 2) r = Math.max(0, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function rateColor(v) {
    return v >= 0.8 ? '#059669' : v >= 0.5 ? '#d97706' : '#dc2626';
  }

  /** 维度雷达图 */
  Ch.drawRadar = function (cv, labels, values) {
    var H = 400;
    var o = setupCanvas(cv, H), ctx = o.ctx, W = o.w;
    var cx = W / 2, cy = H / 2 + 4, R = Math.min(W / 2, H / 2) - 62;
    var n = labels.length;
    if (!n) return;
    var ang = function (i) { return -Math.PI / 2 + i * 2 * Math.PI / n; };
    var g, i, a;

    for (g = 4; g >= 1; g--) {
      ctx.beginPath();
      for (i = 0; i < n; i++) {
        a = ang(i);
        var r = R * g / 4;
        var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = (g % 2 === 0) ? '#f7fafd' : '#fff';
      ctx.fill();
      ctx.strokeStyle = (g === 4) ? '#c3ccd8' : '#e6ebf2';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    for (i = 0; i < n; i++) {
      a = ang(i);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
      ctx.strokeStyle = '#e6ebf2';
      ctx.stroke();
    }
    ctx.beginPath();
    for (i = 0; i < n; i++) {
      a = ang(i);
      var v0 = Math.max(0, Math.min(1, values[i] || 0));
      var x0 = cx + R * v0 * Math.cos(a), y0 = cy + R * v0 * Math.sin(a);
      if (i) ctx.lineTo(x0, y0); else ctx.moveTo(x0, y0);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(59,130,246,.22)';
    ctx.fill();
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    for (i = 0; i < n; i++) {
      a = ang(i);
      var v1 = Math.max(0, Math.min(1, values[i] || 0));
      ctx.beginPath();
      ctx.arc(cx + R * v1 * Math.cos(a), cy + R * v1 * Math.sin(a), 3.6, 0, Math.PI * 2);
      ctx.fillStyle = '#1d4ed8';
      ctx.fill();
    }
    ctx.font = '600 12px -apple-system,"PingFang SC",sans-serif';
    for (i = 0; i < n; i++) {
      a = ang(i);
      var lx = cx + (R + 26) * Math.cos(a), ly = cy + (R + 26) * Math.sin(a);
      ctx.fillStyle = '#475569';
      var pct = Math.round((values[i] || 0) * 100) + '%';
      ctx.textAlign = Math.abs(Math.cos(a)) < 0.18 ? 'center' : (Math.cos(a) > 0 ? 'left' : 'right');
      ctx.textBaseline = Math.abs(Math.sin(a)) < 0.18 ? 'middle' : (Math.sin(a) > 0 ? 'top' : 'bottom');
      ctx.fillText(labels[i], lx, ly - 6);
      ctx.font = '11px -apple-system,sans-serif';
      ctx.fillStyle = rateColor(values[i] || 0);
      ctx.fillText(pct, lx, ly + 7);
      ctx.font = '600 12px -apple-system,"PingFang SC",sans-serif';
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    markCanvas(o);
  };

  /** 横向条形图 */
  Ch.drawBars = function (cv, labels, values, opt) {
    opt = opt || {};
    if (!labels.length) return;
    var H = Math.max(opt.minH || 190, labels.length * 34 + 46);
    var o = setupCanvas(cv, H), ctx = o.ctx, W = o.w;
    var padL = opt.padL || 96, padR = 54, top = 14, btm = 8;
    var bh = 20, gap = (H - top - btm) / labels.length;
    ctx.font = '12.5px -apple-system,"PingFang SC",sans-serif';
    for (var i = 0; i < labels.length; i++) {
      var y = top + gap * i + gap / 2 - bh / 2;
      ctx.fillStyle = '#eef3f9';
      roundRect(ctx, padL, y, W - padL - padR, bh, 5);
      ctx.fill();
      var v = Math.max(0, Math.min(1, values[i] || 0));
      var col = rateColor(v);
      if (v > 0.001) {
        ctx.fillStyle = col;
        roundRect(ctx, padL, y, (W - padL - padR) * v, bh, 5);
        ctx.fill();
      }
      ctx.fillStyle = '#475569';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      /* 过长的标签截断 */
      var lb = String(labels[i]);
      while (lb.length > 2 && ctx.measureText(lb).width > padL - 14) lb = lb.slice(0, -1);
      ctx.fillText(lb, padL - 10, y + bh / 2);
      ctx.fillStyle = col;
      ctx.textAlign = 'left';
      ctx.font = '600 12.5px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(Math.round(v * 100) + '%', padL + (W - padL - padR) * v + 9, y + bh / 2);
      ctx.font = '12.5px -apple-system,"PingFang SC",sans-serif';
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    markCanvas(o);
  };

  /** 分数分布柱状图（班级报告用） */
  Ch.drawDist = function (cv, buckets, counts) {
    var H = 210;
    var o = setupCanvas(cv, H), ctx = o.ctx, W = o.w;
    var padL = 34, padR = 12, top = 20, btm = 32;
    var n = buckets.length;
    if (!n) return;
    var maxC = Math.max.apply(null, counts.concat([1]));
    var bw = (W - padL - padR) / n;
    ctx.font = '11.5px -apple-system,"PingFang SC",sans-serif';
    for (var i = 0; i < n; i++) {
      var h = (H - top - btm) * (counts[i] / maxC);
      var x = padL + bw * i + bw * 0.16;
      var w = bw * 0.68;
      var y = H - btm - h;
      var v = i / (n - 1 || 1);
      ctx.fillStyle = rateColor(v);
      if (h < 2 && counts[i] > 0) h = 2;
      roundRect(ctx, x, H - btm - h, w, h, 4);
      ctx.fill();
      ctx.fillStyle = '#475569';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      if (counts[i] > 0) {
        ctx.font = '600 11.5px -apple-system,sans-serif';
        ctx.fillText(counts[i], x + w / 2, y - 4);
        ctx.font = '11.5px -apple-system,"PingFang SC",sans-serif';
      }
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(buckets[i], x + w / 2, H - btm + 7);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    markCanvas(o);
  };

  Ch.rateColor = rateColor;
  root.Charts = Ch;
}(typeof window !== 'undefined' ? window : globalThis));

</script>
