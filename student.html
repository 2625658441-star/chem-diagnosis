<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>我的化学诊断报告 · 黎伟成制作</title>
<style>
/*!
 * 化学学情诊断平台 · 共享样式
 * 作者：黎伟成
 * 设计语言沿用「化学学情诊断工作台」，保持视觉一致。
 */
:root{
  --bg:#eef2f7; --card:#fff; --ink:#1e293b; --ink2:#475569; --ink3:#94a3b8;
  --line:#dde5ee; --brand:#1d4ed8; --brand2:#3b82f6; --brand-soft:#eaf1ff;
  --ok:#059669; --ok-soft:#e7f7f1; --warn:#d97706; --warn-soft:#fdf4e7;
  --bad:#dc2626; --bad-soft:#fdeceb; --gray-soft:#f1f5f9;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.18);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
}

/* ---------- 全屏水印（黎伟成）----------
   固定在最上层、pointer-events:none，不影响任何点击与输入 */
body::before{
  content:""; position:fixed; inset:0; z-index:9000; pointer-events:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22340%22%20height%3D%22210%22%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-size%3D%2221%22%20font-family%3D%22PingFang%20SC%2CHiragino%20Sans%20GB%2CMicrosoft%20YaHei%2Csans-serif%22%20font-weight%3D%22600%22%20fill%3D%22%231d4ed8%22%20fill-opacity%3D%220.075%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%20transform%3D%22rotate(-26%20170%20105)%22%3E%E9%BB%8E%E4%BC%9F%E6%88%90%20%E5%88%B6%E4%BD%9C%3C%2Ftext%3E%3C%2Fsvg%3E");
  background-repeat:repeat; background-size:340px 210px;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}
.wrap.narrow{max-width:760px}

/* ---------- 顶栏 ---------- */
.topbar{
  background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#3b82f6);
  color:#fff; padding:18px 0; margin-bottom:24px;
  box-shadow:0 6px 26px -14px rgba(30,58,138,.75);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:240px}
.logo-mark{
  width:44px;height:44px;border-radius:12px;flex:none;
  background:rgba(255,255,255,.17); border:1px solid rgba(255,255,255,.3);
  display:grid;place-items:center; font-size:22px; font-weight:700; letter-spacing:-1px;
}
.brand h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.3px}
.brand p{margin:1px 0 0;font-size:12.5px;opacity:.82}
.built-by{
  font-size:12.5px;padding:7px 16px;border-radius:999px;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);
  letter-spacing:1.5px;font-weight:700;white-space:nowrap;
  box-shadow:0 2px 10px -4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
  display:inline-flex;align-items:center;gap:7px;
}
.built-by::before{content:"◈";opacity:.9;font-size:11px}
.navlinks{display:flex;gap:6px;flex-wrap:wrap}
.navlinks a{
  color:rgba(255,255,255,.92);text-decoration:none;font-size:13px;
  padding:7px 13px;border-radius:8px;transition:.15s;white-space:nowrap;
}
.navlinks a:hover{background:rgba(255,255,255,.16)}
.navlinks a.on{background:rgba(255,255,255,.24);font-weight:600}

/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px;border:1px solid rgba(221,229,238,.7)}
h2.sec{font-size:17px;margin:0 0 4px;font-weight:650;display:flex;align-items:center;gap:9px}
h2.sec .bar{width:4px;height:17px;border-radius:2px;background:var(--brand);flex:none}
.sec-desc{color:var(--ink2);font-size:13.5px;margin:0 0 16px 13px}
.hint{color:var(--ink3);font-size:12.5px}
.hidden{display:none !important}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt{margin-top:16px}.mt-s{margin-top:9px}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;
  font-size:14px;font-weight:600;font-family:inherit;transition:.15s;background:var(--brand);color:#fff;
  white-space:nowrap;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--gray-soft);filter:none}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.lg{padding:13px 26px;font-size:15px}
.btn.block{width:100%}

/* ---------- 表单 ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field .sub{font-size:12px;color:var(--ink3);font-weight:400;margin-left:6px}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;padding:10px 13px;font-size:14.5px;
  border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--ink);
  font-family:inherit;transition:.15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
input[type=text].mono{font-family:var(--mono);letter-spacing:.5px;font-size:13px}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.file-drop{
  border:2px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;
  background:#fbfcfe;transition:.15s;cursor:pointer;
}
.file-drop:hover,.file-drop.over{border-color:var(--brand2);background:var(--brand-soft)}
.file-drop .big{font-size:30px;margin-bottom:8px;opacity:.7}
.file-drop .t{font-size:14px;font-weight:600;color:var(--ink2)}
.file-drop .s{font-size:12.5px;color:var(--ink3);margin-top:4px}

/* ---------- 提示条 ---------- */
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:9500;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.toast{
  background:#1e293b;color:#fff;padding:11px 17px;border-radius:10px;font-size:13.5px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:380px;
  animation:toastIn .22s ease-out;pointer-events:auto;line-height:1.5;
}
.toast.ok{background:#065f46}.toast.bad{background:#991b1b}.toast.warn{background:#92400e}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 徽标 / 标签 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--brand-soft);color:var(--brand)}
.tag.gray{background:var(--gray-soft);color:var(--ink2)}

/* ---------- 表格 ---------- */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
table.tbl th,table.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl th{background:var(--gray-soft);font-weight:650;color:var(--ink2);font-size:12.5px;position:sticky;top:0}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:#f8fafc}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl .qid{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.wrong-mark{color:var(--bad);font-weight:700}
.right-mark{color:var(--ok);font-weight:700}

/* ---------- 统计块 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--gray-soft);border-radius:11px;padding:13px 15px;border:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--ink3);margin-bottom:3px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:3px}
.stat.ok{background:var(--ok-soft);border-color:#bbf0da}
.stat.ok .v{color:var(--ok)}
.stat.bad{background:var(--bad-soft);border-color:#f8cfcd}
.stat.bad .v{color:var(--bad)}
.stat.warn{background:var(--warn-soft);border-color:#f2ddba}
.stat.warn .v{color:var(--warn)}

/* ---------- 进度条 ---------- */
.bar-track{height:8px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--brand2);transition:width .3s}
.bar-fill.ok{background:var(--ok)}.bar-fill.bad{background:var(--bad)}.bar-fill.warn{background:var(--warn)}

/* ---------- 弹层 ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9200;
  display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px);
}
.modal{
  background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.5);padding:26px 28px;
}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:650}
.modal .mdesc{color:var(--ink2);font-size:13.5px;margin:0 0 18px}

/* ---------- 空态 ---------- */
.empty{text-align:center;padding:38px 20px;color:var(--ink3)}
.empty .big{font-size:40px;opacity:.35;margin-bottom:10px}
.empty .t{font-size:14.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}

/* ---------- 公告 ---------- */
.notice{
  background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;
  border-radius:12px;padding:13px 17px;margin-bottom:16px;font-size:13.5px;
  display:flex;gap:11px;align-items:flex-start;
}
.notice .ico{font-size:17px;flex:none;line-height:1.35}
.notice .bd{flex:1;min-width:0}
.notice .nt{font-weight:650;color:#92400e;margin-bottom:2px}
.notice .nc{color:#78350f;line-height:1.6;white-space:pre-wrap}
.notice.info{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#bfdbfe}
.notice.info .nt{color:#1e40af}.notice.info .nc{color:#1e3a8a}
.notice.bad{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fecaca}
.notice.bad .nt{color:#991b1b}.notice.bad .nc{color:#7f1d1d}

/* ---------- 锁屏 / 激活 ---------- */
.gate{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#3b82f6);
}
.gate-box{background:#fff;border-radius:18px;padding:34px 36px;max-width:520px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.gate-box h1{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:.3px}
.gate-box .sub{color:var(--ink2);font-size:13.5px;margin:0 0 22px}
.lic-input{
  font-family:var(--mono);font-size:13px;letter-spacing:.4px;
  padding:13px 15px;border:2px solid var(--line);border-radius:11px;width:100%;background:#fbfcfe;
}
.lic-input:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 4px var(--brand-soft);background:#fff}
.lic-state{padding:11px 15px;border-radius:10px;font-size:13.5px;margin-bottom:14px;line-height:1.6}
.lic-state.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bbf0da}
.lic-state.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #f8cfcd}
.lic-state.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f2ddba}
.keybox{
  background:#0f172a;color:#7dd3fc;font-family:var(--mono);font-size:12.5px;
  padding:14px 16px;border-radius:10px;word-break:break-all;line-height:1.75;
  max-height:260px;overflow:auto;position:relative;
}
.keybox .ln{display:block;white-space:pre}

/* ---------- 二维码 ---------- */
.qr-box{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line);display:inline-block}
.qr-box svg{display:block;width:190px;height:190px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.qr-item{text-align:center;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.qr-item .nm{font-weight:650;font-size:14px;margin-bottom:2px}
.qr-item .no{font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin-bottom:9px}
.qr-item .hint{margin-top:7px;font-size:11.5px}

/* ---------- OMR 复核 ---------- */
.omr-stage{position:relative;display:inline-block;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.omr-stage canvas{display:block;max-width:100%;height:auto}
.omr-overlay{position:absolute;inset:0;pointer-events:none}
.omr-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.omr-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.review-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.review-row:last-child{border-bottom:none}
.review-row .qn{font-family:var(--mono);font-size:12.5px;color:var(--ink2);min-width:64px}
.review-row .opts{display:flex;gap:6px;flex-wrap:wrap}
.opt-btn{
  min-width:38px;padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:.13s;
}
.opt-btn:hover{border-color:var(--brand2);background:var(--brand-soft)}
.opt-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt-btn.lowconf{border-color:var(--warn);background:var(--warn-soft)}
.opt-btn.lowconf.on{background:var(--warn);color:#fff}

/* ---------- 打印 ---------- */
.print-only{display:none}
@media print{
  body{background:#fff}
  body::before{
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22300%22%20height%3D%22190%22%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-size%3D%2217%22%20font-family%3D%22PingFang%20SC%2CHiragino%20Sans%20GB%2CMicrosoft%20YaHei%2Csans-serif%22%20font-weight%3D%22600%22%20fill%3D%22%23000000%22%20fill-opacity%3D%220.085%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%20transform%3D%22rotate(-26%20150%2095)%22%3E%E9%BB%8E%E4%BC%9F%E6%88%90%20%E5%88%B6%E4%BD%9C%3C%2Ftext%3E%3C%2Fsvg%3E");background-size:300px 190px;z-index:9999;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .topbar,.navlinks,.no-print,.toast-wrap{display:none !important}
  .card{box-shadow:none;border:none;padding:0;margin:0}
  .wrap{max-width:none;padding:0}
  .print-only{display:block}
  .sheet-page{page-break-after:always;break-after:page}
  .sheet-page:last-child{page-break-after:auto;break-after:auto}
}
.sheet-page{background:#fff;margin:0 auto 18px;box-shadow:var(--shadow);border-radius:6px;overflow:hidden}
.sheet-page svg{display:block;width:100%;height:auto}

/* ============================================================
   报告（老师端 / 学生端共用）
   ============================================================ */
.rp-hero{
  background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#3b82f6);color:#fff;
  border-radius:var(--radius);padding:28px 30px;margin-bottom:18px;
  box-shadow:0 10px 34px -18px rgba(30,58,138,.9);
}
.rp-hero-top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.rp-hero h2{margin:0 0 4px;font-size:22px;font-weight:650;letter-spacing:.3px}
.rp-hero .who{font-size:14px;opacity:.92}
.rp-hero .when{font-size:12.5px;opacity:.72;margin-top:3px}
.rp-score{margin-left:auto;text-align:right}
.rp-score .val{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1.5px}
.rp-score .val small{font-size:16px;font-weight:500;opacity:.68;letter-spacing:0}
.rp-score .pct{font-size:13.5px;opacity:.85;margin-top:5px}
.rp-score .lvl{margin-top:7px;font-size:13px;display:inline-block;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.19);border:1px solid rgba(255,255,255,.3);font-weight:600}
.rp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.22)}
.rp-stats .hs{text-align:center}
.rp-stats .hs .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.rp-stats .hs .k{font-size:11.5px;opacity:.8;margin-top:2px}

.rp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.rp-grid2{grid-template-columns:1fr}}
.cv-box{text-align:center}
.cv-box canvas{max-width:100%}
.rp-legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.rp-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.kprow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f0f4f9;font-size:13.8px}
.kprow:last-child{border-bottom:none}
.kprow .name{flex:1;min-width:0}
.kprow .name small{color:var(--ink3);font-size:11.5px;margin-left:7px}
.kprow .meter{width:86px;height:6px;background:#e8eef7;border-radius:99px;overflow:hidden;flex:none}
.kprow .meter i{display:block;height:100%;border-radius:99px}
.kprow .pct{width:46px;text-align:right;font-size:12.8px;font-weight:650;font-variant-numeric:tabular-nums;flex:none;color:var(--ink2)}

.rootcard{border:1.6px solid #f8d3d1;background:var(--bad-soft);border-radius:12px;padding:15px 18px;margin-bottom:11px}
.rootcard .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.rootcard .rn{font-weight:650;font-size:15px;color:#991b1b}
.rootcard .rd{font-size:13px;color:#7f1d1d;line-height:1.65}
.rootcard .rd b{font-weight:600}

.step{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #f0f4f9}
.step:last-child{border-bottom:none}
.step .num{
  width:29px;height:29px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-weight:700;font-size:13.5px;background:var(--brand-soft);color:var(--brand);border:1px solid #cfe0fb;
}
.step .body{flex:1;min-width:0}
.step .t{font-weight:620;font-size:14.5px;margin-bottom:3px}
.step .d{font-size:13.2px;color:var(--ink2);line-height:1.62}
.step .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.stage-h{margin:16px 0 8px;font-weight:650;font-size:14.5px;color:#1d4ed8}

.rev{border:1.5px solid var(--line);border-radius:12px;padding:17px 19px;margin-bottom:12px;background:#fbfcfe}
.rev.wrong{border-color:#f8d3d1;background:var(--bad-soft)}
.rev.lucky{border-color:#f0c68a;background:var(--warn-soft)}
.rev .rh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.rev .mark{font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px}
.rev.wrong .mark{background:#dc2626;color:#fff}
.rev.lucky .mark{background:#d97706;color:#fff}
.rev .q{font-size:15px;line-height:1.7;margin-bottom:11px;white-space:pre-wrap}
.rev .optline{font-size:13.8px;padding:6px 11px;border-radius:8px;margin-bottom:5px;background:#fff;border:1px solid var(--line);line-height:1.6}
.rev .optline.right{background:var(--ok-soft);border-color:#a7e0c9;font-weight:600}
.rev .optline.wrongpicked{background:#fff1f0;border-color:#f5b5b1}
.rev .exp{
  margin-top:11px;padding:12px 15px;background:#fff;border-radius:9px;
  border-left:3px solid var(--brand);font-size:13.6px;line-height:1.72;color:var(--ink2);white-space:pre-wrap;
}
.rev .exp b{color:var(--ink)}

.signoff{margin-top:26px;padding:22px 6px 6px;text-align:center}
.signoff .so-line{height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);margin-bottom:18px}
.signoff .so-main{font-size:13px;color:var(--ink2);font-weight:600}
.signoff .so-sub{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.8}
.signoff .so-brand{
  margin-top:14px;font-size:15px;font-weight:700;letter-spacing:3px;color:var(--brand);
  display:inline-block;padding:7px 22px;border:1.5px solid #cfe0fb;border-radius:999px;background:var(--brand-soft);
}
.signoff .so-note{margin-top:9px;font-size:11.5px;color:var(--ink3);letter-spacing:.4px}
.pagebreak{break-before:page;page-break-before:always}


/* ---------- 学生报告卡（打印/发放用）---------- */
.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.qr-grid{grid-template-columns:1fr}}
.rpt-card{border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;break-inside:avoid}
.rc-head{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#3b82f6);color:#fff}
.rc-head .rc-t{font-size:13.5px;font-weight:650}
.rc-head .rc-s{font-size:11px;opacity:.82;margin-top:1px}
.rc-head .rc-by{margin-left:auto;font-size:11px;font-weight:600;opacity:.9;letter-spacing:.5px;flex:none;
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 10px}
.rc-body{display:flex;align-items:flex-start;gap:14px;padding:14px}
.rc-l{flex:1;min-width:0}
.rc-r{flex:none;text-align:center}
.rc-name{font-size:17px;font-weight:700;letter-spacing:.5px}
.rc-no{font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.rc-score{font-size:30px;font-weight:700;color:#1d4ed8;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.rc-score small{font-size:13px;font-weight:500;color:var(--ink3);letter-spacing:0}
.rc-rate{font-size:12.5px;color:var(--ink2);margin-top:3px}
.rc-rate b{color:#1d4ed8}
.rc-kv{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.7}
.rc-kv b{color:#b45309;font-variant-numeric:tabular-nums}
.rc-weak{margin-top:8px;font-size:11.8px;color:#991b1b;background:var(--bad-soft);
  border:1px solid #f8d3d1;border-radius:8px;padding:6px 10px;line-height:1.6}
.rc-paper{font-size:11px;color:var(--ink3);margin-top:8px}
.rc-qr{width:132px;height:132px}
.rc-qr svg{display:block;width:100%;height:100%}
.rc-qr-load{width:132px;height:132px;display:grid;place-items:center;font-size:11px;color:var(--ink3);
  border:1px dashed var(--line);border-radius:8px}
.rc-tip{font-size:11px;color:var(--ink2);margin-top:6px;font-weight:600}

@media print{
  .qr-grid{grid-template-columns:1fr 1fr;gap:8mm}
  .rpt-card{border:1px solid #999}
  .rc-head{background:#1e3a8a !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rc-qr{width:30mm;height:30mm}
}


/* ---------- 选卷卡片（view-sheet）---------- */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:13px}
.mode-card{
  border:1.6px solid var(--line);border-radius:12px;padding:15px 17px;cursor:pointer;
  background:#fff;transition:.16s;position:relative;
}
.mode-card:hover{border-color:#b9d0f8;transform:translateY(-1px);box-shadow:0 6px 18px -10px rgba(30,58,138,.4)}
.mode-card.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.mode-card.on::after{content:"✓";position:absolute;top:11px;right:13px;width:19px;height:19px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.mc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mc-ico{font-size:17px;line-height:1}
.mc-nm{font-weight:650;font-size:15px}
.mc-cnt{font-size:11.5px;font-weight:650;color:var(--brand);background:#fff;border:1px solid #cfe0fb;
  border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.mode-card.on .mc-cnt{background:#fff}
.mc-d{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.6}
.mc-tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}

/* ---------- 自定义筛选 ---------- */
.filter-grid{display:flex;flex-direction:column;gap:11px}
.fg-box{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfe}
.fg-t{font-size:12.5px;font-weight:650;color:var(--ink2);margin-bottom:8px}
.fg-row{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{
  font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1.4px solid var(--line);background:#fff;color:var(--ink2);transition:.13s;
}
.chip-btn:hover{border-color:#b9d0f8;color:var(--brand)}
.chip-btn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* ---------- 拍照识别（view-omr）---------- */
.omr-stage{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.omr-stage img,.omr-stage canvas{display:block;max-width:100%;height:auto}
.omr-overlay{position:absolute;inset:0;pointer-events:none}
.opt-btn{
  position:absolute;width:16px;height:16px;border-radius:50%;border:1.6px solid rgba(29,78,216,.65);
  background:rgba(255,255,255,.34);pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);
  transition:.12s;padding:0;
}
.opt-btn:hover{transform:translate(-50%,-50%) scale(1.25);border-color:var(--brand)}
.opt-btn.on{background:rgba(220,38,38,.82);border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.28)}
.opt-btn.lowconf{border-color:#d97706;border-style:dashed;border-width:2.4px;
  animation:pulse 1.15s ease-in-out infinite}
.opt-btn.lowconf.on{background:rgba(217,119,6,.8);border-color:#d97706;border-style:solid}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.5)}50%{box-shadow:0 0 0 6px rgba(217,119,6,0)}}
.omr-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:9px}
.omr-legend i{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:5px;vertical-align:-2px}
.review-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #f0f4f9;font-size:13px}
.review-row:last-child{border-bottom:none}
.review-row .rq{font-weight:650;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;flex:none;width:64px}
.review-row .ra{flex:1;min-width:0}
.review-row .rc{flex:none;font-variant-numeric:tabular-nums;font-size:12px}
.photo-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #f0f4f9;font-size:13.2px}
.photo-row:last-child{border-bottom:none}
.photo-row .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 授权门 ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 18px}
.gate-box{background:#fff;border-radius:var(--radius);padding:34px 32px;max-width:452px;width:100%;
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 20px 50px -20px rgba(15,23,42,.3);border:1px solid rgba(221,229,238,.7)}
.gate-box h1{margin:0 0 6px;font-size:21px;font-weight:650}
.gate-box .sub{margin:0 0 22px;font-size:13px;color:var(--ink2);line-height:1.65}
.lic-input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;letter-spacing:.3px}
.lic-state{font-size:13px;line-height:1.7;border-radius:9px;padding:11px 14px;margin-bottom:14px}
.lic-state.ok{background:var(--ok-soft);color:#065f46;border:1px solid #a7e0c9}
.lic-state.bad{background:var(--bad-soft);color:#991b1b;border:1px solid #f8d3d1}
.lic-state.warn{background:var(--warn-soft);color:#92400e;border:1px solid #f0c68a}
.lic-state.info{background:var(--brand-soft);color:#1e40af;border:1px solid #cfe0fb}
.keybox{background:#0f172a;color:#e2e8f0;border-radius:9px;padding:13px 15px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;line-height:1.7;margin:0;white-space:pre}
.keybox .ln{display:block}


/* ---------- 通用：字段行 / 步骤条 / 标签 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink2);margin-bottom:5px}
.field label .sub{font-weight:400;color:var(--ink3)}
.field input,.field select,.field textarea{
  width:100%;font:inherit;font-size:14px;padding:9px 12px;border-radius:9px;
  border:1.4px solid var(--line);background:#fff;color:var(--ink);transition:.14s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.11)}
.field textarea{resize:vertical;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.field{margin-bottom:0}

.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.step-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink3);
  background:var(--gray-soft);border-radius:999px;padding:6px 15px 6px 7px}
.step-chip b{width:20px;height:20px;border-radius:50%;background:#cbd5e1;color:#fff;
  display:grid;place-items:center;font-size:11.5px;flex:none}
.step-chip.done{background:var(--ok-soft);color:#065f46}
.step-chip.done b{background:#059669}

.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;
  background:var(--gray-soft);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:#065f46}
.tag.warn{background:var(--warn-soft);color:#92400e}
.tag.bad{background:var(--bad-soft);color:#991b1b}
.tag.info{background:var(--brand-soft);color:#1e40af}
.tag.gray{background:var(--gray-soft);color:var(--ink3)}

.notice.ok-notice{background:var(--ok-soft);border-color:#a7e0c9}
.notice.ok-notice .nt{color:#065f46}
.notice.ok-notice .nc{color:#047857}

.spread{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mt-s{margin-top:8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}

/* ---------- 响应式（学生手机端）---------- */
@media (max-width:640px){
  body{font-size:15.5px}
  .wrap{padding:0 14px 48px}
  .topbar{padding:14px 0}
  .topbar-in{padding:0 14px;gap:10px}
  .brand h1{font-size:16.5px}
  .logo-mark{width:38px;height:38px;font-size:19px;border-radius:10px}
  .built-by{font-size:11px;padding:6px 12px;letter-spacing:1px}
  .navlinks{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .navlinks a{font-size:12.5px;padding:6px 11px}
  .card{padding:17px 16px;border-radius:12px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
  .stat{padding:11px 12px}
  .stat .v{font-size:19px}
  .modal{padding:20px 18px}
  .gate-box{padding:26px 22px}
  .qr-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  h2.sec{font-size:15.5px}
  table.tbl{font-size:12.5px}
  table.tbl th,table.tbl td{padding:7px 9px}
}

window.BANK_DATA={"version":"1","builtAt":"2026-10-18T12:32:40.931Z","questions":[{"id":"qA001","kp":"j-1","type":"single","diff":1,"stem":"下列物质的化学式书写正确的是","options":["氧化镁 MgO₂","氯化铁 FeCl₂","碳酸钠 NaCO₃","硫酸铝 Al₂(SO₄)₃"],"answer":3,"explain":"D 正确：Al 显+3价，SO₄²⁻带2个单位负电荷，3×2＝6，2×3＝6，正负电荷总数相等，所以硫酸铝写作 Al₂(SO₄)₃。A 错：Mg 显+2价、O 显-2价，应为 MgO，不能多写一个下标 2。B 错：氯化铁中 Fe 显+3价，应为 FeCl₃，FeCl₂ 是氯化亚铁，是另一种物质。C 错：Na 显+1价，CO₃²⁻带2个负电荷，应为 Na₂CO₃，正确答案要写出 2 个钠。错因诊断：选 B 说明你一看到 Fe 就默认写+2价，没有意识到铁有+2、+3两种价态；选 C 说明你漏掉了\"正负化合价代数和必须为零\"这一步。记住写化学式的固定顺序：先写元素符号（正价在前），再根据各族元素的化合价或原子团所带电荷凑到代数和为零，最后才标下标。"},{"id":"qA002","kp":"j-1","type":"judge","diff":2,"stem":"氢氧化钙 Ca(OH)₂ 中，钙、氧、氢三种元素的原子个数比为 1:2:2，所以它们的质量比也是 1:2:2","answer":false,"explain":"错误，这是把\"原子个数比\"和\"质量比\"当成一回事了。Ca(OH)₂ 中 1 个 Ca、2 个 O、2 个 H，原子个数比确实是 1:2:2；但质量比要用\"原子的相对原子质量×个数\"来算，即 40×1 : 16×2 : 1×2 ＝ 40:32:2 ＝ 20:16:1，数值完全不同。错因诊断：选\"正确\"说明你没有区分\"个数\"和\"质量\"，这不只是这一题的问题——后面所有相对分子质量、元素质量分数、溶解度计算的错误根源都是这里。"},{"id":"qA003","kp":"j-1","type":"single","diff":2,"stem":"工业上给钢材\"脱硫\"时用到硫酸铁 Fe₂(SO₄)₃，下列对它的描述正确的是","options":["它也可以写作 (SO₄)₃Fe₂","其中铁与硫、氧的原子个数比为 2:3:12","它就是硫酸亚铁 FeSO₄","其中铁显+2价"],"answer":1,"explain":"B 正确：Fe₂(SO₄)₃ 里 1 个\"分子\"含 2 个 Fe 原子；括号后下标 3 表示 3 个硫酸根，每个硫酸根有 1 个 S 和 4 个 O，所以 S 共 3 个、O 共 3×4＝12 个，原子个数比为 2:3:12。A 错：化学式中元素符号的书写有习惯顺序（正价元素写在前、负价原子团写在后），不能随意调换。C 错：这是把 Fe₂(SO₄)₃ 和 FeSO₄ 混为一谈，名字只差\"铁/亚铁\"一个字，物质却完全不同。D 错：SO₄²⁻ 共带 3×(-2)＝-6，要让整个化学式电中性，2 个 Fe 共贡献+6，故 Fe 显+3价；判断\"必须知道铁有+2、+3两种价态\"。错因诊断：选 A/C/D 说明你把\"化学式只是一个符号\"当成可以随手改的东西，没把它看成\"能算出原子个数和化合价的式子\"。"},{"id":"qA004","kp":"j-2","type":"single","diff":2,"stem":"高铁酸钠 Na₂FeO₄ 是一种新型净水剂，其中铁元素的化合价是","options":["+2","+3","+6","+7"],"answer":2,"explain":"C 正确。这是\"根据化学式反推化合价\"，方法是抓住一条规则：化合物中各元素化合价的代数和为零。设 Fe 为 x，则 (+1)×2 + x + (-2)×4 ＝ 0，即 2 + x − 8 ＝ 0，x ＝ +6。A 错：看到 Fe 就默认写+2，这是初中阶段最常见的漏洞——你记的是\"铁是+2价\"这个印象，不是\"铁有+2、+3两种价态，具体要看化学式\"。B 错：+3 是 Fe₂O₃、FeCl₃ 中铁的价态，不能套到 Na₂FeO₄ 上。D 错：+7 是 KMnO₄ 中 Mn 的价态，你可能是靠\"见过的物质\"记住的，而不是靠规则推出来的。错因诊断：只要你能写出\"代数和为零\"这一步，本题三个干扰项一个都不会选。"},{"id":"qA005","kp":"j-2","type":"single","diff":2,"stem":"铁在化合物中经常显+2价，也经常显+3价（如 FeCl₂ 与 FeCl₃），出现这种情况的根本原因是","options":["铁与不同非金属反应时，生成的化合物不同，所以价态由\"反应物\"决定","铁原子失去电子的数目可以不同，可以失去 2 个电子，也可以失去 3 个电子","铁的化合价没有规律，只能靠背常见的物质去记","Fe 有两种元素符号，所以有两种化合价"],"answer":1,"explain":"B 正确：化合价的本质就是\"一个原子在形成化合物时得失电子的数目（共用电子对的偏移数目）\"。铁原子最外层电子参与成键时可以失去 2 个或 3 个电子，因此对应 +2 和 +3 两种价态，所以既能形成 FeCl₂，也能形成 FeCl₃——本质是\"失电子数目不同\"，不是\"物质命名不同\"。A 错：价态不是由\"反应物种类\"随意定下来的，而是由铁原子实际失去几个电子决定的；反应物不同只是导致铁失去的电子数不同的外因。C 错：这不叫\"没有规律\"，而是你没抓住\"化合价＝得失电子数\"这条本质；背下来的印象一旦换一个陌生化学式（如 Na₂FeO₄）就会失效。D 错：Fe 只有一个元素符号，\"亚铁/铁\"是中文命名上区分价态的写法，不是两个符号。错因诊断：选 A 或 C 说明你的化合价知识还停留在\"背口诀\"，这也是后面学氧化还原反应（Fe²⁺ 被氧化成 Fe³⁺）时你会卡住的直接原因。"},{"id":"qA006","kp":"j-2","type":"single","diff":2,"stem":"下列各组物质中，铁元素化合价相同的一组是","options":["FeO 和 Fe₂O₃","FeCl₂ 和 FeCl₃","Fe₂O₃ 和 FeCl₃","Fe₃O₄ 和 FeSO₄"],"answer":2,"explain":"C 正确：Fe₂O₃ 中按\"代数和为零\"有 2x + (-2)×3 ＝ 0，x ＝ +3；FeCl₃ 中 x + (-1)×3 ＝ 0，x ＝ +3，两者铁都是+3价。A 错：FeO 中 1 个 O 是-2价，故 Fe 为+2；Fe₂O₃ 中是+3，并不相同。B 错：FeCl₂ 是氯化亚铁（Fe 为+2），FeCl₃ 是氯化铁（Fe 为+3），这正是最常被混为一谈的一对物质。D 错：FeSO₄ 中 SO₄²⁻ 为-2 价，故 Fe 为+2；Fe₃O₄ 是\"混合价态\"化合物，其中铁既有+2价也有+3价（可看作 FeO·Fe₂O₃），不能简单当成单一价态，更不能说与 FeSO₄ 相同。错因诊断：选 A 或 D 说明你看到\"有 Fe 又有 O\"就凭印象给铁定价；选 B 说明你根本没意识到 Fe 有两种价态。正确做法永远是：先设未知数，再让化合价代数和等于零，把结果算出来。"},{"id":"qA007","kp":"j-3","type":"single","diff":2,"stem":"某同学写出的化学方程式如下，其中书写正确（已配平）的是","options":["Fe + CuSO₄ → FeSO₄ + Cu","Fe + O₂ →(点燃) Fe₃O₄","H₂ + O₂ →(点燃) H₂O","Fe₂(SO₄)₃ + 3Cu → Fe + 3CuSO₄"],"answer":0,"explain":"A 正确：左边 1 个 Fe、1 个 Cu、1 个 S、4 个 O，右边同样是 1 个 Fe、1 个 Cu、1 个 S、4 个 O，各种原子的个数前后相等，方程式已经配平。B 错：没有配平，左边 2 个 O 原子、右边 4 个 O 原子，氧原子数目前后不相等，正确写法应为 3Fe + 2O₂ →(点燃) Fe₃O₄，即在\"Fe\"和\"O₂\"前面加系数。C 错：左边 2 个 H、2 个 O，右边 2 个 H、1 个 O，也不平，应为 2H₂ + O₂ →(点燃) 2H₂O。D 错：化学方程式必须尊重客观事实，Fe 不能从 Fe₂(SO₄)₃ 里被 Cu 置换出来，此反应不会发生。错因诊断：判断一个方程式对不对，顺序应该是\"①是否符合事实（能不能反应、产物对不对）→ ②等号两边每种原子的个数是否相等 → ③条件、气体符号是否标注\"。跳过第②步凭眼熟就选，是这一块最典型的失分方式。"},{"id":"qA008","kp":"j-3","type":"judge","diff":2,"stem":"配平方程式 Fe₂O₃ + CO →(高温) Fe + CO₂ 时，只要把式子改成 FeO + CO →(高温) Fe + CO₂，两边铁的原子个数就都是 1 了，这样配平就完成了","answer":false,"explain":"错误。配平是在化学式前面加合适的系数（数字写在化学式前面），绝不能改动化学式本身的下标。Fe₂O₃ 是氧化铁中含铁物质的事实，改成 FeO 就变成了另一种物质（氧化亚铁），产物中的铁也就对不上了，这属于篡改客观事实，方程式再\"好看\"也是错的。正确做法是加系数：Fe₂O₃ + 3CO →(高温) 2Fe + 3CO₂，代数检查：Fe 左2右2，O 左3+3＝6右6，C 左3右3，全部相等。错因诊断：看出来\"改下标\"是错的，说明你抓住了本质——配平的依据是质量守恒定律里的\"原子个数守恒\"，一种元素的原子个数只能靠\"调整系数（即多准备几个粒子）\"来对齐，而不能靠\"把原子拆开重组\"。反过来，如果学生选\"正确\"，则说明他把化学式当成了可以随意修改的符号，这是化学用语部分最严重的漏洞。"},{"id":"qA009","kp":"j-3","type":"single","diff":1,"stem":"铁丝在氧气中燃烧的化学方程式为 3Fe + 2O₂ →(点燃) Fe₃O₄。有同学把其中的\"Fe₃O₄\"改写成\"FeO\"，说这样左边 3 个铁、右边 3 个铁，反而更好配平。这种做法的错误在于","options":["不应该改动系数，只能改动下标","FeO 中氧原子太多，配不平","铁丝在氧气中燃烧本来就不生成氧化铁，方程式该直接删掉","化学方程式必须符合客观事实，不能随意改动产物的化学式（FeO 与 Fe₃O₄ 是两种不同物质）"],"answer":3,"explain":"D 正确。书写化学方程式必须同时满足两个要求：①尊重客观事实（反应真的发生、产物真的是这个物质）；②两边各原子个数相等（质量守恒）。把 Fe₃O₄ 改成 FeO 违反了①。A 错：配平恰恰相反——只能动系数、不能动下标，选项把两者的关系说反了。B 错：FeO 中 Fe 与 O 是 1:1，谈不上\"氧原子太多\"，而且问题不在配平的数值上，而在产物写错了。C 错：铁丝在纯氧中燃烧确实生成 Fe₃O₄（四氧化三铁），这个事实不能因为配平麻烦就否认。错因诊断：选 A 说明你能判断\"哪个能改哪个不能改\"但方向记反了；选 B 说明你把\"配平\"当成了纯数字游戏，忽略了化学方程式首先必须是真的。"},{"id":"qA010","kp":"j-4","type":"single","diff":1,"stem":"关于一切化学反应都遵守质量守恒定律的原因，下列说法正确的是","options":["反应前后分子的种类和数目都没有改变","反应前后元素的化合价都没有改变","反应前后物质的种类没有改变","反应前后原子的种类、数目和质量都没有改变"],"answer":3,"explain":"D 正确。化学反应前后原子的种类、数目、质量都不变，这是质量守恒定律的微观本质，也是\"配平\"的根据。A 错：这条最容易选，因为学生常把\"分子\"和\"原子\"混着用。实际上反应中分子的种类一定改变了（否则就不是化学反应），分子的数目也常常改变，例如 2H₂ + O₂ →(点燃) 2H₂O 中分子由 3 个变成 2 个。守恒的是\"原子\"，不是\"分子\"。B 错：化合价在化学反应中一定发生改变，这恰恰是判断一个反应是不是氧化还原反应的依据（例如上述反应中 H 由 0 价变为+1 价、O 由 0 价变为-2 价），把\"不变\"当结论是本质性错误。C 错：反应物变成生成物，物质种类必然改变。错因诊断：选 A 说明你把\"分子个数守恒\"当成了常识，这是初三到高三反复出现的错误，必须纠正成\"原子守恒、分子不守恒\"。"},{"id":"qA011","kp":"j-4","type":"multi","diff":2,"stem":"对已配平的方程式 2H₂ + O₂ →(点燃) 2H₂O，下列判断正确的是","options":["反应前后分子的总数目改变，由 3 个变成 2 个","反应前后原子的总数目改变，由 5 个变成 3 个","反应前后氢元素和氧元素的种类都没有改变","该反应前后物质的总质量相等"],"answer":[0,2,3],"explain":"A 正确：左边 2 个 H₂ 分子 + 1 个 O₂ 分子＝3 个分子，右边 2 个 H₂O 分子＝2 个分子，分子总数确实改变了，\"反应前后分子数一定不变\"是错觉。C 正确：这是同一种元素的原子重新组合，元素的种类不会改变，氢气中的氢和生成水中的氢是同一种元素。D 正确：参加反应的 H₂ 和 O₂ 的总质量等于生成的 H₂O 的质量，这正是质量守恒定律的内容，与分子个数变不变没有关系。B 错：原子个数是 4 个 H、2 个 O 共 6 个，反应前后都是 6 个（左边 2×2 个 H 与 2 个 O，右边 2×2 个 H 与 2 个 O），一个也没有多、一个也没有少；把它算成\"5 个变成 3 个\"说明你把分子数目当成了原子数目。错因诊断：漏选 A 说明你仍然相信\"反应前后分子数不变\"；漏选 D 说明你以为\"分子数变了，质量可能就不守恒\"，没有理解质量守恒管的是\"原子\"，与分子怎么重新拼装无关。"},{"id":"qA012","kp":"j-4","type":"single","diff":2,"stem":"把一根铁丝放入盛有硫酸铜溶液的试管中，一段时间后取出。下列说法正确的是","options":["铁丝变细、溶液由蓝色变浅绿色，这个变化说明质量守恒定律不成立","反应前后铁元素的质量增加了","反应前后铁元素的化合价没有变化","铁丝表面析出红色的铜，溶液变成浅绿色，反应前后各物质的质量总和不变"],"answer":3,"explain":"D 正确：Fe + CuSO₄ → FeSO₄ + Cu，铁原子换上铜原子，铁丝表面出现红色的铜，溶液中的 Cu²⁺ 减少、Fe²⁺ 增多，蓝色变浅绿；所有反应物质量总和等于所有生成物质量总和。A 错：现象上铁被消耗、铜析出，看起来\"铁没了铜来了\"，但质量并没有凭空消失或产生，参加反应的 Fe 的质量 + 参加反应的 CuSO₄ 的质量 ＝ 生成的 FeSO₄ 的质量 + 生成的 Cu 的质量，定律完全成立。B 错：铁元素有一部分留在溶液中（FeSO₄），把溶液里的铁和铁丝上的铁合起来看并没有增加。C 错：反应前铁是单质（化合价 0），反应后变成 FeSO₄ 中的 Fe（+2 价），化合价一定改变；若化合价真的不变，就不是这样一个能把铜置换出来的反应了。错因诊断：选 A 说明你把\"能看得见的现象\"当成守恒与否的判据，而不是用\"反应前后原子个数相等\"来判断；选 B 说明你只盯着铁丝上的固体，忘了溶液中还溶解着铁。"},{"id":"qA013","kp":"j-5","type":"single","diff":1,"stem":"乳酸（化学式 C₃H₆O₃）是酸奶中含有的有机物，它的相对分子质量是","options":["12 + 6 + 3 ＝ 21","(12 + 1 + 16)×3 ＝ 87","3×12 + 6×1 + 3×16 ＝ 90","3×12 × 6×1 × 3×16 ＝ 10368"],"answer":2,"explain":"C 正确：相对分子质量等于化学式中\"各原子的相对原子质量×该原子的个数\"再相加，即 3×12 + 6×1 + 3×16 ＝ 36 + 6 + 48 ＝ 90，所以乳酸（C₃H₆O₃）的相对分子质量为 90。A 错：把下标当成完全没有用，好像每个元素只算 1 个原子，说明你还没有理解\"化学式里下标表示原子个数\"。B 错：先算出一个\"CH O\"单元的质量再乘 3，但括号里的 12 + 1 + 16 漏掉了 C 有 3 个、H 有 6 个、O 有 3 个的差别，结果 87 是错的（正确的 C₃H₆O₃ 中 H 应为 6×1）。D 错：相对分子质量是\"各原子质量之和\"，不是把所有原子质量相乘，乘起来当然会大得离谱。错因诊断：选 A 说明你不会用下标；选 B 说明你只会套一个见过的式子；选 D 说明你连\"相对分子质量＝求和\"这一步概念都没有建立，这三类是计算类失分的三大来源，务必分清。"},{"id":"qA014","kp":"j-5","type":"single","diff":2,"stem":"尿素 CO(NH₂)₂ 是常用的氮肥，其中氮元素的质量分数是","options":["约为 20.0%","约为 46.7%","约为 26.7%","46.7% 是错的，氮元素在尿素里占 2/8 ＝ 25%"],"answer":1,"explain":"B 正确。先算相对分子质量：12 + 16 + 2×(14 + 1×2) ＝ 12 + 16 + 2×16 ＝ 60；氮元素的质量分数 ＝ (2×14)/60 × 100% ＝ 28/60 × 100% ≈ 46.7%。A 错：20.0% 是把氮的质量 28 当成除 140 之类的乱算，或者把\"氮的个数比\" 2/8 之外的错误比例用上了。C 错：26.7% ＝ 16/60，那是氧元素的质量分数，说明你把 CO(NH₂)₂ 里氧原子的个数和氮原子搞混了，或者把分子式里各元素的位置与含量对应错了。D 错：这一项的算法是把\"原子个数比\"（2 个 N / 共 8 个原子 ＝ 25%）当成了质量分数，直接暴露了\"质量分数＝原子个数比\"这一根本性混淆——注意 N 的相对原子质量 14 和 H 的 1 差很多，个数比不等于质量比。错因诊断：公式记不背得下来不是重点，关键是先算相对分子质量、再用\"某元素原子总质量 ÷ 相对分子质量\"，只要漏掉第一步就必然算错。"},{"id":"qA015","kp":"j-5","type":"single","diff":2,"stem":"某铁的氧化物中，铁元素与氧元素的质量比为 7:3，则该氧化物的化学式是（相对原子质量：Fe-56，O-16）","options":["FeO","Fe₂O₃","Fe₃O₄","无法确定，因为没有给出该氧化物的质量"],"answer":1,"explain":"B 正确。由质量比求原子个数比的公式是：原子个数比 ＝ 质量比 ÷ 相对原子质量比。铁原子数 : 氧原子数 ＝ (7/56) : (3/16) ＝ 0.125 : 0.1875 ＝ 2 : 3，所以化学式为 Fe₂O₃。A 错：FeO 中 Fe 与 O 的质量比是 56:16 ＝ 7:2，和题目给的 7:3 不同，说明你只看到了\"7\"这个数字就选了带铁的 FeO，没有真正做除法。C 错：Fe₃O₄ 中 Fe 与 O 的质量比为 (3×56):(4×16) ＝ 168:64 ≈ 21:8，也不是 7:3。D 错：这类题根本不是\"够不够条件\"的问题——质量比已经给定了原子个数比，解题不需要具体的总质量，选这个选项说明你没有建立\"质量比可以换算成个数比\"这一最关键的桥梁。错因诊断：质量比→个数比（要除以相对原子质量）这个换算是初中化学计算的命门，同时也是后面\"物质的量\"的思维起点，务必练熟。"},{"id":"qA016","kp":"j-6","type":"single","diff":1,"stem":"下列关于物质分类的说法，正确的是","options":["氧化物一定含有氧元素，所以含有氧元素的化合物一定是氧化物","Na₂O₂ 只由 Na、O 两种元素组成，其中一种是氧元素，所以它属于氧化物","CO 能与碱溶液反应生成盐和水，所以 CO 属于酸性氧化物","纯碱 Na₂CO₃ 的水溶液显碱性，所以 Na₂CO₃ 属于碱"],"answer":1,"explain":"B 正确。氧化物的定义只有两条：只由两种元素组成、其中一种必须是氧元素。Na₂O₂ 只含 Na、O 两种元素，符合定义，属于氧化物（它是过氧化物，是氧化物中的一小类）。A 错：把定义反过来说就错了，“含氧化合物”的范围比“氧化物”大得多，例如 H₂SO₄、NaOH、Na₂CO₃、KMnO₄ 都含氧，却因为含有三种及以上元素而不是氧化物——只能说“氧化物一定是含氧化合物，含氧化合物不一定是氧化物”，箭头是单向的。C 错：酸性氧化物指能与碱反应生成盐和水的氧化物（如 CO₂、SO₂），CO 与 NaOH 溶液不反应，它是不成盐氧化物，只是有还原性和毒性。D 错：碱的定义是“电离时产生的阴离子全部是 OH⁻ 的化合物”，Na₂CO₃ 电离出的是 Na⁺ 和 CO₃²⁻，没有 OH⁻，它由金属离子和酸根离子构成，属于盐；它俗称“纯碱”只是因为水溶液显碱性，属于盐类水解的结果，不能凭名称或溶液酸碱性判断类别。错因诊断：选 A 是逻辑上把单向箭头当成了双向箭头；选 D 是凭俗名语感分类，而没有回到定义。"},{"id":"qA017","kp":"j-6","type":"single","diff":2,"stem":"现有下列物质：①Na₂O₂　②CO　③Al₂O₃　④CO₂　⑤H₂O₂　⑥KMnO₄。按“物质 → 混合物／纯净物 → 单质／化合物 → 氧化物……”的树状分类逐级判断，下列说法正确的是","options":["属于氧化物的只有①③④，H₂O₂ 不是氧化物","属于氧化物的是①②③④⑤，而⑥KMnO₄ 是含氧化合物但不是氧化物","属于氧化物的是①②③④⑤⑥，它们都含氧元素","①Na₂O₂ 与水反应生成 NaOH，所以 Na₂O₂ 是碱性氧化物"],"answer":1,"explain":"B 正确。按树状分类逐级走一遍：这六种都是化合物；再看是不是“只由两种元素组成且其中一种是氧”——①Na₂O₂、②CO、③Al₂O₃、④CO₂、⑤H₂O₂ 都符合，全部是氧化物；⑥KMnO₄ 含 K、Mn、O 三种元素，是含氧化合物但不是氧化物。所以氧化物是①②③④⑤。A 错：漏掉了⑤，H₂O₂ 只含 H、O 两种元素，是过氧化物，仍属于氧化物；①Na₂O₂ 也属于氧化物，被漏掉同样说明只凭“见过没见过”在分类。C 错：多算了⑥，判据是元素种类，不能因为“含有氧元素”就归进氧化物，含氧 ≠ 氧化物。D 错：碱性氧化物与水反应只生成对应的碱，而 Na₂O₂ 与水反应是 2Na₂O₂ + 2H₂O → 4NaOH + O₂↑，除碱之外还放出氧气，且其中氧显 −1 价，所以 Na₂O₂ 是过氧化物，不属于碱性氧化物。错因诊断：本题的核心动作是“先数元素种类，再看组成形式，最后才谈性质”，顺序颠倒或凭印象跳过任何一级，都会选错。"},{"id":"qA018","kp":"j-6","type":"judge","diff":2,"stem":"因为“纯净物”只由一种物质组成，所以由同种元素组成的物质一定是纯净物","answer":false,"explain":"错误。这句话把判据偷偷换掉了：纯净物的判据是“由一种物质组成”，而“由同种元素组成”说的是元素的种类，两者不是一回事。反例：O₂ 和 O₃ 混合在一起，组成元素只有氧一种，但体系里确实存在两种不同的物质，属于混合物；同样，金刚石与石墨混合、红磷与白磷混合，也都只含一种元素，却都是混合物。错因诊断：本命题正好利用了“语感”——“同种元素”听起来就该是“纯净”的，但同一种元素可以组成不同的单质（同素异形体），一旦它们混在一起就是混合物。还要注意区分两句容易混淆的话：“由同种元素组成的纯净物叫单质”是对的，因为它保留了“纯净物”这个前提；一旦去掉“纯净物”三个字，命题立刻由真变假。看到“一定”“都”这类绝对化说法时，先去找反例，本题的反例就是同素异形体。"},{"id":"qA019","kp":"j-7","type":"single","diff":2,"stem":"复分解反应发生的条件是“生成沉淀、气体或水”。从微观（离子）角度看，之所以必须满足这个条件，是因为","options":["只有生成沉淀、气体或水，反应才能放出热量，反应才能进行","只有生成沉淀、气体或水，才能把溶液中的某些离子由自由离子变成难电离的物质或脱离溶液，使离子浓度显著降低","只有生成沉淀、气体或水，反应物才可能溶于水","只要反应物分别是酸、碱、盐，反应就一定能够发生"],"answer":1,"explain":"B 正确。复分解反应的实质是两种化合物互相交换成分，也就是溶液中的离子重新组合。如果组合出来的新物质仍然易溶、易电离（如 NaCl、KNO₃），离子还是自由地待在溶液里，等于什么也没有改变；只有当生成物里出现了难溶的沉淀（BaSO₄、AgCl 等）、挥发逸出的气体（CO₂ 等）或难电离的水，相关离子才被“抽走”，离子浓度显著降低，反应才能向前进行。A 错：能否发生反应与是否放热没有必然关系，很多复分解反应几乎没有热效应，例如 Ba(OH)₂·8H₂O 与 NH₄Cl 的反应反而是吸热的。C 错：反应物是否溶解与反应能否发生是两回事，BaCl₂ 溶液与 Na₂SO₄ 溶液都是可溶的，照样能反应。D 错：这是最典型的错误——“能交换成分”不等于“能发生反应”，例如 NaCl 溶液与 KNO₃ 溶液混合后，即使真的交换成分，得到的还是 NaCl 和 KNO₃，没有沉淀、气体或水，所以实际并不发生反应。错因诊断：选 D 的同学只记住了“酸碱盐之间能发生复分解反应”这句结论，却没有养成用“有没有离子被抽走变成沉淀、气体或水”去检验的习惯。"},{"id":"qA020","kp":"j-7","type":"multi","diff":2,"stem":"下列各组物质在溶液中能发生复分解反应的是（多选）","options":["稀盐酸与氢氧化钠溶液","氢氧化钠溶液与氯化钾溶液","氯化钡溶液与硫酸钠溶液","氯化钠溶液与稀硫酸"],"answer":[0,2],"explain":"A、C 能发生。解题的固定动作是：先假定它们交换成分，写出生成物，再看生成物中有没有沉淀 ↓、气体 ↑ 或水。A：HCl + NaOH → NaCl + H₂O，生成了水，能发生反应。C：BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl，生成了白色沉淀 BaSO₄，能发生反应。B 错：NaOH 与 KCl 交换成分得到 NaCl 和 KOH，两者都是易溶、易电离的强碱强酸盐，离子仍自由地待在水里，既无沉淀、又无气体、也无水，所以不发生反应。D 错：NaCl 与 H₂SO₄ 交换成分得到 Na₂SO₄ 和 HCl，Na₂SO₄ 易溶、HCl 易溶，三个条件同样一个都不满足，不能发生反应——不要因为“硫酸是强酸”就以为它跟什么盐都能反应。错因诊断：选 B、D 的同学犯的是同一个错，用“能不能交换成分”代替了“能不能发生反应”。交换成分任何酸碱盐之间都能写出来，能不能反应只由“有没有离子被抽走变成沉淀、气体或水”决定。"},{"id":"qA021","kp":"j-7","type":"judge","diff":1,"stem":"盐都是由金属离子和酸根离子构成的，所以 NH₄Cl、NH₄NO₃ 这类含有铵根离子（NH₄⁺）的化合物不属于盐","answer":false,"explain":"错误。盐的准确说法是：由金属离子或铵根离子（NH₄⁺）与酸根离子构成的化合物。NH₄Cl 由 NH₄⁺ 和 Cl⁻ 构成，NH₄NO₃ 由 NH₄⁺ 和 NO₃⁻ 构成，都完全符合盐的定义，属于盐（铵盐），而且都是常见的可溶性盐；NH₄HCO₃、(NH₄)₂SO₄ 也一样。错因诊断：本命题的陷阱是把“多数情况”当成了“全部情况”——中学常见的盐大多含金属离子，于是不少同学把“盐 = 金属离子 + 酸根离子”直接背成了定义，一遇到铵盐就判错。同类陷阱还有“盐一定含金属元素”“盐一定含有氧元素”（NaCl、KCl 就不含氧）。做概念判断题时要把定义里的每个字都看住，凡是出现“都”“一定”的表述，只要能找到一个反例，命题就一定是错的。"},{"id":"qA022","kp":"j-8","type":"single","diff":2,"stem":"把一小块金属钠放入硫酸铜溶液中，下列对现象与产物的判断，正确的是","options":["钠表面析出红色的铜，发生的是置换反应","钠先与水剧烈反应生成氢气和氢氧化钠，同时生成蓝色沉淀，不能置换出铜单质","钠浮在液面上缓慢反应，溶液由蓝色变成浅绿色","钠把铜从硫酸铜溶液中置换出来，说明钠的活动性排在铜的前面"],"answer":1,"explain":"B 正确。钠是活动性极强的金属，把它放进盐的稀溶液里，它会先与水反应：2Na + 2H₂O → 2NaOH + H₂↑（现象口诀：浮、熔、游、响、红）。生成的 NaOH 随即与 CuSO₄ 反应：2NaOH + CuSO₄ → Cu(OH)₂↓ + Na₂SO₄，看到蓝色沉淀 Cu(OH)₂，总反应可写作 2Na + 2H₂O + CuSO₄ → Cu(OH)₂↓ + Na₂SO₄ + H₂↑。所以整个过程中根本没有铜单质生成。A 错：看不到红色铜，这是把“排在前面的金属能把后面的金属从它的盐溶液中置换出来”机械套用——那条规律的前提是“该金属跟水不发生反应”，钠、钾、钙等极活泼金属不满足这个前提。C 错：Cu²⁺ 呈蓝色、Fe²⁺ 才是浅绿色，颜色对应关系搞混了；而且钠与水的反应非常剧烈，不是“缓慢反应”。D 错：由事实推出的结论正好相反，钠的活动性强于铜没错，但“活动性强”不能推出“能从盐溶液中置换出铜”，因为钠先与水反应了。错因诊断：这类题的关键不是背“前换后”，而是先问一句“这块金属会不会先和水反应”，把金属与水的反应放在最前面考虑。"},{"id":"qA023","kp":"j-8","type":"judge","diff":1,"stem":"金属活动性顺序中排在氢前面的金属，都能把稀盐酸、稀硫酸中的氢置换出来；排在氢后面的金属则不能","answer":true,"explain":"正确。这是金属活动性顺序最基本、最常用的一条用途：在顺序表 K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au 中，位于 (H) 前面的金属能与稀盐酸、稀硫酸反应放出氢气（例如 Zn + 2HCl → ZnCl₂ + H₂↑），位于 (H) 后面的金属（Cu、Hg、Ag、Pt、Au）与稀盐酸、稀硫酸不反应，即不能把酸中的氢置换出来。要顺便记牢三个易错点：一是这里的“酸”指稀盐酸、稀硫酸这类非氧化性酸，硝酸和浓硫酸与金属反应不放氢气，不能用这条规律；二是 (H) 前面的金属中，K、Ca、Na 太活泼，与水就直接剧烈反应，情况特殊；三是这条规律只管“能不能反应”，与反应快慢、放出氢气的多少无关。错因诊断：有些同学背表时只记“前换后”，把“排在氢前”这一半丢掉了，或者误以为“Cu 也能与盐酸反应，只是慢一点”，都是把规律记残了；还有同学一看到“都能”就凭语感判错，这是走到了另一个极端——这条规律在限定范围内确实是无一例外的。"},{"id":"qA024","kp":"j-9","type":"single","diff":1,"stem":"下列关于固体物质溶解度的说法，正确的是","options":["把 36 g NaCl 放入 100 g 水中完全溶解，NaCl 的溶解度就是 36 g","20 ℃ 时 100 g 水中最多能溶解 31.6 g KNO₃，所以 20 ℃ 时 KNO₃ 的溶解度是 31.6 g","某温度下，100 g 饱和溶液中含有 20 g 溶质，则该温度下该物质的溶解度是 20 g","温度越高，固体的溶解度一定越大"],"answer":1,"explain":"B 正确。它把四个要素都说清了：一定温度（20 ℃）、100 g 溶剂（水）、达到饱和（最多能溶解）、单位是克（31.6 g）。A 错：“完全溶解”不等于“达到饱和”，没饱和就不知道这 100 g 水最多能溶解多少，溶解度无从谈起；而且定义里的“100 g”指溶剂的质量，不是溶液的质量，也不是加入的溶质质量。C 错：这是把“100 g”看错了对象。溶解度定义里的 100 g 是溶剂的质量，而题干说的是 100 g 饱和溶液（其中溶剂只有 80 g）。由 S ÷ (100 g + S) = 20 g ÷ 100 g 解得该温度下的溶解度应是 25 g，不是 20 g——同样的数字，分母是“溶剂”还是“溶液”，结果完全不同。D 错：绝大多数固体随温度升高溶解度增大，但氢氧化钙 Ca(OH)₂ 的溶解度随温度升高反而减小，所以“一定越大”是错的，“一定”两个字就是陷阱。错因诊断：做溶解度题先默念四个要素——一定温度、100 g 溶剂、饱和状态、单位克，缺一个就不能叫溶解度；还要盯住“100 g”到底说的是水还是溶液。看到“一定”“都”这类绝对化词语，立刻去想有没有反例。"},{"id":"qA025","kp":"j-9","type":"single","diff":2,"stem":"下列关于“溶解度”与“溶质质量分数”的说法，正确的是","options":["同一温度下，某物质的溶解度越大，它饱和溶液的溶质质量分数就越大","比较两种物质时，只要其中一种的溶解度大，它饱和溶液的溶质质量分数就一定大，与温度无关","溶解度有单位（克），溶质质量分数没有单位，所以两者之间不存在任何换算关系","物质的溶解度大，说明它形成的溶液浓度就一定大，不管该溶液是否已经饱和"],"answer":0,"explain":"A 正确。同一温度下，饱和溶液的溶质质量分数 w 与溶解度 S 满足 w = S ÷ (100 g + S) × 100%，S 越大 w 就越大，两者一一对应、同增同减。B 错：这是本知识点最典型的陷阱，它丢掉了“一定温度”这个前提。溶解度本身就必须指明温度，脱离温度比较两种物质的溶解度大小是没有意义的；最有力的反例是 Ca(OH)₂，它的溶解度随温度升高反而减小，当温度改变时，溶解度大的那种物质，其饱和溶液的溶质质量分数完全可能反而更小，所以“与温度无关”是错的。C 错：两者只是单位不同（溶解度是质量，单位克；溶质质量分数是比值，无单位），在一定温度下的饱和溶液里它们可以互相换算，关系就是 w = S ÷ (100 g + S) × 100%。D 错：溶解度只描述“某温度下 100 g 溶剂中最多能溶解多少”，与溶液实际的浓稀无关——把很少的溶质溶在大量水里，即使该物质溶解度很大，溶液也可以很稀；反过来，溶解度很小的物质，只要不断溶解到饱和，溶液也可以很浓。错因诊断：本题真正要考的是溶解度与溶质质量分数的区别与联系——溶解度是“一定温度、100 g 溶剂、饱和”三个前提下的质量（克），溶质质量分数是任意溶液的比值（无单位）；两者只有在“同一温度、都是饱和溶液”时才能用 w = S ÷ (100 g + S) × 100% 换算，丢掉任何一个前提去比较大小时，结论都会出错。"},{"id":"qA026","kp":"j-9","type":"judge","diff":2,"stem":"20 ℃ 时某物质的溶解度为 20 g，则 20 ℃ 时该物质饱和溶液的溶质质量分数为 20%","answer":false,"explain":"错误。溶解度 20 g 的含义是：20 ℃ 时 100 g 水中最多能溶解该物质 20 g，此时溶液的总质量 = 20 g + 100 g = 120 g。所以溶质质量分数 w = 溶质质量 ÷ 溶液质量 × 100% = 20 g ÷ 120 g × 100% ≈ 16.7%，而不是 20%。正确的关系式是 w = S ÷ (100 g + S) × 100%，并且只在饱和溶液时才成立。错因诊断：把 20 g ÷ 100 g = 20% 的同学，是分母用错了——质量分数的分母永远是溶液质量（溶质质量 + 溶剂质量），不是溶剂质量。要特别注意：溶解度定义里的“100 g”是溶剂的质量，质量分数的分母是溶液的质量，这两个“100 g”含义完全不同，是这一知识点最容易掉进去的坑。"},{"id":"qA027","kp":"j-10","type":"single","diff":1,"stem":"下列离子符号或对应名称的书写，完全正确的是","options":["硫酸根离子 SO₄²⁻；铁离子 Fe²⁺","碳酸根离子 CO₃²⁻；氢氧根离子 OH⁻","镁离子 Mg²⁺；氯离子 Cl²⁻","铵根离子 NH₃⁺；钙离子 Ca²⁺"],"answer":1,"explain":"B 正确：碳酸根离子带 2 个单位负电荷，写作 CO₃²⁻；氢氧根离子带 1 个单位负电荷，写作 OH⁻。A 错：硫酸根离子 SO₄²⁻ 写对了，但 Fe²⁺ 是亚铁离子（铁显 +2 价），铁离子是 Fe³⁺（铁显 +3 价），“铁”与“亚铁”一字之差，电荷数不同。C 错：Mg²⁺ 正确，但氯离子应写作 Cl⁻，氯元素在形成离子时只得到 1 个电子，写成 Cl²⁻ 是把化合价与“带几个单位电荷”胡乱对应；顺便记牢：Cl 表示氯元素或一个氯原子，Cl₂ 表示氯气（单质），2Cl 表示两个氯原子，Cl⁻ 才是氯离子。D 错：铵根离子是 NH₄⁺（1 个氮原子和 4 个氢原子整体带 1 个单位正电荷），写成 NH₃⁺ 把原子个数和电荷位置都搞错了；Ca²⁺ 正确。错因诊断：离子符号的书写规则固定不变——元素符号（或原子团）在右下角写原子个数、在右上角写所带电荷，电荷数字在前、正负号在后，电荷数是 1 时数字省略。"},{"id":"qA028","kp":"j-10","type":"multi","diff":2,"stem":"下列常见沉淀的颜色与溶解性描述正确的是（多选）","options":["BaSO₄ 是白色沉淀，不溶于稀硝酸","Cu(OH)₂ 是蓝色沉淀，受热会分解生成黑色的 CuO","AgCl 是白色沉淀，能溶于稀硝酸","Fe(OH)₃ 是红褐色沉淀，不溶于水但能溶于稀盐酸"],"answer":[0,1,3],"explain":"A、B、D 正确。A：BaSO₄ 是白色沉淀，既难溶于水也难溶于稀盐酸、稀硝酸，正因为“不吃酸”，它常被用来检验 SO₄²⁻，并可以排除 CO₃²⁻（BaCO₃ 会溶于酸并放出 CO₂）的干扰。B：Cu(OH)₂ 是蓝色沉淀，难溶于水，受热分解生成黑色的氧化铜：Cu(OH)₂ →(Δ) CuO + H₂O。C 错：AgCl 确实是白色沉淀，但它不溶于稀硝酸——这一条恰恰是用 AgNO₃ 溶液检验 Cl⁻ 时必须加稀硝酸的原因，如果 AgCl 能被稀硝酸溶解，这个检验方法就根本不成立了；注意 AgCl 只溶于氨水。D：Fe(OH)₃ 是红褐色沉淀，难溶于水，属于碱，能与稀盐酸发生中和反应：Fe(OH)₃ + 3HCl → FeCl₃ + 3H₂O，所以会溶解并得到黄色溶液。错因诊断：本题的记忆底线是五个常见沉淀“加上颜色、加上是否溶于酸”——白色：BaSO₄（不溶于酸）、AgCl（不溶于酸）、CaCO₃（溶于酸并放出 CO₂）；蓝色：Cu(OH)₂；红褐色：Fe(OH)₃；另外 Fe(OH)₂ 是白色沉淀，在空气中会迅速变成灰绿色，最后变成红褐色。选 C 的同学多半把“AgCl 是白色沉淀”记对了，却丢掉了“加稀硝酸不溶解”这个关键性质，而后者才是离子检验和离子方程式判断的依据。"},{"id":"qA029","kp":"j-10","type":"judge","diff":3,"stem":"BaSO₄ 与 AgCl 都是白色沉淀，其中 BaSO₄ 能溶于稀盐酸并放出气体，AgCl 也能溶于稀盐酸","answer":false,"explain":"错误。前半句说两种物质都是白色沉淀，这是对的；但后面的性质判断两处都错。BaSO₄ 既不溶于水，也不溶于稀盐酸、稀硝酸，属于“不吃酸”的沉淀，放入稀盐酸中什么也不发生，更不会放出气体——能溶于稀盐酸并放出气体的是 CaCO₃、BaCO₃ 这类碳酸盐：CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑。AgCl 同样不溶于稀盐酸，也不溶于稀硝酸，只能溶于氨水。错因诊断：本命题的陷阱在于用“都是白色沉淀”这个共同点，让人误以为它们的化学性质也差不多。事实上决定沉淀行为的是它自身的组成：硫酸盐中只有 BaSO₄ 难溶，氯化物中只有 AgCl 难溶，而它们恰好都难溶于酸。真正的判据不是颜色，而是“这个沉淀放进酸里会不会被消耗掉”——只有能与 H⁺ 结合生成弱电解质（水或气体）的沉淀才会溶解，BaSO₄、AgCl 都不具备这个条件。"},{"id":"qB001","kp":"b1-1","type":"single","diff":1,"stem":"下列关于「物质的量」的说法中，正确的是","options":["物质的量是表示物质质量多少的物理量，单位是 g","物质的量的符号是 n，单位是摩尔（mol），它表示含有一定数目粒子的集合体","1 mol 就是 6.02×10²³，物质的量就是粒子个数","物质的量可以用 5 g、2 L 这样的形式表示"],"answer":1,"explain":"B 正确：物质的量是一个基本物理量，符号 n，单位只能是 mol（摩尔），它衡量的是「含有一定数目粒子的集合体」这一物理量，是联系宏观质量与微观粒子的桥梁。错因诊断：选 A 或 D，说明你把「物质的量」直接当成了质量——「物质的量是 5 g」这种说法在化学上彻底错误，质量单位是 g，物质的量的单位是 mol，两者是完全不同的物理量，这是必修一开篇最典型、也最容易带到高三的概念性错误；选 C，说明你把物质的量与粒子个数混为一谈，物质的量大小时必须用 mol 表达（如 n(H₂O) = 1 mol），只是一个描述粒子数目的物理量，不是 6.02×10²³ 这个数字本身。记住：物质的量＝用 mol 数出来的粒子集合个数，不是质量，不是体积，也不是个数。"},{"id":"qB002","kp":"b1-1","type":"single","diff":1,"stem":"下列关于摩尔质量的说法中，正确的是","options":["H₂O 的摩尔质量是 18 g","H₂O 的摩尔质量是 18 g/mol，其数值等于水的相对分子质量","CO₂ 的摩尔质量是 44","1 mol 任何物质的质量都相等"],"answer":1,"explain":"B 正确：摩尔质量是「单位物质的量的物质所具有的质量」，符号 M，单位必须是 g/mol（也可写成 kg/mol），其数值在数值上等于该物质的相对分子质量（或相对原子质量）。错因诊断：选 A 说明你把摩尔质量的单位写成了 g——g 是「质量」的单位，不是「摩尔质量」的单位，摩尔质量漏写或错写单位，在高考阅卷中是直接判错的失分点，看似小事，实则暴露出你把摩尔质量与质量混为一谈；选 C 也是单位问题，只写一个数字 44，物理量离开单位毫无意义；选 D 说明你认为「1 mol 任何物质质量都相等」，实际上 1 mol H₂O 是 18 g，1 mol CO₂ 是 44 g，1 mol Fe 是 56 g，不同物质的摩尔质量不同，1 mol 的质量自然不同。解题时请养成习惯：只要写摩尔质量，后面必须跟 g/mol。"},{"id":"qB003","kp":"b1-1","type":"single","diff":2,"stem":"下列关于 1 mol 物质所含粒子数的说法中，正确的是","options":["1 mol 任何物质都约含有 6.02×10²³ 个原子","1 mol CO₂ 中约含有 6.02×10²³ 个 CO₂ 分子","1 mol H₂O 中约含有 6.02×10²³ 个原子","摩尔是国际单位制中的一个基本物理量"],"answer":1,"explain":"B 正确：1 mol 任何粒子的集合体都约含 6.02×10²³ 个该种粒子，这里的「粒子」可以是分子、原子、离子、电子等，但必须说清楚是哪种粒子。1 mol CO₂ 约含 6.02×10²³ 个 CO₂ 分子。错因诊断：选 A 或 C 说明你把「1 mol 物质含 6.02×10²³ 个粒子」错记成了「含 6.02×10²³ 个原子」——原子数必须看化学式中的原子个数：1 mol CO₂ 含 3×6.02×10²³ 个原子（1 个 C 加 2 个 O），1 mol O₂ 含 2×6.02×10²³ 个氧原子，1 mol H₂O 含 3×6.02×10²³ 个原子，绝不能一律当成 6.02×10²³；选 D 说明你分不清「物理量」和「单位」：摩尔（mol）是单位，物质的量才是物理量，千万不要把「摩尔是物理量」当成对的。"},{"id":"qB004","kp":"b1-2","type":"single","diff":1,"stem":"下列关于气体摩尔体积 22.4 L/mol 的说法中，正确的是","options":["在标准状况下，1 mol 任何物质的体积都约为 22.4 L","在标准状况下，1 mol 任何气体的体积都约为 22.4 L","在任何温度和压强下，1 mol 任何气体的体积都约为 22.4 L","常温常压下，1 mol O₂ 的体积约为 22.4 L"],"answer":1,"explain":"B 正确。22.4 L/mol 的使用有两个前提，缺一不可：① 研究对象必须是气体；② 条件必须是标准状况（0 ℃、101 kPa）。错因诊断：选 A 说明你忽略了「气体」这个前提——标准状况下 1 mol 水约 18 mL、1 mol 铁约 7 cm³，离 22.4 L 差得极远，只有气体才谈得上 22.4 L/mol；选 C 说明你以为 22.4 L/mol 是万能常数，其实温度升高或压强减小，气体分子间平均距离变大，1 mol 气体的体积就大于 22.4 L；选 D 是最典型的丢分点，你把「常温常压（约 25 ℃、101 kPa）」当成了「标准状况」，常温常压下气体摩尔体积大于 22.4 L/mol，所以 1 mol O₂ 的体积大于 22.4 L。请把这两句话变成条件反射：用 22.4 L/mol 前先问自己——是气体吗？是标准状况吗？"},{"id":"qB005","kp":"b1-2","type":"single","diff":2,"stem":"阿伏加德罗定律指出，同温同压下相同体积的任何气体含有相同的分子数。其根本原因是","options":["不同气体分子的质量都相同","不同气体分子的直径大小都相同","同温同压下气体分子间的平均距离基本相同，而分子直径远小于分子间距离，气体体积主要由分子数目和分子间距离决定","气体分子之间没有间隔，所以气体体积只由分子本身的大小决定"],"answer":2,"explain":"C 正确，这就是 22.4 L/mol 的底层逻辑：气体体积的大小由「分子数目」和「分子间的平均距离」共同决定；由于分子本身直径远小于分子间平均距离（通常小一个数量级以上），气体的体积几乎完全由分子间距离决定。同温同压下，任何气体分子间的平均距离基本相同，于是分子数相同时体积就基本相同，标准状况下这个体积恰好约 22.4 L。错因诊断：选 A 或 B 说明你把气体体积的成因错误归到了分子质量或分子大小上——H₂ 与 CO₂ 分子质量和大小都相差悬殊，可同温同压下 1 mol 的体积却都约为 22.4 L，这恰恰证明体积与分子本身的质量、大小无关；选 D 说明你持有「气体分子之间没有间隔」的错误认知，气体容易被压缩、能相互扩散，正是因为分子间有较大的间隔。懂了这一层，你就不会再把 22.4 L/mol 当成「1 mol 气体的固定体积」，而会明白它只是标准状况下的一个特例数值。"},{"id":"qB006","kp":"b1-2","type":"judge","diff":2,"stem":"常温常压下，22.4 L CO₂ 气体的物质的量约为 1 mol。","answer":false,"explain":"错误。22.4 L/mol 只在标准状况（0 ℃、101 kPa）下成立。常温常压比标准状况温度更高、压强更小，气体分子间平均距离更大，气体摩尔体积大于 22.4 L/mol，因此常温常压下 22.4 L CO₂ 的物质的量小于 1 mol。错因诊断：判「正确」说明你看到 22.4 L 这个数字就条件反射地除以 22.4 L/mol，根本没有先确认前提条件——「体积算物质的量必须先看是否标准状况」是高考出现频率最高的陷阱之一。凡是题目给出气体体积让你算物质的量，第一步永远是圈出温度和压强，不是标准状况就不能用 22.4 L/mol。"},{"id":"qB007","kp":"b1-2","type":"single","diff":2,"stem":"配制 0.5 L 1 mol/L 的 NaCl 溶液，下列说法正确的是","options":["该溶液中 NaCl 的物质的量为 0.5 mol，大约含有 0.5×6.02×10²³ 个 Na⁺","该溶液中 NaCl 的物质的量为 1 mol","该溶液的物质的量浓度就是溶质的质量分数","称取 58.5 g NaCl 溶于 0.5 L 水中即得该溶液"],"answer":0,"explain":"A 正确：n = c·V = 1 mol/L × 0.5 L = 0.5 mol；NaCl 是强电解质，在水中完全电离，0.5 mol NaCl 提供 0.5 mol Na⁺，即约 0.5×6.02×10²³ 个 Na⁺。错因诊断：选 B 说明你把体积当成了 1 L，或者把「浓度 1 mol/L」直接当成了「物质的量 1 mol」——物质的量＝浓度×溶液体积，这一步不能省；选 C 说明你分不清两个概念：物质的量浓度＝溶质的物质的量 ÷ 溶液体积（单位 mol/L），溶质质量分数＝溶质质量 ÷ 溶液质量（用百分数表示），两者单位都不一样；选 D 说明你忽略了「溶液体积 ≠ 溶剂体积」——固体溶解后溶液体积会发生变化，58.5 g NaCl 溶于 0.5 L 水所得溶液体积不再是 0.5 L，正确操作是称 58.5 g NaCl，在 0.5 L 容量瓶中定容配成 0.5 L 溶液。"},{"id":"qB008","kp":"b1-3","type":"single","diff":1,"stem":"下列物质在离子方程式中应拆写成离子形式的是","options":["CH₃COOH","NaOH","CaCO₃","H₂O"],"answer":1,"explain":"B 正确：NaOH 是可溶的强碱，在水中完全电离出 Na⁺ 和 OH⁻，必须拆成离子。离子方程式的拆分规则只有一句话：强酸、强碱、可溶性盐全拆成离子；弱酸、弱碱、难溶物、气体和水一律写化学式。错因诊断：选 A 说明你没抓住「弱酸不拆」——CH₃COOH 是弱酸，在水里只有极少数分子电离，主要存在形式是分子，必须写 CH₃COOH；选 C 说明你忽略了难溶物这一条：CaCO₃ 难溶于水，溶液中 CO₃²⁻ 浓度极小，把它写成 CO₃²⁻ 是错的；选 D 说明你忘了水是弱电解质，H₂O 在离子方程式中要写成化学式（例如 H⁺ + OH⁻ → H₂O 中的水不能拆）。请把判断顺序固定下来：先看是不是强酸、强碱、可溶性盐，是就拆，不是就写化学式。"},{"id":"qB009","kp":"b1-3","type":"single","diff":2,"stem":"下列离子方程式中，书写错误的是","options":["醋酸与氢氧化钠溶液反应：CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O","碳酸钙与盐酸反应：CO₃²⁻ + 2H⁺ → H₂O + CO₂↑","氯化钠溶液与硝酸银溶液反应：Cl⁻ + Ag⁺ → AgCl↓","氢氧化钡溶液与稀硫酸反应：Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ → BaSO₄↓ + 2H₂O"],"answer":1,"explain":"B 错误，本题选 B。CaCO₃ 难溶于水，属于难溶物，在离子方程式中必须写化学式、不能拆，正确写法是 CaCO₃ + 2H⁺ → Ca²⁺ + H₂O + CO₂↑。错因诊断：没选 B 说明你拆分时只看「碳酸根遇氢离子放二氧化碳」这个结果，看到 CO₃²⁻ + 2H⁺ 就顺手判它对——请牢记：拆之前先判断该物质属于「强酸、强碱、可溶性盐」中的哪一类，不属于这三类的一律写化学式，CaCO₃ 就不能拆。A 正确：CH₃COOH 是弱酸不拆，只把 NaOH 拆成 Na⁺ 和 OH⁻；C 正确：NaCl、AgNO₃ 都是可溶性盐，都要拆，AgCl 是沉淀不拆；D 正确：Ba(OH)₂ 是强碱、H₂SO₄ 是强酸，都要拆，且 Ba²⁺ 与 SO₄²⁻ 按 1∶1 结合，电荷与原子均已配平。"},{"id":"qB010","kp":"b1-3","type":"multi","diff":2,"stem":"下列物质在离子方程式中必须写成化学式、不能拆成离子的有","options":["H₂CO₃","H₂SO₄","BaSO₄","CO₂"],"answer":[0,2,3],"explain":"A、C、D 都不能拆：H₂CO₃ 是弱酸（弱电解质），BaSO₄ 是难溶物（沉淀），CO₂ 是气体，它们在离子方程式中一律写化学式。B 不符合题意：H₂SO₄ 是强酸，属于在水溶液中完全电离的强电解质，应当拆成 2H⁺ 和 SO₄²⁻。错因诊断：漏选 A 说明你只记住了「沉淀、气体不拆」，没把弱酸、弱碱这类弱电解质归入「不拆」的行列；漏选 D 说明你没意识到气体同样不能拆；误选 B 说明你把「含氢的酸都当成弱酸」，或者忘了强酸必须拆。判断口诀：强酸强碱可溶盐拆，弱酸弱碱沉淀气体水不拆，其中「可溶」这两个字千万不能丢。"},{"id":"qB011","kp":"b1-4","type":"single","diff":1,"stem":"下列各组离子在水溶液中能大量共存的是","options":["H⁺、Na⁺、Cl⁻、CO₃²⁻","Ba²⁺、Na⁺、NO₃⁻、SO₄²⁻","K⁺、Na⁺、NO₃⁻、Cl⁻","H⁺、Na⁺、CH₃COO⁻、Cl⁻"],"answer":2,"explain":"C 正确：K⁺、Na⁺、NO₃⁻、Cl⁻ 相互之间不发生任何反应，可以大量共存。离子不能大量共存的本质，是离子之间能发生反应使某种离子浓度明显减小。错因诊断：选 A 说明你漏掉了 H⁺ 与 CO₃²⁻ 会反应放出气体：2H⁺ + CO₃²⁻ → H₂O + CO₂↑；选 B 说明你漏掉了 Ba²⁺ 与 SO₄²⁻ 会生成难溶的 BaSO₄ 沉淀；选 D 说明你只检查了「有没有沉淀、有没有气体」，忘了 H⁺ 与 CH₃COO⁻ 会结合成弱电解质 CH₃COOH——生成弱酸同样不能大量共存。建议把判断顺序固定为三步：一看沉淀（AgCl、BaSO₄、CaCO₃、Mg(OH)₂ 等），二看气体（H⁺ 与 CO₃²⁻、HCO₃⁻ 等），三看弱电解质（H⁺ 与 CH₃COO⁻，OH⁻ 与 NH₄⁺ 等）。"},{"id":"qB012","kp":"b1-4","type":"single","diff":2,"stem":"在无色透明的强碱性溶液中，能大量共存的离子组是","options":["Fe³⁺、Cl⁻、SO₄²⁻、K⁺","Cu²⁺、NO₃⁻、Na⁺、Cl⁻","NH₄⁺、Mg²⁺、Cl⁻、NO₃⁻","Na⁺、K⁺、SO₄²⁻、Cl⁻"],"answer":3,"explain":"D 正确：这四种离子之间不反应，都是无色离子，在强碱性条件下也能稳定存在。错因诊断：选 A，说明你同时漏掉了两个隐含条件——Fe³⁺ 的水溶液呈棕黄色，不满足「无色」；而且 Fe³⁺ + 3OH⁻ → Fe(OH)₃↓，在强碱性溶液中根本不能存在；选 B，说明你忘了 Cu²⁺ 的水溶液呈蓝色（不满足「无色」），并且 Cu²⁺ + 2OH⁻ → Cu(OH)₂↓；选 C，说明你漏掉了 NH₄⁺ 与 OH⁻ 生成弱电解质 NH₃·H₂O、Mg²⁺ 与 OH⁻ 生成 Mg(OH)₂ 沉淀。题干中的「无色」「强酸性」「强碱性」都是必须圈出来的隐含条件：无色溶液要排除 Cu²⁺（蓝色）、Fe³⁺（棕黄色）、Fe²⁺（浅绿色）、MnO₄⁻（紫红色）等有色离子；强酸性溶液相当于含有大量 H⁺，强碱性溶液相当于含有大量 OH⁻，都要当成一种离子参与判断，而不能只看题目列出的几个离子。"},{"id":"qB013","kp":"b1-4","type":"multi","diff":3,"stem":"下列各组离子在水溶液中不能大量共存的有","options":["Fe³⁺、I⁻、SO₄²⁻、K⁺","MnO₄⁻、H⁺、Cl⁻、K⁺","Na⁺、NO₃⁻、SO₄²⁻、Cl⁻","H⁺、K⁺、SO₄²⁻、Cl⁻"],"answer":[0,1],"explain":"A、B 都不能大量共存，原因是发生了氧化还原反应。A 中 Fe³⁺ 具有氧化性、I⁻ 具有还原性，二者反应：2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂，I⁻ 被氧化成 I₂ 后无法大量存在；B 中 MnO₄⁻ 在酸性条件下氧化性很强，会把 Cl⁻ 氧化为 Cl₂：2MnO₄⁻ + 16H⁺ + 10Cl⁻ → 2Mn²⁺ + 5Cl₂↑ + 8H₂O。C、D 中各离子相互之间不发生反应（D 中 H⁺、K⁺、SO₄²⁻、Cl⁻ 可在溶液中稳定共存），可以大量共存，不符合题意。错因诊断：漏选 A 或 B，说明你判断离子共存时只检查了「沉淀、气体、弱电解质」这三条，忘了第四条判据——氧化还原反应：氧化性离子（Fe³⁺、MnO₄⁻、ClO⁻，以及酸性条件下的 NO₃⁻、Cr₂O₇²⁻ 等）与还原性离子（I⁻、S²⁻、SO₃²⁻、Fe²⁺ 等）不能大量共存，这是离子共存题中区分度最高、也最容易被忽略的一类，必须单独记成一条规则。"},{"id":"qB014","kp":"b1-5","type":"single","diff":1,"stem":"判断一个反应是否属于氧化还原反应，最本质的依据是","options":["反应物或生成物中是否有氧元素","反应物或生成物中是否有单质","反应前后是否有元素的化合价发生变化","反应过程中是否有气体放出或沉淀生成"],"answer":2,"explain":"判断氧化还原反应唯一的本质依据是「反应前后有没有元素的化合价发生变化」：有化合价升降（实质是电子转移）就是氧化还原反应，没有就不是。\n【错因诊断】\nA 望文生义：把「氧化」两个字的字面意思当成了「必须有氧」。反例：CaO + H₂O → Ca(OH)₂ 中有氧元素参加，但 Ca、O、H 的化合价反应前后分别是 +2、-2、+1，一个都没变，所以它是化合反应、不是氧化还原反应；反过来的例子是 2Na + Cl₂ → 2NaCl，整个反应里一点氧都没有，却是标准的氧化还原反应。\nB 拿现象当依据：有单质参加或生成的反应「常常」是氧化还原反应（如 2Na + Cl₂ → 2NaCl），但这只是伴随现象，不能作判断依据。3O₂ → 2O₃ 反应物、生成物都是单质，可氧元素的化合价始终是 0，没有变化，它不是氧化还原反应；而 3NO₂ + H₂O → 2HNO₃ + NO 里根本没有单质，N 的化合价却由 +4 变成了 +5 和 +2，它是氧化还原反应。\nD 把复分解反应的特征搬了过来：NaCl + AgNO₃ → AgCl↓ + NaNO₃ 有沉淀生成，但各元素化合价全都没变，不是氧化还原反应；放气体的 CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑ 同样不是。\n【建议】以后拿到一个反应，先给每种元素标上化合价，逐个比较反应前后是否改变，别背「有氧就是氧化还原」这种伪口诀。"},{"id":"qB015","kp":"b1-5","type":"single","diff":2,"stem":"对于反应 Fe + CuSO₄ → FeSO₄ + Cu，下列说法正确的是","options":["Fe 是氧化剂，发生还原反应","Fe 是还原剂，被氧化，FeSO₄ 是氧化产物","CuSO₄ 是还原剂，被氧化","Cu 是氧化产物，CuSO₄ 被氧化"],"answer":1,"explain":"先标化合价：Fe 由 0 价 → +2 价（升高），Cu 由 +2 价 → 0 价（降低）。化合价升高、失去电子、被氧化的是还原剂，所以 Fe 是还原剂，它被氧化以后得到的 FeSO₄ 叫氧化产物；化合价降低、得到电子、被还原的是氧化剂，所以 CuSO₄ 是氧化剂，它被还原以后得到的 Cu 叫还原产物。\n记忆口诀「升失氧还」：化合价升高、失去电子、被氧化、作还原剂，这四个说法永远指同一种物质；反过来「降得还氧」：化合价降低、得到电子、被还原、作氧化剂，也指同一种物质。\n【错因诊断】\nA：只记住了「氧化剂」这个词，把「作氧化剂」和「发生还原反应」错配给了 Fe。Fe 失去电子、被氧化，发生的应该是氧化反应。学生最常见的错就是把「氧化剂／还原剂」和「被氧化／被还原」四组对应关系记串，根子在于没有先标化合价，靠名称硬背。\nC：CuSO₄ 中的 Cu 由 +2 降到 0，是得到电子被还原，它作的是氧化剂，说反了。\nD：Cu 是 CuSO₄ 被还原后的产物，应该叫还原产物；CuSO₄ 得到电子，发生的是还原反应而不是氧化反应。\n【建议】做这类题固定两步：① 标出变价元素的化合价；② 用「升失氧还」把方向和名称一次写全——升高、失电子、被氧化、作还原剂、生成氧化产物。"},{"id":"qB016","kp":"b1-5","type":"single","diff":2,"stem":"下列关于氧化剂和氧化性的说法，正确的是","options":["氧化剂一定含有氧元素","一种物质得到电子的数目越多，它的氧化性就越强","氧化剂在反应中得到电子、被还原，发生的是还原反应","氧化剂被还原后得到的产物叫作氧化产物"],"answer":2,"explain":"氧化剂就是「在反应中得到电子、化合价降低、被还原」的物质，它发生的反应叫还原反应（对应口诀「降得还氧」）；它被还原以后的产物叫还原产物。\n【错因诊断】\nA 望文生义：把「氧化剂」的「氧」字当成了「含氧」。判断某物质是不是氧化剂，只看它有没有得电子、化合价有没有降低，与它含不含氧毫无关系。反例：2Na + Cl₂ → 2NaCl 中 Cl₂ 得到电子、作氧化剂，而 Cl₂ 里根本没有氧；Cl₂ + 2KBr → 2KCl + Br₂ 中 Cl₂ 同样是氧化剂。\nB 把「数量」当成了「能力」：氧化性的强弱指物质得电子的难易程度（好不好得、抢得凶不凶），是「能力」问题；而得电子的数目是「一个微粒转移几个电子」的数量问题。二者不是一回事，不能说得电子多的氧化性就强。比较氧化性强弱要看在相同条件下的反应难易，而不是数电子的个数。\nD 对应关系记串了：氧化剂被还原后的产物是还原产物，还原剂被氧化后的产物才是氧化产物。可以这样记——产物名称跟的是「氧化剂／还原剂」被变化的那个动作，谁被还原，产物就叫还原产物。\n【建议】把四个名称排成一条线：还原剂 →（失电子、被氧化、化合价升高）→ 氧化产物；氧化剂 →（得电子、被还原、化合价降低）→ 还原产物。"},{"id":"qB017","kp":"b1-6","type":"single","diff":2,"stem":"在反应 2Na + Cl₂ → 2NaCl 中，若有 1 mol Na 完全反应，则转移电子的物质的量为","options":["0.5 mol","1 mol","2 mol","无法确定"],"answer":1,"explain":"先标化合价：Na 由 0 价 → +1 价，每个 Na 原子失去 1 个电子；Cl 由 0 价 → -1 价，每个 Cl 原子得到 1 个电子。1 mol Na 参加反应就失去 1 mol 电子，所以转移电子数为 1 mol。用另一半验证一下：1 mol Na 只需 0.5 mol Cl₂，0.5 mol Cl₂ 含 1 mol Cl 原子，每个 Cl 得 1 个电子，共得 1 mol 电子，得失相等，答案自洽。\n【错因诊断】\n选 C（2 mol）：直接照抄方程式里 Na 的系数 2，或者把「2Na + Cl₂ → 2NaCl 转移 2e⁻」这条整方程式的电子数当成了 1 mol Na 的量，没有把电子数跟「参加反应的物质的量」按比例对应；也有的学生把 Na 失的电子和 Cl₂ 得的电子各算一遍再加起来（1 + 1 = 2），重复计算了。\n选 A（0.5 mol）：错把 Cl₂ 的系数 0.5 当成了电子数，或者以为 1 mol Na 只失去「半个电子」。电子只能一个整个地转移，绝不会出现 0.5 mol 电子的情况。\n选 D（无法确定）：没有抓住「失电子总数 = 得电子总数」这个确定关系。只要价态变化写清楚了，转移电子数就是唯一确定的。\n【方法】转移电子数 = 某元素化合价的变化数 × 该元素参加反应的物质的量（再乘上每个微粒里的原子个数）；算完一定用「失电子总数 = 得电子总数」检查一遍。注意：转移电子数是「总得失电子数」，不是把得失两边相加。"},{"id":"qB018","kp":"b1-6","type":"single","diff":3,"stem":"反应 MnO₂ + HCl(浓) → MnCl₂ + Cl₂↑ + H₂O（加热条件下进行）配平后，若有 1 mol MnO₂ 完全反应，则转移电子的物质的量为","options":["1 mol","2 mol","4 mol","8 mol"],"answer":1,"explain":"配平（化合价升降法，靠「电子守恒 + 原子守恒」两条腿走路）：\n① 标价态：Mn 由 +4 → +2，降 2 价，得 2e⁻，MnO₂ 是氧化剂；Cl 由 -1 → 0，升 1 价，每个被氧化的 Cl 失 1e⁻，HCl 是还原剂。\n② 电子守恒：MnO₂ 得 2e⁻，就要有 2 个 Cl 各失 1e⁻，即生成 1 个 Cl₂ 分子，所以 MnO₂ 与 Cl₂ 的系数都是 1。\n③ 原子守恒：生成 MnCl₂ 还要 2 个 Cl 原子，加上被氧化的 2 个 Cl，一共需要 4 个 Cl，故 HCl 的系数为 4；再数 H 有 4 个，得 H₂O 系数为 2。\n配平结果：MnO₂ + 4HCl(浓) → MnCl₂ + Cl₂↑ + 2H₂O。\n④ 算电子：1 mol MnO₂ 中的 Mn 由 +4 降到 +2，共得 2 mol 电子，所以转移电子数为 2 mol（另一半也可验证：被氧化的 2 mol Cl⁻ 共失 2 mol 电子）。\n【错因诊断】\n选 C（4 mol）：只看 HCl 的系数是 4，就以为「4 个 HCl 都被氧化、共失 4 个电子」。这是本题最大的坑——参加反应的 4 mol HCl 里，只有 2 mol 的 Cl 化合价由 -1 升到 0 被氧化，另外 2 mol 只是以 Cl⁻ 的形式跟 Mn²⁺ 结合成 MnCl₂，化合价全程没变，不参与电子转移。一定要分清「参加反应的 HCl」和「被氧化的 HCl」：本题被氧化的 HCl 只占参加反应 HCl 的一半。\n选 A（1 mol）：要么忘了每个 Mn 是降 2 价，只按降 1 价算；要么只数了 1 个 Cl 原子的失电子数（忘了 1 个 Cl₂ 分子里有 2 个 Cl）。\n选 D（8 mol）：把 Cl 由 -1 → 0 记成了「升 2 价」，再用 4 × 2 = 8；或者把得失两边的电子数加起来（4 + 4）算成了转移总数。\n【方法】转移电子数永远等于「失电子总数」也等于「得电子总数」，绝不是二者之和。"},{"id":"qB019","kp":"b1-7","type":"single","diff":1,"stem":"把一小块金属钠投入水中（水中已滴加几滴酚酞），下列现象与解释都正确的是","options":["钠浮在水面上，说明钠的密度比水小；钠熔成小球，说明反应放热且钠的熔点较低","钠沉在水底，说明钠的密度比水大","产生的气体是 O₂，可用带火星的木条检验","溶液变红，说明钠与水反应生成了 Na₂O"],"answer":0,"explain":"钠与水反应：2Na + 2H₂O → 2NaOH + H₂↑，五个现象记住五个字「浮、熔、游、响、红」，每个字都要能说出原因：\n浮——钠的密度（约 0.97 g/cm³）比水小，所以浮在水面上；\n熔——反应放热，而钠的熔点只有 97.8 ℃，很低，所以熔成一个闪亮的小球；\n游——生成的 H₂ 不断从钠球表面逸出，推动小球在水面上四处游动；\n响——反应剧烈、气体逸出很快，发出「嘶嘶」的响声（量大时甚至会燃烧、轻微爆鸣）；\n红——生成的 NaOH 使酚酞变红（溶液显碱性）。\n【错因诊断】\nB：现象就记反了。学生凭「金属一般都比水重」的生活直觉猜钠会沉底。其实钠是密度比水小的金属，必须记牢「浮」而不是「沉」。\nC：气体记成了 O₂。这是把「钠在空气中燃烧」和「钠与水反应」两件事混在了一起。钠与水反应时，氧元素在水里，水中的 H 得电子被还原成 H₂，所以放出的气体是氢气——这一点还能顺带说明钠与水反应中水作氧化剂、氧元素化合价没变。检验方法是收集后点燃（有爆鸣声/淡蓝色火焰），不能用带火星的木条。\nD：产物记成了 Na₂O。钠与水反应直接生成 NaOH，并不是先生成 Na₂O 再溶于水；Na₂O 是钠在常温下与 O₂ 缓慢氧化得到的产物，两者不是一回事。而且只凭「溶液变红」也只能说明生成了碱性物质，不能当成「生成了 Na₂O」的证据。\n【建议】把「浮熔游响红」五个字和五条原因配对背下来，考试遇到实验现象题，先想这五个字，再逐条核对。"},{"id":"qB020","kp":"b1-7","type":"single","diff":2,"stem":"下列关于 Na₂O 和 Na₂O₂ 的说法，正确的是","options":["Na₂O₂ 中氧元素的化合价是 -2 价，与 Na₂O 中氧的化合价相同","Na₂O₂ 与水反应只生成 NaOH，不生成其他物质","Na₂O 与 CO₂ 反应也能放出 O₂","Na₂O₂ 能与 CO₂ 反应放出 O₂，可用作潜水艇、呼吸面具中的供氧剂"],"answer":3,"explain":"Na₂O₂ 与 CO₂ 反应：2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂↑，把人呼出的 CO₂ 吸收掉，同时放出 O₂，所以可以作供氧剂（它吸收水蒸气时也能放出 O₂：2Na₂O₂ + 2H₂O → 4NaOH + O₂↑）。\n【错因诊断】\nA：掉进了「氧在化合物里一定显 -2 价」这个错误前概念。Na₂O₂ 中 Na 显 +1 价，按「化合物中各元素化合价代数和为零」算：2×(+1) + 2×x = 0，得 x = -1，即 Na₂O₂ 中氧是 -1 价，与 Na₂O 中氧的 -2 价并不相同（H₂O₂ 中的氧也是 -1 价）。一句话：氧的化合价不是永远 -2，写不出 -2 就动手算一算。\nB：只记住了「过氧化钠与水反应生成 NaOH」，漏了同时放出的 O₂。把 Na₂O₂ + H₂O 和 Na₂O + H₂O（只生成 NaOH）混成了一件事。要注意这两个反应其实都是氧化还原反应：Na₂O₂ 中 -1 价的氧，一半升到 0 价变成 O₂、一半降到 -2 价进入 NaOH。\nC：Na₂O 与 CO₂ 反应是 Na₂O + CO₂ → Na₂CO₃，生成的是碳酸钠，反应中各元素化合价都没有变化，不可能放出 O₂。能放出 O₂ 的是 Na₂O₂，不要张冠李戴。\n【补充】从物质类别看，Na₂O 是碱性氧化物，而 Na₂O₂ 属于过氧化物，不属于碱性氧化物；两者都能与水、与 CO₂ 反应，但产物不同，这是最容易被记混的一对，建议用上面的两个方程式对照着记。"},{"id":"qB021","kp":"b1-7","type":"single","diff":1,"stem":"关于 NaHCO₃ 和 Na₂CO₃ 的说法，正确的是","options":["Na₂CO₃ 的热稳定性比 NaHCO₃ 差，受热更易分解","相同温度下，Na₂CO₃ 在水中的溶解度比 NaHCO₃ 小","把 Na₂CO₃ 转化为 NaHCO₃，可向 Na₂CO₃ 溶液中通入足量 CO₂","两者都能与盐酸反应放出 CO₂，所以都可直接用作治疗胃酸过多的药物"],"answer":2,"explain":"正确项：Na₂CO₃ + CO₂ + H₂O → 2NaHCO₃，通入足量 CO₂ 即可把 Na₂CO₃ 转化为 NaHCO₃；反过来 NaHCO₃ 只要加热就能分解成 Na₂CO₃，因为 NaHCO₃ 的热稳定性明显比 Na₂CO₃ 差。\n错误项诊断：A 把稳定性说反了——NaHCO₃ 受热分解（2NaHCO₃ —△→ Na₂CO₃ + H₂O + CO₂↑），Na₂CO₃ 受热稳定不分解，这也是鉴别固体 NaHCO₃ 与 Na₂CO₃ 的常用方法；B 把溶解度说反了——相同温度下 Na₂CO₃ 的溶解度大于 NaHCO₃，所以向饱和 Na₂CO₃ 溶液中通 CO₂ 会析出 NaHCO₃ 晶体，这也是侯氏制碱法先得到 NaHCO₃ 的原因；D 混淆了「能与盐酸反应」和「可以药用」——两者确实都能与盐酸反应放出 CO₂，但 Na₂CO₃ 碱性强、对胃黏膜刺激大，绝不能当胃药，只有 NaHCO₃ 可作抗酸药。\n错因诊断：本题最典型的错法是「两兄弟物质性质一律套用」，把 NaHCO₃ 的性质（受热分解、溶解度小）不加区分地安到 Na₂CO₃ 头上。凡是考 Na₂CO₃/NaHCO₃ 的题，先抓住三条硬对比：热稳定性 Na₂CO₃ > NaHCO₃、相同温度溶解度 Na₂CO₃ > NaHCO₃、与足量盐酸反应时相同质量的 NaHCO₃ 放出 CO₂ 更多（摩尔质量小）。"},{"id":"qB022","kp":"b1-8","type":"single","diff":1,"stem":"关于液氯、新制氯水的说法，正确的是","options":["氯气能与 Na、Fe、Cu 反应，说明氯气的还原性很强","干燥的氯气能使干燥的有色布条褪色","液氯就是液态的氯气，其中含有 HClO，所以也有漂白性","新制氯水中含有 HClO，它能杀死水中的细菌，并有漂白作用"],"answer":3,"explain":"正确项：Cl₂ 溶于水时部分与水反应 Cl₂ + H₂O ⇌ HCl + HClO，生成的 HClO 有强氧化性，能杀菌消毒、漂白有色物质，这正是新制氯水既有刺激性气味又有漂白性的原因。\n错误项诊断：A 把氧化性和还原性搞反——氯气能跟 Na、Fe、Cu 这些金属以及 H₂ 反应，氯气是得到电子的那一位，所以氯气表现的是强氧化性，不是还原性；B 错在忘记「水」这个必要条件——真正起漂白作用的是 HClO，干燥的氯气与有色布条接触时没有水，不能生成 HClO，所以不褪色（干燥氯气可保存在干燥的钢瓶中就是这个道理）；C 混淆了液氯与新制氯水的成分——液氯是纯净的 Cl₂（只含 Cl₂ 分子），没有 HClO，没有漂白性；只有氯气溶解于水并与水反应后才产生 HClO，才有漂白性。\n错因诊断：学生最容易凭「氯气有漂白性」这句话的印象直接错选 B 或 C。请建立一条硬规则：Cl₂ 本身没有漂白性，漂白性来自 HClO；干燥氯气不褪色、只有湿润（新制氯水）有色布条才褪色，这一组对比实验就是用来证明「起漂白作用的是 HClO 而不是 Cl₂」的。"},{"id":"qB023","kp":"b1-8","type":"multi","diff":2,"stem":"关于新制氯水的成分，下列说法正确的是（多选）","options":["含有 Cl₂ 分子、HClO 分子和 H₂O 分子","含有 H⁺、Cl⁻、ClO⁻ 和 OH⁻","含有 Cl₂ 分子、HClO 分子、HCl 分子和 H₂O 分子","含有 H⁺、Cl⁻、ClO⁻ 和 H₂ 分子"],"answer":[0,1],"explain":"正确项：新制氯水的成分要按「三分子、四离子」记——三分子是 Cl₂、HClO、H₂O，四离子是 H⁺、Cl⁻、ClO⁻、OH⁻。故 A、B 正确。\n错误项诊断：C 多写了 HCl 分子，这是最典型的陷阱——Cl₂ + H₂O ⇌ HCl + HClO 中的 HCl 是强酸，在水中完全电离成 H⁺ 和 Cl⁻，所以氯水中不存在 HCl 分子，只有它的离子；D 多写了 H₂ 分子，氯气与水反应不是置换反应，根本不产生氢气（H₂ 要用 Zn 与稀盐酸等制取，与氯水无关）。\n错因诊断：90% 的错误来自「会写化学方程式但不会拆微粒」。学生把 Cl₂ + H₂O ⇌ HCl + HClO 的产物当成分子直接搬进选项，于是错选 C；还有人凭「氯水是液体、像盐酸」猜出 HCl 分子。正确思路有两步：①看到可逆符号就知道 Cl₂ 只是部分反应，所以反应物 Cl₂ 分子仍然留在水中；②遇到强电解质（HCl）要拆成离子，遇到弱电解质（HClO）才保留分子形式。另外必须分清「新制氯水」与「久置氯水」：久置氯水中 HClO 见光分解（2HClO —光照→ 2HCl + O₂↑），氯水最终变成很稀的盐酸，基本只剩 H⁺、Cl⁻ 和 H₂O，漂白性和杀菌能力都消失——这就是「新制氯水成分不同」的根源。"},{"id":"qB024","kp":"b1-8","type":"single","diff":2,"stem":"工业上用氯气与石灰乳反应制取漂白粉。下列关于漂白粉的说法，正确的是","options":["漂白粉的有效成分是 Ca(ClO)₂","漂白粉的主要成分是 CaCl₂ 和 Ca(OH)₂","漂白粉的漂白原理是它本身直接使有色物质褪色","漂白粉长期露置在空气中失效，只是因为吸收了空气中的 CO₂"],"answer":0,"explain":"正确项：漂白粉是混合物，主要成分是 Ca(ClO)₂ 和 CaCl₂，其中具有漂白、杀菌能力的有效成分是 Ca(ClO)₂（制法：2Cl₂ + 2Ca(OH)₂ → Ca(ClO)₂ + CaCl₂ + 2H₂O）。\n错误项诊断：B 把主要成分记错了——澄清石灰水或石灰乳与氯气反应生成的是 Ca(ClO)₂ 和 CaCl₂，Ca(OH)₂ 只是原料，工业产品中即使残留也绝不能称为主要成分；C 错在把「漂白粉」和「起漂白作用的物质」混为一谈——漂白粉本身不能漂白，它必须与空气中的 CO₂ 和水蒸气作用：Ca(ClO)₂ + CO₂ + H₂O → CaCO₃↓ + 2HClO，真正使有色物质褪色的是生成的 HClO；D 只说了半个原因——CO₂ 必须和水同时参加，没有水就不能生成 HClO；而且漂白粉失效还有第二条通道：其中的 HClO（及 Ca(ClO)₂）见光、受热会分解，所以漂白粉要密封、避光保存。\n错因诊断：学生常把「有效成分」和「主要成分」当成一回事（选项 A、B 就是逼你分清这两个词）；也常忽略 CO₂ 与 H₂O 是「联手」起作用的（选项 D）。记住一句口诀：漂白粉→遇潮湿空气（CO₂ + H₂O）→生成 HClO→才漂白、才失效。"},{"id":"qB025","kp":"b1-8","type":"judge","diff":2,"stem":"判断：检验某溶液中是否含有 Cl⁻，正确的做法是先滴加稀硝酸酸化，再滴入 AgNO₃ 溶液，若出现白色沉淀则说明含有 Cl⁻。","options":["正确","错误"],"answer":true,"explain":"命题正确。检验 Cl⁻ 的标准操作是：取少量待测液，先滴加稀硝酸酸化，再滴入 AgNO₃ 溶液，若产生白色沉淀（AgCl，不溶于稀硝酸），则说明含有 Cl⁻。\n为什么要用稀硝酸酸化：①排除干扰离子——Ag₂CO₃、Ag₂SO₃ 等沉淀也是白色的，但它们都能溶于稀硝酸，只有 AgCl 不溶于稀硝酸，先酸化就能排除 CO₃²⁻、SO₃²⁻ 等的干扰；②防止 AgNO₃ 水解，保证 Ag⁺ 以离子形式存在；③使可能存在的其他弱酸根离子处于酸性条件而不生成沉淀。\n为什么只能用稀硝酸、绝不能用稀盐酸酸化：Cl⁻ 检验的本质是 Ag⁺ + Cl⁻ → AgCl↓（白色），如果改用稀盐酸酸化，就等于自己往待测液里引入了大量 Cl⁻，无论原溶液中有没有 Cl⁻都会出现白色沉淀，结论完全失去意义——这是一道极高频的陷阱。\n错因诊断：不少学生把「加酸酸化」与「加稀盐酸酸化」画等号（认为盐酸也是酸），这是只记结论不记理由的表现；还有人只背「用 AgNO₃ 检验 Cl⁻」，漏掉稀硝酸这一步（或加成稀硫酸、加稀盐酸），于是被 CO₃²⁻ 骗出白色沉淀，误判为含 Cl⁻。"},{"id":"qB026","kp":"b1-9","type":"single","diff":2,"stem":"为了证明某溶液中含有 Fe²⁺ 而不含 Fe³⁺，下列操作和现象中最合理的是","options":["取少量溶液，滴加 KSCN 溶液，若变血红色则证明含 Fe²⁺","取少量溶液，滴加 KSCN 溶液，若不变血红色，再滴加少量新制氯水，若变血红色则证明原溶液含 Fe²⁺","取少量溶液，直接滴加 NaOH 溶液，若产生红褐色沉淀则证明含 Fe²⁺","取少量溶液，滴入 AgNO₃ 溶液，若产生白色沉淀则证明含 Fe²⁺"],"answer":1,"explain":"正确项：Fe³⁺ 遇 KSCN 溶液立即变血红色，而 Fe²⁺ 遇 KSCN 溶液不变红，所以先加 KSCN 溶液不变红可确认「不含 Fe³⁺」（或至少检不出 Fe³⁺）；再滴加新制氯水，Cl₂ 把 Fe²⁺ 氧化成 Fe³⁺（2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻），此时变红就证明原来的溶液中有 Fe²⁺。\n错误项诊断：A 把两种离子的显色性质弄反了——使 KSCN 变血红的是 Fe³⁺，Fe²⁺ 加 KSCN 不变色，所以「变红说明含 Fe²⁺」是错的；C 用 NaOH 只能看到沉淀颜色，而且 Fe²⁺ 的沉淀是白色的 Fe(OH)₂，红褐色沉淀对应 Fe³⁺，等于把两种离子的沉淀颜色记反；更重要的是不管加 NaOH 还是加氯水都只是「间接」判断，无法先排除 Fe³⁺ 的干扰；D 是风马牛不相及——加 AgNO₃ 产生白色沉淀说明含 Cl⁻，与铁离子种类毫无关系。\n错因诊断：本题的核心是「先排除 Fe³⁺，再证明 Fe²⁺」这个两步逻辑链，学生常犯的错是「一步到位」：直接加氯水看变红，却忘了若原溶液本来就有 Fe³⁺，加氯水一样会变红，无法证明 Fe²⁺ 存在；另一个高频错误是记不清 KSCN 与哪种离子显色（把 Fe²⁺ 与 Fe³⁺ 颠倒）。请牢记：KSCN 遇 Fe³⁺ 变血红色、遇 Fe²⁺ 不显色——这正好可以用来给 Fe³⁺ 做「专门检验」，也是区分两者的关键工具。"},{"id":"qB027","kp":"b1-9","type":"single","diff":1,"stem":"向 FeCl₂ 溶液中滴加 NaOH 溶液，放在空气中观察，沉淀颜色的变化顺序为","options":["白色 → 灰绿色 → 红褐色","白色 → 红褐色 → 灰绿色","红褐色 → 灰绿色 → 白色","一直是白色，不发生变化"],"answer":0,"explain":"正确项：Fe²⁺ + 2OH⁻ → Fe(OH)₂↓（白色）；生成的 Fe(OH)₂ 中 Fe 为 +2 价，很容易被空气中的 O₂ 氧化成 Fe³⁺，白色沉淀逐渐变灰绿色，最后变成红褐色的 Fe(OH)₃，反应可表示为 4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃。所以颜色变化是白色 → 灰绿色 → 红褐色。\n错误项诊断：B 把中间颜色和最终颜色调换了顺序——红褐色是氧化的最终产物颜色，不可能出现在灰绿色之前；C 把整个顺序颠倒，等于说 Fe(OH)₂ 一开始就是红褐色，把 Fe(OH)₂ 与 Fe(OH)₃ 的颜色混为一谈；D 忽略了 O₂ 的存在——只要溶液和空气接触，Fe(OH)₂ 就一定会被氧化，「一直白色」只有在严格隔绝空气（用长滴管把 NaOH 溶液伸入液面下、溶液上覆盖煤油等）时才可能观察到。\n错因诊断：常见错误是「只记住白色和红褐色两个端色，丢掉中间的灰绿色」，或者把 Fe(OH)₂ 的颜色记成红褐色。记忆要点：白（Fe(OH)₂）→ 灰绿（部分氧化的中间态）→ 红褐（Fe(OH)₃）；同时要能说出原因——Fe²⁺ 有还原性，被空气中的 O₂ 氧化；因此制备 Fe(OH)₂ 时必须隔绝空气。"},{"id":"qB028","kp":"b1-9","type":"judge","diff":2,"stem":"判断：铁与盐酸反应生成 FeCl₂，铁在氯气中燃烧生成 FeCl₃；这说明氯气的氧化性比盐酸（H⁺）强。","options":["正确","错误"],"answer":true,"explain":"命题正确。①铁与盐酸（稀盐酸、非氧化性酸）反应：Fe + 2HCl → FeCl₂ + H₂↑，H⁺ 只能把 Fe 氧化到 +2 价，生成 FeCl₂；②铁在氯气中燃烧：2Fe + 3Cl₂ —点燃→ 2FeCl₃，Cl₂ 是很强的氧化剂，能把 Fe 直接氧化到 +3 价，生成 FeCl₃；③同一还原剂 Fe 被氧化到的价态更高，恰恰说明所遇氧化剂的氧化性更强（得电子能力更强），所以结论「Cl₂ 的氧化性强于 H⁺」成立。\n常见干扰说法辨析：「铁与盐酸反应生成 FeCl₃」是错的（盐酸里的 H⁺ 氧化性不够，只能生成 FeCl₂）；「Fe 与 Cl₂ 反应生成 FeCl₂」也是错的（氯气把铁氧化到 +3 价）；只有 Fe 与 Cl₂ 在点燃或加热条件下才反应，常温干燥时 Cl₂ 与 Fe 几乎不反应，但产物一定是 FeCl₃。\n错因诊断：学生常凭「铁最常见是 +2 价」的印象把产物一律写成 FeCl₂，或者误以为「与盐酸反应也和与氯气反应一样生成 FeCl₃」。请把这条规律记牢：盐酸（稀硫酸同理）、S、I₂、Cu²⁺ 这类较弱的氧化剂只能把 Fe 氧化成 Fe²⁺；Cl₂、Br₂、硝酸、浓硫酸这类强氧化剂能把 Fe 氧化成 Fe³⁺——「产物价态随氧化剂强弱而变」而不是随金属而变。"},{"id":"qC001","kp":"b2-1","type":"single","diff":2,"stem":"X、Y、Z 三种元素在元素周期表中的位置是：X 位于第三周期第ⅡA族，Y 位于第三周期第ⅥA族，Z 位于第二周期第ⅥA族。仅根据上述位置信息判断，下列排列正确的是","options":["原子半径：X > Y > Z","原子半径：Z > Y > X","原子半径：Y > X > Z","原子半径：Z > X > Y"],"answer":0,"explain":"原子半径由\"电子层数\"和\"核电荷数\"共同决定：电子层数越多半径越大；层数相同时核电荷数越大，原子核对外层电子吸引越强，半径越小。X（第三周期第ⅡA族，即 Mg）与 Y（第三周期第ⅥA族，即 S）电子层数都为 3，同周期从左到右核电荷数增大、半径减小，故 X > Y；Z（第二周期第ⅥA族，即 O）与 Y 同主族，Z 只有 2 个电子层，比 Y 少一层，半径明显更小，故 Y > Z。合起来 X > Y > Z，A 正确。错因诊断：①只记住\"同周期从左到右半径减小\"，却忘了跨周期比较时要先看电子层数，把 Z 直接和同周期的元素排在一起（错选 B、D）；②凭\"相对原子质量越大半径越大\"想当然（错选 C）。做这类题的正确顺序是：先比电子层数，层数多的半径大；层数相同再比核电荷数，核电荷数大的半径小。"},{"id":"qC002","kp":"b2-1","type":"single","diff":2,"stem":"已知硒（Se）位于元素周期表第四周期第ⅥA族，硫（S）位于第三周期第ⅥA族。下列比较正确的是","options":["非金属性：Se 强于 S","非金属性：O 强于 S，S 强于 Se","气态氢化物的稳定性：H₂Se 强于 H₂S","最高价氧化物对应水化物的酸性：H₂SeO₄ 强于 H₂SO₄"],"answer":1,"explain":"Se 与 S 同主族，Se 比 S 多一个电子层，原子半径更大，原子核对最外层电子的吸引更弱，得到电子的能力更弱，所以非金属性 S 强于 Se；O、S、Se 同主族从上到下非金属性依次减弱，B 正确。非金属性越弱，其单质与氢气化合越难，气态氢化物越不稳定，最高价氧化物对应水化物的酸性越弱，所以 A、C、D 全错。错因诊断：①把同主族\"从上到下\"的递变方向记反（从上到下金属性增强、非金属性减弱）；②看到 Se 是陌生元素就凭感觉猜，没有用\"半径大小→原子核对最外层电子吸引力→得电子能力\"这条结构决定性质的链条去推；③不知道\"非金属性\"和\"氢化物稳定性、最高价含氧酸酸性\"是绑在一起的，需要一起判断。"},{"id":"qC003","kp":"b2-1","type":"multi","diff":2,"stem":"下列关于元素周期律的说法正确的是（多选）","options":["同主族元素从上到下原子半径逐渐增大，原子失去电子的能力逐渐增强","同周期元素从左到右原子半径逐渐减小，原子得到电子的能力逐渐增强","同周期元素从左到右原子半径逐渐减小，所以从左到右形成的简单离子半径也依次减小","主族元素的最高正化合价在数值上都等于其原子的最外层电子数"],"answer":[0,1],"explain":"A 对：同主族从上到下电子层数增多、半径增大，原子核对外层电子吸引减弱，失电子能力增强（Li → Na → K 金属性增强）。B 对：同周期从左到右核电荷数增大、半径减小，得电子能力增强（失电子能力减弱）。C 错：离子半径不能由原子半径规律直接推出，它与核电荷数、电子层数都有关系，最典型的反例是第三周期的 Na 原子半径大于 Cl 原子，但 Na⁺ 半径（约 102 pm）却明显小于 Cl⁻ 半径（约 181 pm）。D 错：\"都等于\"太绝对，主族元素中 O 一般没有 +6 价、F 没有正化合价，所以最高正价与最外层电子数相等的规律只对大多数主族元素成立。错因诊断：①错选 C 的学生是\"规律的范围乱扩大\"，把原子半径规律硬套到离子上；②错选 D 的学生背结论时丢掉了\"例外\"；③漏选 A 或 B 说明\"半径—核对外层吸引—得失电子能力\"这条因果链没有建立，只是零散记忆。"},{"id":"qC004","kp":"b2-2","type":"single","diff":1,"stem":"下列物质中，只含有共价键的是","options":["Na₂O₂","NaOH","CO₂","NaCl"],"answer":2,"explain":"CO₂ 由碳原子和氧原子共用电子对形成，分子中只含共价键（碳氧之间是不同种非金属原子成键，属于极性共价键），C 正确。A 错误：Na₂O₂ 由 Na⁺ 和 O₂²⁻ 构成，Na⁺ 与 O₂²⁻ 之间是离子键，O₂²⁻ 内部的两个氧原子之间还有非极性共价键（O—O），所以它既含离子键又含共价键。B 错误：NaOH 中 Na⁺ 与 OH⁻ 之间是离子键，O—H 之间是共价键。D 错误：NaCl 只由 Na⁺ 和 Cl⁻ 通过离子键结合，不含共价键。错因诊断：①以为\"化合物中的化学键都是共价键\"，或者以为\"含有共价键的化合物就是共价化合物\"（错选 B）；②看到 Na₂O₂ 中有两个氧原子，就以为它和 NaCl 一样只含离子键（错选 A）。记住高频结论：含共价键的离子化合物有 NaOH、Na₂O₂、Na₂SO₄、NH₄Cl 等，判断物质类别看\"有没有离子\"—有离子才是离子化合物。"},{"id":"qC005","kp":"b2-2","type":"multi","diff":2,"stem":"下列关于化学键的说法正确的是（多选）","options":["H₂O 分子中的 O—H 键是极性共价键","N₂ 分子中的 N≡N 键是非极性共价键","Na₂O₂ 中只含有离子键","完全由非金属元素组成的化合物一定不含离子键"],"answer":[0,1],"explain":"A 对：H 与 O 是不同种非金属原子，形成共用电子对时电子对偏向吸引能力强的氧，所以 O—H 是极性共价键。B 对：N₂ 中两个氮原子是同种原子，共用电子对不偏向任何一方，是非极性共价键（值得注意的是 N≡N 是共价三键，但仍然是\"非极性\"键，因为成键双方相同）。C 错：Na₂O₂ 中 Na⁺ 与 O₂²⁻ 之间是离子键，O₂²⁻ 内部还有 O—O 非极性共价键，不是\"只含\"离子键。D 错：NH₄Cl 全部由非金属元素组成，但它由 NH₄⁺ 和 Cl⁻ 构成，含有离子键，是离子化合物，所以\"一定不含离子键\"的说法错误。错因诊断：①把\"由非金属元素组成\"等同于\"只含共价键\"（错选 D）；②只记住 Na₂O₂ 的化学式，不清楚它的微观构成（误选 C）；③判断极性时只看\"是不是共价键\"，忘了极性键的判断标准是\"成键原子是否为同种元素\"—不同种元素的原子成键是极性键，同种元素的原子成键是非极性键（不论单键、双键还是三键）。"},{"id":"qC006","kp":"b2-2","type":"judge","diff":2,"stem":"判断：氢氧化钠固体溶于水时破坏的是离子键，氢氧化钠固体熔化时破坏的是共价键。","answer":false,"explain":"NaOH 固体由 Na⁺ 和 OH⁻ 通过离子键结合而成。溶于水时，水分子把 Na⁺ 和 OH⁻ 分开，破坏的是离子键；熔化时 NaOH 同样只电离出 Na⁺ 和 OH⁻，破坏的仍然是离子键。也就是说，溶解和熔化破坏的都是离子键，O—H 共价键并没有断裂（所以溶液中存在的是 OH⁻，不是 O²⁻ 和 H⁺）。题干说\"熔化时破坏共价键\"，错误。错因诊断：①以为\"物质中含有共价键，熔化或溶解时就一定断共价键\"，把\"物质里有哪些键\"和\"过程中破坏了哪种键\"混为一谈；②把\"电解质电离\"一律理解成断共价键——只有共价化合物（如 HCl 溶于水）在电离时才破坏共价键，离子化合物溶解或熔化先断开的是离子键。"},{"id":"qC007","kp":"b2-3","type":"single","diff":1,"stem":"下列反应中，属于吸热反应的是","options":["氢氧化钠溶液与盐酸反应","木炭在氧气中燃烧","Ba(OH)₂·8H₂O 晶体与 NH₄Cl 晶体的反应","氢气在氯气中燃烧"],"answer":2,"explain":"Ba(OH)₂·8H₂O 与 NH₄Cl 的反应在常温下就能自动进行，且吸收热量，能使盛有该混合物的烧杯与玻璃片之间的水结冰，是典型的吸热反应，C 正确。中和反应（A）、燃烧反应（B、D）都是常见的放热反应。判断吸热还是放热，要看反应物总能量与生成物总能量的相对大小（或断开旧键吸收的能量与形成新键放出的能量的相对多少），不能看\"要不要加热\"。错因诊断：①把\"需不需要加热\"当成\"吸热还是放热\"，误以为燃烧要\"点燃\"就是吸热（错选 B、D）；②只记住\"中和反应放热\"的结论却记错了对象（错选 A）；③漏掉 D，因为不认识 H₂ 与 Cl₂ 的反应是放热反应。牢记：放热反应不一定不用加热（如木炭燃烧要加热引发），吸热反应也不一定需要加热。"},{"id":"qC008","kp":"b2-3","type":"single","diff":2,"stem":"已知断裂 1 mol H—H 键要吸收 436 kJ 能量，断裂 1 mol Cl—Cl 键要吸收 243 kJ 能量，形成 1 mol H—Cl 键要放出 431 kJ 能量。对于反应 H₂ + Cl₂ → 2HCl，下列说法正确的是","options":["该反应放出 183 kJ 能量","该反应吸收 183 kJ 能量","该反应放出 862 kJ 能量","该反应吸收 679 kJ 能量"],"answer":0,"explain":"反应中先断开旧键：1 mol H—H 和 1 mol Cl—Cl，吸收能量 436 + 243 = 679 kJ；再形成新键：生成 2 mol HCl，放出能量 431 × 2 = 862 kJ。放出能量大于吸收能量，所以反应总体放出 862 − 679 = 183 kJ 能量，A 正确。选项 C 只是\"形成新键放出的能量\"，选项 D 只是\"断开旧键吸收的能量\"，都只算了反应的一半，没有作比较；选项 B 是把放热的反应误判成吸热。错因诊断：①把\"断键\"和\"成键\"的能量变化记反了——断键要吸收能量，成键才放出能量；②忘记生成的 HCl 是 2 mol，成键能量没有乘 2；③只算出一个数据就直接下结论，丢了\"比较\"这一步。判断反应吸热还是放热的通用方法是：吸收总能量 与 放出总能量 谁大，就决定反应吸热还是放热。"},{"id":"qC009","kp":"b2-4","type":"single","diff":1,"stem":"对于反应 2H₂O₂ → 2H₂O + O₂↑（MnO₂ 作催化剂），下列措施中会使产生氧气的速率减慢的是","options":["适当升高温度","加入少量 MnO₂ 粉末","向 H₂O₂ 溶液中加入适量蒸馏水","使用浓度更大的 H₂O₂ 溶液"],"answer":2,"explain":"影响反应速率的外界因素主要有浓度、温度、催化剂、固体表面积等。升高温度、使用催化剂、增大反应物浓度都会加快反应速率，所以 A、B、D 都是加快。向 H₂O₂ 溶液中加蒸馏水稀释，溶液的体积变大、H₂O₂ 的浓度变小，单位体积内参与反应的分子数减少，有效碰撞次数减少，反应速率减慢，C 正确。错因诊断：①把\"加水\"当成\"增加反应物\"，忽略水在本反应中只是溶剂（加水后 H₂O₂ 的物质的量不变，浓度反而变小）；②混淆\"物质的量\"和\"浓度\"——决定速率的是浓度，不是有多少摩尔；③审题只看前半句\"使速率改变\"，没有抓住题目要求的是\"减慢\"。"},{"id":"qC010","kp":"b2-4","type":"single","diff":2,"stem":"一定温度下，在恒容密闭容器中发生反应 N₂ + 3H₂ ⇌ 2NH₃。下列事实能说明该反应已达到化学平衡状态的是","options":["容器内气体的总质量不再改变","容器内气体的总压强不再改变","N₂、H₂、NH₃ 的浓度之比为 1:3:2","每消耗 1 mol N₂ 的同时消耗 3 mol H₂"],"answer":1,"explain":"判断是否达到平衡，关键看某个\"会随反应进行而改变的量\"是否不再改变。A 错：容器是恒容密闭的，气体总质量始终等于开始时加入的气体质量，无论反应进行到什么程度都不变，它根本不是变量，不能作标志。B 对：该反应气体分子数减少（4 mol 变 2 mol），恒温恒容下压强随气体总物质的量变化，压强不变说明气体总物质的量不再变化，即正、逆反应速率相等。C 错：浓度之比等于化学计量数之比只是某个时刻的巧合，与是否平衡没有必然关系。D 错：消耗 N₂ 和消耗 H₂ 都是正反应方向的速率，无论是否平衡，它们的比值都等于 1:3，不能说明 v(正) = v(逆)。错因诊断：①错选 A，是因为没意识到\"总质量\"在本装置中是恒定的；②错选 C，是把\"系数比\"当成了\"平衡标志\"（平衡时各物质的量比由投料比和转化率共同决定）；③漏选 B，说明不会从\"气体分子数是否变化→压强是否是变量\"这个角度思考，也不清楚\"变量不变即平衡\"的判据。"},{"id":"qC011","kp":"b2-4","type":"judge","diff":1,"stem":"判断：化学反应达到限度（平衡状态）时，正反应速率和逆反应速率相等，反应已经完全停止，各物质的浓度保持不变。","answer":false,"explain":"化学平衡是\"动态平衡\"：达到平衡时正反应和逆反应仍在同时进行，只是同一时间内正反应消耗掉的与逆反应生成的量恰好相等，所以 v(正) = v(逆) ≠ 0，反应并没有停止。各物质的浓度保持不变，指的是浓度不再随时间改变，并不意味着不再反应。因此题干中\"反应已经完全停止\"的说法错误。（另外要注意：达到平衡只表示在该条件下反应所能达到的限度，条件改变时平衡会被破坏并重新建立。）错因诊断：①把\"速率相等\"误解成\"速率都等于 0\"，②把\"浓度不变\"误解成\"不再反应\"——这两点是最典型的平衡观错误；③只凭\"平衡\"两个字的感觉作答，没有抓住\"正逆两个方向同时进行、速率相等\"这个本质。"},{"id":"qC012","kp":"b2-5","type":"single","diff":1,"stem":"下列装置中能构成原电池的是","options":["两块铜片插入稀硫酸中，用导线把两块铜片连接起来","锌片和铜片插入稀硫酸中，用导线把锌片和铜片连接起来","两块锌片插入稀硫酸中，用导线把两块锌片连接起来","锌片和铜片分别插入两支盛有稀硫酸的烧杯中，用导线把锌片和铜片连接起来"],"answer":1,"explain":"构成原电池必须同时满足：有两个活动性不同（或能发生不同反应）的电极、有电解质溶液、形成闭合回路、有能自发进行的氧化还原反应。B 中 Zn 与稀硫酸能自发发生反应 Zn + H₂SO₄ → ZnSO₄ + H₂↑，Zn 失去电子作负极，溶液中的 H⁺ 在铜片表面得到电子生成 H₂，化学能转化为电能，能构成原电池。A 中两块铜片活动性相同，且 Cu 与稀硫酸不反应，没有自发进行的氧化还原反应；C 中两块锌片活动性相同，两极发生完全相同的反应，不能形成持续电流；D 中两个烧杯之间没有离子通道，内电路不通，没有形成闭合回路。错因诊断：①只看\"有电极、有溶液、有导线\"就判断能构成原电池，忽略了\"能自发进行的氧化还原反应\"这个本质条件；②以为\"只要两个电极材料不同就行\"，不理解\"活动性不同\"是为了让两极发生不同的反应。判断口诀：先问\"这两个电极和溶液之间能不能自发发生氧化还原反应\"，再检查闭合回路。"},{"id":"qC013","kp":"b2-5","type":"single","diff":2,"stem":"用锌片和铜片作电极、稀硫酸作电解质溶液构成原电池。下列说法正确的是","options":["锌是负极，发生还原反应","铜是正极，电极反应为 2H⁺ + 2e⁻ → H₂↑","电子由铜片经导线流向锌片","溶液中的 H⁺ 向锌电极移动"],"answer":1,"explain":"Zn 比 Cu 活泼，Zn 失去电子被氧化（Zn − 2e⁻ → Zn²⁺），作负极，发生的是氧化反应，A 错。电子由负极经外电路流向正极，即由锌片流向铜片，C 的说法方向正好相反，错。溶液中的阳离子（H⁺）向正极（铜片）移动，在铜片上得到电子：2H⁺ + 2e⁻ → H₂↑，所以在铜片表面能看到气泡，B 对，D 错（H⁺ 移向正极而不是负极）。错因诊断：①把\"负极\"和\"得电子、被还原\"绑在一起，口诀\"负失氧、正得还\"记反；②把电子流向和电流方向混淆（电流方向与电子流动方向相反）；③记不住离子移动规律——溶液中阳离子移向正极，阴离子移向负极。"},{"id":"qC014","kp":"b2-5","type":"multi","diff":3,"stem":"关于原电池，下列说法正确的是（多选）","options":["原电池是把化学能转化为电能的装置","原电池中，负极材料的金属活动性一定比正极材料强","原电池工作时，电子由负极经外电路流向正极，电流的方向与电子流动方向相反","把两片不同的金属用导线连接起来插入某种电解质溶液中，就一定能构成原电池"],"answer":[0,2],"explain":"A 对：原电池的本质是把一个能自发进行的氧化还原反应释放的化学能转化为电能。B 错：判断正负极的依据是\"谁失去电子（被氧化）\"，不是比谁更活泼。例如用 Mg、Al 作电极、NaOH 溶液作电解质溶液，Al 能与 NaOH 溶液反应而失去电子，Mg 不能，此时 Al 是负极、Mg 是正极，与金属活动性顺序正好相反。C 对：电子由负极流出经外电路流向正极；电流的方向规定为正电荷移动的方向，所以与电子流动方向相反。D 错：还必须存在\"能自发进行的氧化还原反应\"，也必须有闭合回路。例如铜片和银片用导线连接后插入稀盐酸中，两种金属都不与稀盐酸反应，不能构成原电池；若把活泼性不同的金属插入酒精等非电解质溶液中，同样不能。错因诊断：①把\"金属越活泼越作负极\"当作判断负极的唯一标准（错选 B）——这是\"背结论、不看本质\"的典型表现；②只记住了原电池的\"形\"（两个电极、一种溶液、一条导线），忘了\"能自发进行的氧化还原反应\"这个\"神\"（错选 D）；③漏选 C，说明电子流向和电流方向还没分清。"},{"id":"qC015","kp":"b2-6","type":"single","diff":1,"stem":"下列关于甲烷的说法正确的是","options":["甲烷分子是平面正方形结构","甲烷在光照条件下与氯气发生取代反应，产物中有氯化氢","甲烷能使酸性高锰酸钾溶液褪色","甲烷与氯气在光照条件下发生加成反应"],"answer":1,"explain":"甲烷分子是正四面体形结构（碳原子在中心，四个氢原子位于四个顶点），不是平面正方形，A 错。甲烷分子中只含 4 个 C—H 单键，属于饱和烃，在光照条件下与氯气发生取代反应，生成一氯甲烷、二氯甲烷、三氯甲烷、四氯化碳和氯化氢，B 对。甲烷不能被酸性高锰酸钾溶液氧化，也不能与溴水反应，C 错。D 错：甲烷与氯气的反应是氯原子\"取代\"甲烷中的氢原子，产物中必有 HCl；而加成反应是碳碳双键或三键打开、加上其他原子或原子团，甲烷里没有不饱和键，不可能发生加成。错因诊断：①受平面示意图影响，把甲烷记成平面正方形（把\"空间结构\"降级成\"平面图形\"）；②只要看到\"有气体反应、有产物\"就当成加成反应，没有抓住取代与加成的本质区别——取代是\"原子被替换下来（还能得到 HCl 这类小分子）\"，加成是\"双键打开直接加上去（只有一种产物）\"。"},{"id":"qC016","kp":"b2-6","type":"multi","diff":2,"stem":"下列关于乙烯和苯的说法正确的是（多选）","options":["乙烯分子中含有碳碳双键，能使酸性高锰酸钾溶液褪色","苯分子中含有三个碳碳双键，能使溴的四氯化碳溶液褪色","乙烯能与溴的四氯化碳溶液发生加成反应，生成 1,2-二溴乙烷","苯与液溴在 FeBr₃ 催化条件下发生加成反应，生成溴苯"],"answer":[0,2],"explain":"A 对：乙烯分子中含碳碳双键，能被酸性高锰酸钾溶液氧化而使其褪色，这是碳碳双键的特征性质之一。B 错：苯分子中并不存在交替的单、双键，6 个碳原子之间的键完全相同，是介于碳碳单键和碳碳双键之间的独特的键；苯不能与溴发生加成反应，所以不能使溴的四氯化碳溶液褪色。C 对：CH₂=CH₂ + Br₂ → CH₂BrCH₂Br，双键打开加上两个溴原子，属于加成反应。D 错：苯与液溴在 FeBr₃ 催化下发生的是取代反应——苯环上的一个氢原子被溴原子取代，同时生成 HBr（C₆H₆ + Br₂ → C₆H₅Br + HBr），生成物是溴苯和溴化氢，不是加成反应。错因诊断：①凭凯库勒式（单双键交替的写法）就认定苯中有三个碳碳双键，进而认为苯能发生加成（错选 B）；②把\"溴的四氯化碳溶液褪色\"一律当成化学反应——苯使溴水颜色变浅是因为把溴萃取到苯层，属于物理变化；③分不清取代和加成，错选 D。判断反应类型的通用方法：看有没有\"原子或原子团被替换下来并生成小分子（如 HCl、HBr）\"，有就是取代。"},{"id":"qC017","kp":"b2-6","type":"judge","diff":2,"stem":"判断：甲烷与足量氯气在光照条件下发生取代反应，可以得到纯净的四氯化碳。","answer":false,"explain":"甲烷与氯气的取代反应是分步进行的：CH₄ + Cl₂ →（光照）CH₃Cl + HCl，CH₃Cl + Cl₂ →（光照）CH₂Cl₂ + HCl，CH₂Cl₂ + Cl₂ →（光照）CHCl₃ + HCl，CHCl₃ + Cl₂ →（光照）CCl₄ + HCl。这几步会同时发生，产物是 CH₃Cl、CH₂Cl₂、CHCl₃、CCl₄ 和 HCl 的混合物（还可能有未反应的 CH₄），即使氯气足量也很难得到纯净的四氯化碳，所以题干说法错误。错因诊断：①以为取代反应\"一步到位\"，看到\"足量氯气\"就认为能把甲烷全部变成 CCl₄，这是对有机反应\"分步进行\"的特点缺乏认识；②不理解有机反应常伴随多种副反应、产物是混合物，需要经过分离提纯才能得到纯净物；③把\"足量\"当成\"完全转化\"，忽略了取代反应是可逆地进行到一定程度的。"},{"id":"qD001","kp":"x1-1","type":"single","diff":1,"stem":"反应 C₂H₅OH(l) + 3O₂(g) → 2CO₂(g) + 3H₂O(l) ΔH = −1367 kJ·mol⁻¹。下列说法正确的是","options":["该反应为放热反应，ΔH < 0","该反应为吸热反应，因为燃烧需要先点燃","热化学方程式中各物质的状态可以省略不写，不影响 ΔH 的数值","若把方程式改写为 2C₂H₅OH(l) + 6O₂(g) → 4CO₂(g) + 6H₂O(l)，则 ΔH = −683.5 kJ·mol⁻¹"],"answer":0,"explain":"A 正确：ΔH 为负值即放热反应，说明生成物总能量低于反应物总能量，反应放热 1367 kJ·mol⁻¹。\n错因诊断：\nB 错在把\"点燃\"这一外界条件当成了反应吸放热的判据——点燃只是引发条件，一旦引发就不再需要外界供热，反应本身放热。学生常把\"需要加热/点燃\"与\"吸热反应\"划等号，这是思维偏差的根源：把\"引发条件\"和\"能量变化\"混为一谈。\nC 错在把状态标注当成\"可有可无的装饰\"。物质状态不同，体系内能不同：H₂O 为液态时放热比气态更多。-1367 kJ·mol⁻¹ 这个数值本身就以\"液态水\"为前提，写成 H₂O(g) 数值就不再是 −1367。书写热化学方程式的规范记忆点：①标注状态 s/l/g/aq；②ΔH 与系数成比例；③不写\"↑↓\"、不写条件、不写\"点燃\"。\nD 错在系数变化与 ΔH 换算脱节。系数全部乘以 2，反应放出的热量也必须乘以 2，故 ΔH = −2734 kJ·mol⁻¹，而不是除以 2。学生典型错误就是\"系数变了 ΔH 不变\"或\"随意改数值\"。"},{"id":"qD002","kp":"x1-1","type":"single","diff":2,"stem":"已知：\n① H₂(g) + 1/2O₂(g) → H₂O(g) ΔH₁ = −241.8 kJ·mol⁻¹\n② H₂O(g) → H₂O(l) ΔH₂ = −44.0 kJ·mol⁻¹\n则反应 2H₂O(l) → 2H₂(g) + O₂(g) 的 ΔH 为","options":["+571.6 kJ·mol⁻¹","−571.6 kJ·mol⁻¹","+483.6 kJ·mol⁻¹","−483.6 kJ·mol⁻¹"],"answer":0,"explain":"生成 1 mol H₂O(l) 的 ΔH = ΔH₁ + ΔH₂
