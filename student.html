= −241.8 + (−44.0) = −285.8 kJ·mol⁻¹。\n目标反应是它的逆反应且系数乘以 2：ΔH = −(−285.8) × 2 = +571.6 kJ·mol⁻¹，A 正确。也可以理解为：把 ① ② 都反向并各乘 2 后相加，ΔH = (−241.8 − 44.0) × (−2) = +571.6。\n错因诊断：\nB 选 −571.6：把\"逆反应\"这一逻辑方向漏掉了。盖斯定律应用有两条铁律——方程式方向颠倒，ΔH 必须变号；系数同乘 n，ΔH 也同乘 n。这里同时发生了\"变号\"和\"乘 2\"两件事，漏掉任何一件都会掉进 B。学生往往只顾着加减方程式，却忘了对 ΔH 做同步处理，本质上是把 ΔH 当成反应的\"标签\"而不是\"随方程式走的量\"。\nC 选 +483.6：只用了第 ① 步（241.8 × 2 = 483.6），把第 ② 步 H₂O(g)→H₂O(l) 的 −44.0 整个丢掉了。这说明多步叠加时\"想到哪步算哪步\"，没有把每一步都处理完。正确做法是先把每一步都改写成与目标方向一致、系数一致的形态，一步都不漏，再逐项相加——少一步，数值必然错。\nD 选 −483.6：同样只算了一步、漏掉第 ② 步，而且把\"目标反应是逆反应、ΔH 必须变号\"也弄反了，方向与系数两项处理都不稳定。\n做题规范：先把目标方程式写在纸中间，把每个已知方程式逐个与目标比对——元素和物质是否一致、方向是否一致、系数是几倍，逐个改写成与目标一致的形态，最后把改写后的 ΔH 相加。"},{"id":"qD003","kp":"x1-2","type":"single","diff":1,"stem":"在恒温恒容密闭容器中发生反应：2A(g) + 3B(g) ⇌ C(g) + 2D(g)。某段时间内测得用 A 表示的反应速率为 0.4 mol·L⁻¹·s⁻¹。下列分析正确的是","options":["此时用 B 表示的反应速率为 0.6 mol·L⁻¹·s⁻¹","用 A 表示的反应速率比用 B 表示的速率大，所以 A 消耗得比 B 多","用 B 表示的反应速率为约 0.27 mol·L⁻¹·s⁻¹，即 0.4 × 2/3","随着反应进行，用 A 表示的速率会一直保持 0.4 mol·L⁻¹·s⁻¹ 不变"],"answer":0,"explain":"同一化学反应中，用不同物质表示的反应速率之比等于化学方程式中对应物质的化学计量数之比：v(A) : v(B) : v(C) : v(D) = 2 : 3 : 1 : 2。\nv(B) = v(A) × 3/2 = 0.4 × 1.5 = 0.6 mol·L⁻¹·s⁻¹，故 A 正确。\n错因诊断：\nB 错在把\"速率数值的大小\"直接等同于\"消耗量的多少\"。速率是浓度变化与时间的比值，不是\"总量\"。这里 v(A) : v(B) = 2 : 3 只是把 1 mol A 与 1.5 mol B 的消耗比例换算成浓度变化之比，真正的消耗物质的量之比恒为 2 : 3（B 消耗得更多）。学生把不同物质的速率数值直接横向比较，是典型的概念替换错误——忘记速率必须指明\"用哪种物质表示\"。\nC 是\"换算方向搞反\"的典型错法：由 v(A) 求 v(B) 时，因为 B 的计量数更大，速率也应该更大，所以要乘以 3/2（得 0.6）；这里却乘了 2/3，把 A、B 的角色对调了。\n记忆抓手（一句话定式）：v(未知) = v(已知) × 未知的化学计量数 ÷ 已知的化学计量数。做题时先在草稿上写下 v(A) : v(B) : v(C) : v(D) = 2 : 3 : 1 : 2 这条比例链，再代入数值，就不会乘反。\nD 错在忽略速率随时间衰减。反应物被消耗，浓度下降，正反应速率随反应进行而减小，0.4 mol·L⁻¹·s⁻¹ 只是某段时间内的平均值，不能作为恒定值。"},{"id":"qD004","kp":"x1-2","type":"single","diff":2,"stem":"对反应 2SO₂(g) + O₂(g) ⇌ 2SO₃(g)，下列改变一定能加快正反应速率的是","options":["恒温恒容下向容器中充入 He，使容器内总压强增大","恒温下缩小容器体积，使容器内压强增大","恒温恒容下向容器中充入 SO₃ 气体，容器内压强增大，正反应速率立刻加快","恒温恒压下充入 He，容器体积随之增大，气体分子活动空间变大，正反应速率加快"],"answer":1,"explain":"B 正确：缩小体积使 SO₂、O₂ 的浓度同时增大，单位体积内活化分子数增多，有效碰撞增多，正反应速率加快。\n错因诊断——本题专治\"增大压强一定加快反应速率\"这条错误经验：\nA 是本题最大的陷阱。恒温恒容下充入 He，容器内总压强确实变大了，但 SO₂、O₂、SO₃ 的物质的量没变、体积没变，它们各自的浓度一点没变，正反应速率也完全不变。根子上的思维偏差在于：把\"压强的数值变大\"当成了速率的直接原因。真正影响速率的是\"浓度\"，压强只是通过改变体积（或充入与反应有关的气体）间接改变了浓度，才起到作用。判断口诀：先问\"涉及气体的浓度变了吗\"，浓度不变，压强再大也不影响速率。\nC 错在\"压强变大所以全部速率都加快\"的粗糙推断。充入 SO₃ 确实使压强增大、SO₃ 浓度增大，但那是让逆反应速率立刻加快；容器体积未变，SO₂ 和 O₂ 的浓度并没有增大，所以正反应速率在充入的一瞬间基本不变，绝不会\"立刻加快\"（要等到逆反应分解出一些 SO₂、O₂ 之后，正反应速率才会随之缓慢增大）。请务必区分\"压强这个数字变大\"和\"反应物浓度变大\"，前者不会直接决定速率。\nD 是与 A 形成对照的\"恒压\"情形，也是本题第二个陷阱。恒温恒压下充入 He，为保持压强不变，容器体积必然增大，于是 SO₂、O₂ 的浓度反而减小，正反应速率是变慢而不是加快。把 A、D 放在一起看，就能看出关键差别不在\"充没充 He\"，而在恒容还是恒压：恒容充 He，各反应物浓度不变，速率不变；恒压充 He，体积变大，各反应物浓度变小，速率变慢。两者都推不出\"加快\"。\n影响因素要点回顾（每一项都要落到\"活化分子/有效碰撞\"这个微观原因上，不要只背结论）：\n① 浓度：其他条件不变时，增大反应物浓度，单位体积内活化分子数增多，有效碰撞增多，速率加快。\n② 温度：升高温度使更多分子获得能量成为活化分子，活化分子百分数增大，速率加快（对正、逆速率都加快）。\n③ 压强：不直接决定速率，只有引起气体物质浓度改变时才有影响——恒容充惰性气体不影响，恒压充惰性气体因体积增大反而使速率变小。\n④ 催化剂：降低活化能，使活化分子百分数增大，正、逆速率同等程度加快，不改变平衡位置。\n⑤ 表面积：固体反应物颗粒越小，接触面越大，反应越快（只对固体或与之接触的反应有意义）。"},{"id":"qD005","kp":"x1-3","type":"multi","diff":2,"stem":"在恒温恒容的密闭容器中，反应 N₂(g) + 3H₂(g) ⇌ 2NH₃(g) 达到平衡。下列情况中，能说明该反应已经达到平衡状态的是（多选）","options":["N₂ 的浓度等于 NH₃ 浓度的一半","正反应和逆反应都还在进行，但正反应速率等于逆反应速率，且都不为零","N₂、H₂、NH₃ 三种物质的浓度都不再随时间变化","随着反应进行，正、逆反应速率都减小，最后都减小到零"],"answer":[1,2],"explain":"B、C 正确。平衡的本质是动态平衡：v正 = v逆 ≠ 0，各组分的浓度保持不变。C 描述的是\"浓度不再变化\"这一最直接的判据，B 描述的是平衡的动力学本质。\n错因诊断：\nA 是最典型的错误。平衡时各物质的浓度是\"不再变化\"，而不是\"彼此相等\"或\"成某个比例\"。N₂ 与 NH₃ 的浓度之比是否等于 1 : 2，完全取决于起始投料量，与是否达到平衡无关：起始只放 NH₃ 也会平衡，那时 N₂ 与 NH₃ 浓度之比根本不会是 1 : 2。把\"不再变化\"误解成\"相等/成比例\"，说明学生心里缺乏\"平衡是一个动态的、由速率决定的状态\"这个画面，只会背结论。\nD 是另一类典型错误：把平衡理解成\"反应停下来了\"。错误链条是——反应正逆方向同时进行 → 想到它们互相抵消 → 推出\"最后都不动了\"。正确的图像是：任何瞬间都有 N₂、H₂ 在结合成 NH₃，也有 NH₃ 在分解，只是单位时间内生成 NH₃ 的量恰好等于 NH₃ 分解的量，宏观上浓度不变，微观上反应从未停止。\n判断平衡的三条常用依据：①v正 = v逆（注意必须一个是正反应、一个是逆反应方向）≠ 0；②各组分浓度（或含量、体积分数）不再随时间变化；③对含气体且气体分子数在方程式两边不相等的反应，恒温恒容下压强不变也可作为标志（本题恰好适用，但它不是唯一的、也不是所有反应都适用的判据）。"},{"id":"qD006","kp":"x1-3","type":"single","diff":1,"stem":"在密闭容器中进行反应 N₂(g) + 3H₂(g) ⇌ 2NH₃(g) ΔH < 0。一定温度下反应达到平衡后，加入合适的催化剂，下列说法正确的是","options":["催化剂只加快正反应速率，平衡向生成 NH₃ 的方向移动","达到新平衡时 NH₃ 的浓度比原来更大，故催化剂的加入提高了产率","正反应速率与逆反应速率同等程度地增大，平衡不发生移动，但达到平衡所需时间缩短","催化剂能提高 N₂ 的转化率，使反应进行得更\"彻底\""],"answer":2,"explain":"C 正确：催化剂能降低反应的活化能，对正、逆反应速率是同等程度地加快。既然 v正 和 v逆 同比例变大，二者的相对大小关系没有改变，平衡也就不移动，只是更快到达平衡状态。\n错因诊断——本题直击\"催化剂使平衡正向移动\"这一高频错误：\nA 的思维偏差在于把催化剂理解成\"对正反应特别有帮助\"。催化剂不选择方向：它降低的是同一条反应路径的活化能，正逆两个方向的能垒被降低的幅度相同，所以 v正、v逆 同步增大。学生凭\"催化剂加快反应，反应要往正方向走\"的语感就选了 A。\nB 的偏差在于把\"速率\"和\"限度/产率\"混为一谈。产率、转化率由平衡位置决定，只有改变温度、浓度、压强等能改变平衡的条件才影响产率；催化剂只改变\"多快到平衡\"，不改变\"平衡在哪里\"。\"反应更快\"不等于\"反应更完全\"。\nD 与 B 同源，都是把速率提升误读成限度提升。\n记忆抓手：\n① 催化剂\"三不变\"：平衡位置不变、转化率不变、产率不变；\"两变\"：反应速率变大、达到平衡的时间变短。\n② 催化剂只影响\"多久到平衡\"，不影响\"平衡在哪里\"——它改变的是路程快慢，不是终点位置。\n③ 真正能使该平衡正向移动的常见措施：降低温度（该反应 ΔH < 0，放热）、增大 N₂ 或 H₂ 的浓度、增大压强（向气体分子数减少的方向移动），且移动的程度服从\"减弱但不能抵消\"。"},{"id":"qD007","kp":"x1-3","type":"multi","diff":3,"stem":"在恒温恒容的密闭容器中，反应 H₂(g) + I₂(g) ⇌ 2HI(g) 已达平衡。此时向容器中再充入一定量的 I₂(g)，重新达到平衡。下列说法正确的是（多选）","options":["再达到平衡时，容器中 I₂ 的浓度一定比充入后那一瞬间的浓度小，但仍大于原来平衡时的浓度","再达到平衡时，H₂ 的转化率比原来增大","平衡向逆反应方向移动，因为充入 I₂ 后容器内总压强增大","新平衡时逆反应速率大于原平衡的逆反应速率"],"answer":[0,1,3],"explain":"A、B、D 正确，C 错误——本题要抓的思维漏洞就在 C 上。\n逐项分析：\nC 错在两处。第一，平衡移动的方向不能靠\"看压强的数字变大还是变小\"来判断。恒温恒容下充入 I₂，容器内总压强确实增大了，但本反应 H₂(g) + I₂(g) ⇌ 2HI(g) 方程式两边气体分子数相等（都是 2），单纯改变压强并不能使平衡移动；真正使平衡正向移动的原因是 I₂ 的浓度瞬间增大，使 v正 瞬间大于 v逆。注意与压强类问题对照：只有当压强变化确实引起了各气体物质浓度的变化，且方程式两边气体分子数不相等时，压强才谈得上影响平衡。\n第二，C 把\"平衡移动\"当成一句可以脱口而出的套话，而不是一个要用 v正 与 v逆 的相对大小去推的结论。凡是出现\"一定\"\"必然\"的方向判断，都要先落到 v正 和 v逆 的大小上。\nA 体现勒夏特列原理的实质——\"减弱但不能抵消\"：I₂ 浓度增大使平衡正移，正移会消耗一部分 I₂，所以浓度从充入后的那一点往下降（减弱了这种增大）；但正移只能消耗掉一部分，不可能把它加的全部用光，所以最终浓度一定还是高于原平衡（没有抵消）。选 A 时若想成\"I₂ 全被消耗掉，浓度反而小于原来\"，就掉进了\"减弱 = 抵消\"的陷阱。\nB 正确：加入 I₂ 使平衡正移，H₂ 被更多地消耗，转化率增大。\nD 正确：达到新平衡时，体系中 I₂ 和 HI 都比原平衡多（浓度更大），分子间有效碰撞更频繁，所以用任何物质表示的正、逆反应速率都比原平衡大。新平衡是\"更高的速率水平上的相等\"。注意区分：平衡常数 K 只随温度变化，此题恒温，K 不变；但 K 不变不代表各物质的量、各速率不变。\n错因诊断（本组核心）：\n① 选 C：把\"压强变大\"直接等同于\"平衡移动\"，同时对\"气体分子数相等的反应，压强不影响平衡\"这一条毫无觉察，属于典型的\"只套口诀、不看条件\"。方向问题的判断依据永远来自 v正、v逆 的相对大小；程度问题的依据是\"移动只能减弱改变，不能抵消改变\"。\n② 漏选 D：误认为\"移动了就是新状态，新状态和旧的没关系\"。其实新平衡与原平衡只是速率相等的位置不同，速率绝对值通常会变。\n③ 漏选 B：只盯着\"I₂ 多了\"就说\"没变化\"，忽略了 I₂ 增多必然带动 H₂ 的消耗。\n通用解题顺序：先定\"改变的是哪个条件\" → 再算\"瞬间 v正、v逆 谁大\" → 得出移动方向 → 最后用\"减弱但不抵消\"判断浓度/转化率的最终变化，并牢记 K 只随温度改变。"},{"id":"qD008","kp":"x1-4","type":"single","diff":1,"stem":"对于反应 N₂(g) + 3H₂(g) ⇌ 2NH₃(g)，其浓度平衡常数 K = c²(NH₃) / [c(N₂)·c³(H₂)]。下列说法正确的是","options":["增大压强使平衡正向移动，所以 K 随之增大","使用催化剂能加快反应速率并使 K 增大，所以 NH₃ 的产率提高","K 只与温度有关，改变 N₂ 或 H₂ 的浓度、增大压强、使用催化剂都不会改变 K","升高温度反应速率加快，因此 K 一定增大"],"answer":2,"explain":"C 正确。K 描述的是\"在某一温度下、反应达到平衡时\"各物质浓度幂之积的比值，它是一个只随温度变化的常数：温度不变，K 就不变；不论你改变浓度、压强（体积）还是加不加催化剂，K 都岿然不动。\n错因诊断：\nA 错：增大压强（缩小体积）确实使平衡向气体分子数减小的方向即正向移动，使 c(NH₃) 增大、c(N₂) 和 c(H₂) 减小，但一增一减之后 K 这个比值并不改变。学生最典型的错误就是把\"平衡移动了\"直接等同于\"K 变了\"，把\"移动的方向\"和\"常数的大小\"混成了一回事。记住一句话：平衡移动改变的是浓度和转化率，唯一能改变 K 的只有温度。\nB 错：催化剂同等程度地加快正、逆反应速率，只让平衡提前到达，不改变平衡状态，更不改变 K。凡是\"催化剂提高产率、提高转化率\"的说法一律错误，催化剂能缩短的只是到达平衡所用的时间。\nD 错：\"升温\"对 K 的影响取决于反应是吸热还是放热：吸热反应升温 K 增大，放热反应升温 K 减小，不存在\"升温 K 一定增大\"的规律。合成氨是放热反应，升温反而使 K 减小。判断 K 的变化要先看 ΔH 是正是负，再看温度怎么变。"},{"id":"qD009","kp":"x1-4","type":"single","diff":2,"stem":"一定温度下，在密闭容器中进行反应 CO(g) + H₂O(g) ⇌ CO₂(g) + H₂(g)。某时刻测得 c(CO) = c(H₂O) = 0.5 mol/L，c(CO₂) = c(H₂) = 1.0 mol/L。已知该温度下该反应的平衡常数 K = 1.0。此时该反应","options":["向正反应方向进行，因为生成物的浓度比反应物的浓度大","向逆反应方向进行，因为浓度商 Q > K","处于平衡状态，因为生成物与反应物的浓度之比恰好为 1 : 1","无法判断，还需要知道该反应的 ΔH 才能确定反应方向"],"answer":1,"explain":"B 正确。浓度商 Q 的写法与 K 完全相同，只是代入的是\"此刻\"的浓度：Q = [c(CO₂)·c(H₂)] / [c(CO)·c(H₂O)] = (1.0 × 1.0) / (0.5 × 0.5) = 4.0。Q = 4.0 > K = 1.0，说明此刻生成物\"偏多\"（相当于反应走过了头），体系必须向逆反应方向进行以消耗生成物，直到 Q = K 才达到平衡。\n判断方向只需记住一句话：Q < K 正向进行，Q = K 已达平衡，Q > K 逆向进行。\n错因诊断：\nA 错：把\"谁的浓度大\"当成了判据。浓度不能直接比大小，必须按化学方程式的计量数写成幂、放在分子或分母的正确位置上，最后只比 Q 与 K 的大小。生成物浓度比反应物大完全是正常的（本题 Q = 4 就说明了这一点），它本身不能说明反应往哪边走。\nC 错：把\"浓度相等\"误当成\"达到平衡\"。平衡的唯一标志是各物质浓度不再变化，即 Q = K；本题浓度数值恰好两两相等，但 Q = 4.0 ≠ K = 1.0，根本不是平衡状态。\nD 错：判断\"此刻往哪边进行\"只需比较 Q 与 K，与 ΔH、与反应快慢都无关。ΔH 只决定\"升温时平衡往哪边移、K 变大还是变小\"，不决定此刻的方向。"},{"id":"qD010","kp":"x1-5","type":"single","diff":1,"stem":"下列电离方程式或说法正确的是","options":["醋酸是弱电解质，其电离方程式为 CH₃COOH = CH₃COO⁻ + H⁺","NaCl 溶于水后完全电离，所以 NaCl 属于弱电解质","弱电解质溶液的导电能力一定比强电解质溶液弱","醋酸是弱电解质，其电离方程式为 CH₃COOH ⇌ CH₃COO⁻ + H⁺"],"answer":3,"explain":"D 正确。弱电解质在水中只有一部分分子电离成离子，溶液中同时存在未电离的分子和离子，电离是可逆过程、存在电离平衡，所以电离方程式必须用可逆号 ⇌，绝不能用等号。\n错因诊断：\nA 错：等号表示\"完全电离\"，那是强电解质的写法。学生把符号写错，根源是脑子里没有\"部分电离\"的图景，把电离一律想成\"拉断后全部变成离子\"。做题前先问一句\"它电离完了吗（溶质分子还有没有剩）\"，符号自然就分清了。补充：多元弱酸分步电离，如 H₂CO₃ ⇌ H⁺ + HCO₃⁻（以第一步为主）。\nB 错：把\"完全电离\"和\"强弱\"的关系颠倒了。强、弱电解质的唯一区别就是水中是否完全电离：完全电离的是强电解质（NaCl、HCl、NaOH 等），只有部分电离的才是弱电解质（醋酸、NH₃·H₂O、H₂CO₃ 等）。\"完全电离\"恰恰说明 NaCl 是强电解质。\nC 错：导电能力的强弱取决于溶液中自由移动离子的浓度和离子所带电荷，与\"强/弱电解质\"这个分类没有必然联系。\"一定\"这类绝对说法几乎都是错的：极稀的盐酸导电能力可能还不如较浓的醋酸溶液。"},{"id":"qD011","kp":"x1-5","type":"single","diff":2,"stem":"常温下，向 0.1 mol/L 的醋酸溶液中加水稀释，使溶液的体积变为原来的 10 倍（稀释过程中温度保持常温）。下列判断正确的是","options":["醋酸的电离程度增大，但溶液中 c(H⁺) 减小","醋酸的电离程度不变，溶液中 c(H⁺) 变为原来的十分之一","溶液中 c(H⁺) 增大，因为加水稀释促进了醋酸的电离","溶液中 c(H⁺) 与 c(CH₃COO⁻) 都增大，溶液酸性增强"],"answer":0,"explain":"A 正确。稀释时醋酸的电离平衡 CH₃COOH ⇌ CH₃COO⁻ + H⁺ 向电离方向移动（加水使各微粒浓度同等降低，平衡便向微粒数目增多的方向移动），因此醋酸的电离程度增大；已电离出的 H⁺ 的物质的量 n(H⁺) 虽然有所增多，但溶液体积增大的倍数超过了 n(H⁺) 增大的倍数，所以 c(H⁺) = n(H⁺) ÷ V 仍然减小，溶液 pH 变大、酸性减弱。\n错因诊断：\nB 错：套用了\"稀释 10 倍浓度就除以 10\"的强酸算法。醋酸存在电离平衡，稀释时会额外电离出一部分 H⁺，所以 c(H⁺) 减小的倍数小于 10 倍（比原值的十分之一要大一些），不是简单除以 10。\nC 错：把\"电离程度增大\"与\"离子浓度增大\"当成同一个意思，这是本知识点最高频的陷阱。要分清两个量：电离程度是百分比，说的是\"已电离的分子占原有分子的比例\"变大；c(H⁺) 说的是\"单位体积内的 H⁺ 数目\"，它变小。两者可以同时成立，完全不矛盾。\n判断这类题永远走同一条路：①先判断平衡往哪个方向移动；②再判断 n 和 V 各怎么变；③最后用 c = n ÷ V 算浓度。只看\"平衡右移\"就下结论，必错。\nD 错：若 c(H⁺) 和 c(CH₃COO⁻) 都增大，等于说加水稀释后酸性反而增强，这与实验事实（稀释醋酸溶液 pH 变大）直接矛盾；同时由 Kw 可知，酸性减弱时 c(OH⁻) 一定增大。"},{"id":"qD012","kp":"x1-6","type":"single","diff":2,"stem":"常温下，某盐酸溶液的 pH = 3。下列说法正确的是","options":["溶液中由水电离出的 c(H⁺) = 1×10⁻³ mol/L，因为溶液的 pH = 3","溶液中由水电离出的 c(H⁺) = 1×10⁻⁷ mol/L，与纯水中由水电离出的 c(H⁺) 相同","溶液中由水电离出的 c(H⁺) 大于由水电离出的 c(OH⁻)","溶液中由水电离出的 c(H⁺) = 1×10⁻¹¹ mol/L"],"answer":3,"explain":"D 正确。第一步先认清\"谁提供的 H⁺\"：pH = 3 表示溶液中的 c(H⁺) = 1×10⁻³ mol/L，但这些 H⁺ 绝大部分由 HCl 电离而来，不能用 pH 直接读出\"水电离出的 H⁺\"。第二步走 OH⁻ 这条通道：常温下任何水溶液都满足 c(H⁺)·c(OH⁻) = Kw = 1×10⁻¹⁴，所以 c(OH⁻) = 10⁻¹⁴ ÷ 10⁻³ = 1×10⁻¹¹ mol/L；溶液中没有别的 OH⁻ 来源，OH⁻ 全部是水电离出来的，故由水电离出的 c(OH⁻) = 1×10⁻¹¹ mol/L。第三步利用水自身电离的特点：水每电离出 1 个 H⁺ 就同时电离出 1 个 OH⁻，所以由水电离出的 c(H⁺) 与由水电离出的 c(OH⁻) 永远相等，都等于 1×10⁻¹¹ mol/L。\n错因诊断：\nA 错：把\"溶液中的 c(H⁺)\"与\"水电离出的 c(H⁺)\"当成了同一个量，这是本考点最核心的陷阱，两者在本题中相差 8 个数量级（10⁻³ 与 10⁻¹¹）。做题前先问自己一句：这个 H⁺ 是盐酸给的，还是水给的？酸溶液中 c(H⁺) 的\"大头\"来自酸，水只贡献了极小一部分——如果水真能提供 10⁻³ mol/L 的 H⁺，那就不需要加盐酸了，因为纯水自身由水电离出的 c(H⁺) 也只有 1×10⁻⁷ mol/L。\nB 错：以为加酸只影响溶质、水自身的电离照旧。事实上酸性增强使水的电离平衡 H₂O ⇌ H⁺ + OH⁻ 逆向移动，水的电离受到抑制，由水电离出的 c(H⁺) 会从 1×10⁻⁷ mol/L 降到 1×10⁻¹¹ mol/L，比 10⁻⁷ 小得多。\nC 错：水自身电离出的 H⁺ 与 OH⁻ 永远按 1 : 1 生成，与溶液显酸性、碱性还是中性无关。酸溶液中\"不相等\"的是溶液里 H⁺ 与 OH⁻ 的总浓度，而不是\"水电离出的\"浓度，这两个问题必须分清。"},{"id":"qD013","kp":"x1-6","type":"multi","diff":2,"stem":"常温下，将 pH = 3 的盐酸与 pH = 11 的 NaOH 溶液等体积混合。下列有关混合后溶液的说法正确的是","options":["混合后溶液显中性，pH = 7","混合后溶液中 c(H⁺) = 1×10⁻⁷ mol/L","混合后溶液中 c(H⁺)·c(OH⁻) = 1×10⁻¹⁴ mol²/L²","混合后溶液中由水电离出的 c(H⁺) 大于 1×10⁻⁷ mol/L"],"answer":[0,1,2],"explain":"pH = 3 的盐酸中 c(H⁺) = 1×10⁻³ mol/L；pH = 11 的 NaOH 溶液中 c(H⁺) = 1×10⁻¹¹ mol/L，故 c(OH⁻) = Kw ÷ c(H⁺) = 10⁻¹⁴ ÷ 10⁻¹¹ = 1×10⁻³ mol/L。两者等体积混合，H⁺ 与 OH⁻ 的物质的量恰好相等，发生 H⁺ + OH⁻ → H₂O 恰好完全中和，溶液显中性，pH = 7，此时 c(H⁺) = c(OH⁻) = 1×10⁻⁷ mol/L，所以 A、B 正确。Kw 是水的离子积，常温下任何水溶液（酸性、碱性、中性都一样）都满足 c(H⁺)·c(OH⁻) = 1×10⁻¹⁴ mol²/L²，C 正确。本题答案为 A、B、C。\n错因诊断：\nD 错：以为\"溶液里发生了中和反应，水的电离就被促进了\"。恰恰相反，只有当溶液中存在能水解的盐（如 CH₃COONa、NH₄Cl）时水的电离才被促进；本题混合后得到的是 NaCl 溶液，Na⁺、Cl⁻ 都不水解，水的电离既没被促进也没被抑制，由水电离出的 c(H⁺) 就等于 1×10⁻⁷ mol/L，\"大于\"的说法错误。注意此时溶液刚好中性，\"溶液中的 c(H⁺)\"与\"水电离出的 c(H⁺)\"数值恰好相等，与酸、碱溶液中两者悬殊的情形不同。\n常见漏选 A、B 的错因：只靠\"3 和 11 一中和就是 7\"猜答案。本题恰好猜对，但换成\"pH = 3 的盐酸与 pH = 12 的 NaOH 等体积混合\"就会答错（碱过量，溶液显碱性，pH 约为 11.7）。正确做法只有一条：先分别算出 c(H⁺) 与 c(OH⁻)，比较物质的量、看谁过量，再用剩余的那个求 pH。\n常见漏选 C 的错因：以为 Kw 只是\"纯水里\"的常数，忘了常温下任何水溶液都满足 c(H⁺)·c(OH⁻) = 1×10⁻¹⁴。\n补充一个自检点：混合后溶液中 c(Na⁺) = c(Cl⁻)（Na⁺ 只来自 NaOH、Cl⁻ 只来自盐酸，二者不参与反应且等体积混合），这说明抓住\"不参加反应的离子物质的量不变\"就能快速判断，不必被中和反应带偏。"},{"id":"qD014","kp":"x1-6","type":"single","diff":1,"stem":"常温下，将 pH = 3 的盐酸加水稀释到原体积的 100 倍，稀释后溶液的 pH 约为","options":["1","3","5","7"],"answer":2,"explain":"盐酸是强酸，在水中完全电离，稀释 100 倍时 c(H⁺) 也被稀释 100 倍：c(H⁺) = 1×10⁻³ mol/L ÷ 100 = 1×10⁻⁵ mol/L，故 pH = −lg c(H⁺) = −lg 10⁻⁵ = 5，选 C。\npH 的本质就是把 c(H⁺) 取负对数：c(H⁺) 变成原来的 1/10，pH 就增大 1 个单位。\n错因诊断：\nA（pH = 1）：把稀释的方向弄反了，或者算对数的符号出错。稀释只会让酸性减弱、c(H⁺) 减小，pH 一定增大，不会变小。\nB（pH = 3）：以为\"加水不影响 pH\"，直接照抄题干数字，没有意识到溶液浓度已经变了。\nD（pH = 7）：这是最要警惕的错因——把\"无限稀释\"的结论套了过来。只有当强酸被稀释到 c(H⁺) 接近 1×10⁻⁷ mol/L 时，才必须把水电离出的 H⁺ 考虑进去，此时 pH 趋近 7 但永远略小于 7，绝不会等于 7（溶液仍显酸性）。本题中 c(H⁺) = 1×10⁻⁵ mol/L 远大于 1×10⁻⁷ mol/L，水电离出的那点 H⁺ 完全可以忽略，pH 就是 5。\n规律总结：强酸每稀释 10 倍，c(H⁺) 变为原来的 1/10，pH 增大 1 个单位；强碱每稀释 10 倍，c(OH⁻) 变为原来的 1/10，pH 减小 1 个单位。两者都要注意\"无限稀释只能趋近 7\"的极限。"},{"id":"qD015","kp":"x1-7","type":"single","diff":1,"stem":"常温下，0.10 mol·L⁻¹ CH₃COONa 溶液的酸碱性以及判断的理由，正确的是","options":["显酸性，因为 CH₃COO⁻ 能电离出 H⁺，使溶液中 c(H⁺) > c(OH⁻)","显中性，因为 CH₃COONa 是正盐，正盐的水溶液一定显中性","显碱性，因为 CH₃COO⁻ 发生水解：CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻","显碱性，因为 Na⁺ 水解产生了 OH⁻，而 CH₃COO⁻ 不水解"],"answer":2,"explain":"CH₃COONa 溶液显碱性。判断口诀是“谁弱谁水解，谁强显谁性”：CH₃COO⁻ 是弱酸 CH₃COOH 的酸根，属于“弱”的一方，会发生水解 CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻，产生 OH⁻，使 c(OH⁻) > c(H⁺)，溶液显碱性；Na⁺ 来自强碱 NaOH，属于“强”的一方，不水解。碱性完全由 CH₃COO⁻ 的水解提供，而且水解程度很小，所以溶液只是弱碱性，不是强碱性。错因诊断：认为“显酸性”的同学把水解和电离弄混了，看见“醋酸”两个字就按酸性类推，或者以为 CH₃COO⁻ 会电离出 H⁺——其实 CH₃COO⁻ 是结合 H⁺ 的一方（水解时它抢走水电离出的 H⁺），它不可能电离出 H⁺，也不会让溶液显酸性；认为“显中性”的同学把“盐溶液都显中性”当成了规律，其实只有强酸强碱盐（NaCl、KNO₃ 等）才显中性，CH₃COONa、Na₂CO₃ 这类弱酸强碱盐都显碱性；认为“Na⁺ 水解产生 OH⁻”的同学搞错了水解对象，Na⁺ 是强碱的阳离子，不水解，只有弱碱的阳离子（NH₄⁺、Al³⁺、Fe³⁺ 等）才水解。记住这类题的核心：先看盐里哪一个离子是“弱”的，是它水解，水解出来的是 OH⁻ 还是 H⁺，决定溶液的酸碱性。"},{"id":"qD016","kp":"x1-7","type":"single","diff":2,"stem":"常温下，关于 0.10 mol·L⁻¹ Na₂CO₃ 溶液的说法正确的是","options":["加热溶液能促进 CO₃²⁻ 的水解，加水稀释也能促进它的水解","CO₃²⁻ 水解的离子方程式为 CO₃²⁻ + H₂O = CO₂↑ + 2OH⁻","CO₃²⁻ 的水解程度很大，溶液中的 CO₃²⁻ 几乎全部转化为 H₂CO₃","加水稀释会抑制 CO₃²⁻ 的水解，因为稀释使 c(CO₃²⁻) 减小"],"answer":0,"explain":"水解是微弱的、可逆的，所以书写水解的离子方程式必须用“⇌”，不能写“=”；正因为程度很小，产物不会以气体或沉淀形式离开体系，所以不能标“↑”“↓”（只有 Al³⁺ 与 HCO₃⁻、Al³⁺ 与 CO₃²⁻ 这类互相促进的“双水解”才写“ = ”和“↑”“↓”）。CO₃²⁻ 的水解要分两步写：CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻（主要），HCO₃⁻ + H₂O ⇌ H₂CO₃ + OH⁻（次要）。影响因素：水解是中和反应的逆反应，中和放热，所以水解吸热，升高温度促进水解；溶液越稀，水解程度越大，所以加水稀释也促进水解，可以记成“越热越水解，越稀越水解”。错因诊断：写“CO₃²⁻ + H₂O = CO₂↑ + 2OH⁻”的同学把水解当成能进行到底的复分解反应，还凭空把 H₂CO₃ 拆成了 CO₂ 和 H₂O，只要抓住“水解微弱、写⇌、不标↑↓”就能纠正；认为“几乎全部转化”的同学对水解程度毫无概念，实际 0.10 mol·L⁻¹ Na₂CO₃ 溶液的 pH 只有 11～12，绝大部分 CO₃²⁻ 仍以离子形式存在，溶液根本不冒气泡；认为“稀释抑制水解”的同学把稀释的规律记反了，加水稀释时水解平衡向水解方向移动，水解程度增大（注意区分：水解程度增大不等于碱性增强，稀释后 c(OH⁻) 和 pH 都是减小的）。"},{"id":"qD017","kp":"x1-7","type":"single","diff":2,"stem":"常温下，NaHCO₃ 溶液中 HCO₃⁻ 既能水解又能电离。下列说法正确的是","options":["HCO₃⁻ 的电离程度大于水解程度，所以溶液显酸性","HCO₃⁻ 水解时产生 H⁺，电离时产生 OH⁻，两个过程互相促进","HCO₃⁻ 既能水解又能电离，两个过程恰好完全抵消，所以溶液显中性","HCO₃⁻ 的水解程度大于电离程度，所以溶液显碱性"],"answer":3,"explain":"在 NaHCO₃ 溶液中，HCO₃⁻ 同时发生两个过程：水解 HCO₃⁻ + H₂O ⇌ H₂CO₃ + OH⁻（产生 OH⁻），电离 HCO₃⁻ ⇌ H⁺ + CO₃²⁻（产生 H⁺）。溶液最终显什么性，取决于两个过程中哪一个占优势；NaHCO₃ 溶液显碱性，说明水解产生的 OH⁻ 多于电离产生的 H⁺，即 HCO₃⁻ 的水解程度大于它的电离程度。错因诊断：认为“电离程度大、显酸性”的同学只看到 HCO₃⁻ 是酸式酸根、能给出 H⁺，把 HCO₃⁻ 直接当成弱酸，忘了它同时还能水解；认为“水解产生 H⁺、电离产生 OH⁻”的同学把两个过程的产物记反了，水解的实质是 HCO₃⁻ 结合水电离出的 H⁺，把 OH⁻ 留在溶液中，产物是 H₂CO₃ 和 OH⁻，而电离是 HCO₃⁻ 自己给出 H⁺、得到 CO₃²⁻；认为“两者恰好抵消显中性”的同学以为同时进行的两个过程会互相抵消，其实它们的程度一般不相等，所以溶液一定偏向酸性或碱性中的一边。可以这样记：酸式酸根离子既能水解又能电离，谁强就显谁的性质，NaHCO₃ 显碱性说明水解强；同样的思路可以判断 NaHSO₃ 溶液显酸性，说明 HSO₃⁻ 的电离程度大于水解程度。"},{"id":"qD018","kp":"x1-8","type":"single","diff":3,"stem":"常温下，Ksp(AgCl)=1.8×10⁻¹⁰，Ksp(Ag₂CrO₄)=1.1×10⁻¹²。向含 Cl⁻ 和 CrO₄²⁻ 且两者浓度均为 0.10 mol·L⁻¹ 的混合溶液中逐滴加入 AgNO₃ 溶液（忽略体积变化），下列说法正确的是","options":["CrO₄²⁻ 先沉淀，因为 Ksp(Ag₂CrO₄) 比 Ksp(AgCl) 小，Ksp 越小说明越难溶，就越先沉淀","Cl⁻ 先沉淀，因为使 Cl⁻ 开始沉淀所需 c(Ag⁺) 约为 1.8×10⁻⁹ mol·L⁻¹，比使 CrO₄²⁻ 开始沉淀所需的约 3.3×10⁻⁶ mol·L⁻¹ 小","两种离子同时开始沉淀，因为溶液中 Cl⁻ 和 CrO₄²⁻ 的浓度相等","向混合溶液中加入少量 NaCl 固体，AgCl 的 Ksp 会减小"],"answer":1,"explain":"判断谁先沉淀，不能只看 Ksp 数值的大小，必须算出各离子“开始沉淀时所需的 c(Ag⁺)”，谁需要的 c(Ag⁺) 更小，谁就先沉淀。计算：Cl⁻ 开始沉淀需 c(Ag⁺) = Ksp(AgCl) ÷ c(Cl⁻) = 1.8×10⁻¹⁰ ÷ 0.10 = 1.8×10⁻⁹ mol·L⁻¹；CrO₄²⁻ 开始沉淀需满足 c(Ag⁺)² = Ksp(Ag₂CrO₄) ÷ c(CrO₄²⁻) = 1.1×10⁻¹² ÷ 0.10 = 1.1×10⁻¹¹，即 c(Ag⁺) ≈ 3.3×10⁻⁶ mol·L⁻¹。因为 1.8×10⁻⁹ 远小于 3.3×10⁻⁶，所以滴加 AgNO₃ 溶液时 Cl⁻ 先达到沉淀所需条件，先析出白色 AgCl 沉淀，继续滴加才出现砖红色 Ag₂CrO₄ 沉淀。错因诊断：认为“Ksp 小的先沉淀”的同学只背了“Ksp 越小越难溶”，没有注意 AgCl 属于 AB 型、Ag₂CrO₄ 属于 A₂B 型，两种沉淀类型不同，Ksp 的表达式形式不同，数值不能直接比较——事实上 Ag₂CrO₄ 的 Ksp 更小，但它的溶解度反而比 AgCl 大，这一次它也没有先沉淀；只有同类型的沉淀（如 AgCl 与 AgI）才能直接比 Ksp 得出先后顺序，不同类型或离子浓度不同时一律要代回表达式计算。认为“同时沉淀”的同学把“两种离子浓度相等”当成了“同时出现沉淀”，忽略了两者需要的 c(Ag⁺) 相差上千倍。认为“加 NaCl 使 Ksp 减小”的同学误以为 Ksp 会随溶液中离子浓度变化，其实 Ksp 只与难溶电解质本身和温度有关，温度不变 Ksp 就不变；加入 NaCl 只增大 c(Cl⁻)，使 AgCl 的沉淀溶解平衡向生成沉淀的方向移动，但 Ksp(AgCl) 的数值不变。沉淀能不能转化也要按这个思路判断：不能只看两个 Ksp 谁大谁小，必须看实际浓度算出的 Q 与 Ksp 的关系，目标沉淀的离子浓度不够时，Ksp 再小也不会转化。"},{"id":"qD019","kp":"x1-8","type":"single","diff":2,"stem":"已知 Ksp(AgCl)=1.8×10⁻¹⁰、Ksp(AgBr)=5.4×10⁻¹³、Ksp(AgI)=8.5×10⁻¹⁷。向含有 Cl⁻、Br⁻、I⁻ 且三者浓度均为 0.10 mol/L 的混合溶液中逐滴加入 AgNO₃ 溶液（忽略溶液体积变化），下列说法正确的是","options":["先生成 AgI 沉淀，因为三种难溶物都是 AB 型（阴、阳离子个数比均为 1:1），组成类型相同时 Ksp 越小溶解度越小，AgI 的 Ksp 最小，所以最先沉淀","先生成 AgCl 沉淀，因为 AgCl 的 Ksp 最大，Ksp 越大越容易析出","三种沉淀同时开始生成，因为加入的 Ag⁺ 会同时遇到溶液中的 Cl⁻、Br⁻、I⁻","先生成 AgI 沉淀，因为溶液中 I⁻ 的浓度最大"],"answer":0,"explain":"正确答案是“先生成 AgI 沉淀，因为三种难溶物都是 AB 型（阴、阳离子个数比均为 1:1），组成类型相同时 Ksp 越小溶解度越小，AgI 的 Ksp 最小，所以最先沉淀”。AgCl、AgBr、AgI 都是阴、阳离子个数比为 1:1 的 AB 型难溶物，组成类型相同，可以直接用 Ksp 比较溶解能力：Ksp 越小，越难溶，越容易被沉淀出来。本题三种离子浓度相同（都是 0.10 mol/L），可以算一算各自的 Q：Q(AgCl)=c(Ag⁺)×0.10、Q(AgBr)=c(Ag⁺)×0.10、Q(AgI)=c(Ag⁺)×0.10。逐滴加入 AgNO₃ 时 c(Ag⁺) 从很小开始慢慢增大，最先被突破的是 Ksp 最小的 AgI，所以 AgI 沉淀最先出现；继续加 Ag⁺ 才依次轮到 AgBr、AgCl。判断依据始终是“Q 与 Ksp 比较”：Q>Ksp 才生成沉淀，谁先满足谁先沉淀，而不是看谁的 Ksp 大或者谁的离子浓度大。“先生成 AgCl 沉淀，因为 AgCl 的 Ksp 最大，Ksp 越大越容易析出”错：Ksp 大恰恰说明 AgCl 溶解能力强、更难沉淀，把 Ksp 的含义说反了。“三种沉淀同时开始生成，因为加入的 Ag⁺ 会同时遇到溶液中的 Cl⁻、Br⁻、I⁻”错：三种 Ksp 相差 10⁷ 倍以上，而三种离子浓度又相等，不可能同时达到 Q>Ksp 的条件。“先生成 AgI 沉淀，因为溶液中 I⁻ 的浓度最大”错：题干已说明三种离子浓度都是 0.10 mol/L，并不存在 I⁻ 浓度最大；先沉淀的根本原因是 AgI 的 Ksp 最小。错因诊断：①把“Ksp 小”和“Ksp 大”的意义记反，以为 Ksp 大就是容易沉淀，实际上 Ksp 越小越难溶、越容易先沉淀；②忽略前提条件，见到 Ksp 就直接比大小——只有组成类型相同（如都是 AB 型）时才可以直接由 Ksp 比较溶解度，组成类型不同的难溶物（例如 AgCl 与 Ag₂CrO₄）不能直接比；③只背“Ksp 小的先沉淀”这一句结论，不写 Q 与 Ksp 的比较过程，遇到离子浓度不相等或判断“能否产生沉淀”的题目就无从下手。"},{"id":"qD020","kp":"x1-9","type":"single","diff":1,"stem":"酸碱中和滴定必须选择合适的指示剂。下列有关指示剂选择的说法正确的是","options":["用 0.1000 mol/L 盐酸滴定氨水，应选用甲基橙，终点时溶液由黄色变为橙色，且半分钟内不恢复原色","用 0.1000 mol/L 盐酸滴定氨水，应选用酚酞，终点时溶液由红色变为无色，且半分钟内不恢复原色","用 0.1000 mol/L NaOH 溶液滴定盐酸，只能选用酚酞，不能选用甲基橙","石蕊是中和滴定中最常用的指示剂，因为它由红色经紫色到蓝色，颜色变化最丰富"],"answer":0,"explain":"正确答案是“用 0.1000 mol/L 盐酸滴定氨水，应选用甲基橙，终点时溶液由黄色变为橙色，且半分钟内不恢复原色”。选指示剂看两件事：一是变色范围要落在滴定突跃范围内，二是颜色变化要明显、易判断。盐酸滴定氨水，恰好完全反应时生成 NH₄Cl，NH₄⁺ 水解使溶液显酸性，滴定突跃范围大约在 pH 4.3~6.3。甲基橙的变色范围是 3.1~4.4（红~黄），正好落在突跃范围内，所以终点时溶液由黄色变为橙色，现象明显，能准确指示终点。“用 0.1000 mol/L 盐酸滴定氨水，应选用酚酞，终点时溶液由红色变为无色”错：酚酞的变色范围是 8.2~10.0（无色~红），偏碱性，远高于上面的突跃范围。若用酚酞，溶液由红色褪成无色时 pH 还在 8 以上，此时盐酸明显加少了，测得的氨水浓度偏低，误差太大。“用 0.1000 mol/L NaOH 溶液滴定盐酸，只能选用酚酞，不能选用甲基橙”错：强酸强碱相互滴定，恰好完全反应时溶液呈中性，突跃范围很宽（0.1000 mol/L 时约为 pH 4.3~9.7），甲基橙（3.1~4.4）和酚酞（8.2~10.0）的变色范围都落在突跃范围之内，两种指示剂都可以用，“只能”这种绝对化说法是典型错误。“石蕊是中和滴定中最常用的指示剂，因为它由红色经紫色到蓝色，颜色变化最丰富”错：石蕊的变色范围很宽（约 5.0~8.0），且颜色由红经紫到蓝的过渡很不明显，人眼无法准确判断终点，所以中和滴定中不用石蕊。错因诊断：①把“恰好完全反应”等同于“溶液呈中性”——强酸滴定弱碱时恰好完全反应时溶液显酸性，所以必须看终点时溶液的真实酸碱性，不能想当然选酚酞；②以为指示剂颜色变化越丰富越好，忽略了滴定要求“变色范围窄、颜色突变明显”；③凭语感读题，对“只能”“一定”这类绝对化表述不敏感，看到“只能选用酚酞”觉得顺口就选了。"},{"id":"qD021","kp":"x1-9","type":"single","diff":2,"stem":"用 0.1000 mol/L NaOH 标准溶液滴定 25.00 mL 未知浓度的盐酸，以酚酞为指示剂，计算式为 c(盐酸)=c(NaOH)·V(NaOH)/V(盐酸)。下列操作中会使测得的盐酸浓度偏高的是","options":["盛装 NaOH 标准溶液的碱式滴定管用蒸馏水洗净后，没有用 NaOH 标准溶液润洗就直接使用","锥形瓶用蒸馏水洗净后瓶内残留少量蒸馏水，再移入 25.00 mL 待测盐酸","滴定开始前读数时平视，滴定结束后读数时俯视（滴定管刻度 0 在刻度上方，数值从上往下增大）","移取待测盐酸的移液管用蒸馏水洗净后没有干燥，内壁残留少量蒸馏水就吸取 25.00 mL 待测盐酸"],"answer":0,"explain":"正确答案是“盛装 NaOH 标准溶液的碱式滴定管用蒸馏水洗净后，没有用 NaOH 标准溶液润洗就直接使用”。误差分析的推理链条（三步走）：①这个操作改变了谁的量？滴定管内壁残留的蒸馏水把 NaOH 标准溶液稀释了，同样体积的标准液里 NaOH 变少了；②要中和 25.00 mL 盐酸，就必须多滴一些标准液，即消耗的 V(NaOH) 偏大；③看计算式 c(盐酸)=c(NaOH)·V(NaOH)/V(盐酸)，c(NaOH) 与 V(盐酸) 都是定值，V(NaOH) 偏大，所以测得的 c(盐酸) 偏高。“锥形瓶用蒸馏水洗净后瓶内残留少量蒸馏水，再移入 25.00 mL 待测盐酸”——无影响。残留的水既不消耗 NaOH，也没有增加 HCl 的量（HCl 的量由准确移取的 25.00 mL 溶液决定），V(NaOH) 不变，测定结果不变。“滴定开始前读数时平视，滴定结束后读数时俯视”——读数偏小，结果偏低。滴定管的刻度 0 在上、数值从上往下增大，液面下方的刻度大、上方的刻度小；俯视时视线从斜上方看下去，落在液面偏高处的刻度上，读到的末读数比真实值偏小，于是 V(NaOH)=末读数−初读数 偏小，测得浓度偏低（读数时必须平视凹液面的最低处）。“移取待测盐酸的移液管用蒸馏水洗净后没有干燥，内壁残留少量蒸馏水就吸取 25.00 mL 待测盐酸”——结果偏低。内壁残留的蒸馏水把待测盐酸稀释了，实际移入锥形瓶的 HCl 比应有的少，中和它需要的 NaOH 偏少，V(NaOH) 偏小，测得浓度偏低。错因诊断：①把“锥形瓶有水”和“移液管/滴定管有水”混为一谈——关键看这个水最终稀释的是什么：锥形瓶里残留的水只改变溶液体积、不改变移取到的 HCl 的物质的量，所以无影响；移液管内壁残留的水会随待测液一起被吸入并被稀释，使 HCl 的物质的量偏少，所以有影响；滴定管内壁残留的水改变了标准液的浓度，影响最大。②只会背“偏高/偏低”的结论，不写推理链条，题目稍微换个问法（比如问“偏低”的是哪个）就判断错；③把滴定管读数和量筒读数混在一起，记不清“俯视、仰视”到底哪个偏大，实际上量筒的 0 刻度在下方，滴定管的 0 刻度在上方，两者结论正好相反。"},{"id":"qD022","kp":"x1-10","type":"single","diff":1,"stem":"把锌片和铜片用导线连接后插入盛有稀硫酸的烧杯中，构成了一个原电池。下列有关说法正确的是","options":["锌片是负极，电极反应为 Zn − 2e⁻ → Zn²⁺，锌片逐渐溶解","锌片是负极，发生还原反应，锌片质量逐渐减小","铜片是正极，发生氧化反应，铜片表面有气泡产生","电子由铜片经导线流向锌片，电流由锌片经导线流向铜片"],"answer":0,"explain":"原电池中较活泼的金属作负极。锌比铜活泼，锌作负极失去电子：Zn − 2e⁻ → Zn²⁺，发生氧化反应（口诀\"升失氧\"：化合价升高、失去电子、被氧化），所以锌片不断溶解、质量减小，A 正确。B 错：锌片确实是负极，但负极失去电子、化合价升高，发生的是氧化反应，不是还原反应，\"负极质量减小\"这一句是对的，\"发生还原反应\"是错的。C 错：铜片是正极，溶液中的 H⁺ 在铜片表面得到电子：2H⁺ + 2e⁻ → H₂↑，发生的是还原反应。注意\"铜片上有气泡\"这一现象本身是正确的，题目错在把正极的反应类型写成了氧化反应。D 错：电子由负极经导线流向正极，即由锌片流向铜片；而电流方向与电子流向相反，由正极流向负极，即由铜片流向锌片。这一选项把两句话都说反了。错因诊断：①只背\"锌作负极、铜片冒气泡\"这类现象，没有把\"失电子—化合价升高—被氧化—负极\"和\"得电子—化合价降低—被还原—正极\"两条链一一对应起来，于是反应类型特别容易写反（错选 B、C）；②把\"电子流向\"和\"电流方向\"混为一谈，记不住电流方向与电子流向相反（错选 D）。建议固定这样记：负极→失电子→氧化→溶解变轻；正极→得电子→还原→有物质析出或冒气泡。"},{"id":"qD023","kp":"x1-10","type":"multi","diff":2,"stem":"将锌片插入 ZnSO₄ 溶液中、铜片插入 CuSO₄ 溶液中，用导线把锌片和铜片连接起来，并在两个烧杯之间用含 KCl 的盐桥连接，构成带盐桥的原电池。下列说法正确的是（多选）","options":["锌片作负极，锌片逐渐溶解变薄；铜片上析出红色固体，铜片质量增大","盐桥中的 K⁺ 移向 CuSO₄ 溶液一侧，Cl⁻ 移向 ZnSO₄ 溶液一侧，使两侧溶液保持电中性","盐桥的作用是传导电子，把两个半电池连接成闭合回路","该装置中锌比铜活泼，锌作负极失去电子，说明一般情况下较活泼的金属在原电池中作负极"],"answer":[0,1,3],"explain":"负极（锌片，较活泼）：Zn − 2e⁻ → Zn²⁺，锌片不断溶解变薄；正极（铜片）：Cu²⁺ + 2e⁻ → Cu，铜片上析出红色的铜、质量增大，A 正确。盐桥中离子的移动方向可以这样推：负极侧锌不断溶解，溶液中 Zn²⁺ 增多、正电荷过剩，需要阴离子（Cl⁻）进入中和；正极侧 Cu²⁺ 不断被消耗，正电荷减少、SO₄²⁻ 相对过剩，需要阳离子（K⁺）进入中和。所以 K⁺ 移向 CuSO₄ 溶液一侧，Cl⁻ 移向 ZnSO₄ 溶液一侧，B 正确。C 错：盐桥和电解质溶液导电靠的是离子的定向移动，不是电子；电子只能在外电路的导线中流动，把\"盐桥传导电子\"和\"导线传导电子\"混在一起，是对内、外电路作用的典型误解。D 对：原电池中较活泼的金属作负极（失电子、被氧化），所以把两种金属分别作电极组成原电池，作负极的那种金属活动性更强，这是实验室里比较金属活动性强弱常用的方法。错因诊断：①认为\"能导电就一定是靠电子\"，不清楚电解质溶液和盐桥靠离子导电（错选 C）；②把盐桥当成\"只是把两杯溶液连起来的管子\"，不知道它的核心作用是平衡电荷、形成闭合回路，以为取走盐桥电流也不受影响；③盐桥中离子移动方向全靠死记，其实按\"哪一侧多了什么电荷，就补什么离子进去\"现场推一推，就不会记反。"},{"id":"qD024","kp":"x1-11","type":"single","diff":2,"stem":"用石墨棒作电极电解 CuCl₂ 溶液。下列判断正确的是","options":["与电源正极相连的一极是阴极，该电极上 Cu²⁺ 得到电子析出铜","阴极上 H⁺ 先得到电子生成 H₂↑，阳极上 OH⁻ 先失去电子生成 O₂↑","与电源负极相连的一极是阴极，Cu²⁺ 在该电极上得到电子析出铜；与电源正极相连的一极是阳极，Cl⁻ 在该电极上失去电子生成 Cl₂","电解过程中只有水被分解，CuCl₂ 不参加反应，总反应为 2H₂O → 2H₂↑ + O₂↑"],"answer":2,"explain":"电解池中电极名称与电源相连情况是固定的：与电源负极相连的一极是阴极，阴极上阳离子得到电子、发生还原反应；与电源正极相连的一极是阳极，阳极上阴离子失去电子、发生氧化反应。CuCl₂ 溶液中的阳离子有 Cu²⁺ 和 H⁺，得电子（放电）顺序为 Ag⁺ > Fe³⁺ > Cu²⁺ > H⁺ > …，Cu²⁺ 排在 H⁺ 前面，所以阴极上 Cu²⁺ 先放电：Cu²⁺ + 2e⁻ → Cu，阴极表面析出红色的铜，得不到 H₂。溶液中的阴离子有 Cl⁻ 和 OH⁻，失电子（放电）顺序为 S²⁻ > I⁻ > Br⁻ > Cl⁻ > OH⁻ > …，Cl⁻ 排在 OH⁻ 前面，所以阳极上 Cl⁻ 先放电：2Cl⁻ − 2e⁻ → Cl₂↑，阳极上逸出黄绿色的氯气。总反应为 CuCl₂ →（电解）Cu + Cl₂↑，C 正确。A 错：与电源正极相连的是阳极，不是阴极，而且阳极发生的是失电子的氧化反应。B 错：把 H⁺、OH⁻ 的放电顺序排到了 Cu²⁺、Cl⁻ 前面，只有 Cu²⁺、Cl⁻ 被电解完以后（即继续电解水）才会轮到它们放电。D 错：把电解 CuCl₂ 溶液和电解水混为一谈，本反应中参加反应的是 CuCl₂ 本身。错因诊断：①\"正极、负极\"与\"阳极、阴极\"一一对应记混，这是最典型的失分点，务必记住：电源正极连电解池阳极，电源负极连电解池阴极，且阳极一定失电子（氧化）、阴极一定得电子（还原）；②只记住\"电解有水就会放出 H₂ 和 O₂\"，没有先按放电顺序判断到底谁先得失电子，忽略了 Cu²⁺ 和 Cl⁻ 的放电能力都强于 H⁺ 和 OH⁻；③误以为\"溶液中含量多的离子先放电\"，把浓度大小当成了放电顺序，而放电顺序比较的是离子得失电子能力的强弱。"},{"id":"qD025","kp":"x1-11","type":"single","diff":2,"stem":"下列关于电镀和电解精炼铜的说法正确的是","options":["电镀时把待镀的金属制品作阳极，把镀层金属作阴极","电镀和电解精炼铜时都用石墨作阳极，阳极只起导电作用、本身不参加反应","电镀时镀层金属作阳极、待镀制品作阴极；电解精炼铜时粗铜作阳极、纯铜作阴极，两种情况下阴极上发生的都是金属阳离子得到电子的反应","电解精炼铜时用 CuCl₂ 溶液作电解质溶液，阳极上发生的是还原反应"],"answer":2,"explain":"电镀的目的是在一种金属表面镀上另一层金属（例如在铁上镀铜、镀锌、镀银），做法是：待镀制品作阴极，镀层金属作阳极，用含镀层金属离子的溶液作电镀液。通电后阳极的镀层金属不断溶解：Cu − 2e⁻ → Cu²⁺（氧化）；阴极上待镀制品表面 Cu²⁺ + 2e⁻ → Cu（还原，这里阴极上得电子的仍是 Cu²⁺ 而不是 H⁺，因为得电子能力 Cu²⁺ > H⁺），这样阳极溶解下来的金属离子刚好补充阴极析出消耗的部分，电镀液中 Cu²⁺ 的浓度基本不变，C 正确。A 错：阴阳极安排正好接反。若把待镀制品作阳极，它自己会溶解（Fe − 2e⁻ → Fe²⁺），不但镀不上金属，制品还会被腐蚀。B 错：电镀和电解精炼铜用的都是\"可溶阳极\"（分别为镀层金属和粗铜），阳极本身要溶解并补充溶液中的金属离子。如果用石墨这类惰性电极作阳极，放电的是溶液中的阴离子，金属离子只消耗不补充，电镀液和电解液会不断变稀，达不到电镀和精炼的要求。D 错：①电解精炼铜常用 CuSO₄ 溶液（常加少量 H₂SO₄）作电解质溶液，不用 CuCl₂ 溶液；②阳极失去电子，发生的必然是氧化反应，被还原、得电子的是阴极。补充要点：电解精炼铜时杂质按活泼性\"分流\"——比铜活泼的 Zn、Fe、Ni 与铜一起溶解而留在溶液中（它们失电子能力比铜强，能在阳极溶解，但阴极上 Cu²⁺ 先放电，所以它们不在阴极析出）；不如铜活泼的 Ag、Au 溶解不了，直接落到槽底形成阳极泥。错因诊断：①把电镀和电解精炼的阴阳极安排记混，其实两者规律完全一致——\"要溶解的（镀层金属、粗铜）作阳极，要长金属的（待镀制品、纯铜）作阴极\"，抓住\"阳极溶解、阴极析出\"就能同时记住；②误以为电解池的阳极必须用石墨这样的惰性电极，不知道还有\"可溶阳极\"这个重要类型；③看到\"精炼\"两个字就以为阳极不反应或者杂质全部溶解，不知道\"阳极泥\"的存在恰好体现了金属活泼性的差异。"},{"id":"qD026","kp":"x1-12","type":"single","diff":1,"stem":"关于钢铁的电化学腐蚀，下列说法正确的是","options":["钢铁在酸性较强的溶液中主要发生吸氧腐蚀，在弱酸性或中性溶液中主要发生析氢腐蚀","钢铁发生电化学腐蚀时，铁作正极被保护起来，所以腐蚀速率比单纯的化学腐蚀更慢","钢铁发生析氢腐蚀时，正极反应为 2H⁺ + 2e⁻ → H₂↑，负极反应为 Fe − 3e⁻ → Fe³⁺","钢铁在弱酸性或中性溶液中主要发生吸氧腐蚀，这是钢铁腐蚀的主要形式，其正极反应为 O₂ + 4e⁻ + 2H₂O → 4OH⁻"],"answer":3,"explain":"钢铁表面的水膜中溶有 CO₂、O₂ 等物质，形成一层电解质薄膜，铁和其中的碳等杂质构成原电池的两极，铁作负极被腐蚀。水膜酸性较强时，H⁺ 浓度大，H⁺ 得电子的能力强，发生的是析氢腐蚀：负极 Fe − 2e⁻ → Fe²⁺，正极 2H⁺ + 2e⁻ → H₂↑。水膜呈弱酸性或中性时，H⁺ 浓度很小，主要靠溶在水膜里的 O₂ 得电子，发生的是吸氧腐蚀：负极 Fe − 2e⁻ → Fe²⁺，正极 O₂ + 4e⁻ + 2H₂O → 4OH⁻，生成的 Fe²⁺ 与 OH⁻ 结合成 Fe(OH)₂，再被空气中的 O₂ 继续氧化，最终转变为铁锈（主要成分可写成 Fe₂O₃·xH₂O）。由于空气里的水和氧气到处都有，绝大多数钢铁的腐蚀属于吸氧腐蚀，所以吸氧腐蚀是主要形式，D 正确。A 错：把两种腐蚀的适用条件说反了——酸性较强对应析氢腐蚀，弱酸性或中性对应吸氧腐蚀。B 错：电化学腐蚀中铁作负极（失去电子、被氧化）而被消耗，作正极的是钢铁中不如铁活泼的杂质（如碳）；由于构成了原电池，腐蚀速率比单纯与酸或氧气直接接触的化学腐蚀更快，不是更慢。C 错：析氢腐蚀的负极反应是 Fe − 2e⁻ → Fe²⁺，铁只失去 2 个电子生成亚铁离子，不能写成 Fe − 3e⁻ → Fe³⁺；Fe³⁺ 是腐蚀产物又被氧化后才出现的，不属于电极反应。错因诊断：①A、D 两个选项考的就是\"水膜酸碱性—腐蚀类型\"的对应，很多学生只记住\"析氢\"\"吸氧\"两个名称，没有把名称和条件挂钩，一紧张就选反；②把负极产物写成 Fe³⁺ 是高频错误，根源是铁有 +2、+3 两种价态分不清，记住：电极反应中 Fe 只失 2 个电子生成 Fe²⁺，铁锈里的 +3 价铁是后续被氧化的结果；③把原电池的极性记反了，以为铁比较\"正\"所以作正极，其实铁比杂质活泼，作负极被腐蚀，被腐蚀的永远是被氧化的那一极。"},{"id":"qD027","kp":"x1-12","type":"multi","diff":2,"stem":"马口铁是在铁的表面镀一层锡，镀锌铁（俗称白铁皮）是在铁的表面镀一层锌。下列说法正确的是（多选）","options":["马口铁的镀层破损后，铁比锡活泼，铁作负极被腐蚀，所以镀层破损的马口铁比镀层破损的镀锌铁更容易锈蚀","把钢铁闸门与电源正极相连，让它作阳极被氧化，这是常用的外加电流的阴极保护法","镀锌铁的镀层破损后，锌比铁活泼，锌作负极被腐蚀，铁作正极被保护，这种方法称为牺牲阳极的阴极保护法","两种镀层破损后，都是镀层金属作负极被腐蚀，铁都被保护起来"],"answer":[0,2],"explain":"镀层破损后谁被腐蚀，唯一判断依据是\"两种金属谁更活泼\"——活泼的作负极、被腐蚀。马口铁的镀层破损后，铁比锡活泼，铁作负极失去电子：Fe − 2e⁻ → Fe²⁺，锡作正极充当\"电子接收器\"，反而会加速铁的腐蚀，所以破损的马口铁比纯铁生锈还快，A 正确。镀锌铁的镀层破损后，锌比铁活泼，锌作负极被腐蚀：Zn − 2e⁻ → Zn²⁺，铁作正极受到保护，即使镀层局部破损，铁也不容易生锈，这正是水桶、屋面板等常用镀锌铁（白铁皮）的原因，这种方法叫牺牲阳极的阴极保护法，C 正确。B 错：阴极保护法要让被保护的金属作阴极（得到保护、不被氧化），所以外加电流的阴极保护法是把被保护金属与电源负极相连，另用石墨或废钢铁作阳极；如果接到电源正极上，钢铁就变成阳极被强制失电子，腐蚀会大大加快。D 错：只有镀锌铁破损后是\"镀层金属作负极、铁被保护\"；马口铁破损后恰恰相反，是铁作负极、铁自己被腐蚀，锡作正极，两者的情形完全不同。错因诊断：①最典型的错误观念是\"镀了金属就防锈，镀层破了也一样没关系\"，忽略了镀层破损后可能形成原电池，反而让铁腐蚀得更快——判断时只看\"谁更活泼\"；②把牺牲阳极的阴极保护法与外加电流的阴极保护法搞混：牺牲阳极法靠原电池原理，牺牲掉锌、铝等比铁活泼的金属，被保护金属作正极；外加电流法靠电解池原理，接直流电源，被保护金属接电源负极作阴极。两者共同点是\"被保护金属都作阴极、都只起得电子（不被氧化）的作用\"；③误以为锡比铁活泼（锡排在铁后面），凭\"镀上去的金属一定更活泼\"想当然，遇到判断活泼性顺序的题应当回到金属活动性顺序表（K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au）去查证。"},{"id":"qE001","kp":"sy-1","type":"single","diff":1,"stem":"关于常用仪器的选择与读数，下列说法正确的是","options":["用 10 mL 量筒量取 9.50 mL 蒸馏水","用 25 mL 酸式滴定管量取 20.00 mL 稀盐酸","用 100 mL 容量瓶配制 85 mL 一定物质的量浓度的溶液","中和滴定时，滴定管用蒸馏水洗净后可直接装入标准液使用"],"answer":1,"explain":"B 正确：滴定管是精密量器，读数要估读到 0.01 mL，所以 20.00 mL 这样精确的体积应该用滴定管量取（盐酸显酸性，用酸式滴定管）。A 错：量筒的精度只有 0.1 mL（10 mL 量筒的最小分度是 0.1 mL），只能读到小数点后一位，9.50 mL 是滴定管才有的精度，用量筒根本量不准。C 错：容量瓶只有一条刻度线，一个规格只能配制一个固定体积的溶液，100 mL 容量瓶只能配 100 mL 溶液，不能用来配 85 mL。D 错：滴定管用蒸馏水洗净后，必须再用标准液润洗 2~3 次，否则内壁残留的蒸馏水会把标准液稀释，滴定时消耗的标准液体积偏大，算出的待测液浓度就偏高。错因诊断：这类错误本质上不是「记不住」，而是没建立「仪器—精度—用途」的对应关系：量筒精度 0.1 mL、滴定管 0.01 mL；容量瓶只有一条刻度线，只能定容、不能量取任意体积。把三种仪器混着用，就是把「大概量」和「准确量」混为一谈。"},{"id":"qE002","kp":"sy-1","type":"single","diff":1,"stem":"关于加热操作与酒精灯的使用，下列说法正确的是","options":["酒精灯的火焰中，外焰温度最高，加热时应使用外焰","为了节省时间，可以用一只燃着的酒精灯去引燃另一只酒精灯","酒精灯内的酒精越多越好，加到接近灯口可以加热更长时间","加热结束后应立即用嘴吹灭酒精灯，以免灯帽被烤热"],"answer":0,"explain":"A 正确：酒精灯火焰分焰心、内焰、外焰，外焰与空气接触最充分、燃烧最完全，温度最高，所以加热要用外焰部分。B 错：用燃着的酒精灯去引燃另一只，酒精容易流出引燃桌面甚至烧伤人，必须用火柴点燃；同样严禁向燃着的酒精灯里添加酒精。C 错：酒精的量不能超过灯容积的 2/3，也不能少于 1/4，装得太满时酒精受热膨胀会溢出，引发失火。D 错：熄灭酒精灯必须用灯帽盖灭（盖灭后应再打开灯帽一次再盖上，防止灯内冷却形成负压使灯帽打不开）；用嘴吹可能把火焰压入灯内，引燃灯内酒精蒸气。补充：酒精灯温度一般不超过 500 ℃，如果实验需要更高的温度（如玻璃管加工约 1000 ℃），就要改用酒精喷灯——喷灯之所以更热，是因为它让酒精蒸气与空气充分混合后再燃烧，燃烧更完全。错因诊断：只把「点灯、灭灯」当成习惯动作，不知道每条规定背后防的是什么事故。"},{"id":"qE003","kp":"sy-1","type":"multi","diff":1,"stem":"关于药品的取用和仪器的洗涤，下列说法正确的有","options":["倾倒液体时，试剂瓶上的标签要朝向手心","玻璃仪器洗净的标准是内壁附着的水既不聚成水滴，也不成股流下","取用固体药品时，为了节省时间可以用手直接拿取","用胶头滴管滴加液体时，滴管尖嘴应伸入试管内并接触试管内壁"],"answer":[0,1],"explain":"A、B 正确。A：倾倒液体时标签朝手心，是为了让倒出的液流顺着没有标签的那一侧流下，即使有少量残液顺着瓶口流下也不会腐蚀标签。B：仪器洗净的标准不是「看不见脏东西」，而是内壁附着的水既不聚成水滴、也不成股流下，而是形成一层均匀的水膜。C 错：手上有汗渍、油脂，会污染药品，有些药品还有腐蚀性；固体粉末应用药匙（或纸槽）取用，块状固体用镊子夹取。D 错：胶头滴管应垂直悬空在容器口上方滴加，不能伸入容器内、更不能接触内壁，否则滴管尖嘴被污染，再取用其他药品时就会把整瓶试剂污染。错因诊断：失分点常常不是「不会做」，而是只背了动作、没想过「为什么要这样做」——一旦题目换一个问法（比如问「洗净的标准是什么」「为什么标签朝手心」），背下来的动作就对不上号了。"},{"id":"qE004","kp":"sy-2","type":"single","diff":1,"stem":"在粗盐提纯实验的过滤操作中，下列做法错误的是","options":["滤纸紧贴漏斗内壁，中间不留气泡","漏斗内的液面要低于滤纸的边缘","用玻璃棒不断搅拌漏斗内的液体，以加快过滤速度","漏斗下端管口紧靠在烧杯内壁上"],"answer":2,"explain":"C 错误：过滤时玻璃棒的作用是「引流」，不是搅拌。搅拌会捅破滤纸，滤液变浑浊，过滤反而失败。过滤的操作要领是「一贴、二低、三靠」——一贴：滤纸紧贴漏斗内壁，中间不能有气泡（有气泡时滤液会从气泡处流下，过滤变慢）；二低：滤纸边缘要低于漏斗边缘、漏斗内液面要低于滤纸边缘（液面太高时液体会从滤纸与漏斗壁之间的缝隙流走，滤液仍然浑浊）；三靠：烧杯口紧靠玻璃棒、玻璃棒下端轻靠三层滤纸处（三层处最厚实，不容易戳破）、漏斗下端管口紧靠烧杯内壁（使滤液沿内壁流下，防止飞溅）。A、B、D 都是正确做法。错因诊断：把「用玻璃棒搅拌可以加快溶解、加快反应」这条经验原封不动搬到过滤里，只想着「快」，忘了过滤能不能成功取决于滤纸是否完好。如果过滤后滤液仍然浑浊，正确做法是换一张滤纸重新过滤，而不是继续搅拌。"},{"id":"qE005","kp":"sy-2","type":"single","diff":2,"stem":"关于从溶液中得到晶体的方法，下列说法正确的是","options":["KNO₃ 中混有少量 NaCl，要提纯 KNO₃ 应采用蒸发结晶的方法","NaCl 中混有少量 KNO₃，可用蒸发结晶（趁热过滤）的方法提纯 NaCl","蒸发溶液时应一直加热到溶液完全蒸干为止，这样产率最高","溶解度受温度影响越大的物质，越适合用蒸发结晶法提纯"],"answer":1,"explain":"B 正确：NaCl 的溶解度受温度影响很小，只要蒸发溶剂就能让它大量析出；KNO₃ 的溶解度受温度影响很大、含量又少，蒸发时仍留在母液里，所以蒸发结晶（蒸发到出现较多固体时趁热过滤）就能把 NaCl 分离出来。A 错：KNO₃ 的溶解度随温度升高显著增大，提纯 KNO₃ 应该「蒸发浓缩、冷却结晶、过滤」——先蒸掉一部分水（不能蒸干），再降温让 KNO₃ 大量析出，而 NaCl 因溶解度变化很小留在母液中。C 错：蒸发时要用玻璃棒不断搅拌（防止局部过热造成液滴飞溅），但出现较多固体时就应停止加热，利用蒸发皿的余热把剩余液体蒸干；一直加热到完全蒸干，晶体会飞溅、受热易分解或含结晶水的物质还会变质。D 错：恰恰相反，溶解度受温度影响大的物质适合冷却结晶，受影响小的才适合蒸发结晶。错因诊断：只背了「NaCl 蒸发结晶、KNO₃ 冷却结晶」这两个结论，没抓住选择依据是「溶解度随温度变化的程度」；题目一旦把「谁混谁」反过来，或者追问依据，就只能靠猜。"},{"id":"qE006","kp":"sy-2","type":"single","diff":2,"stem":"用四氯化碳从溴水中萃取溴，下列说法正确的是","options":["四氯化碳的密度比水小，所以四氯化碳层在上、水层在下","充分振荡并静置分层后，下层是橙红色的四氯化碳层，上层是接近无色的水层","分液时先放出下层液体，再关闭活塞，把上层液体也从分液漏斗的下口放出","振荡后不必静置分层，可以直接打开活塞放出液体"],"answer":1,"explain":"B 正确：四氯化碳的密度约 1.59 g/cm³，比水大且与水互不相溶，所以四氯化碳层在下层；溴在四氯化碳中的溶解度远大于在水中的溶解度，溴就从水层转移到四氯化碳层，下层呈橙红色，上层水接近无色（萃取剂的选择要求：与原溶剂互不相溶、溶质在萃取剂中的溶解度远大于在原溶剂中的溶解度、且不与溶质反应）。A 错：把四氯化碳和苯、汽油那一类密度比水小（浮在上层）的萃取剂弄混了。C 错：分液时下层液体从下口放出，上层液体必须从分液漏斗的上口倒出，否则上层液体会被残留在漏斗下口部位的液体污染。D 错：必须静置足够长时间让两相分层清楚后再分液，否则分不干净。补充：分液漏斗使用前要先检查是否漏水；振荡时要及时打开活塞放气，因为振荡时有机物挥发使漏斗内压强增大，不放气可能把塞子顶开、液体喷出。错因诊断：只记住「四氯化碳能萃取溴」这个结论，没有把密度和「谁在上、谁在下」联系起来，也没记住「上层液从上口倒出」这条规则的道理（下口有残留液）。"},{"id":"qE007","kp":"sy-3","type":"single","diff":2,"stem":"关于常见气体的收集方法，下列说法正确的是","options":["CO₂ 能溶于水，所以用排水法收集最纯净","NH₃ 极易溶于水、密度比空气小，用向下排空气法收集","H₂ 密度比空气小，只能用向下排空气法收集，不能用排水法","Cl₂ 密度比空气大且有毒，用向上排空气法收集后，多余的氯气可直接排入空气"],"answer":1,"explain":"B 正确：收集方法的判断依据只有两条——气体的密度与空气相比谁大谁小、气体在水中的溶解度大不大（会不会与水反应）。NH₃ 极易溶于水，绝对不能用排水法；它的密度比空气小（相对分子质量 17，小于空气的平均相对分子质量约 29），所以用向下排空气法，收集时在试管口塞一团棉花，防止氨气与空气对流。A 错：CO₂ 能溶于水，还能与水反应生成 H₂CO₃，所以不能用排水法，只能用向上排空气法。C 错：H₂ 难溶于水，用排水法收集更纯净，所以「只能用向下排空气法」是错的——凡是难溶于水又不与水反应的气体，优先考虑排水法。D 错：Cl₂ 有毒，多余的氯气必须用 NaOH 溶液吸收进行尾气处理，不能直接排入空气。顺带记住：O₂ 不易溶于水、密度比空气大，排水法或向上排空气法都可以；CO₂、Cl₂、SO₂ 这类密度比空气大又能溶于水（或与水反应）的气体，只能用向上排空气法。错因诊断：把「能溶于水」当成了「难溶于水」，或者干脆死记「什么气体用什么方法收集」，不去推「为什么要用这个方法」。"},{"id":"qE008","kp":"sy-3","type":"single","diff":2,"stem":"实验室加热氯化铵和氢氧化钙的固体混合物制取氨气（2NH₄Cl + Ca(OH)₂ →(加热) CaCl₂ + 2NH₃↑ + 2H₂O）。下列说法错误的是","options":["发生装置应选用「固体 + 固体，加热」型装置，大试管口略向下倾斜","用向上排空气法收集，因为氨气极易溶于水、密度比空气小","收集氨气的试管口放一团棉花，防止氨气与空气对流","检验氨气是否收集满，可用湿润的红色石蕊试纸靠近试管口，试纸变蓝说明已收集满"],"answer":1,"explain":"B 错误，而且设了一个语言陷阱：前半句「用向上排空气法收集」和后半句「密度比空气小」自相矛盾——密度比空气小的气体应该用向下排空气法。很多同学只看到「氨气密度比空气小」这句话是对的，凭语感就选了它，没有把推理链条走完。A 正确：反应物都是固体且需要加热，所以用「固体 + 固体，加热」型装置；大试管口略向下倾斜，防止固体受热产生的冷凝水倒流到管底使试管炸裂。C 正确：氨气密度小、容易与空气对流逸出，在试管口塞一团棉花能减缓对流，更快收集满。D 正确：氨气极易溶于水且溶于水后显碱性（NH₃ + H₂O ⇌ NH₃·H₂O ⇌ NH₄⁺ + OH⁻），能使湿润的红色石蕊试纸变蓝，这是检验氨气最简便的方法（也可用蘸了浓盐酸的玻璃棒靠近试管口，看到白烟说明已满）。错因诊断：判断收集方法要按「先看密度和溶解性，再定用什么法」的顺序推理；只看半句话就作答，是典型的「背过结论但不会用」。"},{"id":"qE009","kp":"sy-4","type":"judge","diff":2,"stem":"某同学要比较不同浓度的盐酸与镁条反应产生气体的快慢，他每次都取 20 mL 盐酸、加入质量相同的镁条，但两次实验中镁条的形状（表面积）可以不同，这样比较出的结果仍然可靠","answer":false,"explain":"错误。反应速率不仅与浓度、温度有关，还与固体反应物的接触面积有关：形状不同，表面积就不同，反应快慢自然不同。既然要研究「盐酸浓度」的影响，浓度就是唯一的变量，其他条件——溶液体积、温度、镁条的质量和形状（表面积）、是否振荡等——都必须完全相同。这里「质量相同」不等于「条件相同」，粉末状镁条比块状镁条反应快得多。错因诊断：知道「要控制变量」这个名词，但没有真正搞清楚「一个变量」到底包含哪些具体因素，所以看不出「形状不同」其实偷偷多引入了一个变量。审题时把可能影响结果的因素逐条列出来，再看两组实验里哪些不一样，多出来的那一条就是错误所在。"},{"id":"qE010","kp":"sy-4","type":"single","diff":2,"stem":"下列实验设计或结论正确的是","options":["用湿润的 pH 试纸测定氯水的 pH，测得的结果更加准确","氯水中含 HClO，有漂白性，不能用 pH 试纸测其 pH，因为试纸会褪色而无法与标准比色卡对照，应改用 pH 计","用 pH 试纸测定溶液的 pH 之前，必须先用蒸馏水把试纸润湿","pH 试纸能读到小数点后一位，所以可以测出 pH = 3.5"],"answer":1,"explain":"B 正确：氯水中含有 HCl 和 HClO，HClO 有强氧化性（漂白性），会把 pH 试纸上变红的指示剂漂白——试纸往往先变红、随后褪成白色，根本没法与标准比色卡对照，所以测定氯水的 pH 要用 pH 计。A 错：把「润湿」当成了正确操作；氯水本身就是溶液，润湿只会把溶液稀释，而且仍然躲不过漂白的问题。C 错：使用 pH 试纸的正确操作是——把试纸放在表面皿（或点滴板）上，用干燥洁净的玻璃棒蘸取待测液点在试纸中部，半分钟内与标准比色卡对照；试纸不能事先用水润湿，因为润湿相当于把溶液稀释：测酸性溶液会使 pH 偏大，测碱性溶液会使 pH 偏小，只有测中性溶液时才没有影响。D 错：pH 试纸是粗测工具，只能读到整数，3.5 这样精确的数值要用 pH 计才能测。错因诊断：一是把「试纸润湿」当成通用规则，不知道它只适用于用试纸检验气体；二是只记住「氯水显酸性」，忘了其中还有漂白性的 HClO——说明做题时没有把「物质的性质」和「测定的原理」联系起来。"},{"id":"qE011","kp":"sy-4","type":"multi","diff":2,"stem":"下列除杂或分离的说法正确的有（括号内为杂质）","options":["除去 CO₂ 中混有的少量 HCl：将混合气体通过盛有饱和 NaHCO₃ 溶液的洗气瓶","除去 Cl₂ 中混有的少量 HCl：将混合气体通过盛有饱和食盐水的洗气瓶","分离乙醇和水的混合物：用蒸发结晶的方法","蒸馏时，温度计的水银球应插入蒸馏烧瓶内液面以下，以准确测量液体温度"],"answer":[0,1],"explain":"A、B 正确。A：HCl 与 NaHCO₃ 反应被吸收，同时还会生成 CO₂（HCl + NaHCO₃ = NaCl + H₂O + CO₂↑），CO₂ 在饱和 NaHCO₃ 溶液中溶解度很小，所以既除了杂质又不损失主要成分。B：HCl 极易溶于水，能被饱和食盐水吸收；Cl₂ 在饱和食盐水中的溶解度很小（同离子效应），基本不损失。C 错：乙醇和水互溶，不存在溶解度差异可以利用，应该用蒸馏（利用两者沸点不同：乙醇约 78 ℃、水 100 ℃）；蒸发结晶适用于「溶解度随温度变化不大的固体溶质从溶液中析出」，对互溶的两种液体无效。D 错：蒸馏时温度计的水银球要放在蒸馏烧瓶的支管口处，因为需要测的是「即将进入冷凝管的蒸气的温度」，插入液面以下测的是液体的温度，读数会偏高，不能反映馏分的沸点；冷凝管中的冷却水要下口进、上口出，这样管里才能充满水、冷凝效果好。错因诊断：除杂必须同时满足两条——«除掉杂质»和«不引入新杂质、不减少主要成分»。很多同学只想着第一步「什么能吸收杂质」，忘了第二步「主要成分会不会被一起吸收」（如用 NaOH 溶液吸收 CO₂ 中的 HCl，结果把 CO₂ 也除掉了）。"},{"id":"qE012","kp":"sy-5","type":"single","diff":2,"stem":"实验室用 NaCl 固体配制 100 mL 一定物质的量浓度的 NaCl 溶液，下列说法错误的是","options":["容量瓶使用前要检查是否漏水：加适量水塞紧瓶塞，倒立观察是否漏水；正立后将瓶塞旋转 180°，再倒立观察一次","把称好的 NaCl 固体直接放入容量瓶中，加水到刻度线，再摇匀即可","溶解应在烧杯中进行，冷却到室温后再用玻璃棒引流转移到容量瓶，并用少量蒸馏水洗涤烧杯和玻璃棒 2~3 次，洗涤液一并转入容量瓶","定容时，液面接近刻度线 1~2 cm 处，改用胶头滴管滴加蒸馏水至凹液面最低处与刻度线相切"],"answer":1,"explain":"B 错误：不能在容量瓶中直接溶解固体。容量瓶是精密的定容仪器，溶解会放热或吸热，使溶液体积随温度变化，固体溶解时也可能碰坏瓶壁，导致刻度线失准。正确顺序是：计算 → 称量 → 在烧杯中溶解并冷却至室温 → 用玻璃棒引流转移进容量瓶 → 洗涤烧杯和玻璃棒 2~3 次并把洗涤液全部转入容量瓶 → 加水至接近刻度线 1~2 cm 处，改用胶头滴管定容 → 塞紧瓶塞、倒转摇匀。A 正确：容量瓶使用前必须检漏，倒立观察、正立旋转瓶塞 180° 后再倒立观察，两次都不漏水才能使用。C 正确：必须冷却到室温再转移——容量瓶的刻度线是在 20 ℃ 时刻制的，热溶液直接转移定容，冷却后液面会降到刻度线以下，实际体积小于 100 mL，所配溶液浓度偏高；洗涤烧杯和玻璃棒是为了把残留的溶质全部转入容量瓶，否则溶质损失、浓度偏低。D 正确：定容最后必须用胶头滴管缓慢滴加，防止加水超过刻度线。如果不慎加水超过了刻度线，只能倒掉重新配制，不能把多余的水吸出来（吸出时会带走溶质）。错因诊断：把容量瓶当成了「大号的烧杯或试管」，忘了它唯一的功能是定容——它只有一条刻度线，不能用来溶解、不能加热、不能作反应容器、也不能长期存放溶液。"},{"id":"qE013","kp":"sy-5","type":"single","diff":3,"stem":"关于定量实验中的读数与误差，下列说法正确的是","options":["用量筒量取 10.0 mL 水时，仰视刻度线读数，实际量取的水的体积大于 10.0 mL","用滴定管读数时，仰视刻度线会使读数偏小","用容量瓶定容时仰视刻度线，会使所配溶液的浓度偏大","用量筒量取液体，读数应记录到小数点后两位，如 5.20 mL"],"answer":0,"explain":"A 正确：量筒的刻度自下而上增大（0 在下方）。量取一定体积时如果仰视刻度线，视线向上斜，看到的刻度比实际液面的位置低，也就是水加到「看起来到了 10.0 mL」时，实际液面已经高于 10.0 mL 的刻度线，所以实际量取的水多于 10.0 mL。B 错：滴定管的刻度正好相反，0 刻度在上方、刻度自上而下增大，读数时仰视会使读数偏大（俯视使读数偏小）。C 错：容量瓶定容时仰视刻度线，眼睛偏低，实际上加水加过了刻度线，溶液体积偏大，浓度偏小（俯视则加水不足，浓度偏大）。D 错：量筒的精度是 0.1 mL，只能读到小数点后一位，如 5.2 mL；能读到小数点后两位（5.20 mL）的是滴定管、移液管这类精密量器，其中滴定管还要估读到 0.01 mL。错因诊断：读数误差题绝不能靠背「仰视偏大还是偏小」的口诀——量筒、滴定管、容量瓶的 0 刻度位置不同，判断的是「量取」还是「测体积」也不同，口诀一混就全错。可靠的做法是画一条带刻度的线，想清楚「眼睛在哪一侧、看到的是哪条刻度、实际液面在哪里」，再判断实际体积或浓度是偏大还是偏小。"},{"id":"qF001","kp":"x2-1","type":"single","diff":2,"stem":"基态铬原子(₂₄Cr)的电子排布式是","options":["1s²2s²2p⁶3s²3p⁶3d⁴4s²","1s²2s²2p⁶3s²3p⁶3d⁵","1s²2s²2p⁶3s²3p⁶3d⁵4s¹","1s²2s²2p⁶3s²3p⁶3d⁶"],"answer":2,"explain":"C 正确。铬原子核外共 24 个电子，电子填到该填 3d 的时候，若 5 个 3d 轨道各占 1 个电子（半充满 3d⁵）、4s 上留 1 个电子（半充满 4s¹），体系能量最低、最稳定，所以基态铬为 1s²2s²2p⁶3s²3p⁶3d⁵4s¹（也写作 [Ar]3d⁵4s¹）。A 是按构造原理“从头填满”想当然写出的结果，3d⁴4s² 不是铬的基态；B 的电子总数只有 2+2+6+2+6+5=23，电子个数都不对；D 的电子总数虽是 24，但 4s 能级能量低于 3d，电子应先填 4s，不能出现 3d 填了 6 个而 4s 空着的基态排布（那是激发态）。错因诊断：把构造原理当成“必须逐格填满”的死规则，不知道半充满、全充满、全空时能量更低的洪特规则特例——Cr、Cu 是最常考的两个特例。"},{"id":"qF002","kp":"x2-1","type":"judge","diff":2,"stem":"判断：洪特规则是指电子在同一能级的各个轨道上总是优先单独占据、且自旋方向相同；根据这一规则，基态铜原子(₂₉Cu)的价层电子排布应为 3d⁹4s²。","answer":false,"explain":"说法错误。“电子在同一能级的各个轨道上优先单独占据、自旋方向相同”确实是洪特规则的内容（如基态 N 原子 2p 上的 3 个电子分占 3 个 2p 轨道、自旋平行），但用它推出 3d⁹4s² 是错的。铜原子核外 29 个电子，若排成 3d⁹4s²，3d 轨道既不是半充满也不是全充满；而排成 3d¹⁰4s¹ 时，3d 全充满、4s 半充满，体系能量更低，所以基态铜原子的价层电子排布是 3d¹⁰4s¹（即 [Ar]3d¹⁰4s¹）。错因诊断：只背住洪特规则的条文，不会用它判断能量高低；遇到 Cr(3d⁵4s¹)、Cu(3d¹⁰4s¹) 这类半充满、全充满特例时仍机械写成 3d⁴4s²、3d⁹4s²。"},{"id":"qF003","kp":"x2-2","type":"single","diff":2,"stem":"第二周期元素中，Be 的第一电离能大于 B，N 的第一电离能大于 O，其原因是","options":["Be 和 N 的原子半径分别大于 B 和 O，半径越大，原子核对外层电子的吸引越弱，越难失去电子","Be 的最外层 2s 轨道全充满(2s²)、N 的 2p 轨道半充满(2p³)，这两种状态能量较低、结构更稳定，失去电子更困难","同周期元素从左到右第一电离能必然依次增大，Be、N 的反常只能解释为实验误差","第一电离能只与元素的金属性有关，与最外层电子的排布方式无关"],"answer":1,"explain":"B 正确。第一电离能的总趋势是同周期从左到右逐渐增大，但当最外层电子处于全充满、半充满或全空状态时结构更稳定，电离能会反常偏大：Be 的价电子为 2s²（全充满），N 的价电子为 2s²2p³（2p 半充满），所以 I₁(Be)>I₁(B)、I₁(N)>I₁(O)（同理还有 Mg>Al、P>S）。A 说法本身不对，Be 的原子半径比 B 小；C 把“总趋势”当成“必然递增”，无视了半充满、全充满带来的反常；D 否认了电子排布对电离能的影响，而电离能正是由核电荷数、原子半径和电子排布共同决定的。错因诊断：只背“同周期从左到右电离能增大”的结论，遇到 Be、N、Mg、P 这些半满全满元素就判断反了，属于典型的结构与性质脱节。"},{"id":"qF004","kp":"x2-2","type":"single","diff":1,"stem":"下列关于电负性的说法正确的是","options":["元素电负性越大，其原子在化合物中吸引电子的能力越强","元素电负性越大，其第一电离能一定越小","两种元素的电负性差值越大，形成的化学键极性越强，且一定是离子键","同主族元素从上到下，电负性逐渐增大"],"answer":0,"explain":"A 正确，电负性是元素原子在化合物中吸引电子能力的相对大小，电负性越大，吸引电子的能力越强。B 错，电负性与第一电离能之间没有这种反向关系，例如 F 的电负性和第一电离能都是同周期元素中最大的；C 错，电负性差值大只说明共价键的极性强，并不一定是离子键，如 HF 中 H—F 仍是极性共价键（成键两元素电负性差值较大时才倾向形成离子键，不能一概而论）；D 错，同主族从上到下电负性逐渐减小，如 F>Cl>Br>I。错因诊断：把“电负性大”与“容易失去电子”混为一谈（电负性大恰恰是容易得电子），或把“键的极性强弱”与“键的类型”直接画等号。"},{"id":"qF005","kp":"x2-3","type":"single","diff":1,"stem":"下列分子中，中心原子的杂化轨道类型与其他三个不同的是","options":["CH₄","NH₃","H₂O","BF₃"],"answer":3,"explain":"D 不同。CH₄、NH₃、H₂O 的中心原子价层电子对数都是 4（CH₄：4 个 σ 键、0 对孤对电子；NH₃：3 个 σ 键 + 1 对孤对电子；H₂O：2 个 σ 键 + 2 对孤对电子），都采取 sp³ 杂化；而 BF₃ 的中心原子 B 只有 3 个 σ 键、没有孤对电子，价层电子对数为 3，采取 sp² 杂化。错因诊断：一是只数“形成几个化学键”就下结论，二是把孤对电子排除在价层电子对之外，于是把 NH₃、H₂O 误判成 sp² 或 sp。关键：孤对电子同样占据杂化轨道，必须计入价层电子对数（价层电子对数 = σ 键数 + 孤对电子数），再按 2→sp、3→sp²、4→sp³ 对应。"},{"id":"qF006","kp":"x2-3","type":"single","diff":2,"stem":"下列分子中中心原子杂化轨道类型的判断，正确的是","options":["CO₂ 中的碳原子采取 sp² 杂化","SO₂ 中的硫原子采取 sp³ 杂化","HCN 中的碳原子采取 sp 杂化","CCl₄ 中的碳原子采取 sp² 杂化"],"answer":2,"explain":"C 正确。HCN 中碳原子分别与 1 个 H、1 个 N 形成 1 个 σ 键，共 2 个 σ 键、无孤对电子，价层电子对数为 2，采取 sp 杂化，分子为直线形 H—C≡N。A 错：CO₂ 中碳有 2 个 σ 键、无孤对电子，价层电子对数为 2，是 sp 杂化（O=C=O 直线形）；B 错：SO₂ 中硫有 2 个 σ 键和 1 对孤对电子，价层电子对数为 3，是 sp² 杂化（分子为 V 形）；D 错：CCl₄ 中碳有 4 个 σ 键、无孤对电子，价层电子对数为 4，是 sp³ 杂化。错因诊断：把双键、三键当成“多对电子对”重复计数——判断杂化只需要看 σ 键数加孤对数，π 键不额外占用杂化轨道，否则 CO₂、HCN 就会被误判成 sp²、sp³。"},{"id":"qF007","kp":"x2-4","type":"single","diff":2,"stem":"关于 H₂O 分子的结构，下列说法正确的是","options":["中心氧原子有 4 个价层电子对，价层电子对的构型为四面体形，而分子的空间构型为 V 形","中心氧原子只有 2 个价层电子对，价层电子对的构型为直线形，分子的空间构型也是直线形","中心氧原子有 4 个价层电子对，价层电子对构型和分子的空间构型都是四面体形","因为氧原子上有孤对电子，孤对电子之间的排斥力较小，所以 H₂O 的键角大于 109°28′"],"answer":0,"explain":"A 正确。H₂O 中氧原子有 2 个 σ 键和 2 对孤对电子，价层电子对数为 4，价层电子对（VSEPR）构型是四面体形；但四面体的 4 个顶点中有 2 个被孤对电子占据，只看原子的空间位置，分子的空间构型是 V 形（角形），键角约 105°。B 只数了成键的 2 对电子，漏掉孤对电子；C 把“价层电子对构型”直接当成了“分子构型”，这是最高频的错误；D 说反了，孤对电子只被一个原子核吸引、电子云更“胖”，排斥力比成键电子对大，所以 H₂O 的键角小于 109°28′。错因诊断：判断分子构型必须两步走——先算价层电子对数确定电子对构型，再扣除孤对电子占据的顶点得到分子构型。同理 NH₃ 的电子对构型是四面体形，分子构型是三角锥形。"},{"id":"qF008","kp":"x2-4","type":"single","diff":1,"stem":"下列分子与其空间构型对应正确的是","options":["CO₂ —— V 形","NH₃ —— 三角锥形","BF₃ —— 三角锥形","CH₄ —— 平面正方形"],"answer":1,"explain":"B 正确。NH₃ 中 N 有 3 个 σ 键和 1 对孤对电子，价层电子对构型为四面体形，去掉被孤对电子占据的一个顶点后，分子构型是三角锥形。A 错：CO₂ 中碳没有孤对电子，价层电子对数为 2，分子是直线形（O=C=O）；C 错：BF₃ 中 B 没有孤对电子，价层电子对数为 3，分子是平面三角形（不是三角锥形，三角锥形必须有孤对电子，如 NH₃）；D 错：CH₄ 中碳的 4 个价层电子对全部成键，分子是正四面体形，不是平面正方形。错因诊断：把价层电子对构型与分子构型混为一谈（如把 NH₃、H₂O 判成四面体形），或者只凭分子式联想形状而不去数孤对电子——BF₃ 与 NH₃ 都是 4 个原子，但有无孤对电子决定了形状完全不同。"},{"id":"qF009","kp":"x2-5","type":"single","diff":1,"stem":"HF、H₂O、NH₃ 的沸点分别比同族其他元素的氢化物（HCl、H₂S、PH₃ 等）高得多，其主要原因是","options":["它们的相对分子质量最大，分子间作用力随相对分子质量增大而增大","它们分子间能形成氢键，液体汽化时需要额外克服氢键，吸收的能量更多","它们的分子内存在氢键，使分子本身变得更稳定","它们都是离子化合物，离子键比分子间作用力强得多"],"answer":1,"explain":"B 正确。F、O、N 的电负性很大、原子半径很小，与 H 形成共价键后 H 几乎“裸露”而带部分正电性，能与另一分子中电负性大、半径小的 F、O、N 相互吸引，形成分子间氢键；氢键比普通的范德华力强，所以 HF、H₂O、NH₃ 的沸点远高于同族相邻的氢化物（HF 的沸点高于 HCl、HBr、HI）。A 错：HCl、H₂S、PH₃ 的相对分子质量都比对应的 HF、H₂O、NH₃ 更大，用相对分子质量解释不了这种反常；C 错：氢键存在于分子之间，不是分子内的作用，也不改变分子本身的稳定性；D 错：HF、H₂O、NH₃ 都是共价化合物，分子内是共价键，根本不存在离子键。错因诊断：一是把氢键当成化学键，二是把“分子间氢键”写成“分子内氢键”。请牢记：氢键是较强的分子间作用力，不是化学键。"},{"id":"qF010","kp":"x2-5","type":"judge","diff":2,"stem":"判断：氢键是一种特殊的化学键，它比范德华力强，所以水的沸点比 H₂S 高；冰中水分子之间也存在氢键，这些氢键使水分子排列得更紧密，因此冰的密度比液态水大。","answer":false,"explain":"错误，这段话里有两处关键错误。①氢键不是化学键，它属于分子间作用力（比范德华力强，但比共价键弱得多），水分子间存在氢键使水的沸点比 H₂S 高，这一点结论对、但“氢键是化学键”的说法错。②冰中每个水分子通过氢键与周围 4 个水分子相连，形成有规则、空隙较大的空间网状结构，所以冰的密度比液态水小，冰才能浮在水面上；而不是“排列得更紧密”。错因诊断：一是把“作用力强”等同于“化学键”；二是把氢键有方向性、饱和性造成的疏松结构，想当然地理解成“分子靠得更近、密度更大”。补充：氢键还影响溶解性，NH₃ 极易溶于水、乙醇与水能以任意比互溶，都与分子间形成氢键有关。"},{"id":"qF011","kp":"x2-6","type":"single","diff":1,"stem":"下列物质中属于共价晶体（又称原子晶体）的是","options":["干冰(CO₂)","金刚石","氯化钠","铜"],"answer":1,"explain":"B 正确。金刚石中每个碳原子与相邻的 4 个碳原子以共价键结合，整块晶体是一个巨大的空间网状结构，属于共价晶体（原子晶体），熔化时必须破坏共价键，所以熔点极高（约 3550 ℃）。A 干冰是 CO₂ 分子靠分子间作用力堆积而成的分子晶体，熔点很低；C 氯化钠由 Na⁺ 和 Cl⁻ 通过离子键结合，是离子晶体；D 铜由原子（离子）通过金属键结合，是金属晶体。错因诊断：把“含有共价键”当成“共价晶体”。干冰、冰、CO₂ 分子内部都有共价键，但它们都是分子晶体。判断晶体类型要看构成晶体的微粒以及微粒间的作用力（分子—分子间作用力／原子—共价键／离子—离子键／金属阳离子与自由电子—金属键），而不是看分子内部有什么键。"},{"id":"qF012","kp":"x2-6","type":"single","diff":2,"stem":"下列物质熔点高低的比较，正确的是","options":["金刚石 > 氯化钠 > 干冰","氯化钠 > 金刚石 > 干冰","干冰 > 氯化钠 > 金刚石","冰 > 金刚石 > 氯化钠"],"answer":0,"explain":"A 正确。金刚石是共价晶体，熔化时要破坏共价键，熔点最高（约 3550 ℃）；氯化钠是离子晶体，熔化时要破坏离子键，熔点较高（801 ℃）；干冰是分子晶体，熔化（升华）时只需克服微弱的分子间作用力，熔点最低（−78.5 ℃ 升华）。因此顺序是 金刚石 > 氯化钠 > 干冰。错因诊断：一看到“氯化钠”就想当然地认为离子键一定比共价键强，从而把离子晶体排在共价晶体前面。比较熔点要先判断晶体类型：一般 共价晶体 > 离子晶体 > 分子晶体；但要注意两点——金属晶体的熔点差别很大（Hg 很低、W 很高），离子晶体的熔点还与离子所带电荷和半径有关（MgO 的熔点就高于 NaCl）。"},{"id":"qF013","kp":"x2-6","type":"fill","diff":3,"stem":"某晶体的晶胞为立方体，X 原子位于立方体的 8 个顶点和 6 个面心，Y 原子位于立方体的 12 条棱的中点和 1 个体心。该晶体的化学式为____（用 X、Y 和数字表示）。","answer":["XY","YX","X₁Y₁"],"explain":"答案 XY。用均摊法计算：顶点上的微粒被 8 个晶胞共用，每个顶点微粒属于该晶胞 1/8；棱上的微粒被 4 个晶胞共用，属于 1/4；面心上的微粒被 2 个晶胞共用，属于 1/2；体心上的微粒完全属于该晶胞，算 1。所以 X 的个数 = 8×1/8 + 6×1/2 = 1 + 3 = 4；Y 的个数 = 12×1/4 + 1×1 = 3 + 1 = 4。X : Y = 4 : 4 = 1 : 1，化学式为 XY。错因诊断：最典型的错误是完全不均摊，数出几个就写几个（如写成 X₈Y₁₃）；其次是把棱上的 1/4 记成 1/8、把体心的 1 记成 1/2，或把面心的 1/2 与顶点的 1/8 用反。记牢“顶点 1/8、棱 1/4、面心 1/2、体心 1”，再按最简整数比写出化学式。"},{"id":"qF014","kp":"x2-7","type":"single","diff":1,"stem":"在 [Cu(NH₃)₄]SO₄ 中，中心离子、配体和配位数依次是","options":["Cu²⁺、NH₃、4","Cu⁺、NH₃、4","Cu²⁺、SO₄²⁻、4","Cu²⁺、NH₃、6"],"answer":0,"explain":"A 正确。方括号内的 [Cu(NH₃)₄]²⁺ 是配合物的内界，SO₄²⁻ 是外界。中心离子是 Cu²⁺：外界 SO₄²⁻ 带 −2 价，内界整体为 +2 价，4 个 NH₃ 分子不带电，故 Cu 为 +2 价；配体是提供孤对电子的 NH₃ 分子；配位数是方括号内直接与中心离子成键的配体数目，为 4。B 错在中心离子的价态，铜在此为 +2 价而不是 +1 价；C 错在把外界离子 SO₄²⁻ 当成了配体，它位于内界之外，不是配体；D 错在配位数，与 Cu²⁺ 直接成键的只有 4 个 NH₃，没有 6 个。错因诊断：分不清内界和外界，把外界离子也算进配体；或者凭“铜离子常配位 6 个”的经验乱填配位数。判断配位数只看方括号内与中心离子直接相连的配体个数。"},{"id":"qF015","kp":"x2-7","type":"judge","diff":2,"stem":"判断：NH₄⁺ 中 N 原子与 4 个 H 原子成键，其中 3 个 N—H 键是普通的共价键、1 个是由 N 原子提供孤对电子、H⁺ 提供空轨道形成的配位键；因为形成方式不同，所以这 4 个 N—H 键的键长和键能并不相同。","answer":false,"explain":"错误。前面的描述本身没问题：NH₄⁺ 可以看作 NH₃ 中 N 原子的孤对电子进入 H⁺ 的空轨道，形成 1 个配位键（表示为 N→H），加上原有的 3 个 N—H 共价键。但结论错了——配位键一旦形成，就与普通共价键完全等同，没有本质差别，NH₄⁺ 中 4 个 N—H 键的键长、键能都相同，NH₄⁺ 是正四面体形。错因诊断：把“成键方式不同”误当成“键的性质不同”，这是对配位键最典型的误解。要记住：配位键是特殊的共价键，它的“特殊”只体现在共用电子对的来源上（由一方单独提供），形成之后不再有任何区别。"},{"id":"qG001","kp":"x3-1","type":"single","diff":1,"stem":"某有机物的结构简式为 HO—CH₂—CH=CH—COOH，该分子中含有的官能团共有几种","options":["2种","3种","4种","5种"],"answer":1,"explain":"答案 3 种：羟基（—OH）、碳碳双键（C=C）、羧基（—COOH）。错因诊断：①漏数——眼睛只盯住羧基和双键，把最左边的 —CH₂OH 上的羟基漏掉；②多数——把羧基拆成“羰基 + 羟基”算成两种，其实羧基（—COOH）是一个整体官能团，不能拆开数。正确做法是沿着结构简式从左到右把每个特征基团逐个圈出来，圈完再数个数，数官能团考的就是“数得全不全、拆得对不对”。"},{"id":"qG002","kp":"x3-1","type":"multi","diff":2,"stem":"下列关于有机物中所含官能团及所属类别的说法正确的是（多选）","options":["CH₃CH₂CHO 中的官能团是醛基（—CHO），属于醛","CH₃—O—CH₂CH₃ 中的官能团是醚键（—O—），属于醚","CH₃COOCH₂CH₃ 中的官能团是酯基（—COO—），属于酯","CH₃CONH₂ 中的官能团是氨基（—NH₂），属于胺"],"answer":[0,1,2],"explain":"A、B、C 三项对应都正确：醛基 —CHO 对应醛，醚键 —O— 对应醚，酯基 —COO— 对应酯。D 错：CH₃CONH₂ 中的 —NH₂ 是连在羰基碳上的，整体是酰胺基（—CONH₂，含酰胺键），属于酰胺，不是胺。错因诊断：判断类别不能“看到 —NH₂ 就是胺、看到 —OH 就是醇”，必须看这个基团直接连在什么原子上：—OH 连在链烃基上叫醇、连在苯环上叫酚、在 —COOH 里属羧基，性质完全不同。"},{"id":"qG003","kp":"x3-2","type":"single","diff":1,"stem":"下列有关同分异构体的说法正确的是","options":["分子式相同、结构不同的化合物互为同分异构体","相对分子质量相同的化合物一定互为同分异构体","分子式相同、结构相同的物质互为同分异构体","同分异构体的化学性质一定相同"],"answer":0,"explain":"A 就是同分异构体的定义，必须同时满足“分子式相同”和“结构不同”两个条件。B 错：相对分子质量相同、分子式不同的物质不是同分异构体，例如乙醇（C₂H₆O，相对分子质量 46）和甲酸（CH₂O₂，相对分子质量 46）。C 错：分子式相同、结构相同的是同一种物质。D 错：同分异构体结构不同，性质可以差别很大。错因诊断：只记“分子式相同”就下结论，漏掉“结构不同”。顺便记住三类异构：碳链异构（正丁烷与异丁烷）、位置异构（1-丁烯与 2-丁烯）、官能团异构（乙醇与二甲醚 C₂H₆O、丙醛与丙酮 C₃H₆O、乙酸与甲酸甲酯 C₂H₄O₂）。"},{"id":"qG004","kp":"x3-2","type":"single","diff":1,"stem":"分子式为 C₄H₁₀ 的烷烃的同分异构体共有几种（不考虑立体异构）","options":["2种","3种","4种","5种"],"answer":0,"explain":"C₄H₁₀ 只有 2 种：正丁烷 CH₃CH₂CH₂CH₃ 和异丁烷（2-甲基丙烷）CH₃CH(CH₃)CH₃。写同分异构体的规范方法是“减碳法”：先写最长碳链（4 个碳一条直链），再把主链缩短到 3 个碳、把剩下的 1 个碳当支链挂上去，注意支链不能挂在链的端点上（挂到端点上主链就变长了，等于重复计数）。错因诊断：多数——把 CH₃CH(CH₃)CH₃ 又写成 CH₃CH₂(CH₃)CH₃ 当成第二种，其实是同一种物质；漏数——只写出直链的 1 种。数同分异构体练的是“不重不漏”，写完全部结构后一定要回头两两比对。"},{"id":"qG005","kp":"x3-2","type":"single","diff":3,"stem":"正丁烷（CH₃CH₂CH₂CH₃）的一氯代物共有几种（不考虑立体异构）","options":["1种","2种","3种","4种","5种"],"answer":1,"explain":"正丁烷分子中的氢分 2 类：两端 2 个 —CH₃ 上的 6 个氢完全等效（分子左右对称），中间 2 个 —CH₂— 上的 4 个氢等效，所以一氯代物只有 2 种：1-氯丁烷 CH₃CH₂CH₂CH₂Cl 和 2-氯丁烷 CH₃CH₂CHClCH₃。错因诊断：①多数——按“有几种碳就写几种”，把 1-氯丁烷与 4-氯丁烷、2-氯丁烷与 3-氯丁烷重复计数，数出 4 种；②忘了等效氢的判断规则：同一个碳上的氢等效，处于对称位置的氢（包括对称位置上的甲基）等效。补充：异丁烷 CH₃CH(CH₃)CH₃ 的等效氢也只有 2 类（3 个甲基上的氢等效、中间 —CH— 上 1 个氢），它的一氯代物同样是 2 种，不要以为支链多就一定多。"},{"id":"qG006","kp":"x3-3","type":"single","diff":1,"stem":"下列关于甲烷的说法正确的是","options":["甲烷与氯气在光照条件下发生的是取代反应，产物中 HCl 的物质的量最多","甲烷能使酸性高锰酸钾溶液褪色","甲烷能与溴水发生加成反应而使溴水褪色","甲烷是平面结构，5 个原子在同一平面上"],"answer":0,"explain":"A 正确：CH₄ + Cl₂ →(光照) CH₃Cl + HCl，每一步取代都生成 1 mol HCl，无论最终生成哪种氯代甲烷，HCl 都是物质的量最多的产物。B 错：烷烃化学性质稳定，不能使酸性 KMnO₄ 溶液褪色。C 错：甲烷是饱和烃，只能取代、不能加成，不能使溴水褪色。D 错：甲烷是正四面体结构（分子中最多 3 个原子共平面），不是平面结构。错因诊断：把烷烃的“取代”记成“加成”是这一节最高频的错误，判断时先找有没有不饱和键（碳碳双键、碳碳三键），有双键才谈得上加成。"},{"id":"qG007","kp":"x3-3","type":"single","diff":1,"stem":"下列关于乙烯的说法正确的是","options":["乙烯分子中 6 个原子在同一平面上","乙烯使酸性高锰酸钾溶液褪色和使溴水褪色，两者的原理相同","乙烯与溴水发生取代反应生成 1,2-二溴乙烷","乙烯属于饱和烃，不能发生加成反应"],"answer":0,"explain":"A 正确：乙烯 CH₂=CH₂ 是平面形分子，2 个碳原子和 4 个氢原子共 6 个原子在同一平面上。B 错：使酸性 KMnO₄ 溶液褪色是因为乙烯被氧化（氧化反应），使溴水褪色是因为乙烯与 Br₂ 发生加成反应，原理不同。C 错：CH₂=CH₂ + Br₂ → CH₂BrCH₂Br（1,2-二溴乙烷），是加成反应而不是取代反应。D 错：乙烯含碳碳双键，是不饱和烃，能与 H₂、Br₂、H₂O 等发生加成。错因诊断：“两种褪色现象原理不同”必须分清——这也正是用酸性 KMnO₄ 溶液可以区分烷烃和烯烃、而用溴水不能区分（苯也能使溴水褪色，但那是萃取，属于物理变化）的原因。"},{"id":"qG008","kp":"x3-3","type":"single","diff":2,"stem":"下列关于苯（C₆H₆）的说法正确的是","options":["苯能与液溴在 FeBr₃ 催化下发生取代反应生成溴苯","苯分子中含有碳碳单键和碳碳双键交替出现的结构","苯能与溴水发生加成反应而使溴水褪色","苯能被酸性高锰酸钾溶液氧化，从而使溶液褪色"],"answer":0,"explain":"A 正确：C₆H₆ + Br₂ →(FeBr₃ 或铁粉催化) C₆H₅Br + HBr，得到溴苯，这是取代反应。B 错：苯分子中 6 个碳碳键完全相同，是介于单键和双键之间的一种特殊键，不存在单、双键交替。C 错：苯与溴水不反应，溴水褪色是因为溴在苯中的溶解度远大于在水中的溶解度，发生了萃取（物理变化）。D 错：苯不能被酸性 KMnO₄ 氧化。错因诊断：苯的性质记“三不三能”——不能使酸性 KMnO₄ 褪色、不能与溴水反应（只萃取）、不能使溴的四氯化碳溶液褪色；能取代（液溴/FeBr₃、浓硝酸和浓硫酸、浓硫酸）、能加成（H₂/Ni 生成环己烷）、能燃烧。"},{"id":"qG009","kp":"x3-4","type":"single","diff":1,"stem":"溴乙烷（CH₃CH₂Br）与 NaOH 的乙醇溶液共热，发生的反应类型及主要产物是","options":["消去反应，主要产物是乙烯","取代反应，主要产物是乙醇","加成反应，主要产物是乙烷","氧化反应，主要产物是乙醛"],"answer":0,"explain":"CH₃CH₂Br + NaOH →(乙醇溶液，加热) CH₂=CH₂↑ + NaBr + H₂O，脱去 HBr 生成乙烯，属于消去反应，A 正确。B 错：在 NaOH 的水溶液中加热才是水解（取代）反应，产物是乙醇。C、D 与卤代烃的典型反应不符，溴乙烷不能通过加成生成乙烷，也不会被 NaOH 氧化成乙醛。错因诊断：记住“溶剂不同、产物不同”——NaOH 水溶液 → 取代（水解）得醇；NaOH 乙醇溶液 → 消去得烯烃。不要死背产物，要看条件判断是“哪个碳上的原子被拿掉”。"},{"id":"qG010","kp":"x3-4","type":"multi","diff":2,"stem":"检验溴乙烷中是否含有溴元素，下列操作或说法正确的是（多选）","options":["把溴乙烷与 NaOH 溶液共热，使它水解生成 Br⁻","水解后的溶液冷却后直接滴加 AgNO₃ 溶液，出现淡黄色沉淀即可证明含溴元素","水解后的溶液先用稀硝酸酸化，再滴加 AgNO₃ 溶液，出现淡黄色沉淀说明含溴元素","溴乙烷中的溴元素以 Br⁻ 形式存在，加入 AgNO₃ 溶液可直接产生沉淀"],"answer":[0,2],"explain":"A 正确：溴乙烷中的溴是共价键中的原子状态，必须先水解（取代）转成 Br⁻ 才能检验。C 正确：水解液中有过量的 NaOH，先加稀硝酸中和并酸化，再加 AgNO₃ 溶液，淡黄色沉淀 AgBr 说明有溴元素。B 错：不酸化时 OH⁻ 会与 Ag⁺ 生成沉淀（Ag₂O/AgOH），干扰判断。D 错：溴乙烷不能电离出 Br⁻，直接加 AgNO₃ 溶液不会产生沉淀。错因诊断：卤素检验的统一套路是“先水解、再酸化、后加 AgNO₃”；酸化只能用稀硝酸，不能用盐酸（引入 Cl⁻ 会造成干扰），酸化这一步漏掉是最典型的失分点。"},{"id":"qG011","kp":"x3-5","type":"single","diff":1,"stem":"下列物质中，既能与金属钠反应放出氢气，又能与 NaOH 溶液反应的是","options":["乙醇（CH₃CH₂OH）","苯酚（C₆H₅OH）","乙醚（CH₃CH₂OCH₂CH₃）","乙酸乙酯（CH₃COOCH₂CH₃）"],"answer":1,"explain":"B 正确：苯酚既能与 Na 反应放出 H₂，又能与 NaOH 反应生成苯酚钠和水（C₆H₅OH + NaOH → C₆H₅ONa + H₂O），说明酚羟基具有弱酸性。A 错：乙醇能与 Na 反应（2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂↑），但不能与 NaOH 反应，所以不满足“都能”。C 错：乙醚既不与 Na 反应，也不与 NaOH 反应。D 错：乙酸乙酯能与 NaOH 发生水解，但不能与 Na 反应放出 H₂。错因诊断：醇羟基和酚羟基都含 —OH、都能与 Na 反应，但只有酚羟基有酸性；看到“与 NaOH 反应”就应立刻想到酚，而不是醇。"},{"id":"qG012","kp":"x3-5","type":"multi","diff":2,"stem":"下列关于乙醇和苯酚的说法正确的是（多选）","options":["它们的分子中都含有羟基（—OH），都能与金属钠反应放出氢气","它们都能与 NaOH 溶液反应生成相应的钠盐","向苯酚溶液中滴加 FeCl₃ 溶液会显紫色，可用这一方法鉴别苯酚和乙醇","苯酚能与 Na₂CO₃ 溶液反应生成苯酚钠和 NaHCO₃，但不能放出 CO₂"],"answer":[0,2,3],"explain":"A 正确：乙醇（醇羟基）和苯酚（酚羟基）都能与 Na 反应放出 H₂。B 错：乙醇不能与 NaOH 反应，只有苯酚能与 NaOH 反应生成苯酚钠。C 正确：苯酚遇 FeCl₃ 溶液显紫色，这是检验苯酚最简便的方法。D 正确：C₆H₅OH + Na₂CO₃ → C₆H₅ONa + NaHCO₃，只生成 NaHCO₃，不放 CO₂，说明苯酚的酸性比碳酸弱、但比 HCO₃⁻ 强。错因诊断：把“醇”和“酚”当成一类物质是核心错误。记住两条对比：①与 Na 反应——醇、酚都能；与 NaOH、Na₂CO₃ 反应——只有酚能；②酸性顺序：H₂CO₃ > 苯酚 > HCO₃⁻，所以苯酚与 Na₂CO₃ 反应不产生 CO₂，苯酚也不能与 NaHCO₃ 溶液反应。"},{"id":"qG013","kp":"x3-5","type":"single","diff":2,"stem":"下列醇中，不能发生消去反应生成烯烃的是","options":["甲醇（CH₃OH）","乙醇（CH₃CH₂OH）","1-丙醇（CH₃CH₂CH₂OH）","2-丙醇（CH₃CH(OH)CH₃）"],"answer":0,"explain":"醇消去（分子内脱水成烯烃）的结构要求是：与羟基相连的碳原子（α碳）的邻位碳原子（β碳）上必须有氢原子。A 甲醇分子只有一个碳原子，没有 β碳，无论什么条件都不能消去生成烯烃，所以 A 符合题意。B、C、D 的 β碳上都有氢，都能消去：乙醇→乙烯，1-丙醇→丙烯，2-丙醇→丙烯。错因诊断：①只背“醇能消去”，不问结构有没有 β-H；②条件记混——醇消去用浓硫酸并加热到 170 ℃，140 ℃时发生的是分子间脱水生成乙醚（取代反应）。补充：催化氧化要求 α碳上有氢，所以甲醇能催化氧化成甲醛，而叔醇（如 2-甲基-2-丙醇）不能被催化氧化。"},{"id":"qG014","kp":"x3-6","type":"single","diff":1,"stem":"下列物质中，能与新制氢氧化铜悬浊液在加热条件下反应生成砖红色沉淀的是","options":["乙醛（CH₃CHO）","乙醇（CH₃CH₂OH）","丙酮（CH₃COCH₃）","乙酸（CH₃COOH）"],"answer":0,"explain":"只有含醛基（—CHO）的物质才能被新制 Cu(OH)₂ 氧化：CH₃CHO + 2Cu(OH)₂ + NaOH →(加热) CH₃COONa + Cu₂O↓ + 3H₂O，砖红色沉淀是 Cu₂O，A 正确。B 错：普通醇不与新制 Cu(OH)₂ 反应，只有甘油等多元醇能使它溶解成绛蓝色溶液，但不会出现砖红色沉淀。C 错：丙酮的官能团是羰基（酮羰基），不是醛基，不能反应——这正是“醛基、羰基记混”的典型错点。D 错：乙酸显酸性，只会把氢氧化铜溶解，不生成砖红色沉淀。错因诊断：检验醛基的两大试剂是银氨溶液（银镜反应，水浴加热）和新制氢氧化铜悬浊液（加热，砖红色沉淀），两者都必须在碱性条件下使用，反应中醛被氧化、表现还原性。"},{"id":"qG015","kp":"x3-6","type":"multi","diff":2,"stem":"关于乙醛的性质和检验，下列说法正确的是（多选）","options":["乙醛能与银氨溶液发生银镜反应，说明乙醛具有还原性","乙醛与新制氢氧化铜悬浊液加热，产生砖红色沉淀","丙酮（CH₃COCH₃）也能发生银镜反应，因为它的分子中也含有羰基","银镜反应中乙醛被还原成乙醇"],"answer":[0,1],"explain":"A、B 正确：银镜反应（银氨溶液、水浴加热）和新制 Cu(OH)₂ 反应（加热、砖红色沉淀）是检验醛基的两种经典方法，乙醛在反应中被氧化，表现还原性。C 错：酮的羰基碳上没有氢原子，不能被银氨溶液氧化，丙酮不能发生银镜反应。D 错：银镜反应中乙醛被氧化成乙酸（碱性条件下生成乙酸盐），生成乙醇发生在乙醛与 H₂ 加成的反应中，不能混为一谈。错因诊断：牢记“能被氧化的只有醛基，酮羰基不能”，同时要知道甲酸（HCOOH）、甲酸酯、葡萄糖等分子中含有类似醛基的结构，也都能发生银镜反应。"},{"id":"qG016","kp":"x3-6","type":"single","diff":2,"stem":"下列关于醛和酮的说法正确的是","options":["醛和酮的分子中都含有羰基，但醛的羰基碳上一定连有氢原子","醛能与 H₂ 发生加成反应生成醇，酮不能与 H₂ 发生加成反应","醛和酮都能发生银镜反应","醛和酮都能被酸性高锰酸钾溶液氧化"],"answer":0,"explain":"A 正确：醛（R—CHO）和酮（R—CO—R′）都含羰基（C=O），区别在于醛的羰基碳上连有 1 个氢原子，酮的羰基碳两端都连碳原子。B 错：酮也能与 H₂ 加成生成醇，如丙酮加氢生成 2-丙醇，这是加成（还原），不是不能反应。C 错：只有醛能发生银镜反应，酮不能。D 错：酮一般不能被酸性 KMnO₄ 溶液氧化，醛可以。错因诊断：把醛、酮的“同”与“异”分清——“同”是都有羰基，都能催化加氢成醇；“异”是只有醛能被银氨溶液、新制 Cu(OH)₂ 氧化（银镜反应、砖红色沉淀），这是鉴别醛和酮的关键。"},{"id":"qG017","kp":"x3-7","type":"single","diff":2,"stem":"乙酸与乙醇在浓硫酸催化下发生酯化反应生成乙酸乙酯，下列说法正确的是","options":["反应中乙酸脱去羟基（—OH），乙醇脱去羟基上的氢原子","反应中乙酸脱去氢原子，乙醇脱去羟基","该反应属于加成反应，原子利用率为 100%","该反应能进行到底，反应物可以完全转化为乙酸乙酯"],"answer":0,"explain":"A 正确：酯化反应的断键规律是“酸脱羟基、醇脱氢”，生成的水中氧原子来自乙酸，用氧同位素（¹⁸O）示踪可以证明。B 错：脱去的原子团写反了。C 错：酯化反应属于取代反应，同时还有水生成，原子利用率不是 100%。D 错：CH₃COOH + C₂H₅OH ⇌(浓硫酸，加热) CH₃COOCH₂CH₃ + H₂O 是可逆反应，反应物不可能完全转化；浓硫酸的作用是催化剂和吸水剂，吸收生成的水可以使平衡向正反应方向移动。错因诊断：酯化反应三点必记——可逆（用 ⇌ 不用 →）、浓硫酸催化吸水、酸脱羟基醇脱氢。"},{"id":"qG018","kp":"x3-7","type":"single","diff":1,"stem":"乙酸乙酯（CH₃COOCH₂CH₃）在 NaOH 溶液中加热水解，生成的产物是","options":["乙醇和乙酸钠","乙醇和乙酸","乙醛和乙酸钠","甲醇和乙酸钠"],"answer":0,"explain":"CH₃COOCH₂CH₃ + NaOH →(加热) CH₃COONa + C₂H₅OH，酯在碱性条件下水解生成醇和羧酸盐，A 正确。B 错：乙醇和乙酸是酸性条件下水解（CH₃COOC₂H₅ + H₂O ⇌ CH₃COOH + C₂H₅OH）的产物；碱性条件下生成的乙酸立即被 NaOH 中和成乙酸钠，所以水解程度更大、更彻底。C 错：酯水解不生成醛。D 错：从结构看 —O—CH₂CH₃ 这一部分是乙醇提供的，产物中的醇是乙醇，不是甲醇。错因诊断：酯水解属于取代反应；判断产物时把酯沿 —COO— 中间断开，羰基一侧接 —OH（有碱时接 —ONa），氧一侧接 —H 形成醇，这样断不会错。"},{"id":"qG019","kp":"x3-7","type":"single","diff":2,"stem":"下列关于乙酸的说法正确的是","options":["乙酸的酸性比碳酸强，能与 Na₂CO₃ 溶液反应放出 CO₂","乙酸能与 NaHCO₃ 溶液反应，说明乙酸的酸性比碳酸弱","1 mol 乙酸与足量 NaHCO₃ 溶液反应可放出 2 mol CO₂","乙酸分子中含有醛基，能发生银镜反应"],"answer":0,"explain":"A 正确：CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂↑，能与碳酸盐反应放出 CO₂，说明乙酸的酸性比碳酸强。B 错：能反应恰恰说明酸性比碳酸强，逻辑方向说反了。C 错：1 mol 乙酸只含 1 mol 羧基，最多放出 1 mol CO₂。D 错：乙酸的官能团是羧基（—COOH），不是醛基，不能发生银镜反应（注意甲酸 HCOOH 结构特殊，既显羧酸性又能发生银镜反应，是唯一的例外）。错因诊断：酸性强弱顺序要记牢：羧酸（乙酸）> 碳酸 > 苯酚 > HCO₃⁻；判断“谁强”的唯一标准是“能否反应并放出 CO₂”。"},{"id":"qG020","kp":"x3-8","type":"single","diff":2,"stem":"合成路线如下：乙烯与 HBr 反应得到溴乙烷；溴乙烷在 NaOH 水溶液中加热得到乙醇；乙醇在 Cu 催化下与 O₂ 反应得到乙醛。下列说法正确的是","options":["乙烯→溴乙烷是加成反应，溴乙烷→乙醇是取代（水解）反应，乙醇→乙醛是氧化反应","乙烯→溴乙烷是取代反应，溴乙烷→乙醇是加成反应，乙醇→乙醛是还原反应","乙烯→溴乙烷是加成反应，溴乙烷→乙醇是消去反应，乙醇→乙醛是取代反应","上述三步反应都是加成反应"],"answer":0,"explain":"A 正确：CH₂=CH₂ + HBr → CH₃CH₂Br（双键打开加进原子，是加成反应）；CH₃CH₂Br + NaOH →(水溶液，加热) CH₃CH₂OH + NaBr（—Br 被 —OH 替代，是水解，属于取代反应）；2CH₃CH₂OH + O₂ →(Cu，加热) 2CH₃CHO + 2H₂O（去氢加氧，是催化氧化）。B、C、D 都把反应类型张冠李戴。错因诊断：判断反应类型只看“官能团怎么变”——双键（或三键）变成单键是加成；有机物中某个原子或原子团被别的原子或原子团替代是取代；加氧或去氢是氧化，加氢或去氧是还原。乙醇→乙醛是去氢过程，只能叫氧化，不能叫消去（消去会生成乙烯，条件是浓硫酸、170 ℃）。"},{"id":"qG021","kp":"x3-8","type":"single","diff":3,"stem":"以乙醇为原料合成乙酸乙酯的路线为：CH₃CH₂OH →(①) CH₃CHO →(②) CH₃COOH →(③，与乙醇反应) CH₃COOCH₂CH₃。下列判断正确的是","options":["①是催化氧化（Cu 或 Ag 催化并加热），②也是氧化反应；③是酯化反应，属于取代反应且可逆","①是消去反应，②是加成反应，③是加成反应","①是取代反应，②是还原反应，③的产物只有乙酸乙酯，没有任何其他物质","①是加成反应，②是氧化反应，③是不可逆反应"],"answer":0,"explain":"A 正确：①2CH₃CH₂OH + O₂ →(Cu 或 Ag，加热) 2CH₃CHO + 2H₂O，是催化氧化；②2CH₃CHO + O₂ →(催化剂，加热) 2CH₃COOH，也是氧化反应（用新制 Cu(OH)₂ 或银氨溶液氧化乙醛同样可行）；③CH₃COOH + C₂H₅OH ⇌(浓硫酸，加热) CH₃COOCH₂CH₃ + H₂O，是酯化反应，属于取代反应，而且可逆。B、D 的反应类型判断错误。C 错：酯化是可逆反应，且有水生成，不可能“产物只有乙酸乙酯”。错因诊断：①把“乙醇→乙醛”误判为消去（消去必须生成不饱和键，如乙醇在浓硫酸、170 ℃下生成乙烯）；②忘了酯化可逆、有水生成。有机合成推断的通用思路是：先看每一步官能团怎么变，决定反应类型；再看碳骨架有没有变，决定是取代、加成还是消去。"},{"id":"qH001","kp":"lj-1","type":"judge","diff":2,"stem":"常温下，将 10 g 乙醇与 10 g 乙酸混合并充分振荡，在忽略挥发损失的条件下，混合液的总质量一定等于 20 g","answer":true,"explain":"正确。质量守恒定律说的是：参加反应的各物质的质量总和等于反应后生成的各物质的质量总和；而即使两者根本不发生反应，物理混合时各部分质量之和也必然等于总质量，所以一定是 20 g。很多同学一看到“乙醇和乙酸”就想到“它们会发生酯化反应，质量会不会变了”——这是把“发生了变化”等同于“质量会消失”。事实上即使真的发生了 CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O，反应前后原子的种类、数目、质量都不变，总质量仍然是 20 g；而且酯化反应是可逆反应，无论反应进行到什么程度，质量都守恒。错因诊断：选“错误”说明你在用“感觉”判断，而没有用守恒关系去判断——守恒的结论与“反应有没有发生、反应是否完全”无关。"},{"id":"qH002","kp":"lj-1","type":"single","diff":2,"stem":"下列关于守恒关系的说法，正确的是","options":["氧化还原反应中，氧化剂得到的电子总数一定等于还原剂失去的电子总数","氧化还原反应中，氧化剂与还原剂的物质的量一定相等","任何溶液中阳离子的数目一定等于阴离子的数目","化学反应前后，分子的种类和数目都不发生改变"],"answer":0,"explain":"A 正确，这就是电子守恒：氧化剂得电子总数必等于还原剂失电子总数，它是氧化还原计算的核心工具。B 错：守恒的是电子的“总数”，而不是物质的量；每分子得失电子数不同，氧化剂与还原剂的物质的量就不相等，例如 2Na + Cl₂ → 2NaCl 中还原剂 Na 是 2 mol、氧化剂 Cl₂ 是 1 mol。把“电子总数相等”偷换成“物质的量相等”，是最典型的偷换概念。C 错：溶液中守恒的是电荷——阳离子所带正电荷总数等于阴离子所带负电荷总数，而离子“数目”不一定相等，例如 1 mol MgCl₂ 溶液中 Mg²⁺ 只有 1 mol、Cl⁻ 却有 2 mol。D 错：化学变化中分子破裂成原子再重新组合，分子的种类一定改变，数目也可能改变。错因诊断：选 B、C 的同学是把“总量守恒、电荷守恒”误读成“具体微粒的个数相等”，守恒思想要求你写清楚守恒的到底是哪一个量。"},{"id":"qH003","kp":"lj-1","type":"single","diff":2,"stem":"一定条件下，1 mol 乙醇（C₂H₆O）在足量氧气中完全燃烧。若不考虑副反应，下列判断正确的是","options":["生成 2 mol CO₂ 和 3 mol H₂O，共消耗 3 mol O₂","生成 2 mol CO₂ 和 3 mol H₂O，共消耗 2 mol O₂","生成 CO₂ 和 H₂O 一共 5 mol，因此消耗的 O₂ 也是 5 mol","反应前后物质的总物质的量保持不变"],"answer":0,"explain":"A 正确：由碳原子守恒，1 mol C₂H₆O 中含 2 mol C，故生成 2 mol CO₂；由氢原子守恒，含 6 mol H，故生成 3 mol H₂O；再由氧原子守恒核算，生成物中共有氧原子 2×2 + 3×1 = 7 mol，其中乙醇自身提供 1 mol，其余 6 mol 必须由 O₂ 提供，故 n(O₂) = 3 mol（也可写成 C₂H₆O + 3O₂ → 2CO₂ + 3H₂O）。B 错：只按 CO₂ 中的氧去配氧气，漏掉了水中的氧。C 错：“生成物共 5 mol”与“消耗氧气多少”之间没有任何必然联系，物质的量守恒在化学反应中一般不成立。D 错：反应前共 1 + 3 = 4 mol 气体，反应后只有 2 + 3 = 5 mol（水在燃烧温度下为气态），物质的量发生了改变，守恒的是质量、原子和元素，不是物质的量。错因诊断：守恒前必须先问“哪一种微粒守恒”，抓住“原子守恒”才能一步推出答案。"},{"id":"qH004","kp":"lj-2","type":"single","diff":2,"stem":"在 1 L 1 mol/L 的 NaCl 溶液中（阿伏加德罗常数的值约为 6.02×10²³ mol⁻¹），下列说法正确的是","options":["含有 NaCl 分子约 6.02×10²³ 个","Na⁺ 与 Cl⁻ 的个数之和约为 1.204×10²⁴ 个","溶液中只含有 Na⁺ 和 Cl⁻ 两种微粒","溶液中水分子的数目等于 Na⁺ 的数目"],"answer":1,"explain":"B 正确：溶液中 NaCl 为 1 mol，在水中完全电离为 1 mol Na⁺ 和 1 mol Cl⁻，离子总数 2 mol，即约 2×6.02×10²³ = 1.204×10²⁴ 个。A 错：NaCl 是离子化合物，由 Na⁺、Cl⁻ 通过离子键结合而成，固体中就不存在 NaCl 分子，溶于水后 Na⁺ 与 Cl⁻ 被水分子包围而分开（水合离子），更不会形成 NaCl 分子——这个说法从根本上就不成立，它暴露的是“看见化学式就想象出一个分子”的错误，把 NaCl 当成了 HCl 那样的共价分子。C 错：溶液中除了 Na⁺、Cl⁻，还有大量水分子，以及水电离出的极少量 H⁺ 和 OH⁻，“只有两种微粒”漏掉了溶剂。D 错：1 L 水的质量约 1000 g，物质的量约 1000 g ÷ 18 g/mol ≈ 55.6 mol，水分子数远多于 Na⁺。错因诊断：微粒观的第一步永远是“先清点体系里到底有哪些微粒、各有多少”，而不是盯着化学式做算术。"},{"id":"qH005","kp":"lj-2","type":"multi","diff":2,"stem":"下列对宏观现象的微观解释，正确的是（多选）","options":["氯化钠固体不导电，是因为固体中没有自由移动的离子","NaCl 溶液能导电，是因为通电后 NaCl 才电离出自由移动的离子","打开盛浓氨水的试剂瓶瓶塞能闻到刺激性气味，说明分子在不断运动","1 mol CO₂ 与 1 mol CO 中所含氧原子的物质的量相等"],"answer":[0,2],"explain":"A 对：固态 NaCl 中 Na⁺ 和 Cl⁻ 按一定规则紧密排列、不能自由移动，所以不导电；但“不能自由移动”不等于“不存在”，说“固体中没有离子”就错了。C 对：氨分子不断运动、扩散到空气中进入鼻腔，才有气味，这正是微粒不断运动的宏观表现。B 错：NaCl 溶于水时，水分子使离子键被破坏，Na⁺、Cl⁻ 立即电离出来，导电能力与“通不通电”无关；通电只是让已有的自由离子定向移动。把“电离”和“导电”混为一谈，是这一考点最常见错误。D 错：1 mol CO₂ 含 2 mol 氧原子，1 mol CO 只含 1 mol 氧原子，是 2:1。错因诊断：微粒观要分清三个层次——有没有微粒、微粒能不能自由移动、微粒有多少；三个问题混着答，就会觉得每个选项“好像都对”。"},{"id":"qH006","kp":"lj-3","type":"judge","diff":1,"stem":"可逆反应达到化学平衡状态时，正反应和逆反应都已经停止，所以各物质的浓度不再变化","answer":false,"explain":"错误。化学平衡是动态平衡：达到平衡时正、逆反应都仍在进行，只是 v(正) = v(逆) ≠ 0，即单位时间内正反应消耗的量与逆反应生成的量恰好相等，因此各物质的浓度、质量分数等宏观量保持不变。正确说法是“浓度保持不变，但反应并未停止，v(正) = v(逆) ≠ 0”。把“宏观不再变化”直接等同于“微观不再运动”，是一种静态思维；如果正、逆反应真的都停止了，那改变条件后平衡还能移动就无法解释了。错因诊断：选“正确”说明你记住了“平衡”这个词的表面含义，却没有建立起“动的平衡”这个图像——平衡不是死水，而是进出速率相等的流动状态。"},{"id":"qH007","kp":"lj-3","type":"single","diff":2,"stem":"一定温度下，在恒容密闭容器中进行反应 N₂(g) + 3H₂(g) ⇌ 2NH₃(g)。下列事实能说明该反应已达到化学平衡状态的是","options":["容器内气体的总质量不再变化","容器内气体的压强不再变化","单位时间内生成 1 mol N₂ 的同时生成 3 mol H₂","N₂、H₂、NH₃ 的物质的量浓度之比为 1:3:2"],"answer":1,"explain":"B 对：该反应是气体分子数减小的反应（4 分子 → 2 分子），恒温恒容下压强随气体总物质的量变化，压强不再变化就说明各物质的量不再变化，反应达到平衡。A 错：容器中全是气体，由质量守恒可知气体总质量从反应一开始就永远不变，它“不再变化”不能说明任何问题——只有“会变的量”不变了才能作平衡标志，这叫变量不变原则。C 错：生成 N₂ 和生成 H₂ 都属于逆反应方向的速率，同方向的速率之间无论是否平衡都有固定比例，必须“一正一逆”才能判断，例如改为“单位时间内生成 1 mol N₂ 的同时消耗 3 mol H₂”就可以。D 错：浓度之比等于化学计量数之比只在某些特定投料下才出现，不能由它反推平衡。错因诊断：判平衡只需两句话——是不是变量？是不是一正一逆？"},{"id":"qH008","kp":"lj-3","type":"single","diff":2,"stem":"下列关于化学平衡的说法，正确的是","options":["使用催化剂能加快反应速率，也能提高反应物的平衡转化率","相同条件下，可逆反应无论从正反应开始还是从逆反应开始，最终都能达到相同的平衡状态","反应达到平衡时，各物质的浓度一定相等","增大反应物的浓度，正反应速率增大，逆反应速率减小"],"answer":1,"explain":"B 对：化学平衡状态只由外界条件（温度、压强、浓度等）决定，与“从哪个方向开始、经过什么途径”无关，所以同温下从正、逆两个方向建立平衡，最终各物质的浓度是相同的。A 错：催化剂同等程度地加快正、逆反应速率，只缩短到达平衡的时间，不改变平衡状态，因此不能提高平衡转化率——把“速率”和“平衡转化率”混为一谈是高频错误。C 错：平衡时各物质的浓度“保持不变”，但彼此不一定相等，浓度相等只是极特殊的巧合。D 错：增大反应物浓度，正反应速率立刻增大，逆反应速率也会随之增大（只是增大幅度不同），随后在新的条件下重新平衡；说逆反应速率减小是凭想象。错因诊断：平衡观要求学生把“速率怎么变”和“平衡往哪移”当成两件事来分别判断。"},{"id":"qH009","kp":"lj-4","type":"single","diff":2,"stem":"已知 N 和 P 是同主族元素，PH₃ 与 NH₃ 的分子结构相似（都由一个中心原子与 3 个氢原子成键，并含 1 对孤电子对）。下列对 PH₃ 性质的推断正确的是","options":["PH₃ 极易溶于水，在水中能像 NH₃ 一样与水分子形成氢键","PH₃ 的稳定性比 NH₃ 强，受热时比 NH₃ 更难分解","PH₃ 的沸点比 NH₃ 高","PH₃ 属于共价化合物，其分子的空间构型为三角锥形"],"answer":3,"explain":"D 对：PH₃ 由分子构成，属于共价化合物；P 与 H 之间形成共价键，分子中中心原子带 1 对孤电子对、连 3 个氢原子，与 NH₃ 一样是三角锥形——结构相似，这一点可以放心迁移。A 错：NH₃ 极易溶于水，关键原因是 N 的电负性大，NH₃ 能与水分子形成氢键；P 不能与 H、O 形成氢键（一般只有 N、O、F 才能形成明显氢键），PH₃ 在水中溶解度很小。B 错：非金属性 N 强于 P，气态氢化物的稳定性 NH₃ 强于 PH₃，PH₃ 反而更易分解。C 错：NH₃ 分子间存在氢键，沸点反常升高，PH₃ 分子间只有普通分子间作用力，沸点比 NH₃ 低得多。错因诊断：结构决定性质，说的是“结构的差异决定性质的差异”，相似的结构可以迁移，但氢键、非金属性强弱、键能这些差异必须单独考察——把 NH₃ 的性质整套搬到 PH₃ 上，正是“同主族性质相同”这种想当然的思维。"},{"id":"qH010","kp":"lj-4","type":"single","diff":2,"stem":"金刚石和石墨都是由碳元素组成的单质，金刚石坚硬且不导电，石墨质软且能导电。下列说法正确的是","options":["金刚石和石墨互为同位素","两者都由碳原子构成，只是碳原子的排列方式不同，就导致了物理性质差异很大，体现了结构决定性质","石墨能导电，说明石墨中含有自由移动的离子","金刚石和石墨的化学性质完全不同"],"answer":1,"explain":"B 对：金刚石中碳原子以空间网状结构排列，石墨中碳原子排成层状结构，组成原子相同而排列方式不同，硬度、导电性等物理性质就相差极大，这是“结构决定性质”最经典的例子。A 错：同位素指同一种元素的不同原子（如碳-12 与碳-14），金刚石和石墨是不同的单质，二者互称“同素异形体”，概念被偷换。C 错：石墨能导电是因为层内存在自由移动的电子（每个碳原子贡献 1 个电子在层内移动），与“自由移动的离子”是完全不同的微观机理——把两种导电方式混为一谈。D 错：两者都是碳的单质，都能燃烧生成 CO₂、都能被氧化，化学性质基本相同，差别主要在物理性质。错因诊断：选 C 说明你的微粒观里只有离子，没有电子；选 A 说明你把“同种元素组成”直接套成了“同位素”，都是概念替换而不是结构分析。"},{"id":"qH011","kp":"lj-5","type":"single","diff":2,"stem":"将一定质量的 Na₂CO₃ 固体与足量稀盐酸充分反应，产生的气体全部通入足量澄清石灰水中，得到 10 g 沉淀。则参加反应的 Na₂CO₃ 的质量为（相对原子质量：C—12、O—16、Na—23、Ca—40）","options":["4.4 g","5.3 g","10.6 g","21.2 g"],"answer":2,"explain":"C 正确。用关系式法一步到位：由碳元素守恒可得 Na₂CO₃ ~ CO₂ ~ CaCO₃，即 1 mol Na₂CO₃ 最终生成 1 mol CaCO₃ 沉淀。n(CaCO₃) = 10 g ÷ 100 g/mol = 0.1 mol，故 n(Na₂CO₃) = 0.1 mol，m(Na₂CO₃) = 0.1 mol × 106 g/mol = 10.6 g。A 4.4 g 是中间产物 CO₂ 的质量（0.1 mol × 44 g/mol），算到中途就停了；B 5.3 g 相当于只算了 0.05 mol Na₂CO₃；D 21.2 g 是把关系式错写成 2Na₂CO₃ ~ CaCO₃。错因诊断：这类题不需要先算 CO₂ 的质量、体积再换算，只要抓住“碳元素守恒”写出一步关系式；选 A 说明你只盯着眼前的中间物质，忘了题目最后问的是 Na₂CO₃——分层计算越多，越容易被中间量带偏。"},{"id":"qH012","kp":"lj-5","type":"single","diff":2,"stem":"工业上用黄铁矿（主要成分 FeS₂）制硫酸，涉及的反应为 4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂、2SO₂ + O₂ ⇌ 2SO₃、SO₃ + H₂O → H₂SO₄。若硫元素全部转化为硫酸且不考虑损耗，则 1 mol FeS₂ 理论上可制得 H₂SO₄ 的物质的量为","options":["1 mol","2 mol","3 mol","4 mol"],"answer":1,"explain":"B 正确。关系式法（元素守恒）：1 mol FeS₂ 中含 2 mol 硫原子，而硫在转化过程中“一个硫原子最终变成一个 H₂SO₄ 分子”，故可直接写出 FeS₂ ~ 2H₂SO₄，n(H₂SO₄) = 2 mol。A 1 mol 是忘了 FeS₂ 中有 2 个硫原子；D 4 mol 是把 SO₂ 与 H₂SO₄ 按 1:2 换算，多乘了一倍；C 3 mol 是逐步计算、层层换算时把三个反应各自的倍数叠加错了——这正是“一步一步算”最容易翻车的地方。错因诊断：多步连续反应的计算，先找出起点物质和终点物质，按元素守恒配出“起点 ~ 终点”的关系式，再按关系式列比例，比逐步算又快又准。"},{"id":"qH013","kp":"lj-6","type":"single","diff":2,"stem":"向一定量的稀硫酸中逐滴加入 Ba(OH)₂ 溶液，直到 Ba(OH)₂ 明显过量。下列对实验过程中变化情况的描述，正确的是","options":["溶液的 pH 先减小后增大","溶液的导电能力先减小到接近为零，然后逐渐增大","生成沉淀的质量先增大后减小","溶液中 SO₄²⁻ 的数目先减小后增大"],"answer":1,"explain":"B 正确。稀硫酸中大量自由移动的 H⁺ 和 SO₄²⁻ 使溶液导电；加入 Ba(OH)₂ 后发生 2H⁺ + SO₄²⁻ + Ba²⁺ + 2OH⁻ → BaSO₄↓ + 2H₂O，溶液中的离子不断被消耗掉（变成了沉淀和水），离子浓度越来越小，恰好完全反应时导电能力降到接近为零（此时只剩水电离出的极少量离子）；继续滴加 Ba(OH)₂，溶液中又出现大量 Ba²⁺ 和 OH⁻，导电能力又逐渐增大，是一条“先降后升”的曲线。A 错：溶液由酸性变中性再变碱性，pH 应一直增大，不会先减小。C 错：沉淀只会不断增加，恰好反应后保持不变，绝不会减少。D 错：SO₄²⁻ 只被不断消耗，恰好反应后数目为 0 并保持为 0，不会“再增大”。错因诊断：看变化趋势要先想清楚“物质在变什么、量在怎么变”，而不能凭“加了试剂，现象应该越来越明显”的语感去选；A、C、D 都是语感选出来的答案。"},{"id":"qH014","kp":"lj-6","type":"single","diff":2,"stem":"某小组用足量的锌粒与 20 mL 1 mol/L 稀硫酸反应制取 H₂，记录发现单位时间内产生 H₂ 的量第 1 分钟最多，之后逐渐减少，一段时间后不再有气体产生。下列分析正确的是","options":["反应速率逐渐减小的主要原因是硫酸的浓度随反应进行不断减小","反应速率逐渐减小的主要原因是锌粒不断被消耗、越来越少","不再产生气体，说明硫酸还有剩余","整个过程中溶液的温度和硫酸的浓度都保持不变"],"answer":0,"explain":"A 对：题目已说明锌粒是足量的，说明反应过程中锌一直过量、表面积基本不变，唯一显著变化的就是 H⁺ 不断被消耗、硫酸浓度不断减小，所以反应速率逐渐减小——这正是“浓度影响反应速率”的直接体现。B 错：把恒量当成了变量；判断速率变化的原因，要先分清哪些量在变、哪些量不变，锌粒足量就不可能是主因。C 错：不再产生气体说明硫酸（H⁺）已经消耗完，而不是有剩余；若酸有剩余而锌不足，那应该是锌先消耗完，与题设“锌足量”矛盾。D 错：该反应是放热的，溶液温度会升高，硫酸浓度会减小，两个量都在变。错因诊断：数据分析的第一步是把“变量”和“恒量”分开；把所有可能因素都当成原因，等于没有分析。"},{"id":"qH015","kp":"lj-7","type":"single","diff":2,"stem":"某同学把一种无色气体通入澄清石灰水中，观察到石灰水变浑浊，于是他得出结论：“该气体一定是 CO₂”。下列对该推理的评价正确的是","options":["结论正确，因为只有 CO₂ 能使澄清石灰水变浑浊","结论正确，因为观察到的现象是客观事实","结论不严密，因为 SO₂ 也能使澄清石灰水变浑浊，仅凭这一现象无法确定该气体一定是 CO₂","结论不严密，因为 CO₂ 不一定能使澄清石灰水变浑浊"],"answer":2,"explain":"C 正确：SO₂ 也能与澄清石灰水反应生成白色的 CaSO₃ 沉淀（SO₂ + Ca(OH)₂ → CaSO₃↓ + H₂O），石灰水同样变浑浊，所以“变浑浊”只是 CO₂ 可能造成的现象之一，仅凭它无法确定气体一定是 CO₂，还必须继续实验（例如通入品红溶液或酸性 KMnO₄ 溶液检验 SO₂ 是否存在）。A 错：前提本身就不成立，不是“只有”CO₂ 有这种性质——这是“以偏概全”。B 错：现象客观，不等于由现象得到的结论正确；从现象到结论之间必须排除其他可能。D 错：这句话本身是错的，CO₂ 确实能使澄清石灰水变浑浊（只有持续通入过量 CO₂ 时才变澄清，因为生成了可溶的 Ca(HCO₃)₂）；用一个错误命题去否定结论，属于偷换概念。错因诊断：由现象推结论时，永远要追问一句“还有没有别的物质能产生同样的现象”，否则就是凭一个现象武断下结论。"},{"id":"qH016","kp":"lj-7","type":"single","diff":2,"stem":"已知“向含 SO₄²⁻ 的溶液中加入 BaCl₂ 溶液会产生白色沉淀”。某同学向一份未知溶液中滴加 BaCl₂ 溶液，出现白色沉淀，于是他判断“该溶液中一定含 SO₄²⁻”。关于这一判断，下列说法正确的是","options":["判断正确，因为已知的那条规律本身是成立的","判断正确，因为能和 BaCl₂ 溶液产生的白色沉淀只能是 BaSO₄","判断不正确，因为 CO₃²⁻、Ag⁺ 等也能与 BaCl₂ 溶液生成白色沉淀（如 BaCO₃、AgCl），仅凭这一现象不能证明一定含 SO₄²⁻","判断不正确，因为不含 SO₄²⁻ 的溶液加入 BaCl₂ 溶液一定不产生沉淀"],"answer":2,"explain":"C 正确：已知规律说的是“含 SO₄²⁻ → 加 BaCl₂ 会产生白色沉淀”，由条件能推出结论；但反过来由现象推成分就不一定成立。CO₃²⁻ 会生成白色 BaCO₃ 沉淀，SO₃²⁻ 会生成白色 BaSO₃ 沉淀，Ag⁺ 会生成白色 AgCl 沉淀，因此必须先加足量稀盐酸排除这些干扰，再加 BaCl₂ 才能确证 SO₄²⁻。A 错：原命题成立，并不等于它的逆命题成立——把“充分条件”当成“必要条件”，是最常见的逻辑错误。B 错：白色沉淀不只有 BaSO₄ 一种。D 错：这句话恰好说反了，不含 SO₄²⁻ 但含 Ag⁺ 或 CO₃²⁻ 的溶液加入 BaCl₂ 溶液同样会产生白色沉淀。错因诊断：推理时要分清“谁推谁”，做实验推理时养成“先想干扰离子”的习惯，否则就会把“能说明有”当成“一定能证明有”。"},{"id":"qH017","kp":"lj-7","type":"single","diff":3,"stem":"下列是某同学作出的四组推理：①因为 Na₂O₂ 与水反应能放出 O₂，所以 Na₂O₂ 可用作供氧剂；②因为某物质能与 NaOH 溶液反应生成盐和水，所以该物质一定是酸；③因为某溶液中加入 BaCl₂ 溶液产生了白色沉淀，所以该溶液中一定含有 SO₄²⁻；④因为钠与水反应生成 NaOH 和 H₂，所以该反应既属于置换反应，也属于氧化还原反应。其中推理正确的是","options":["①③","①④","②③","③④"],"answer":1,"explain":"B 正确。① 成立：Na₂O₂ 能与 H₂O、CO₂ 反应放出 O₂，可用于呼吸面具、潜水艇中供氧，由“能放出 O₂”推出“可作供氧剂”逻辑完整。④ 成立：钠与水反应为 2Na + 2H₂O → 2NaOH + H₂↑，反应物是“单质 + 化合物”、生成物是“化合物 + 单质”，符合置换反应的定义；同时 Na 由 0 价升高到 +1 价、H 由 +1 价降低到 0 价，有化合价变化，属于氧化还原反应，两个判断都对。② 错：能与 NaOH 反应生成盐和水的物质不一定是酸，CO₂、SO₂ 等酸性氧化物与 NaOH 反应同样生成盐和水，反应中根本没有酸参加——把“酸的某些通性”当成“酸的专属性质”，是以偏概全。③ 错：CO₃²⁻、SO₃²⁻、Ag⁺ 等也能与 BaCl₂ 生成白色沉淀，现象无法反推成分，是把“充分条件”当成了“必要条件”。错因诊断：判断一个推理是否正确要分两步——前提是否真实、前提能否推出结论，两步全过才算对；②③ 属于“前提真、推不出来”，是最隐蔽的一类错误。"}],"kp":[{"id":"j-1","stage":"J","dim":"d1","name":"元素符号与化学式","prereq":[]},{"id":"j-2","stage":"J","dim":"d1","name":"化合价","prereq":["j-1"]},{"id":"j-3","stage":"J","dim":"d1","name":"化学方程式与配平","prereq":["j-1"]},{"id":"j-4","stage":"J","dim":"d10","name":"质量守恒定律","prereq":["j-3"]},{"id":"j-5","stage":"J","dim":"d2","name":"相对分子质量与质量分数","prereq":["j-1"]},{"id":"j-6","stage":"J","dim":"d3","name":"物质分类","prereq":[]},{"id":"j-7","stage":"J","dim":"d3","name":"酸碱盐与复分解反应","prereq":["j-1","j-6"]},{"id":"j-8","stage":"J","dim":"d3","name":"金属活动性顺序","prereq":["j-3"]},{"id":"j-9","stage":"J","dim":"d2","name":"溶解度与溶质质量分数","prereq":["j-5"]},{"id":"j-10","stage":"J","dim":"d1","name":"常见离子与沉淀","prereq":["j-1"]},{"id":"b1-1","stage":"B1","dim":"d2","name":"物质的量","prereq":["j-5"]},{"id":"b1-2","stage":"B1","dim":"d2","name":"摩尔质量·气体摩尔体积·物质的量浓度","prereq":["b1-1","j-9"]},{"id":"b1-3","stage":"B1","dim":"d4","name":"离子反应与离子方程式","prereq":["j-7","j-10"]},{"id":"b1-4","stage":"B1","dim":"d4","name":"离子共存","prereq":["b1-3"]},{"id":"b1-5","stage":"B1","dim":"d4","name":"氧化还原反应概念","prereq":["j-2"]},{"id"    * 所以两边都归一化成「纯 ASCII 小写、无空格」再比。
   *
   * 历史上这里只映射了下标（H₂O→h2o），漏了上标 ——
   * 结果所有离子方程式都判错：Fe3+/Fe³⁺、SO42-/SO₄²⁻、NH4+/NH₄⁺……
   * 这是化学里最常见的写法之一，属于会把成绩打反的 bug。
   *
   * 归一化原则：只做「同一个意思的不同写法」的合并。
   * 不猜、不纠错、不做同义词替换 —— 学生写错字仍然判错。
   */
  function normFill(s) {
    if (s == null) return '';
    return String(s)
      .replace(/\s+/g, '')
      .replace(/[，,、；;]/g, ',')
      .replace(/[（(]/g, '(').replace(/[）)]/g, ')')
      /* 全角加减号：中文输入法下很容易打出来，学生未必察觉 */
      .replace(/[－—–−ー]/g, '-').replace(/＋/g, '+').replace(/＝/g, '=')
      /* 下标数字 ₀-₉ → 普通数字 */
      .replace(/[₀]/g, '0').replace(/[₁]/g, '1').replace(/[₂]/g, '2').replace(/[₃]/g, '3')
      .replace(/[₄]/g, '4').replace(/[₅]/g, '5').replace(/[₆]/g, '6').replace(/[₇]/g, '7')
      .replace(/[₈]/g, '8').replace(/[₉]/g, '9')
      /* 上标数字：⁰⁴⁵⁶⁷⁸⁹ 在 U+2070 区，¹²³ 在 Latin-1 区，两处都要管 */
      .replace(/[⁰]/g, '0').replace(/[¹]/g, '1').replace(/[²]/g, '2').replace(/[³]/g, '3')
      .replace(/[⁴]/g, '4').replace(/[⁵]/g, '5').replace(/[⁶]/g, '6').replace(/[⁷]/g, '7')
      .replace(/[⁸]/g, '8').replace(/[⁹]/g, '9')
      /* 上标正负号（电荷）与上标 n */
      .replace(/[⁺]/g, '+').replace(/[⁻]/g, '-').replace(/[ⁿ]/g, 'n')
      /* 幂次的 ^ 记号：SO4^2- 与 SO₄²⁻ 指同一件事。
         去掉 ^ 之后两者都是 so42-，这是这里唯一一处「丢信息」的替换，
         但方向是让更多写对的学生被判对，且不会把错答变对。 */
      .replace(/\^/g, '')
      /* 结晶水的·：CuSO₄·5H₂O 与 CuSO4.5H2O 是同一个东西 */
      .replace(/[·•⋅]/g, '.')
      .toLowerCase();
  }

  /**
   * 判断一题是否答对
   * @param {Object} q 题目
   * @param {*} ans 学生答案
   */
  function isCorrect(q, ans) {
    if (ans === undefined || ans === null) return false;
    if (q.type === 'single') return ans === q.answer;
    if (q.type === 'judge') return ans === q.answer;
    if (q.type === 'multi') {
      if (!Array.isArray(ans) || !Array.isArray(q.answer)) return false;
      if (ans.length !== q.answer.length) return false;
      var a = ans.slice().sort(function (x, y) { return x - y; });
      var b = q.answer.slice().sort(function (x, y) { return x - y; });
      for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }
    if (q.type === 'fill') {
      /* 主观题有两种判分来源：
         (a) 手工录入 / 在线作答 → 文本比对
         (b) 答题卡涂卡 / 拍照识别 → 老师直接给的布尔判定（对/错）
         布尔值直接采信，不做文本匹配。                                     */
      if (typeof ans === 'boolean') return ans;
      var std = Array.isArray(q.answer) ? q.answer : [q.answer];
      var given = Array.isArray(ans) ? ans : [ans];
      /* 逐个空位比对：学生该空与标准答案任一写法一致即算对 */
      for (var k = 0; k < std.length; k++) {
        var okThis = false;
        var accepts = String(std[k]).split('|');   /* 标准答案可用 | 给出多种写法 */
        var g = normFill(given[k]);
        for (var j = 0; j < accepts.length; j++) {
          if (g === normFill(accepts[j])) { okThis = true; break; }
        }
        if (!okThis) return false;
      }
      return true;
    }
    return false;
  }

  /** 是否作答过（空白判定） */
  function isAnswered(q, ans) {
    if (ans === undefined || ans === null) return false;
    if (q.type === 'multi') return Array.isArray(ans) && ans.length > 0;
    if (q.type === 'fill') {
      if (typeof ans === 'boolean') return true;      /* 老师已判定 → 视为已作答 */
      if (!Array.isArray(ans)) return normFill(ans) !== '';
      return ans.some(function (x) { return normFill(x) !== ''; });
    }
    return true;
  }

  /* ============================ 依赖图 ============================ */

  /**
   * 建立一个知识点索引 + 前置闭包缓存
   * @param {Array} KP 知识点列表 [{id, stage, dim, name, prereq:[]}]
   * @param {Array} STAGES
   */
  function makeGraph(KP, STAGES) {
    var KP_MAP = {}, STAGE_MAP = {};
    KP.forEach(function (k) { KP_MAP[k.id] = k; });
    STAGES.forEach(function (s, i) {
      STAGE_MAP[s.id] = { id: s.id, name: s.name, i: (s.i === undefined ? i : s.i) };
    });

    var cache = {};
    function prereqClosure(id) {
      if (cache[id]) return cache[id];
      var out = {}, stack = [id], guard = 0;
      while (stack.length && guard++ < 5000) {
        var cur = stack.pop();
        var kp = KP_MAP[cur];
        if (!kp || !kp.prereq) continue;
        for (var i = 0; i < kp.prereq.length; i++) {
          var p = kp.prereq[i];
          if (p === id) continue;             /* 自环保护 */
          if (!out[p]) { out[p] = 1; stack.push(p); }
        }
      }
      cache[id] = out;
      return out;
    }

    function depthOf(id, seen) {
      seen = seen || {};
      if (seen[id]) return 0;
      seen[id] = 1;
      var kp = KP_MAP[id];
      if (!kp || !kp.prereq || !kp.prereq.length) return 0;
      var d = 0;
      for (var i = 0; i < kp.prereq.length; i++) {
        d = Math.max(d, 1 + depthOf(kp.prereq[i], seen));
      }
      return d;
    }

    return { KP_MAP: KP_MAP, STAGE_MAP: STAGE_MAP, prereqClosure: prereqClosure, depthOf: depthOf };
  }

  /* ============================ 核心分析 ============================ */

  /**
   * 分析一个学生的作答
   * @param {Object} o
   *   o.questions 本次卷子的题目（数组，每条含 id/kp/type/options/answer）
   *   o.answers   {qid: value}
   *   o.unsure    {qid: true}   学生自评"不确定"
   *   o.graph     makeGraph() 的返回值
   *   o.KP_MAP    可选，覆盖
   * @returns {Object} 同《工作台》的 analysis 结构
   */
  function analyze(o) {
    var questions = o.questions, answers = o.answers || {}, unsure = o.unsure || {};
    var G = o.graph || o;
    var KP_MAP = G.KP_MAP, STAGE_MAP = G.STAGE_MAP;
    var STAGES = o.STAGES || [], DIMS = o.DIMS || [];

    var res = { kp: {}, stage: {}, dim: {} };
    STAGES.forEach(function (s) { res.stage[s.id] = { pts: 0, n: 0, wrong: 0, unsure: 0, blank: 0, ids: [] }; });
    DIMS.forEach(function (d) { res.dim[d.id] = { pts: 0, n: 0, wrong: 0, unsure: 0, blank: 0, ids: [] }; });

    var totalPts = 0, totalN = 0, nRight = 0, nLucky = 0, nWrong = 0, nBlank = 0;
    var wrongIds = [];

    questions.forEach(function (q) {
      var kp = KP_MAP[q.kp];
      var ans = answers[q.id];
      var ok = isCorrect(q, ans);
      var un = !!unsure[q.id];
      var blank = !isAnswered(q, ans);
      var pts = ok ? (un ? 0.5 : 1) : 0;

      if (!res.kp[q.kp]) {
        res.kp[q.kp] = { pts: 0, n: 0, wrong: 0, unsure: 0, blank: 0, ids: [], wids: [] };
      }
      var K = res.kp[q.kp];
      K.pts += pts; K.n += 1; K.ids.push(q.id);
      if (!ok) { K.wrong += 1; K.wids.push(q.id); }
      if (un && ok) K.unsure += 1;
      if (blank) K.blank += 1;

      var groups = [];
      if (kp) { groups.push(res.stage[kp.stage]); groups.push(res.dim[kp.dim]); }
      groups.forEach(function (g) {
        if (!g) return;
        g.pts += pts; g.n += 1; g.ids.push(q.id);
        if (!ok) g.wrong += 1;
        if (un && ok) g.unsure += 1;
        if (blank) g.blank += 1;
      });

      totalPts += pts; totalN += 1;
      if (ok && un) nLucky++;
      else if (ok) nRight++;
      else { nWrong++; if (blank) nBlank++; wrongIds.push(q.id); }
    });

    Object.keys(res.kp).forEach(function (k) {
      var K = res.kp[k];
      K.rate = K.n ? K.pts / K.n : 0;
      K.level = K.rate >= 0.8 ? 'ok' : (K.rate >= 0.5 ? 'mid' : 'bad');
    });
    ['stage', 'dim'].forEach(function (g) {
      Object.keys(res[g]).forEach(function (k) {
        var G2 = res[g][k];
        G2.rate = G2.n ? G2.pts / G2.n : 0;
        G2.level = G2.rate >= 0.8 ? 'ok' : (G2.rate >= 0.5 ? 'mid' : 'bad');
      });
    });

    /* ---------- 根源诊断 ---------- */
    var failed = {};
    Object.keys(res.kp).forEach(function (k) {
      if (res.kp[k].rate < 0.6) failed[k] = 1;
    });
    var impact = {};
    Object.keys(failed).forEach(function (f) {
      var cl = G.prereqClosure(f);
      for (var p in cl) {
        if (failed[p] && p !== f) {
          if (!impact[p]) impact[p] = { n: 0, down: [] };
          impact[p].n++;
          impact[p].down.push(f);
        }
      }
    });
    var roots = Object.keys(impact).map(function (p) {
      return { id: p, n: impact[p].n, down: impact[p].down };
    }).sort(function (a, b) {
      if (b.n !== a.n) return b.n - a.n;
      return G.depthOf(a.id) - G.depthOf(b.id);
    });

    /* ---------- 补习路线图 ---------- */
    var need = {};
    Object.keys(failed).forEach(function (f) {
      need[f] = 1;
      var cl = G.prereqClosure(f);
      for (var p in cl) need[p] = 1;
    });
    Object.keys(need).forEach(function (k) {
      if (!res.kp[k]) {
        res.kp[k] = { pts: 0, n: 0, rate: 0, level: 'bad', untested: true, wrong: 0, ids: [], wids: [] };
      }
    });
    /* 补习路线图：必须满足「前置知识点先于依赖它的知识点」。
       仅按 stage/depth 排序不够 —— 例如「物质的量」(B1) 是「有机计算」(X3) 的前提，
       一旦 stage 编号顺序与依赖方向不一致，学生就会先学难的。
       因此这里做真正的拓扑排序，再在同层内用 stage→depth→掌握率 做稳定排序。 */
    var roadmap = Object.keys(need).map(function (k) {
      var kp = KP_MAP[k];
      return {
        id: k, name: kp ? kp.name : k, stage: kp ? kp.stage : 'ZZ', dim: kp ? kp.dim : 'd10',
        stageI: kp ? (STAGE_MAP[kp.stage] || { i: 99 }).i : 99,
        depth: G.depthOf(k),
        rate: res.kp[k] ? res.kp[k].rate : 0,
        untested: !!(res.kp[k] && res.kp[k].untested),
        isRoot: !!impact[k],
        prereq: (kp && kp.prereq) ? kp.prereq.filter(function (p) { return need[p]; }) : []
      };
    });

    /* Kahn 拓扑排序 + 同层按 stage/depth/rate 排序 */
    (function topoSort(list) {
      var byId = {}, indeg = {};
      list.forEach(function (it) { byId[it.id] = it; indeg[it.id] = 0; });
      list.forEach(function (it) {
        it.prereq.forEach(function (p) { if (byId[p]) indeg[it.id]++; });
      });
      /* 依赖图可能有环（数据录入失误）——用 guard 兜底，绝不死循环 */
      var out = [], guard = 0;
      var cmp = function (a, b) {
        if (a.stageI !== b.stageI) return a.stageI - b.stageI;
        if (a.depth !== b.depth) return a.depth - b.depth;
        if (a.rate !== b.rate) return a.rate - b.rate;
        return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
      };
      while (out.length < list.length && guard++ < list.length * 8 + 64) {
        var ready = list.filter(function (it) {
          return !it._done && indeg[it.id] === 0;
        });
        if (!ready.length) {
          /* 有环：把剩余部分按稳定顺序直接排入，保证结果完整 */
          list.filter(function (it) { return !it._done; }).sort(cmp).forEach(function (it) {
            it._done = true; out.push(it);
          });
          break;
        }
        ready.sort(cmp);
        ready.forEach(function (it) { it._done = true; out.push(it); });
        ready.forEach(function (it) {
          list.forEach(function (o) {
            if (o.prereq.indexOf(it.id) >= 0) indeg[o.id]--;
          });
        });
      }
      list.forEach(function (it) { delete it._done; });
      roadmap = out;
    })(roadmap);

    /* ---------- 错因诊断汇总 ---------- */
    var reasons = [];
    questions.forEach(function (q) {
      if (isCorrect(q, answers[q.id])) return;
      if (!q.explain) return;
      reasons.push({
        id: q.id, kp: q.kp, kpName: (KP_MAP[q.kp] || {}).name || q.kp,
        explain: q.explain, blank: !isAnswered(q, answers[q.id])
      });
    });

    return {
      kp: res.kp, stage: res.stage, dim: res.dim,
      totalPts: totalPts, totalN: totalN,
      rate: totalN ? totalPts / totalN : 0,
      nRight: nRight, nLucky: nLucky, nWrong: nWrong, nBlank: nBlank,
      roots: roots.slice(0, 6), roadmap: roadmap,
      failedCount: Object.keys(failed).length,
      wrongIds: wrongIds, reasons: reasons
    };
  }

  /* ============================ 班级统计 ============================ */

  /**
   * 把多个学生的结果汇总成班级视图
   * @param {Array} rows [{studentNo, name, answers, unsure, score, analysis}]
   * @param {Array} questions
   * @returns {Object} {n, avg, median, min, max, dist, qStats, kpStats, weakestStudents}
   */
  function classReport(rows, questions, graph) {
    var n = rows.length;
    if (!n) return { n: 0, avg: 0, qStats: [], kpStats: [], dist: [], rows: [] };

    var scores = rows.map(function (r) { return r.rate == null ? 0 : r.rate; })
      .sort(function (a, b) { return a - b; });
    var sum = scores.reduce(function (a, b) { return a + b; }, 0);
    var avg = sum / n;
    var median = n % 2 ? scores[(n - 1) >> 1] : (scores[n / 2 - 1] + scores[n / 2]) / 2;

    /* 分数分布（十档） */
    var dist = [];
    for (var d = 0; d < 10; d++) {
      dist.push({ lo: d * 10, hi: d * 10 + 10, n: 0 });
    }
    rows.forEach(function (r) {
      var pct = (r.rate == null ? 0 : r.rate) * 100;
      var b = Math.min(9, Math.floor(pct / 10));
      dist[b].n++;
    });

    /* 逐题统计 */
    var qStats = questions.map(function (q) {
      var right = 0, blank = 0, wrongStudents = [];
      rows.forEach(function (r) {
        var ans = r.answers ? r.answers[q.id] : undefined;
        if (isCorrect(q, ans)) right++;
        else {
          if (!isAnswered(q, ans)) blank++;
          wrongStudents.push(r.studentNo || r.name);
        }
      });
      var kp = graph && graph.KP_MAP ? graph.KP_MAP[q.kp] : null;
      return {
        id: q.id, kp: q.kp, kpName: kp ? kp.name : q.kp,
        stage: kp ? kp.stage : 'ZZ', diff: q.diff,
        right: right, wrong: n - right, blank: blank,
        rate: n ? right / n : 0,
        wrongStudents: wrongStudents
      };
    });

    /* 按知识点汇总 */
    var agg = {};
    qStats.forEach(function (s) {
      if (!agg[s.kp]) agg[s.kp] = { id: s.kp, name: s.kpName, stage: s.stage, right: 0, n: 0, qids: [] };
      var A = agg[s.kp];
      A.right += s.right; A.n += rows.length; A.qids.push(s.id);
    });
    var kpStats = Object.keys(agg).map(function (k) {
      var A = agg[k];
      A.rate = A.n ? A.right / A.n : 0;
      A.level = A.rate >= 0.8 ? 'ok' : (A.rate >= 0.5 ? 'mid' : 'bad');
      return A;
    }).sort(function (a, b) { return a.rate - b.rate; });

    /* 需要重点关注的学生（分数最低且错题最多） */
    var weakest = rows.slice().sort(function (a, b) {
      return (a.rate == null ? 0 : a.rate) - (b.rate == null ? 0 : b.rate);
    }).slice(0, 8);

    return {
      n: n, avg: avg, median: median,
      min: scores[0], max: scores[n - 1],
      dist: dist, qStats: qStats, kpStats: kpStats,
      weakestStudents: weakest, rows: rows
    };
  }

  /* ============================ 等级描述 ============================ */

  function levelInfo(rate) {
    var p = rate * 100;
    if (p >= 90) return { txt: '优秀', cls: 'l5', desc: '知识体系完整' };
    if (p >= 80) return { txt: '良好', cls: 'l4', desc: '基础扎实' };
    if (p >= 65) return { txt: '中等', cls: 'l3', desc: '基础尚可，细节有漏洞' };
    if (p >= 50) return { txt: '及格线附近', cls: 'l2', desc: '多处基础不牢' };
    if (p >= 30) return { txt: '薄弱', cls: 'l1', desc: '底层知识缺口明显' };
    return { txt: '严重薄弱', cls: 'l0', desc: '需要从最底层重建' };
  }

  return {
    normFill: normFill,
    isCorrect: isCorrect,
    isAnswered: isAnswered,
    makeGraph: makeGraph,
    analyze: analyze,
    classReport: classReport,
    levelInfo: levelInfo
  };
}));

</script>
