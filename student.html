<script>
/*!
 * 化学学情诊断平台 · 通用工具
 * 作者：黎伟成
 */
(function (root) {
  'use strict';

  var U = {};

  /* ---------------- DOM ---------------- */
  U.$ = function (sel, ctx) { return (ctx || document).querySelector(sel); };
  U.$$ = function (sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  };

  U.el = function (tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.keys(v).forEach(function (d) { e.dataset[d] = v[d]; });
        else e.setAttribute(k, v === true ? '' : v);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  };

  /* 转义：用于 innerHTML 拼接 */
  U.esc = function (s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /** 把大段 HTML 注入容器：用 indexOf+slice 拼接，避免 $& 等替换陷阱 */
  U.setHTML = function (node, html) {
    node.innerHTML = '';
    var tpl = document.createElement('template');
    tpl.innerHTML = html;
    node.appendChild(tpl.content);
    return node;
  };

  /* ---------------- 提示 ---------------- */
  U.toast = function (msg, kind, ms) {
    var wrap = U.$('.toast-wrap');
    if (!wrap) {
      wrap = U.el('div', { class: 'toast-wrap' });
      document.body.appendChild(wrap);
    }
    var t = U.el('div', { class: 'toast' + (kind ? ' ' + kind : ''), text: msg });
    wrap.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .25s, transform .25s';
      t.style.opacity = '0';
      t.style.transform = 'translateY(8px)';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
    }, ms || (kind === 'bad' ? 5200 : 3000));
    return t;
  };
  U.ok = function (m) { return U.toast(m, 'ok'); };
  U.err = function (m) { return U.toast(m, 'bad'); };
  U.warn = function (m) { return U.toast(m, 'warn'); };

  /* ---------------- 弹层 ---------------- */
  U.modal = function (opts) {
    var back = U.el('div', { class: 'modal-back' });
    var box = U.el('div', { class: 'modal' });
    if (opts.title) box.appendChild(U.el('h3', { text: opts.title }));
    if (opts.desc) box.appendChild(U.el('p', { class: 'mdesc', text: opts.desc }));
    var body = U.el('div');
    if (opts.body) {
      if (typeof opts.body === 'string') U.setHTML(body, opts.body);
      else body.appendChild(opts.body);
    }
    box.appendChild(body);
    var foot = U.el('div', { class: 'row', style: { marginTop: '20px', justifyContent: 'flex-end' } });

    (opts.buttons || [{ label: '关闭' }]).forEach(function (b) {

    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);

      }
      ctx.closePath();
      ctx.fillStyle = (g % 2 === 0) ? '#f7fafd' : '#fff';
      ctx.fill();
      ctx.strokeStyle = (g === 4) ? '#c3ccd8' : '#e6ebf2';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    for (i = 0; i < n; i++) {
      a = ang(i);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
      ctx.strokeStyle = '#e6ebf2';
      ctx.stroke();
    }
    ctx.beginPath();
    for (i = 0; i < n; i++) {
      a = ang(i);
      var v0 = Math.max(0, Math.min(1, values[i] || 0));
      var x0 = cx + R * v0 * Math.cos(a), y0 = cy + R * v0 * Math.sin(a);
      if (i) ctx.lineTo(x0, y0); else ctx.moveTo(x0, y0);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(59,130,246,.22)';
    ctx.fill();
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    for (i = 0; i < n; i++) {
      a = ang(i);
      var v1 = Math.max(0, Math.min(1, values[i] || 0));
      ctx.beginPath();
      ctx.arc(cx + R * v1 * Math.cos(a), cy + R * v1 * Math.sin(a), 3.6, 0, Math.PI * 2);
      ctx.fillStyle = '#1d4ed8';
      ctx.fill();
    }
    ctx.font = '600 12px -apple-system,"PingFang SC",sans-serif';
    for (i = 0; i < n; i++) {
      a = ang(i);
      var lx = cx + (R + 26) * Math.cos(a), ly = cy + (R + 26) * Math.sin(a);
      ctx.fillStyle = '#475569';
      var pct = Math.round((values[i] || 0) * 100) + '%';
      ctx.textAlign = Math.abs(Math.cos(a)) < 0.18 ? 'center' : (Math.cos(a) > 0 ? 'left' : 'right');
      ctx.textBaseline = Math.abs(Math.sin(a)) < 0.18 ? 'middle' : (Math.sin(a) > 0 ? 'top' : 'bottom');
      ctx.fillText(labels[i], lx, ly - 6);
      ctx.font = '11px -apple-system,sans-serif';
      ctx.fillStyle = rateColor(values[i] || 0);
      ctx.fillText(pct, lx, ly + 7);
      ctx.font = '600 12px -apple-system,"PingFang SC",sans-serif';
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    markCanvas(o);
  };

  /** 横向条形图 */
  Ch.drawBars = function (cv, labels, values, opt) {
    opt = opt || {};
    if (!labels.length) return;
    var H = Math.max(opt.minH || 190, labels.length * 34 + 46);
    var o = setupCanvas(cv, H), ctx = o.ctx, W = o.w;
    var padL = opt.padL || 96, padR = 54, top = 14, btm = 8;
    var bh = 20, gap = (H - top - btm) / labels.length;
    ctx.font = '12.5px -apple-system,"PingFang SC",sans-serif';
    for (var i = 0; i < labels.length; i++) {
      var y = top + gap * i + gap / 2 - bh / 2;
      ctx.fillStyle = '#eef3f9';
      roundRect(ctx, padL, y, W - padL - padR, bh, 5);
      ctx.fill();
      var v = Math.max(0, Math.min(1, values[i] || 0));
      var col = rateColor(v);
      if (v > 0.001) {
        ctx.fillStyle = col;
        roundRect(ctx, padL, y, (W - padL - padR) * v, bh, 5);
        ctx.fill();
      }
      ctx.fillStyle = '#475569';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      /* 过长的标签截断 */
      var lb = String(labels[i]);
      while (lb.length > 2 && ctx.measureText(lb).width > padL - 14) lb = lb.slice(0, -1);
      ctx.fillText(lb, padL - 10, y + bh / 2);
      ctx.fillStyle = col;
      ctx.textAlign = 'left';
      ctx.font = '600 12.5px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(Math.round(v * 100) + '%', padL + (W - padL - padR) * v + 9, y + bh / 2);
      ctx.font = '12.5px -apple-system,"PingFang SC",sans-serif';
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    markCanvas(o);
  };

  /** 分数分布柱状图（班级报告用） */
  Ch.drawDist = function (cv, buckets, counts) {
    var H = 210;
    var o = setupCanvas(cv, H), ctx = o.ctx, W = o.w;
    var padL = 34, padR = 12, top = 20, btm = 32;
    var n = buckets.length;
    if (!n) return;
    var maxC = Math.max.apply(null, counts.concat([1]));
    var bw = (W - padL - padR) / n;
    ctx.font = '11.5px -apple-system,"PingFang SC",sans-serif';
    for (var i = 0; i < n; i++) {
      var h = (H - top - btm) * (counts[i] / maxC);
      var x = padL + bw * i + bw * 0.16;
      var w = bw * 0.68;
      var y = H - btm - h;
      var v = i / (n - 1 || 1);
      ctx.fillStyle = rateColor(v);
      if (h < 2 && counts[i] > 0) h = 2;
      roundRect(ctx, x, H - btm - h, w, h, 4);
      ctx.fill();
      ctx.fillStyle = '#475569';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      if (counts[i] > 0) {
        ctx.font = '600 11.5px -apple-system,sans-serif';
        ctx.fillText(counts[i], x + w / 2, y - 4);
        ctx.font = '11.5px -apple-system,"PingFang SC",sans-serif';
      }
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(buckets[i], x + w / 2, H - btm + 7);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    markCanvas(o);
  };

  Ch.rateColor = rateColor;
  root.Charts = Ch;
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/report -->
<script>
/*!
 * 化学学情诊断平台 · 报告渲染
 * 作者：黎伟成
 *
 * 一份报告同时服务两种读者：
 *   role='teacher'  老师 / 家长：全量信息，含逐题解析、错因诊断
 *   role='student'  学生手机扫码：同样完整，但语气更友好，突出「接下来做什么」
 * 两者用的是同一套分析引擎（Analyze.analyze），所以数据口径完全一致。
 */
(function (root) {
  'use strict';

  var R = {};
  var U = root.U;
  var Core = root.Core;
  var Analyze = root.Analyze;

  var _graph = null;
  function graph() {
    if (_graph) return _graph;
    _graph = Analyze.makeGraph(Core.kp(), Core.stages());
    return _graph;
  }

  function esc(s) { return U.esc(s); }
  function keyOf(i) { return String.fromCharCode(65 + i); }

  /* ---------------- 等级 ---------------- */
  R.levelInfo = function (rate) {
    if (rate >= 0.85) return { txt: '基础扎实', col: 'var(--ok)', tone: 'ok' };
    if (rate >= 0.7) return { txt: '基本达标', col: 'var(--ok)', tone: 'ok' };
    if (rate >= 0.5) return { txt: '基础不牢', col: 'var(--warn)', tone: 'warn' };
    if (rate >= 0.3) return { txt: '基础很薄弱', col: 'var(--bad)', tone: 'bad' };
    return { txt: '地基严重缺失', col: 'var(--bad)', tone: 'bad' };
  };

  /* ---------------- 计算 ---------------- */
  /**
   * @param {Object} data {questions, answers, unsure, meta}
   * @returns {Object} {questions, answers, unsure, meta, analysis, rate, stats}
   */
  R.compute = function (data) {
    var questions = data.questions || [];
    var answers = data.answers || {};
    var unsure = data.unsure || {};
    var A = Analyze.analyze({
      questions: questions, answers: answers, unsure: unsure,
      graph: graph(), STAGES: Core.stages(), DIMS: Core.dims()
    });
    var totalPts = 0, maxPts = 0;
    questions.forEach(function (q) {
      maxPts += Core.scoreOf(q);
      var a = answers[q.id];
      if (Analyze.isCorrect(q, a)) totalPts += (unsure[q.id] ? 0.5 : 1) * Core.scoreOf(q);
    });
    return {
      questions: questions, answers: answers, unsure: unsure,
      meta: data.meta || {},
      analysis: A,
      rate: maxPts ? totalPts / maxPts : 0,
      score: totalPts, maxScore: maxPts,
      stats: Core.paperStats(questions.map(function (q) { return q.id; }))
    };
  };

  /* ---------------- 结论 ---------------- */
  function verdict(d, role) {
    var A = d.analysis, rate = d.rate;
    var STAGES = Core.stages(), DIMS = Core.dims();
    var weakestStage = null, wv = 2, strongestStage = null, sv = -1;
    STAGES.forEach(function (s) {
      var g = A.stage[s.id];
      if (g && g.n >= 3) {
        var v = g.pts / g.n;
        if (v < wv) { wv = v; weakestStage = s; }
        if (v > sv) { sv = v; strongestStage = s; }
      }
    });
    var weakestDim = null, dv = 2, strongestDim = null, sdv = -1;
    DIMS.forEach(function (x) {
      var g = A.dim[x.id];
      if (g && g.n >= 3) {
        var v = g.pts / g.n;
        if (v < dv) { dv = v; weakestDim = x; }
        if (v > sdv) { sdv = v; strongestDim = x; }
      }
    });

    var t = '';
    var n = 0;
    function step(title, body) {
      n++;
      t += '<div class="step"><div class="num">' + ['①', '②', '③', '④', '⑤', '⑥', '⑦'][n - 1] + '</div><div class="body">' +
        '<div class="t">' + title + '</div><div class="d">' + body + '</div></div></div>';
    }

    if (role === 'student') {
      if (rate < 0.5) {
        step('先说结论：现在最该做的不是刷题',
          '你的得分率是 <b>' + Math.round(rate * 100) + '%</b>，属于<b>' + R.levelInfo(rate).txt + '</b>。' +
          '这个分数段说明问题不在"某几个知识点没记住"，而是<b>底层概念还没有连成网</b>。' +
          '这个阶段硬刷高三的卷子，只会一直受挫——先把地基打好，分数会涨得比你想的快。');
      } else {
        step('先说结论：地基还在，是连接不牢',
          '得分率 <b>' + Math.round(rate * 100) + '%</b>，属于<b>' + R.levelInfo(rate).txt + '</b>。' +
          '框架是有的，丢分主要来自知识点之间的连接松动，以及一部分概念的细节理解有偏差。这种问题补起来见效最快。');
      }
    } else {
      step('总体判断',
        '得分率 <b>' + Math.round(rate * 100) + '%</b>，属于<b>' + R.levelInfo(rate).txt + '</b>。' +
        (rate < 0.5
          ? '这个分数段说明问题不在"某几个知识点没背"，而是<b>底层概念框架还没有建立起来</b>。继续刷高三的题只会不断累积挫败感，必须先回到基础重建。'
          : '基础框架基本还在，问题主要是知识点之间的连接不牢、以及部分概念理解有偏差。'));
    }

    if (weakestStage || weakestDim) {
      step(role === 'student' ? '最需要补的地方' : '最薄弱的板块',
        (weakestStage ? ('阶段上最弱的是<b>' + esc(weakestStage.name) + '</b>（正确率 ' + Math.round(wv * 100) + '%）。') : '') +
        (weakestDim ? ('能力维度上最弱的是<b>' + esc(weakestDim.name) + '</b>（正确率 ' + Math.round(dv * 100) + '%）。') : ''));
    }

    if (A.nLucky > 0) {
      step('有 ' + A.nLucky + ' 道题是「不确定但蒙对了」',
        (role === 'student'
          ? '你自己标记了「不确定」。<b>这 ' + A.nLucky + ' 道题要当成错题来对待</b>——考试时题目稍变就会翻车。'
          : '学生自己标记了"不确定"。<b>这 ' + A.nLucky + ' 道题在补课时要当成错题处理</b>，' +
            '因为这说明相关知识点是"模糊的、靠语感的"，考试时只要题目稍变就会翻车。'));
    }
    if (A.nBlank > 0) {
      step('有 ' + A.nBlank + ' 道题完全没作答',
        '空白通常意味着"连蒙都不会"，比选错更能说明这个知识点是完全陌生的。');
    }
    if (strongestDim && sdv >= 0.4) {
      step(role === 'student' ? '你的相对优势' : '相对优势',
        '<b>' + esc(strongestDim.name) + '</b>相对最好（' + Math.round(sdv * 100) + '%），' +
        (role === 'student' ? '这是你的抓手，可以从这里重建信心。' : '可以把它作为重建信心的切入点。'));
    }
    return t;
  }

  /* ---------------- 逐题回顾 ---------------- */
  function renderRev(q, kind, ans, role) {
    var kp = Core.kpmap()[q.kp] || { name: '—' };
    var st = Core.stage(kp.stage);
    var h = '<div class="rev ' + (kind === 'lucky' ? 'lucky' : 'wrong') + '">' +
      '<div class="rh"><span class="mark">' + (kind === 'lucky' ? '蒙对' : '答错') + '</span>' +
      '<span class="chip">' + esc(st.name) + '</span>' +
      '<span class="chip">' + esc(kp.name) + '</span>' +
      '<span class="chip d' + (q.diff || 1) + '" style="margin-left:auto">' + esc(Core.typeName(q.type)) + '</span>' +
      '</div>' +
      '<div class="q">' + esc(q.stem) + '</div>';

    if (q.type === 'single' || q.type === 'multi') {
      (q.options || []).forEach(function (o, i) {
        var isA = (q.type === 'single') ? (q.answer === i) : ((q.answer || []).indexOf(i) >= 0);
        var picked = (q.type === 'single') ? (ans === i) : (Array.isArray(ans) && ans.indexOf(i) >= 0);
        var cls = isA ? ' right' : (picked ? ' wrongpicked' : '');
        var mark = isA ? ' ✓' : (picked ? ' ✗' : '');
        h += '<div class="optline' + cls + '">' + keyOf(i) + '. ' + esc(o) + mark + '</div>';
      });
      if (!Analyze.isAnswered(q, ans)) {
        h += '<div class="optline" style="background:#f8fafc;color:#94a3b8">（未作答）</div>';
      }
    } else if (q.type === 'judge') {
      h += '<div class="optline' + (ans === true ? ' wrongpicked' : '') + '">你的答案：' +
        (Analyze.isAnswered(q, ans) ? (ans === true ? '对' : '错') : '（未作答）') + '</div>' +
        '<div class="optline right">正确答案：' + (q.answer ? '对' : '错') + ' ✓</div>';
    } else {
      h += '<div class="optline' + (Analyze.isCorrect(q, ans) ? ' right' : ' wrongpicked') + '">你的答案：' +
        esc(Core.answerText(q, ans)) + '</div>' +
        '<div class="optline right">参考答案：' + esc((q.answer || []).join(' 或 ')) + ' ✓</div>';
    }
    h += '<div class="exp"><b>' + (role === 'student' ? '错因诊断：' : '解析：') + '</b>' +
      esc(q.explain || '（无）') + '</div></div>';
    return h;
  }

  /* ---------------- 主渲染 ---------------- */
  /**
   * @param {Object} d  R.compute() 的结果
   * @param {Object} o  {role:'teacher'|'student', showQuestions:bool, compact:bool}
   * @returns {String} HTML
   */
  R.html = function (d, o) {
    o = o || {};
    var role = o.role || 'teacher';
    var A = d.analysis, meta = d.meta;
    var L = R.levelInfo(d.rate);
    var qs = d.questions;
    var secs = Math.round(meta.seconds || 0);
    var mm = Math.floor(secs / 60), ss = secs % 60;
    var h = '';

    /* ---- 概览 ---- */
    h += '<div class="rp-hero">' +
      '<div class="rp-hero-top">' +
      '<div>' +
      '<h2>' + (role === 'student' ? '我的化学诊断报告' : '化学学情诊断报告') + '</h2>' +
      '<div class="who">' +
      (meta.name ? esc(meta.name) : '未署名') +
      (meta.studentNo ? ' · 学号 ' + esc(meta.studentNo) : '') +
      (meta.paperName ? ' · ' + esc(meta.paperName) : '') +
      '</div>' +
      '<div class="when">' + esc(U.fmtTime(meta.submittedAt || Date.now())) +
      (secs ? ' · 用时 ' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss : '') +
      '</div>' +
      '</div>' +
      '<div class="rp-score"><div class="val">' + d.score.toFixed(0) +
      '<small>/' + d.maxScore + ' 分</small></div>' +
      '<div class="pct">得分率 ' + Math.round(d.rate * 100) + '%</div>' +
      '<div class="lvl ' + L.tone + '">' + L.txt + '</div></div>' +
      '</div>' +
      '<div class="rp-stats">' +
      '<div class="hs"><div class="v">' + A.totalN + '</div><div class="k">总题数</div></div>' +
      '<div class="hs"><div class="v">' + A.nRight + '</div><div class="k">真会</div></div>' +
      '<div class="hs"><div class="v">' + A.nLucky + '</div><div class="k">蒙对</div></div>' +
      '<div class="hs"><div class="v">' + A.nWrong + '</div><div class="k">答错</div></div>' +
      '<div class="hs"><div class="v">' + A.failedCount + '</div><div class="k">漏洞知识点</div></div>' +
      '</div></div>';

    /* ---- 结论 ---- */
    h += '<div class="card"><h2 class="sec"><span class="bar"></span>' +
      (role === 'student' ? '给你的结论' : '诊断结论') + '</h2>' +
      '<p class="sec-desc">' +
      (role === 'student' ? '顺着看完，你会知道下一步该干什么' : '这一栏是给补习老师 / 家长看的') +
      '</p>' + verdict(d, role) + '</div>';

    /* ---- 图表 ---- */
    h += '<div class="rp-grid2">' +
      '<div class="card"><h2 class="sec"><span class="bar"></span>能力维度</h2>' +
      '<p class="sec-desc">十个化学能力维度上的得分率</p>' +
      '<div class="cv-box"><canvas id="rp-radar"></canvas></div>' +
      '<div class="rp-legend">' +
      '<span><i style="background:#059669"></i>≥80% 掌握</span>' +
      '<span><i style="background:#d97706"></i>50–80% 不稳固</span>' +
      '<span><i style="background:#dc2626"></i>&lt;50% 未掌握</span>' +
      '</div></div>' +
      '<div class="card"><h2 class="sec"><span class="bar"></span>各阶段掌握度</h2>' +
      '<p class="sec-desc">按人教版教材顺序排列</p>' +
      '<div class="cv-box"><canvas id="rp-bars"></canvas></div></div>' +
      '</div>';

    /* ---- 根源诊断 ---- */
    h += '<div class="card"><h2 class="sec"><span class="bar"></span>根源诊断 · 最该先补的地方</h2>' +
      '<p class="sec-desc">这些知识点本身没掌握，同时还是其他错题的<b>前置基础</b>——补它们收益最大</p>';
    if (!A.roots.length) {
      h += '<div class="empty"><div class="big">🌱</div><div class="t">没有发现明显的连锁性漏洞</div>' +
        '<div>基础之间没有互相拖累，按正常顺序推进即可。</div></div>';
    } else {
      A.roots.slice(0, 6).forEach(function (rt) {
        var kp = Core.kpmap()[rt.id] || { name: rt.id };
        var st = Core.stage(kp.stage);
        var rr = A.kp[rt.id] ? A.kp[rt.id].rate : 0;
        h += '<div class="rootcard"><div class="rh">' +
          '<span class="rn">' + esc(kp.name) + '</span>' +
          '<span class="chip">' + esc(st.name) + '</span>' +
          '<span class="chip d3">正确率 ' + Math.round(rr * 100) + '%</span>' +
          '<span class="chip gray">卡住下游 ' + rt.n + ' 个知识点</span>' +
          '</div>' +
          '<div class="rd">这个知识点没打通，直接导致后面这些内容也听不懂：' +
          rt.down.slice(0, 7).map(function (x) {
            return '<b>' + esc((Core.kpmap()[x] || { name: x }).name) + '</b>';
          }).join('、') +
          (rt.down.length > 7 ? (' 等 ' + rt.down.length + ' 个') : '') +
          '。建议从这里开始补。</div></div>';
      });
    }
    h += '</div>';

    /* ---- 漏洞清单 ---- */
    var bad = [];
    Object.keys(A.kp).forEach(function (k) {
      var K = A.kp[k];
      if (K.untested) return;
      if (K.rate < 0.8) bad.push({ id: k, K: K, kp: Core.kpmap()[k] });
    });
    bad.sort(function (a, b) {
      if (a.K.rate !== b.K.rate) return a.K.rate - b.K.rate;
      var sa = Core.stage((a.kp || {}).stage).i, sb = Core.stage((b.kp || {}).stage).i;
      return (sa === undefined ? 99 : sa) - (sb === undefined ? 99 : sb);
    });

    h += '<div class="card"><h2 class="sec"><span class="bar"></span>知识漏洞清单</h2>' +
      '<p class="sec-desc">正确率低于 80% 的知识点，按严重程度排序</p>';
    if (!bad.length) {
      h += '<div class="empty"><div class="big">🎉</div><div class="t">本次测评涉及的知识点全部达标</div></div>';
    } else {
      bad.forEach(function (x) {
        var pct = Math.round(x.K.rate * 100);
        var col = x.K.rate >= 0.5 ? 'var(--warn)' : 'var(--bad)';
        h += '<div class="kprow">' +
          '<span class="name">' + esc(x.kp ? x.kp.name : x.id) +
          '<small>' + esc(Core.stage((x.kp || {}).stage).name) + ' · ' +
          esc(Core.dim((x.kp || {}).dim).name) + '</small></span>' +
          '<span class="meter"><i style="width:' + pct + '%;background:' + col + '"></i></span>' +
          '<span class="pct" style="color:' + col + '">' + pct + '%</span></div>';
      });
    }
    h += '</div>';

    /* ---- 补习路线图 ---- */
    h += '<div class="card pagebreak"><h2 class="sec"><span class="bar"></span>' +
      (role === 'student' ? '你的复习路线图' : '补习路线图') + '</h2>' +
      '<p class="sec-desc">已按知识点依赖关系排好序，从最底层往上补。<b>按这个顺序走，不要跳</b>。</p>';
    var batches = [], curStage = null;
    A.roadmap.forEach(function (item) {
      if (item.stage !== curStage) { curStage = item.stage; batches.push({ stage: curStage, items: [] }); }
      batches[batches.length - 1].items.push(item);
    });
    if (!batches.length) {
      h += '<div class="empty"><div class="big">✅</div><div class="t">没有需要补的知识点</div></div>';
    } else {
      var stepNo = 0;
      batches.forEach(function (b) {
        h += '<div class="stage-h">▍' + esc(Core.stage(b.stage).name) + '</div>';
        b.items.forEach(function (it) {
          stepNo++;
          var rootInfo = A.roots.filter(function (x) { return x.id === it.id; })[0];
          var why = it.untested ? '本次未考到，但它是错题的前置基础'
            : (it.isRoot ? '<b style="color:#b91c1c">根源性漏洞</b>，卡住 ' + (rootInfo ? rootInfo.n : 0) + ' 个下游知识点'
              : '正确率 ' + Math.round(it.rate * 100) + '%');
          h += '<div class="step"><div class="num">' + stepNo + '</div><div class="body">' +
            '<div class="t">' + esc(it.name) + '</div>' +
            '<div class="d">' + why + '</div>' +
            '<div class="tags">' +
            (it.isRoot ? '<span class="tag" style="border-color:#f5b5b1;color:#b91c1c">根源</span>' : '') +
            '<span class="tag">' + esc(Core.dim(it.dim).name) + '</span>' +
            '</div></div></div>';
        });
      });
    }
    h += '</div>';

    /* ---- 逐题回顾 ---- */
    if (o.showQuestions !== false) {
      var wrongList = qs.filter(function (q) { return !Analyze.isCorrect(q, d.answers[q.id]); });
      var luckyList = qs.filter(function (q) { return Analyze.isCorrect(q, d.answers[q.id]) && d.unsure[q.id]; });
      h += '<div class="card pagebreak"><h2 class="sec"><span class="bar"></span>逐题回顾</h2>' +
        '<p class="sec-desc">共 ' + wrongList.length + ' 道错题' +
        (luckyList.length ? ('、' + luckyList.length + ' 道蒙对题') : '') +
        '。蒙对题单独列出，因为它们暴露的是同一种问题。</p>';
      luckyList.forEach(function (q) { h += renderRev(q, 'lucky', d.answers[q.id], role); });
      wrongList.forEach(function (q) { h += renderRev(q, 'wrong', d.answers[q.id], role); });
      if (!wrongList.length && !luckyList.length) {
        h += '<div class="empty"><div class="big">💯</div><div class="t">全部答对</div></div>';
      }
      h += '</div>';
    }

    /* ---- 落款 ---- */
    h += '<div class="signoff">' +
      '<div class="so-line"></div>' +
      '<div class="so-main">化学学情诊断报告 · 由「化学学情诊断平台」自动生成</div>' +
      '<div class="so-sub">测评学生：' + esc(meta.name || '未署名') +
      (meta.studentNo ? '（学号 ' + esc(meta.studentNo) + '）' : '') +
      '　|　测评时间：' + esc(U.fmtTime(meta.submittedAt || Date.now())) +
      '　|　试卷：' + esc(meta.paperName || '') +
      '　|　共 ' + A.totalN + ' 题　得分率 ' + Math.round(d.rate * 100) + '%</div>' +
      '<div class="so-brand">黎伟成制作</div>' +
      '<div class="so-note">本平台与题库由黎伟成独立开发 · 仅供教学使用</div>' +
      '</div>';

    return h;
  };

  /** 渲染进容器并绘图 */
  R.renderTo = function (container, d, o) {
    U.setHTML(container, R.html(d, o));
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        setTimeout(function () {
          var A = d.analysis;
          var cvr = container.querySelector('#rp-radar');
          if (cvr && root.Charts) {
            root.Charts.drawRadar(cvr,
              Core.dims().map(function (x) { return x.name; }),
              Core.dims().map(function (x) { var g = A.dim[x.id]; return g && g.n ? g.pts / g.n : 0; }));
          }
          var cvb = container.querySelector('#rp-bars');
          if (cvb && root.Charts) {
            var sl = [], sv = [];
            Core.stages().forEach(function (s) {
              var g = A.stage[s.id];
              if (g && g.n) { sl.push(s.name); sv.push(g.pts / g.n); }
            });
            root.Charts.drawBars(cvb, sl, sv);
          }
          resolve();
        }, 20);
      });
    });
  };

  /** 一行摘要，用于列表 */
  R.summaryLine = function (d) {
    var L = R.levelInfo(d.rate);
    return '<span class="tag ' + (L.tone === 'ok' ? 'ok' : L.tone === 'warn' ? 'warn' : 'bad') + '">' +
      L.txt + '</span>';
  };

  root.Report = R;
}(typeof window !== 'undefined' ? window : globalThis));

</script>

<!-- app/student -->
<script>
/*!
 * 化学学情诊断平台 · 学生端（扫码进入）
 * 作者：黎伟成
 *
 * 学生用手机扫答题卡 / 报告卡上的二维码，打开的就是这个页面。
 * 因为没有服务器，二维码里直接装着「这份卷子考了哪些题 + 每题选了什么」，
 * 页面拿本地题库把题目还原出来，再用和老师端完全相同的分析引擎算报告。
 *
 * URL 格式：student.html?d=<base64url载荷>
 * 也支持把载荷放在 hash 里：#d=<载荷>（更不容易被聊天软件截断）
 */
(function (root) {
  'use strict';

  var U = root.U;
  var Core = root.Core;
  var Codec = root.Codec;
  var Report = root.Report;

  if (window.Lic && window.CHEM_PUBKEY) window.Lic.setPublicKey(window.CHEM_PUBKEY);

  function getPayload() {
    var fromQuery = null, fromHash = null;
    try {
      var m = /[?&]d=([^&#]+)/.exec(location.search);
      if (m) fromQuery = decodeURIComponent(m[1]);
    } catch (e) {}
    try {
      var h = location.hash || '';
      var m2 = /[#&]d=([^&]+)/.exec(h);
      if (m2) fromHash = decodeURIComponent(m2[1]);
    } catch (e) {}
    return fromHash || fromQuery || null;
  }

  function brand() {
    return '<header class="topbar"><div class="topbar-in">' +
      '<div class="brand"><span class="logo-mark">化</span>' +
      '<div><h1>化学学情诊断报告</h1>' +
      '<p>由黎伟成开发 · 高中化学学情测评</p></div></div>' +
      '<span class="built-by">黎伟成 制作</span>' +
      '</div></header>';
  }

  function fail(msg, detail) {
    var mount = document.getElementById('app');
    U.setHTML(mount, brand() + '<div class="wrap narrow">' +
      '<div class="card">' +
      '<div class="empty">' +
      '<div class="big">🔍</div>' +
      '<div class="t">' + U.esc(msg) + '</div>' +
      '<div style="margin-top:10px;line-height:1.8">' + (detail ? U.esc(detail) : '') + '</div>' +
      '</div>' +
      '<div class="lic-state warn" style="margin-top:16px;text-align:left">' +
      '<b>怎么解决？</b><br>' +
      '1. 请老师重新发一次二维码给你（可能是复制链接时少了一段）<br>' +
      '2. 直接扫原始二维码，不要手动转发链接<br>' +
      '3. 如果是从相册扫的旧图，让老师重新生成' +
      '</div>' +
      '</div></div>');
  }

  function render(payload) {
    var mount = document.getElementById('app');
    var bank = Core.questions();

    var res = Codec.decode(payload, bank);
    if (!res.ok) {
      fail('这份报告打不开', res.error || '二维码数据校验没通过。');
      return;
    }

    var questions = res.questions;
    var answers = res.answers;

    /* 学生端不知道「哪些是蒙对」——那需要涂卡时额外标记。
       但答题卡上确实有「不确定」这一栏，所以 OMR 会带过来（unsure 存在时用）。 */
    var unsure = res.unsure || {};

    var d = Report.compute({
      questions: questions,
      answers: answers,
      unsure: unsure,
      meta: {
        name: res.name || '',
        studentNo: res.studentNo || '',
        paperName: res.paperName || '化学学情诊断',
        submittedAt: res.submittedAt || Date.now()
      }
    });

    U.setHTML(mount, brand() + '<div class="wrap narrow">' +
      '<div id="rp"></div>' +
      '<div class="footnote no-print">' +
      '本页面由二维码中的离线数据生成，未经过任何服务器。<br>' +
      '报告内容仅本人与任课老师可见 · 黎伟成制作' +
      '</div>' +
      '<div style="margin-top:18px" class="no-print">' +
      '<button class="btn block lg" id="btn-print">保存为 PDF / 打印</button>' +
      '</div>' +
      '</div>');

    Report.renderTo(document.getElementById('rp'), d, { role: 'student' });

    var bp = document.getElementById('btn-print');
    if (bp) bp.addEventListener('click', function () { window.print(); });

    if (!res.bankMatch) {
      U.warn('题库版本已更新，个别题目的解析可能略有出入。');
    }
  }

  function noData() {
    var mount = document.getElementById('app');
    U.setHTML(mount, brand() + '<div class="wrap narrow">' +
      '<div class="card">' +
      '<h2 class="sec"><span class="bar"></span>没有检测到报告数据</h2>' +
      '<p class="sec-desc">这个页面需要用答题卡 / 报告卡上的二维码打开。</p>' +
      '<div class="lic-state info" style="background:var(--brand-soft);color:var(--brand);border:1px solid #cfe0fb">' +
      '<b>你现在可能做了这些事：</b><br>' +
      '· 直接打开了网址（没有扫码）<br>' +
      '· 扫的是别的东西的二维码<br>' +
      '· 链接在转发时被截断了' +
      '</div>' +
      '<div style="margin-top:16px;line-height:1.9;font-size:13.5px;color:var(--ink2)">' +
      '<b>正确做法：</b>用手机相机直接对准老师发的那张报告卡上的二维码，' +
      '点击弹出的链接，就能看到你的详细报告。' +
      '</div>' +
      '</div></div>');
  }

  function boot() {
    if (!Core.questions().length) {
      fail('平台数据未加载', '请刷新页面重试。');
      return;
    }
    var p = getPayload();
    if (!p) { noData(); return; }
    try {
      render(p);
    } catch (e) {
      fail('报告打开失败', (e && e.message) || String(e));
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  /* 页面从后台恢复时，如果 URL 变了（比如再扫一次），重新渲染 */
  window.addEventListener('hashchange', boot);
}(typeof window !== 'undefined' ? window : globalThis));

</script>
